 NRA_The_West_Virginian_Corporate_State:0 "The West Virginian Corporate State"
 NRA_The_West_Virginian_Corporate_State_desc:0 "Our nation is a proud corporate state. We are living in the most productive nation on the continent, money is pouring in due to our vast coal mining operations and our strategic investments. Everything is going great for us. But, we need to keep an eye on our enemies as some want to topple our business empire..."
 NRA_Continue_The_Mining_Operations:0 "Continue Mining Operations"
 NRA_Continue_The_Mining_Operations_desc:0 "The only way to keep making money in this economy is to make money. How, you ask? It’s simple: Expanding our mining operations will give our economy the boost it needs to produce plentiful amounts of cash."
 NRA_Investment_For_Trump:0 "Investments From Trump"
 NRA_Investment_For_Trump_desc:0 "Reaching out to the legitimate leader of the United States, President Trump, for investments will give us the recognition we need from him as well as lots of cash. While we receive these investments, we also rest easy knowing that we are protected under the light of his eyes."
 NRA_Sell_Our_Products:0 "Sell Our Products"
 NRA_Sell_Our_Products_desc:0 "Selling our products all across the continent is another big step in growing our nation. I mean, it's basically rule number one on the how-to-get-rich list. The income that is generated from the sale of our resources will let us spend more on ourselves."
 NRA_Growing_Discontent:0 "Growing Discontent"
 NRA_Growing_Discontent_desc:0 "Among the people of our nation, there seems to be growing discontent about what we are doing. This is really nothing to worry about, I mean, what can they even really do? We are safe from them; they will know to love our ways."
 NRA_Which_Side_Are_You_On:0 "Which Side Are You On?"
 NRA_Which_Side_Are_You_On_desc:0 "Those are the words of Pete Seeger. Which side are you on boys? Which side are you on? Wise words from a wise man. The time has come to pick a side to fight on. Will you join Tucker Carlson and his revolutionary ways, or will you stick with the corporatists and stick to their ways of money and capitalism? The choice is yours."
 NRA_Crackdown_On_Protests:0 "Crack Down On Protests"
 NRA_Crackdown_On_Protests_desc:0 "To end these little protests across our nation, we need to be strong and stomp them out before they become a problem. Sending in the police and military should get the job done of dispersing these protesters. Then, we can get back to the real work."
 NRA_Comrade_Tucker_Ideas:0 "Comrade Tucker's Ideas"
 NRA_Comrade_Tucker_Ideas_desc:0 "Many are now joining with Comrade Tucker. His political beliefs and words have influenced many across the nation. Comrade Tucker knows what's best and will lead us to a better nation. A united nation."
 NRA_Harsher_Punishments:0 "Harsher Punishments"
 NRA_Harsher_Punishments_desc:0 "Because of these little protests, we must now introduce harsher punishments so these bands of rebels will know the true meaning of fear. We need to set an example so the people of the nation won’t rise up against us. They will see what happens to people like them..."
 NRA_Form_Popular_Militias:0 "Form Popular Militias"
 NRA_Form_Popular_Militias_desc:0 "To achieve the new nation we must rally the troops. Men who are willing to die for the cause will be perfect. The New nation must be born, no matter the cost. The Red Flag will fly!"
 NRA_Work_Them_To_Death:0 "Work Them To Death"
 NRA_Work_Them_To_Death_desc:0 "One of our punishments is to work them to death. They will spend the rest of their lives working in the pits of hell; the forced labor will make us rich, and we will benefit all the while. Nothing can go wrong now. The people have been silenced!"
 NRA_The_Final_Solution:0 "The Final Solution"
 NRA_The_Final_Solution_desc:0 "The time has come; we must fight for our nation. The Final Solution is to take up arms against the oppressive regime of the capitalist. The people need to be freed! The people need to be united, otherwise our mission has failed!"
 NRA_The_Second_Battle_Of_Blair_Mountain:0 "The Second Battle Of Blair Mountain"
 NRA_The_Second_Battle_Of_Blair_Mountain_desc:0 "The Revolution is starting; the Second Battle of Blair Mountain is upon us. Who will come out of this conflict successfully? Will it be Tucker's newfound Militia who will succeed in this conflict, or will it be the capitalists with their private armies? This battle will tell."
 NRA_Contact_Biden:0 "Contact Biden"
 NRA_Contact_Biden_desc:0 ""
 NRA_Gain_Industrial_Machinery_From_The_Federalists:0 "Gain Industrial Machinery From The Federalists"
 NRA_Gain_Industrial_Machinery_From_The_Federalists_desc:0 ""
 NRA_Rally_In_Pittsburgh_And_Martinsburg:0 "Rally In Pittsburgh And Martinsburg"
 NRA_Rally_In_Pittsburgh_And_Martinsburg_desc:0 ""
 
 
 NRA_The_Appalachian_Revolution:0 "The Appalachian Revolution"
 NRA_The_Appalachian_Revolution_desc:0 "The time has come for Independence; it is time to reclaim what is ours and regain control of Appalachia! It is time for our own Revolutionary war. Just like our Ancestors in 1775, we shall fight back the enemy. We shall mobilize the Revolutionaries and call on our fellow comrades from afar. Remember, No Step Back!"
 NRA_Mobilize_The_Rangers:0 "Mobilize The Rangers"
 NRA_Mobilize_The_Rangers_desc:0 "If we are to win this war we must get the best of the best on the frontlines. Rangers will be on the frontlines helping our fellow comrades. Their special skills and tactics will overcome the enemy forces and give us that advantage we need!"
 NRA_The_Knowledge_Of_The_Terrain:0 "The Knowledge Of The Terrain"
 NRA_The_Knowledge_Of_The_Terrain_desc:0 "For our men to fight in the Revolutionary war, they need to know the terrain. The mountains and steep slopes will need to be our ally rather than our enemy. Once we know the ways of the land, we can use it as an advantage. Laying traps, fighting in the bushes and using the mountains as an advantage. We will make our own Vietnam in Appalachia. The enemy will know fear."
 NRA_Making_Use_Of_Our_Numerical_Advantages:0 "Making Use Of Our Numerical Advantages"
 NRA_Making_Use_Of_Our_Numerical_Advantages_desc:0 "The amount of men we have for our cause is a great advantage in the war. The more manpower we have, the more we can advance and attack. We can fill in for men on the frontlines with our Numerical Advantage as well as filling in for men in the factories to produce the guns and vehicles we need to conquer."
 NRA_Contact_Fellow_Comrades:0 "Contact Fellow Comrades"
 NRA_Contact_Fellow_Comrades_desc:0 "To secure our chances of winning, we need to call in support from countries and beyond, once we have the manpower and supplies we need from our allies abroad we will easily win this war with a quick and decisive victory. The locals will help us, countries will support us and societies will fund us."
 NRA_Supports_From_Russia:0 "Supports From Russia"
 NRA_Supports_From_Russia_desc:0 "Our Russian comrades have decided to help us in this war, their supplies and volunteers will definitely help us in the war. It’s good to know we have friends out there across the globe."
 NRA_Supports_From_The_Locals:0 "Supports From The Locals"
 NRA_Supports_From_The_Locals_desc:0 "The Locals who support the cause of our Revolution will help us in many ways. They will fund us with money which we can use to buy equipment and guns, they will raise arms and give us arms. They will let us use their houses for bases and the environment around them to move supplies around our territory."
 NRA_Funds_From_Larouche_Society:0 "Funds From The LaRouche Society"
 NRA_Funds_From_Larouche_Society_desc:0 "Our comrades from the LaRouche Society have been generous enough to fund our endeavors in the war. We will not forget this, from the funding we have received we can get new equipment and guns, we can also pay salaries and help boost our economy."
 NRA_Sabotage_Their_Industries:0 "Sabotage Their Industries"
 NRA_Sabotage_Their_Industries_desc:0 "We can sabotage our enemy by attacking their industry to stop them producing the equipment they need to supply the front. We can use our air force to strike their factories and destroy them. There are also operations that we have to infiltrate factories and shut them down. Once we have sabotaged their industries, we can easily steamroll their infantry with a lack of supplies."
 NRA_Cause_Mutiny_In_Their_Ranks:0 "Cause Mutinies In Their Ranks"
 NRA_Cause_Mutiny_In_Their_Ranks_desc:0 "If we can get our men into their ranks, we can cause Mutinies. If we can spread our message to the desperate troops of the other side, they may take up arms with us, furthering our cause. This will make the enemy easier to invade and also help us gain extra manpower in the process."
 NRA_For_A_Greater_Cause:0 "For A Greater Cause"
 NRA_For_A_Greater_Cause_desc:0 "The fight for independence is for a Greater Cause, to spread our message of our ideology around the once United States. The men and women of America must learn the true meaning of our cause and join us, they need to see the obvious answer which is that we are superior and want to help them. In our society, everyone is equal, everyone is great, and everyone needs to be united for victory."
 NRA_The_Final_Push:0 "The Final Push"
 NRA_The_Final_Push_desc:0 "Today we shall Celebrate, for we have nearly finished our goal! The enemy is on their last breath. We have managed to push them back with our manpower and equipment. The Men and Women of our country have united to take on our enemy and have won. Soon it will be our 4th July, just one final push men. Kick down the door and the enemy will be exposed!"
 NRA_Victory_Is_Ours:0 "Victory Is Ours!"
 NRA_Victory_Is_Ours_desc:0 "We have won the revolutionary war; the capitalist pigs are now dead! Let a red star shine over the nation as our symbol of victory. Today is the time to bask in our victory, worry about the troubles later. Let us enjoy this moment."
 
 
 
 NRA_The_Morning_After:0 "§8The Morning After§!"
 NRA_The_Morning_After_desc:0 "Now that we have won the war, it is time to rebuild this broken nation. It’s time to get our hands dirty and unite the people in our common goals. Now is the time to show the rest of the world what kind of nation we are."
 
 
 
 NRA_The_Cultural_Crisis:0 "The Cultural Crisis"
 NRA_The_Cultural_Crisis_desc:0 "Our nation is in a crisis in what our cultural destiny should be, there are many paths to choose but we need to resolve this step by step. We have many old cultures we could take, for instance we have our Scott-Irish origins from our ancestors who sailed here years ago. We must also take in our own language to differentiate ourselves from the rest of these Fractured United States."
 NRA_Foundation_Of_The_Appalachian_Identity:0 "Foundation Of The Appalachian Identity"
 NRA_Foundation_Of_The_Appalachian_Identity_desc:0 "We must now lay the foundations for the new Appalachian identity; this will remain here for the rest of the country’s life. Once we have secured the Appalachian identity, we can rejoice and not be confused about the direction we are going. This will show the path of the people."
 NRA_The_Appalachian_Language:0 "The Appalachian Language"
 NRA_The_Appalachian_Language_desc:0 "The Appalachian Language will be a language that is unique to the rest of the so-called United States of America. We will use this language to promote strength across the mountainous regions and show others the unity of our nation compared to others as our culture expands."
 NRA_Rural_Improvements:0 "Rural Improvements"
 NRA_Rural_Improvements_desc:0 "If we are going to make this new culture work, we must improve the way of life in the rural areas, improving farms so we can have more food, and improving roads to traverse easier and quicker than before. Once we improve, we can use this as a Cultural Revolution piece and gain popularity along the way."
 NRA_Country_Roads:0 "Country Road..."
 NRA_Country_Roads_desc:0 "The country road will be one of the main pieces of culture in our quest. It shows the way of the rural lifestyle as well as that good old country flavor, which will really fit the Appalachian vibes."
 NRA_Take_Me_Home:0 "...Take Me Home"
 NRA_Take_Me_Home_desc:0 "Home is where the heart is, and many of the Appalachian people now have connected their hearts and souls to the new cultural lifestyle, many are happy to see Tucker doing something to help them. God Bless Appalachia, God Bless the New America."
 NRA_Embrace_Conservative_Socialism:0 "Embrace Conservative Socialism"
 NRA_Embrace_Conservative_Socialism_desc:0 "In embracing this new political ideology, we have set a clear path for what our people need to believe in and support. This will also help maintain our traditional values and beliefs into the future."
 NRA_Remember_Our_Ancestors:0 "Remember Our Ancestors"
 NRA_Remember_Our_Ancestors_desc:0 "We must remember our old Ancestors who gave birth to the land we are on now. Our Scott-Irish origins are important so that we must not lose the way of the men and women before us."
 NRA_Develop_The_Great_Minds_Of_Appalachia:0 "Develop The Great Minds Of Appalachia"
 NRA_Develop_The_Great_Minds_Of_Appalachia_desc:0 "If our Cultural Revolution is to succeed, we need to develop and build the great minds of the new Appalachia. With new minds comes new ways to expand our technology and help the people develop into a better and more organized society. We shall grow and develop into a paradise with the help of our great minds!"
 NRA_The_Proclamation_Of_Independence:0 "The Proclamation Of Independence"
 NRA_The_Proclamation_Of_Independence_desc:0 "We have done it; we can now fight for our independence! This is a happy day throughout Appalachia as we can now claim that we are an free, independent, Communist Nation. Now that we have fixed the cultural crisis, we can expand and focus on other problems that are growing inside this newly founded nation.  With our new revolutionary spirit, nothing can stop us now. LONG LIVE COMRADE TUCKER!"
 NRA_Purge_Capitalist_And_Liberal_Degeneracy:0 "Purge Capitalists And Liberal Degeneracy"
 NRA_Purge_Capitalist_And_Liberal_Degeneracy_desc:0 "To efficiently secure our new culture, we must wipe out the Capitalists and Liberals that are terrorizing our  new Appalachia. The Capitalists will be purged along with their Corporatist ways, as well as the Liberals who spread their Liberal media. We need to wipe these types of people out and do so quickly, so they don't spread their ways and effectively destroy the foundation of what we’re building."
 NRA_Revolutionary_Traditionalism:0 "Revolutionary Traditionalism"
 NRA_Revolutionary_Traditionalism_desc:0 "Just like the many countless countries who have had many Revolutions, we shall follow suit. We shall follow the ways of the Soviet Union, the birthplace of Communism in practice, and the People's Republic of China which is still going strong to this day. If we are to carry this new culture, we need to put the Revolutionary spirit into our people."
 NRA_Comrade_Tucker_Knows_Whats_Best:0 "Comrade Tucker Knows What's Best!"
 NRA_Comrade_Tucker_Knows_Whats_Best_desc:0 "We shall follow the words and ways of Comrade Tucker, the founder of the new Revolution for Appalachia. His words and spirit will guide the people through dark times. He shall bring the Revolution and become the next Lenin. We shall follow the ways of Comrade Tucker, after all; he knows what's best!"
 NRA_Red_Fox_News:0 "Red Fox News"
 NRA_Red_Fox_News_desc:0 "If we are to spread the Revolution throughout Appalachia and further beyond, we need to take control of the news stations which will be able to broadcast the Revolutionary spirit. Our target of course is turning FOX News into a house of Red Propaganda. Once we have taken it, we can spread our message and begin to fill  the hearts and minds of people throughout the former United States with the Revolutionary spirit!
 NRA_Open_New_Mines:0 "Open New Mines"
 NRA_Open_New_Mines_desc:0 "After more than 5 decades of straight closures of our mines under federal rule and mismanagement under the corporatists, the West Virginian economy has been devastated. We can now start to reopen the old mines as well as creating new ones to find the resources we need to heal our crippled economy. It is time to put the West Virginian miner back to work."
 NRA_Expand_Lumber_Production:0 "Expand Lumber Production"
 NRA_Expand_Lumber_Production_desc:0 "In order to grow our industries, lumber is needed to support our factories and civilian buildings. Comrade Tucker has decreed that we will cut down trees to fulfill the deficit of lumber we currently have. What’s a few more dead trees anyway?"
 NRA_The_Myth_Of_Mothman:0 "The Myth Of Mothman"
 NRA_The_Myth_Of_Mothman_desc:0 "The Mothman is a popular Appalachian legend, of a large humanoid creature with massive wings, with the legend originating in 1966 in Point Pleasant, West Virginia. Using this popular legend we might differentiate ourselves even more from the old American culture, strengthening our own Appalachian culture in the process."
 NRA_Expanding_Coal_And_Steel_Production:0 "Expanding Coal And Steel Production"
 NRA_Expanding_Coal_And_Steel_Production_desc:0 "With the new inflow of natural resources coming from the mines, we can now maintain a constant growth in our coal and steel production. The rule of those corporatist goons that mismanaged our economy led to the inefficiency plaguing our industries today. With these reforms, Comrade Tucker is sure to lead us forward into a new era for the West Virginian economy!"
 NRA_Industrialization_Of_Agriculture:0 "Industrialization Of Agriculture"
 NRA_Industrialization_Of_Agriculture_desc:0 "Even though the miners and factory workers have been revitalized, we must now turn to the backbone of our nation. Comrade Tucker has decreed that all farmers are now to be compensated with industrial machinery, so that they may continue to support us in the revolution. Only Comrade Tucker would take into consideration the people in the background, for the Comrade is the most considerate and compassionate of all!"
 NRA_Local_Wisdom:0 "Local Wisdom"
 NRA_Local_Wisdom_desc:0 "We have always been taught to listen to our elders in the tales that they give us, as well as the advice they bring. Comrade Tucker, in his never-ending wisdom has decreed that local wisdom shall be preserved for the future generations. Only Comrade Tucker would be able to think so far into the future, for the Comrade is the most intelligent of all!"
 NRA_Build_New_Universities:0 "Build New Universities"
 NRA_Build_New_Universities_desc:0 "No revolution is complete without the equality of the people. Comrade Tucker has decided to fund education systems to improve the positions of our people, and to open up new opportunities for them. With this initiative, Comrade Tucker hopes to share his wisdom with all Americans. Glory to Comrade Tucker! Glory to the Revolution!"
 
 
 NRA_The_Industrial_Devastation:0 "The Industrial Devastation"
 NRA_The_Industrial_Devastation_desc:0 "We have to accept the fact that our nation is poorly developed. We are lacking the industrial equipment and modernization to produce consumer goods and military factories to supply our troops. We need to fix this problem by modernizing and upgrading our industry to the max, for we shall rebuild."
 NRA_Ensure_Workers_Rights:0 "Ensure Workers Rights"
 NRA_Ensure_Workers_Rights_desc:0 "We need to tell the workers of the nation that they will have rights. Having rights will allow them to feel secure and know that we are looking out for them. A happy worker is a productive worker, to make them happy we will abolish worker slavery and let them have the right to work and be educated once more."
 NRA_Secure_Minimal_Wages:0 "Secure Minimal Wages"
 NRA_Secure_Minimal_Wages_desc:0 "Allowing workers to have minimum wage will increase productivity in factories and reduce employee turnovers. It will also boost our economy as more demands will be met to buy more consumer goods for their households and other places around the country."
 NRA_Modern_Machinery:0 "Modern Machinery"
 NRA_Modern_Machinery_desc:0 "Modern Machinery is one of the steps to becoming a modernized nation. With modernized machinery we will be able to increase output and productive capabilities, as well as making the workplace more productive. It will help workers with their jobs so they can understand and perform tasks easier than before."
 NRA_Appalachian_Working_Ethics:0 "Appalachian Working Ethics"
 NRA_Appalachian_Working_Ethics_desc:0 "Work ethics will give our workers the chance to live up to our standards. It will help with productivity as these guidelines will stop them from thinking about the bad things to do in the workplace and more of the good things to do. For instance taking healthy breaks and not being distracted by their phones or any other distracting items."
 NRA_Open_New_Industries:0 "Open New Industries"
 NRA_Open_New_Industries_desc:0 "Opening new industries means more things being produced. It will benefit our economy as more people can get jobs and stimulate the economy into a wealthy country. It will also remove our dependence on other countries around the world, ensuring a higher standard of living for more of our people."
 NRA_Increase_Local_Weapon_Production:0 "Increase Local Weapon Production"
 NRA_Increase_Local_Weapon_Production_desc:0 "Increasing Weapon Production means that our armies will now be replenished with new equipment and guns to help them fight in future wars with our capitalist enemies. It also protects our citizens from any criminals that wish to harm them."
 NRA_Copy_Russian_Models:0 "Copy Russian Models"
 NRA_Copy_Russian_Models_desc:0 "The Russians have given us the licenses for their effective and beautifully designed guns, tanks and military vehicles to produce in our factories. This truly is a great relationship growing between our Russian allies and ourselves, allowing us to increase our military power and improve our military might."
 NRA_Russian_Industrial_Investments:0 "Russian Industrial Investments"
 NRA_Russian_Industrial_Investments_desc:0 "Russia has gladly invested in our industry, a new wave of gratitude from our allies in the East. This will greatly help our industry by providing new jobs and increasing our technical knowledge furthering our nation’s reorganization thanks to our Russian allies.
 NRA_Total_Collectivization:0 "Total Collectivization"
 NRA_Total_Collectivization_desc:0 "It is time to share our economy amongst each other. This will hopefully make our economy more efficient than it is now, due to us taking control of the shops and sharing the proceeds with the rest of the nation."
 NRA_Allow_Small_Business:0 "Allow Small Business"
 NRA_Allow_Small_Business_desc:0 "Allowing small business into our economy will help create meaningful jobs in the economy as well as supporting neighborhoods and communities among the nation. It will also help us deal with capitalists as we let small businesses who are weakened outside of the nation, be prosperous inside our nation."
 NRA_Anti_Trust_Laws:0 "Antitrust Laws"
 NRA_Anti_Trust_Laws_desc:0 "Enforcing the Antitrust law will mean that we will protect consumers from businesses who want to take over, it will also ensure fair competition amongst businesses as they won’t be backed by large capitalist corporations."
 NRA_Civilian_Factories_Effort:0 "Civilian Factories Effort"
 NRA_Civilian_Factories_Effort_desc:0 "Civilian factories will help us with the economy as they produce consumer goods for the nation which rack up profits for us which we can share with the people. It also helps with stability as the people of the nation won’t be too upset at us for spending it on the military."
 NRA_Military_Factories_Effort:0 "Military Factories Effort"
 NRA_Military_Factories_Effort_desc:0 "Military factories help by giving the nation a chance to breathe as they know that our military is being supplied with the best equipment we have possible, to help in offensive and defensive wars against other nations."
 NRA_Modern_Buildings_Tecniques:0 "Modern Building Techniques"
 NRA_Modern_Buildings_Tecniques_desc:0 "Modern Building Techniques will help our nation give it that unique look in our buildings which give us the sense of being a modernized nation. Instead of run-down buildings with caved in roofs, we will have the cleanest and most beautifully designed buildings available. It will appeal to the people of our nation! "
 NRA_The_Appalachian_Industrial_And_Economic_Boom:0 "The Appalachian Industrial And Economic Boom"
 NRA_The_Appalachian_Industrial_And_Economic_Boom_desc:0 "We have turned our once unproductive and destroyed economy into a prosperous one. Factories are now producing consumer goods and military equipment. We have modern buildings which help with stability and places to live for our people as well as Russian industrial investments which help our nation in becoming a productive state amongst the other Americas. Long Live Appalachia!"
 NRA_Inherit_The_Spirit_Of_The_Industrial_Revolution:0 "Inherit The Spirit Of The Industrial Revolution"
 NRA_Inherit_The_Spirit_Of_The_Industrial_Revolution_desc:0 "A working man is a good man, a productive man is a better man. An efficient man is the best man. Comrade Tucker has decreed that we will revitalize and reinvigorate the spirit of industrialization. The long history of West Virginia shows an era of the efficient man under industrialization. Now, Comrade Tucker wants to bring that time back here. Glory to the efficient man!"
 
 
 
 NRA_What_To_Do_With_The_Militias:0 "What To Do With The Militias?"
 NRA_What_To_Do_With_The_Militias_desc:0 "Now that we have won the war, the question now ponders. What to do with our Militia, we have many options such as; keeping the militias the way they are or integrating them into our armed forces and making the militia into a professional army so that we can win wars with our knowledge of the civil war."
 NRA_Keep_The_Militias:0 "Keep The Militias"
 NRA_Keep_The_Militias_desc:0 "Keeping the Militia will be good as this gives the chance to help defend small cities from attacks with these civilians turned veterans of the civil war. We can have more militia and turn the country into an armed state ready for defensive and offensive wars."
 NRA_Form_A_Professional_Army:0 "Form a Professional Army"
 NRA_Form_A_Professional_Army_desc:0 "Forming a professional army with these Militias gives us more manpower, but we can also expand their tactics and give them new ways to attack our enemies with technology and have the ability to push our enemies back with great skill. However this would be a burden on the economy as we need to pay quite a lot for the professional army with the new technology and equipment."
 NRA_Integrate_Them_Into_The_Army:0 "Integrate Them Into the Army"
 NRA_Integrate_Them_Into_The_Army_desc:0 "Integrating them into the army will mean that we have more manpower and our army strength will increase. While in the army they can have more training and soon become Appalachians' proud elite soldiers, ready for combat."
 NRA_The_Appalachian_Air_Force:0 "The Appalachian Air Force"
 NRA_The_Appalachian_Air_Force_desc:0 "Our air force is quite small at the moment; we need to fix this so we can provide our boots on the ground with support from above. Our Air Force will pave the way for our men to attack and conquer!"
 NRA_The_Red_Appalachian_Army:0 "The Red Appalachian Army"
 NRA_The_Red_Appalachian_Army_desc:0 "The Army is weak. To show the full power of our red army we must modernize and upgrade. Dealing with Fascists and Capitalists will be tough, but with the power of our army we shall prevail."
 NRA_The_Appalachian_Navy:0 "The Appalachian Navy?"
 NRA_The_Appalachian_Navy_desc:0 "Appalachia has always been landlocked, and our population has very little experience with the ocean, if any at all. Unfortunately, we will need to secure the seas if we hope to make our revolution a success."
 NRA_Build_New_Airports:0 "Build New Airports"
 NRA_Build_New_Airports_desc:0 "Building new airports will give us a chance to make more air bases for our planes. At the same time we can get a tourist increase and make money off of it. The perfect scheme."
 NRA_Prepare_For_Air_Raids:0 "Prepare For Air Raids"
 NRA_Prepare_For_Air_Raids_desc:0 "Once we invade enemy nations, we must prepare for the onslaught of bombers flying above and bombing our nation to the ground. We must set up AA defenses around Appalachia as well as telling people to be careful and not put their lights on so it’s harder for bombers to hit their targets."
 NRA_Fighters_Initiative:0 "Fighters Initiative"
 NRA_Fighters_Initiative_desc:0 "Focusing on our fighter jets will mean that we can finally upgrade and prepare them for combat."
 NRA_Extra_Fundings_To_The_Air_Force:0 "Extra Fundings To The Air Force"
 NRA_Extra_Fundings_To_The_Air_Force_desc:0 "Our Air Force is still quite small, giving extra funds to it should give us a long-term advantage against our enemies."
 NRA_Light_Bombers_Effort:0 "Light Bombers Effort"
 NRA_Light_Bombers_Effort_desc:0 "Light Bombers are good as they are quick and swift with their bombings while still managing to go on air missions. However they have limited capacity for bombs but are good in combat."
 NRA_Heavy_Bombers_Effort:0 "Heavy Bombers Effort"
 NRA_Heavy_Bombers_Effort_desc:0 "Heavy Bombers are also good as they might be slow, but what they make up in speed is the capacity. They have a lot of bombs ready to drop. The inclusion of protective armaments will make them into flying fortresses."
 NRA_Study_New_Air_Doctrines:0 "Study New Air Doctrines"
 NRA_Study_New_Air_Doctrines_desc:0 "Giving pilots new doctrines means they can carry out more missions and bombing runs with greater skill and have new tactics to show in the air and destroy the enemy’s flying devils."
 NRA_Cheaper_Planes:0 "Cheaper Planes"
 NRA_Cheaper_Planes_desc:0 "Cheaper planes are good as they reduce the cost while still being efficient. However, they can break easily and are prone to malfunction but it is a cost to pay to help our nation economically."
 NRA_Kickstart_Rockets_Production:0 "Kickstart Rockets Production"
 NRA_Kickstart_Rockets_Production_desc:0 "Rockets are the next goal to work on in our nation, rockets give us the chance to launch massive explosions at our targets causing massive amounts of damage. The rockets of hell will rain down."
 NRA_Research_Nuclear_Energy:0 "Research Nuclear Energy"
 NRA_Research_Nuclear_Energy_desc:0 "The time has come, the research into Nuclear warfare starts now. If we can’t stop our enemies by force, well then. WE WILL NUKE THEM TO THE GROUND! Nothing can stop us now; the power is too good!"
 NRA_Russian_Armament_Investments:0 "Russian Armament Investments"
 NRA_Russian_Armament_Investments_desc:0 "Years of rule from the federalists and the corporations left our state military in a frankly poor position. Research has been neglected, while equipment shortages run high. Comrade Tucker has announced that he has made a deal with Russia. Russia will give us new blueprints and weapons to help us modernize our military. West Virginia and Russia will now walk hand-in-hand to forward the revolution. Glory to Comrade Tucker! Glory to our Russian friends! Glory to the Revolution!"
 NRA_Draw_War_Plans:0 "Draw War Plans"
 NRA_Draw_War_Plans_desc:0 "To push the revolution forward, Comrade Tucker has decided to export it throughout the former United States. Glory to the Revolution!"
 NRA_Invest_In_Artillery:0 "Invest In Artillery"
 NRA_Invest_In_Artillery_desc:0 "We must make a big boom in order to advance our ideals on the rest of America. Glory to the Revolution!"
 NRA_Utilize_Our_Trucks:0 "Utilize Our Trucks"
 NRA_Utilize_Our_Trucks_desc:0 "The people donate their trucks to help Comrade Tucker advance the revolution. Glory to the Revolution!"
 NRA_New_Support_Brigades:0 "New Support Brigades"
 NRA_New_Support_Brigades_desc:0 "Comrade Tucker has called upon the masses to help support our army and form support brigades. Naturally, we will help the Comrade. Glory to the Revolution!"
 NRA_Call_The_Reserves:0 "Call The Reserves"
 NRA_Call_The_Reserves_desc:0 " Comrade Tucker has called upon the reserves to come and fight for the revolution. Naturally, we will answer the call and aid the Comrade. Glory to the Revolution!"
 NRA_Design_Our_Own_Tanks:0 "Design Our Own Tanks"
 NRA_Design_Our_Own_Tanks_desc:0 "Tanks were the weapons of the future. Unfortunately, Comrade Tucker has revealed that we don’t have the modern designs to build them. Our glorious Comrade has called on the intellectuals of the revolution to help design our own revolutionary tanks. Glory to the Intellectuals and the Revolution!"
 NRA_Study_CSTO_War_Doctrines:0 "Study CSTO War Doctrines"
 NRA_Study_CSTO_War_Doctrines_desc:0 "Our new allies in Russia as well as the rest of the CSTO have pledged to support Comrade Tucker’s revolutionary cause in America. Glory to Comrade Tucker! Glory to the CSTO! Glory to the Revolution!"
 NRA_Finish_Army_Reforms:0 "Finish Army Reforms"
 NRA_Finish_Army_Reforms_desc:0 "Federalist and Corporatist kleptocratic control of the West Virginian military has been a plague to the advancement of the revolution. Throughout history revolutions relied on militaries to protect them. The Jacobins in France, The Red Army in Russia, the People's Liberation Army in China, and now, the West Virginian Army can fall under that category. After a series of many revolutionary reforms, Comrade Tucker has proclaimed the elimination of the corporatist and federalist hindrances to the army. Glory to the Army! Glory to Comrade Tucker! Glory to the Revolution!"
 NRA_A_Modern_Military:0 "A Modern Military"
 NRA_A_Modern_Military_desc:0 "While each and every soldier is filled with the glorious purpose of the revolution, there still remains the issue of bringing them up to speed with the power of the class enemies."
 NRA_Transform_Our_River_Fleet:0 "Transform Our River Fleet"
 NRA_Transform_Our_River_Fleet_desc:0 "For some time now, we’ve had several small vessels in the rivers that run through Appalachia. With some effort, we can refit these ships into ones that will not only be able to sail on the oceans, but hopefully find victory."
 NRA_Use_Russian_Ports:0 "Use Russian Ports"
 NRA_Use_Russian_Ports_desc:0 "Much to our surprise, our comrades in Russia have presented us with an offer to use their ports! This will not only allow us to work on some of our own ships, but it will also give us a good means to access the ocean."
 NRA_The_Appalachian_Submarine:0 "The Appalachian Submarine"
 NRA_The_Appalachian_Submarine_desc:0 "Class traitors and enemies lay not just above the waves, but also below them. To ensure they never threaten the revolution of the working class, we must design vessels able to brave the depths of the sea."
 NRA_Begin_Naval_Expansion:0 "Begin Naval Expansion"
 NRA_Begin_Naval_Expansion_desc:0 "Our docks and ports are abuzz with the sounds of the labor of the working class, each hammer strike crafting the way to our future. Soon, very soon, the red flag of revolution will no longer be stuck to our land dwellings."
 NRA_Focus_On_A_Green_Water_Navy:0 "Focus On A Green Water Navy"
 NRA_Focus_On_A_Green_Water_Navy_desc:0 "Our goal is not global revolution, at least not yet. We should focus on a green water navy, so we can better fight the fight here in America, instead of focusing on what happens elsewhere."
 NRA_Focus_On_A_Blue_Water_Navy:0 "Focus On A Blue Water Navy"
 NRA_Focus_On_A_Blue_Water_Navy_desc:0 "The goal of every revolution is the liberation of the working class everywhere! By constructing a blue water navy, no corner of the Earth will be safe for the Bourgeoisie, and no worker will be left behind."
 NRA_Study_Past_Naval_Doctrines:0 "Study Past Naval Doctrines"
 NRA_Study_Past_Naval_Doctrines_desc:0 "While the navy has historically been the pride of reactionaries, and thus have suffered their influence, we can still endeavor to use their knowledge for the good of the people, instead of the good of their pockets."
 NRA_Prepare_Naval_Invasions:0 "Prepare Naval Invasions"
 NRA_Prepare_Naval_Invasions_desc:0 "Not every piece of land is accessible to our glorious army. If we are to truly achieve our goals, we must be able to bring our army to every island and coast we can reach."
 NRA_Appalachia_Rules_The_Waves:0 "Appalachia Rules The Waves"
 NRA_Appalachia_Rules_The_Waves_desc:0 "Long ago, it was said that Britannia ruled the waves. This is no longer true! Now, at this very moment, the proud men and women of the revolution work tirelessly to ensure that the seas belong to the people, not some long dead reactionary empire."
 NRA_Our_Way_Of_Flying:0 "§ROur Way Of Flying§!"
 NRA_Our_Way_Of_Flying_desc:0 "For too long, the realm of air power has remained within the grip of capitalism. No longer! Soon, the skies will be full of the People’s dreams and strength!"
 NRA_Train_Paratroopers:0 "Train Paratroopers"
 NRA_Train_Paratroopers_desc:0 "Enough men have completed the Paratrooper training program to deploy a new division. We will now rain the fire of the revolution unto our enemies from the sky."
 NRA_New_Military_Uniforms:0 "New Military Uniforms"
 NRA_New_Military_Uniforms_desc:0 "Unfortunately, the current uniforms our soldiers wear still bear the stick of the capitalist pigs. By working with local manufacturers and getting ideas from our valued workers, we have come up with a new design fit for the revolution."
 NRA_Develop_New_APC:0 "Develop New APC's"
 NRA_Develop_New_APC_desc:0 "The wave of the revolution will crash against the beach of the bourgeois, and if we are to succeed in this and gain a beach head, we will need something strong to beat back the dogs of capital. To achieve this, we will develop new armored personnel carriers to not only protect our troops, but to protect our glorious revolution."
 NRA_Our_Way_Of_Marching:0 "§GOur Way Of Marching§!"
 NRA_Our_Way_Of_Marching_desc:0 "Every soldier represents the hopes and dreams of the working class. If we are to make our army into something more than just a killing force, we must ensure that every movement, every breath, every blink is filled with the zeal of those fighting for the revolution."
 NRA_Our_Way_Of_Sailing:0 "§BOur Way Of Sailing§!"
 NRA_Our_Way_Of_Sailing_desc:0 "Our revolution is unlike any other, and thus our sailors are unlike any other. On each face is a smile, and in every heart is the spirit of a person willing to brave the roughest seas and weathers to ensure that the working class is truly liberated."
 
 
 
 NRA_Our_Diplomatic_Position:0 "Our Diplomatic Position"
 NRA_Our_Diplomatic_Position_desc:0 "We must not forget that we are not alone in this, there are lots of enemies that want to destroy and subjugate us. We must carefully choose our allies and pick fights that we are certain to win."
 NRA_The_Question_Of_National_Defense:0 "The Question Of National Defense"
 NRA_The_Question_Of_National_Defense_desc:0 "Self-reliance is useless if we have no means to defend ourselves. Supreme Leader Carlson knows this all too well, and many worker revolutions have been crushed due to failing to fight the neoliberal order. Not only that, but our revolution in particular is facing the remnants of the ex-world’s strongest military power, meaning we cannot afford to be idealistic about our military doctrine when defending against outside threats. Several strategies have been drawn up that are being considered, with one of the more popular ones being to rely on a smaller but elite trained army that can at least be on par with the remnants of the US army. Other propositions are more theoretical, including ideas like mass conscripting the workers to have safety in numbers, or allowing local bands of revolutionaries to undertake a guerilla war similar to the theories presented by minds like Mao and Gonzalos. We must choose wisely, for our choice can be the matter of life or death for our revolution…"
 NRA_The_Question_Of_Our_Territory:0 "The Question Of Our Territory"
 NRA_The_Question_Of_Our_Territory_desc:0 "Whilst our revolution has secured our spot in West Virginia, the actual security of our borders is questionable. Whilst efforts have gone underway to mildly reinforce them, one cannot deny that our neighbors eye our territory as land to be taken and exploited for their capitalist elite. Not only that, but our policy of self-reliance is one that encompasses all Appalachians, not just the ones within West Virginia. Even ignoring that, who are we to call ourselves communists if we do not wish to free our proletarian brothers and sisters when they are being enslaved and exploited right next to us? So it is time for us to ask ourselves a crucial question. Where do the borders of worker liberation and self-reliance end?"
 NRA_Contact_Our_International_Allies:0 "Contact Our International Allies"
 NRA_Contact_Our_International_Allies_desc:0 "Luckily for us, not everyone in the outside world consider us a threat and some countries even want to support us. We have to organize some meetings with them."
 NRA_Preparing_For_The_Federalist_Invasion:0 "Preparing For The Federalist Invasion"
 NRA_Preparing_For_The_Federalist_Invasion_desc:0 "It shouldn’t take a genius to suspect that Biden and his lackeys are plotting to retake the broken apart lands of this country. Unfortunately for us, we happen to be amongst their first targets for their neoliberal conquest. Regardless of how one views the "legitimate" president, none can deny that they still hold remnants of the US army within their ranks, which do not bode well for our revolution and its goals. As it stands currently, we cannot even begin to hope that an offensive push would be possible, so we must prepare for the eventual push on their end. We must lay down guerilla defenses in hopes of doing damage to the future invaders. Secret armories within villages, bunkers across our northern border, tunnel systems in key areas, booby trapping key infrastructure, etc. Every worker within our nation must be ready to do what's necessary in defending our revolution, even if it means facing total annihilation and spitting in its face."
 NRA_Intensifies_Bunker_Constructions:0 "Intensified Bunker Constructions"
 NRA_Intensifies_Bunker_Constructions_desc:0 "While our guerilla tactics will no doubt help against the capitalist hordes of the north, we cannot for one second disregard conventional means of defense. Not only will our trained soldiers be able to be the first line of defense against the federalists and weaken them to be picked off by our guerilla fighters, but we can also coerce them into a false mindset believing that they will be facing a conventional force in the upcoming struggle. However we cannot waste a single day to wait, the state will bring in legions of workers to work tirelessly in building a bunker system across our northern border, as well as other borders in preparation for future attacks by other capitalist dogs that surround us. Our self-reliance shall not be taken away from us, and this wall of bunkers will stand as a testament for generations to come in showing the unwavering will of the workers of America."
 NRA_Looking_Up_North:0 "Looking Up North"
 NRA_Looking_Up_North_desc:0 "The Compound is an artificial country created by Tim Pool. We can easily conquer them and liberate all the people living there."
 NRA_Integrate_The_Compound:0 "Integrate The Compound"
 NRA_Integrate_The_Compound_desc:0 "After our swift victory we can finally begin to integrate them, this should not be difficult at all..."
 NRA_Liberate_The_Workers_Of_Kentuchy:0 "Liberate The Workers Of Kentucky"
 NRA_Liberate_The_Workers_Of_Kentuchy_desc:0 "Our Appalachian brothers in Kentucky were not so lucky like us and still suffer under a corporate regime. We must liberate them as soon as possible, because no man shall be a slave for the globalists!"
 NRA_Propone_The_Charlestone_Pact:0 "Propone The Charleston Pact"
 NRA_Propone_The_Charlestone_Pact_desc:0 "Whilst the situation in Kentucky is not ideal for our goal of revolution within Appalachia, Supreme Leader Carlson has proposed a more pragmatic solution to those who feel like we are not ready for war against the bourgeoisie. Despite the government in Kentucky not aligning with our interests (with many in said government possibly not even being communist at all), we still hold a mutual interest in preserving our self-determination and reliance from those who wish to take it away from us. We will propose an alliance between our two nations that we will dub the Charleston Pact, an alliance that will be defined by smaller nations banding together and defying the larger imperialist bourgeoisie who seek to destroy our self-reliance and determination. Not only that, but if we maintain our position as the head of the Pact, then we will be able to influence each member’s government to be more aligned with the cause of worker’s self-reliance for Appalachia. Eventually we will have enough support in their government that we will be able to subsume their authority into ours, joining our states together in a union of worker solidarity."
 NRA_Integrate_Kentuchy:0 "Integrate Kentucky"
 NRA_Integrate_Kentuchy_desc:0 "Supreme Leader Carlson and his army have taken their first steps to liberate the Appalachian workers outside of West Virginia. With Kentucky finally under our control, we can begin the process of integrating the state into our new Appalachian worker’s state. Not only that, but our integration efforts can serve as a template for our future integration efforts with the rest of the Appalachian states. For administrative purposes, we will allow the state of Kentucky to still exist under a newly appointed government that falls in accordance with our policy of Workers self-reliance and promoting Appalachian culture. Naturally, we will also have to crush any notion of separation and the idea that Kentucky residents are different from our Appalachian worker’s culture. After all, self-determination is not an excuse for every bit of land to secede from the larger state."
 NRA_1861_Once_Again:0 "1861 Once Again!"
 NRA_1861_Once_Again_desc:0 "Those bastards in Virginia are trying to subjugate us again like they did in 1861... We must prepare a surprise invasion of Virginia, this way, they won’t be able to react quickly enough. May Lincoln help us."
 NRA_Invite_Virginia_To_The_Pact:0 "Invite Virginia To The Pact"
 NRA_Invite_Virginia_To_The_Pact_desc:0 "Whilst many workers in our nation might wish to go to war with Virginia in hopes of glorious reunification of states, one must not forget the cost of war. Whilst dying for the cause of self-reliance is something to be glorified, we cannot forget both the emotional damage of relative grief and the economic damage of losing potential workers that could contribute to making our worker nation a city on a hill. So, we will invite the government of Virginia into the Charleston Pact, hoping to diplomatically unite the two states that broke off so long ago. Not only that, but if the Virginians accept to be a part of the Pact, we will hold the power to influence the government in being more lenient to our eternal revolutionary goal of self-reliance."
 NRA_Integrate_Virginia:0 "Integrate Virginia"
 NRA_Integrate_Virginia_desc:0 "After nearly 160 years of division, the two Virginias are finally under the same cause. Our workers have won over the hearts and minds of the workers of Virginia, and we will begin our integration of the state within the Appalachian nation. Unlike Kentucky whom we have allowed to retain their borders, we will eliminate the borders of Virginia and subsume them into the local government seat of West Virginia, finally uniting the two states under a common state level government once again. Whilst this might create a need for bureaucratic redrawing and create temporary setbacks, the long-term cultural impacts of the two states coming together will give a bond stronger than any capitalist war machine."
 NRA_Put_An_End_To_Northern_Anarchism:0 "Put An End To Northern Anarchism"
 NRA_Put_An_End_To_Northern_Anarchism_desc:0 "The state of Ohio, the westernmost state of the Appalachian workers. As it stands currently, the state is ruled by three tyrants, the "Triumvirate" they call themselves. Whilst one of them might hold sympathies with our ideology and cause, we cannot take any risks of Supreme Leader Carlson’s seat being threatened by opposition forces. Our soldiers shall march into Ohio to end this roman nonsense, and free the workers of their trio of tyrants. There is only one certainty with joining the Appalachian workers, and that certainty is VICTORY."
 NRA_A_Meeting_With_AOC:0 "A Meeting With Hawkins"
 NRA_A_Meeting_With_AOC_desc:0 "Amongst the Triumvirate, the elusive Howie Hawkins is seen as the leader of the workers of Ohio. Whilst he is no doubt guilty of collaborating with the capitalist elites that wish to divide and exploit the workers, he can no doubt be of use to us. Supreme Leader Carlson has proposed that we meet with Hawkins in a bid to gain his trust and have him favor the NRA’s cause. If we can do that, then perhaps we can convince him to join our cause in a mutual partnership for further cooperation between workers in hopes of undermining the capitalist menace. Whilst the two other tyrants might kick and scream, we shall be celebrating another member state joining with our cause of self-reliance of all Appalachian workers."
 NRA_Integrate_Ohio:0 "Integrate Ohio"
 NRA_Integrate_Ohio_desc:0 "Finally after a great amount of effort, the accursed lands of Ohio are finally ours. Much like Kentucky and Virginia, we shall go forth with integrating the state into our worker’s government. Similar to Kentucky, Ohio will be allowed to retain its existence on a local level for administrative reasons, albeit forced to adapt a ruling party of our choosing for a coherent policy focus. Whilst on paper figures like AOC will be allowed to operate within our government, we will have to keep her on a tight leash and prevent her from rising the ranks of the party in any sort of bid to overtake Supreme Leader Carlson’s position of leadership."
 NRA_Membership_For_Detroit:0 "Membership For Detroit?"
 NRA_Membership_For_Detroit_desc:0 "The city of Detroit has always had a significant role in the worker culture of the once united America. Being an industrial center of the past, the once proud worker city had since fallen into ruin like much of the rust belt region once the capitalists found enjoyment in outsourcing to foreign nations and workers. Currently the city is controlled by the very workers we seek to liberate and give self-reliance to, free from foreign outsourcing and accursed rust that has plagued Appalachian and Rust belt industry for decades. Given their current position, we can easily exploit their need for security. We can either approach them with an offering of membership in our glorious nation state and give them the security in numbers they need, or we can go for the more direct approach of military invasion. Whichever it may be, the city shall be ours soon enough."
 NRA_The_Northern_Threat:0 "The Northern Threat"
 NRA_The_Northern_Threat_desc:0 "Now that we have consolidated our gains among the independent lands of Appalachia, it's time to focus our eyes northwards to the dreaded north. The lands of Pennsylvania are rooted in Appalachian pride and culture, and as the foremost movement seeking to liberate the region, Pennsylvania shall be brought into the fold of workers self-reliance. Of course, we will still have to deal with the reactionary forces that still control the state…"
 NRA_The_Chaotic_South:0 "The Chaotic South"
 NRA_The_Chaotic_South_desc:0 "Now that we have consolidated our gains among the independent lands of Appalachia, it's time to focus our eyes southwards to the chaos that is the south. The lands of Tennessee have fallen victim to the chaos that was Kanye West and his experiment of bringing a dead cause back into the modern day. Not only that, but he also has the gall to paint the slaveholder cause as something to be redeemed. We should tread carefully but sternly, for lunatics deserve a well-planned demise when they enslave Appalachian workers!"
 NRA_Take_The_Rest_Of_Pennsylvania:0 "Take The Rest Of Pennsylvania"
 NRA_Take_The_Rest_Of_Pennsylvania_desc:0 "During our revolution, the Appalachian army managed to gain control of the southern parts of Pennsylvania, but this is not enough for what we wish to achieve. Our goal wishes to unite all Appalachian workers, not just the ones we deem are worthy enough to be liberated. Due to our glorious victory against the capitalists and their puppet president, the so-called "Federalists" have collapsed into bickering governments and nations that have no hope of unity in the near future. Now that these lands are weakened and divided, our glorious NRA can march into Pennsylvania and take it for ourselves, crushing any bourgeoisie or reactionary opposition that wishes to destroy the Appalachian worker and his culture!"
 NRA_Finish_What_We_Started:0 "Finish What We Started"
 NRA_Finish_What_We_Started_desc:0 "During our war with the Federalists, we managed to hold our own against the capitalist hordes that sought to enslave the Appalachian worker and make him forget his culture. Whilst we accepted the white peace Biden and his government offered to us out of pragmatism, we cannot deny the risk of the Federalists coming back to end our revolution in the scenario that our fervor falters. So, Supreme Leader Carlson is considering a drastic measure, given the now weakened position of the Federalists after their defeat, the workers of Appalachia will initiate our own invasion of their land, taking our enslaved brethren back by force. Not only that, but Supreme Leader Carlson has also considered the possibility of full annexation of the Federalists as a way to prevent any further hostilities in the region…"
 NRA_Integrate_Pennsylvania:0 "Integrate Pennsylvania"
 NRA_Integrate_Pennsylvania_desc:0 "After undermining the local authorities in Pennsylvania, we finally have the rest of the state in our hands. Like before, the state will be allowed to function under the leadership of a local branch of our party, promoting both proletarian and culturally Appalachian values for future generations. We will also have to take great efforts in crushing any semblance of "Federalist" authority that seeks to undermine Supreme Leader Carlson’s rule, as well as eradicating the feudal order of the Amish communities in favor of modern Appalachian worker communities."
 NRA_The_Perfect_Opportunity:0 "The Perfect Opportunity"
 NRA_The_Perfect_Opportunity_desc:0 "There have been many instances where the writing was seemingly on the wall for the lunatic that was Kanye West, but his insane fiefdom has finally died. In its wake are squabbling factions of nationalists, all of whom are too busy organizing lynch mobs to properly defend themselves. Now that law and order in Tennessee have been thoroughly destroyed, we can finally begin our march through the state, destroying any warlords or capitalist oligarchs we find. We have shown American how dedicated the NRA is to the goal of self-reliance for Appalachia and its workers, and we will not cease. Tennessee will be liberated, and Appalachian culture will prevail!"
 NRA_Invade_The_South:0 "Invade The South"
 NRA_Invade_The_South_desc:0 "Seemingly despite all odds, West’s bastard of a nation still lives. However, a state such as this has no chance of holding any sort of semblance of stability or unity, making it an easy target for the might of the NRA. The lack of coherency and national unity in the southern states will no doubt create a weak and undisciplined army that doesn’t wish to fight for West’s fiefdom due to its inherent insanity. We will mount a full offensive war with the short-term goals of taking Tennessee from West’s slaver worship, as well as having the long-term goal of liberating the entirety of the Southern states. Taking the entire south will not only help us liberate the workers and restore the proper cultural tenants of being Appalachian in the areas needed, but it will also allow us an ample amount of land to deter any sort of invasions from outside forces, such as Trump’s tyranny or other capitalist pawns that wish to end our revolution. Like the West Virginians of old, we will march through Georgia and tear down the notion of slavery in the south once and for all!"
 NRA_Integrate_Tennesee:0 "Integrate Tennessee"
 NRA_Integrate_Tennesee_desc:0 "Finally after marching through the fields, opposing the capitalist hordes that oppress and destroy the Appalachian people, Tennessee is finally ours. The southernmost colony of our culture has been liberated from the insanity that befell it, and we can finally begin to integrate it into our revolutionary state. Amongst the most pressing matters to deal with, we have to begin to crack down on the worship of the Confederacy, as it is blatant worship of slavery as well as the mere concept of it undermines and destroys Appalachian culture. Much like before, Tennessee will be allowed to operate as its own local state, ran by a single party government that is a part of our larger revolutionary party. Supreme Leader Carlson has won many battles before, and today stands as another great victory for the working class of Appalachia!"
 NRA_Our_Destiny_Manifested:0 "§tOur Destiny Manifested§!"
 NRA_Our_Destiny_Manifested_desc:0 "They called him delusional. They called him exploitative. They called him a dog whistle for tyrants. But despite the worst names and labels people called Supreme Leader Tucker Carlson, the worst thing anybody did to him in his pursuit of revolution was laugh. But they laugh no more. They see what our Supreme Leader has done, and they stay silent. Their feelings are of no importance to us, for  we know that our Supreme Leader’s guidance is right, and his goal of self-reliance and liberation for Appalachia’s workers is the only goal any of us can follow with dignity. Our destiny has been manifested. Appalachia is finally OURS."
 NRA_Proclaim_Greater_Appalachia:0 "Proclaim Greater Appalachia"
 NRA_Proclaim_Greater_Appalachia_desc:0 "Our goal of national liberation and self-reliance has been accomplished. Appalachia is under the leadership of Supreme Leader Carlson and the NRA and is laying the groundwork to make the nation and its people more self-reliant and solidify Appalachian culture as the primary worker culture of our state. Our workers have suffered many hardships, and many Appalachian lives have been lost in the pursuit of freeing them from foreign capitalist reliance. As we speak our youth are being educated in the NRA’s historic achievements and solidifying the tenants of Appalachian culture into their minds. All workers will come to appreciate the accomplishments of Supreme Leader Carlson, and all will view him as the model to strive for as an Appalachian worker."
 
 #trust the plan
 
 NRA_Liberate_America:0 "Liberate America"
 NRA_Liberate_America_desc:0 "We must take a moment to reevaluate our current goal. From our movement’s conception and the first day of Supreme Leader Carlson’s leadership, our goal has been to liberate the workers and culture of Appalachia. And we have done just that. We have marched on the capitalist warlords, repelled the Federalist hordes, followed Supreme Leader Carlson without question, all in the pursuit of liberating Appalachia and its culture. By all metrics, we have achieved our ideology of self-reliance for the workers and their culture, therefore making our goal accomplished. However, within the heart of Supreme Leader Carlson, there is a sense of unfulfillment. Sure, it is an amazing feat that we have been able to liberate the workers of Appalachia and free their culture from both domestic and foreign capitalist reliance, but there exists a sense of hoarding within our Supreme Leader’s mind. Appalachians are their own unique and glorious people true, but are Appalachians not also Americans? Look outwards towards the rest of America, and you will see the same capitalist warlords and oppression that once plagued Appalachia plaguing the entirety of the past USA. From the Midwest to the Southwest, American workers are all being enslaved, and their culture is being destroyed for the sake of profit. What makes those workers so different from Appalachian workers? It was at this moment that our Supreme Leader came to a single conclusion. OUR liberation was not over."
 NRA_Ask_For_Alaska_To_The_Russians:0 "Request The Transfer Of Alaska"
 NRA_Ask_For_Alaska_To_The_Russians_desc:0 "During the ensuing chaos of the collapse of America, the last frontier was taken by their historic overlords. Whilst the old America never got along with the Russians, our new America under our Supreme Leader strives to be different. Both of our peoples and cultures are defined by the workers rising up against capitalism, striving to save our culture from its destruction. Whilst they unfortunately have lost their way, and their culture is being tainted by capitalism once again, that does not mean we still cannot be on good terms with them. We will approach the Russian government in Alaska for control of the state once again, offering certain liberties such as military access and what not. Some might view this as betraying our goal of self-reliance, but we must make sacrifices for the sake of all American workers being united once again. And if the Russians say no, then perhaps resorting to insurgency will get the point across…"
 NRA_Dealing_With_Hawaii:0 "Dealing With Hawaii"
 NRA_Dealing_With_Hawaii_desc:0 "Hawaii has always been the odd one out of American states. Whilst having its own culture and people, Hawaii still holds many American workers that have been left stranded since the collapse. Not only that, but the capitalist controlled Pacific Fleet of the ex-USA holds dominance over the state and guards it with an iron fist. Whilst it might seem as though the odds are stacked against us in retaking the island, we will nonetheless prevail. Hawaii is American and its workers shall be liberated under the guidance of our Supreme Leader!"
 NRA_Pacify_Maine:0 "Pacify Maine"
 NRA_Pacify_Maine_desc:0 "Maine represents the northernmost bastion of American culture before the lunacy that is Canada. Because of its rich colonial history and culture, Maine had helped shape the culture of the American worker, laying the foundations of our Supreme Leader’s ideology of American self-reliance. Now, Maine is controlled by a group that is a threat to our revolution and American culture and should be pacified accordingly. We will save this bastion of American culture, whether the reactionary forces in charge like it or not."
 NRA_Destroy_The_Great_Lakes:0 "Destroy The Great Lakes"
 NRA_Destroy_The_Great_Lakes_desc:0 "As we move to spread our Supreme Leader’s revolution across all of America, we come to the great lakes. Historically the Great Lakes was the start of the American frontier, allowing American workers to leave the established cities and forge new ones with the industrial might to rival the east. However, they too have been tainted by the scourge of capitalism, with the industrial might being left to die as foreign outsourcing and destruction of American culture ran rampant. Since America’s collapse, the worst members of capitalism have come together to implement their sick and twisted version of capitalism, treating the workers like private property! Our Supreme Leader says no more, and we will liberate the culturally downtrodden workers of the Great Lakes and show them the light of revolution and self-reliance!"
 NRA_End_Minnesota_Chaos:0 "End Minnesota's Chaos"
 NRA_End_Minnesota_Chaos_desc:0 "The land of 10,000 lakes, once a bastion of labor progress, is now a land of bickering factions all wanting to control the lakes for themselves. Social Democracy is a dead end in the eyes of our Supreme Leader, and the only saving grace the culture of Minnesotan workers will have is with him. There can be no liberation as long as it is under capitalism, and Minnesotan workers have to realize this for the sake of their culture. The star of the north shall be painted red!"
 NRA_Finish_Off_The_Republicans:0 "Finish Off The Republicans"
 NRA_Finish_Off_The_Republicans_desc:0 "There was once a time where our Supreme Leader saw Trump as an ally of the American worker and his culture. Our Supreme Leader told everyone he could how glorious Trump was, and how he would make this country and its workers great again. But not anymore. Trump in his arrogance betrayed the very people he claimed to have wanted to save, instead opting to tear the nation and its workers apart. Now, our movement and his are face to face, old allies now staunch enemies. This misdeed against the American worker and his culture cannot be forgiven. Trump cannot be forgiven. So we will stop what he started."
 NRA_Take_Out_Florida:0 "Take Out Florida"
 NRA_Take_Out_Florida_desc:0 "Florida has always been a unique cultural place within America. Whether you saw its workers as insane lunatics or laid-back survivors of nature, most workers in the nation had their own image of what Floridian worker culture was like. However, whilst Trump was busy destroying America and its workers, his sons took Florida as their own like warlords. Capitalism triumphs in Florida currently, with them bleeding the already damaged state dry. Not only that, but if we choose to end Trump’s madness once and for all, his sons will have to be taken out as well."
 NRA_Bring_Texas_Into_The_Fold:0 "Bring Texas Into The Fold"
 NRA_Bring_Texas_Into_The_Fold_desc:0 "Texas has always held a great cultural significance in America to its workers. Ask any non-American what they believe an American is like, and there's a good chance that they’ll think of Texas. However, like all of the states in the Union, it had been corrupted beyond recognition by capitalism and its goons. As it stands now, Texas has the independence it has been wanting for centuries, but in reality there can be no independence under capitalism. What sort of self-reliance is there if the workers are at the whims of the global market? We have to bring Texas under our wing, let them know that the only chance of independence one has is with our Supreme Leader as his workers!"
 NRA_Clean_The_Southern_Rockies:0 "Clean The Southern Rockies"
 NRA_Clean_The_Southern_Rockies_desc:0 "The Southern Rockies have been sullied with capitalist and reactionary filth. Mormons trying to impose their faith on others? A madman seeking to end civilization as we know it? Drug cartels preying on and exploiting the proud American workers with their products? Apocalyptic Nazis that believe nuclear annihilation will bring on a golden age of the white race? It would be comical if it wasn’t so sickening. But we will finally be able to put an end to this nonsense."
 NRA_Conquer_The_Northern_Rockies_And_Cascadia:0 "Conquer The Northern Rockies And Cascadia"
 NRA_Conquer_The_Northern_Rockies_And_Cascadia_desc:0 "We are now in a position where we can finally begin to march north through the great Rocky Mountain Range and reach the coasts of Cascadia. The Northern Rockies and Cascadia have been engulfed in a turbulent state of things. From Trump’s armed wing in the Rockies, to the antifa-ridden cities of Cascadia, things have been equally as chaotic here as it has been in the rest of the country. But as the legitimate authority of the working class in America, we shall march through the mountains and reach the coast with fervent effectiveness. All American workers shall be liberated under the guidance of our Supreme Leader, with their culture being saved from the throes of capitalism!"
 NRA_Going_Back_Home:0 "Going Back Home"
 NRA_Going_Back_Home_desc:0 "We are in the homestretch. We have braved many struggles in our path of liberation for all America, with the workers being eternally grateful for our Supreme Leader and his tireless work to make America self-reliant and free of foreign capitalist rule. The only place left to liberate is the birthplace of our Supreme Leader, California. The state is controlled by the self-proclaimed "People’s Republic of America", a once revolutionary movement that has since been plagued by factions that lose sight of the true revolutionary goal. To us, the PRA stopped being revolutionary when it sought reliance with the Federalists, an act that has sullen the birthplace of our Supreme Leader. We cannot let this foreign reliance plague American workers anymore, we MUST bring real liberation to them. The Chinese may not like this, but it is a necessary step if we wish to preserve the culture of Americans. Kim would understand, and so will the workers!"
 NRA_A_New_America:0 "A New America"
 NRA_A_New_America_desc:0 "We have done it. Our Supreme Leader sits in our capital and is finally able to rest. From sea to shining sea, our banners fly, and the workers of America sing our anthem. Whilst we mustn’t forget our roots as a band of revolutionaries in Appalachia, we cannot focus only on it. We will march forward with pride and continue laying the groundwork for the revival of American culture and its self-reliance. We thank you, Supreme Leader Tucker Carlson!"
 NRA_Proclaim_Our_Victory_Over:0 "Proclaim Our Victory Over..."
 NRA_Proclaim_Our_Victory_Over_desc:0 "The revolution has won! Gone are the class traitors and class enemies that once plagued our land!"
 NRA_Capitalism:0 "...Capitalism..."
 NRA_Capitalism_desc:0 "The once "great" capitalist pigs that controlled America are either dead or rotting away in prisons. We have finally liberated the working class from their greedy grasp!"
 NRA_Fascism:0 "...Nazism..."
 NRA_Fascism_desc:0 "For the second time in history, the filth that is Nazism has been destroyed! Much like our predecessors, we have waged a great struggle against their poison, and just like back then, the will of the people won!"
 NRA_Liberalism:0 "...Liberalism..."
 NRA_Liberalism_desc:0 "The Liberals always claimed to be on the working class’s side, with their token concessions and gestures. They thought their facade would hide them and their bourgeois desires, but we have not only cast down that fetid mask, but utterly smashed it!"
 NRA_Progressivism:0 "...Progressivism"
 NRA_Progressivism_desc:0 "Progressivism, a somehow worse version of Liberalism, has finally been put down. Their divisive ideas of gender and race will no longer divide the working class!"
 NRA_The_Night_Before:0 "§3The Night Before§!"
 NRA_The_Night_Before_desc:0 "Before we came into control of America, the land was shrouded in the night of despair. The light of our glorious revolution has destroyed this foul cloud, and now the light of the victory of the working-class shines on the face of every man, woman, and child in America."
 
