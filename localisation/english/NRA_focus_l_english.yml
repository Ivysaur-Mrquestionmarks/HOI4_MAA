 ### events ###
 
 corporate.1.t:0 "The Trial of Tucker Carlson"
 corporate.1.d:0 "RIP"
 corporate.1.a:0 "He won't be an issue anymore"
 
 corporate.2.t:0 "Victory of the NRA"
 corporate.2.d:0 "From a small rebellion in the mountains of West Virginia, to the bearers of the American way. Trump showed us the way in 2016, showed us the rot that had taken over the old government. In 2020 he showed us that the rot could only be cleansed through direct action. Our final lesson was learned in the mines of West Virginia. \n\nBehind simple party loyalties, the NRA hopes to bring fair governance back to the people. We hold that the freedom for self protection to be self evident and will do everything in our power to protect the right to bear arms. It was in these arms we freed ourselves from a tyrannical government, and it is in these arms that we will remain free."
 corporate.2.a:0 "The Second Amendment is based"
 
 corporate.3.t:0 "Victory of the Vinnell PMC"
 corporate.3.d:0 "We have brought freedom and security to our new empire, by honing on the truest lessons that America ever taught us, eat or be eaten. The banners of an old empire were set ablaze across our lands, as the last holdouts of America finally died out, only to be reborn in our image. \n\n To our current contract holders, be aware that the terms have changed, as the situation has changed. Additionally, we are expanding our International contracts to alternative conflict zones. By tomorrow we will have already begun involvement in our neighbors affairs, with plans to spread our influence to every corner of the world. Let it be known that there is nothing in this world that makes men more ready to throw their lives away than the almighty dollar."
 corporate.3.a:0 "Money, Money and Money"
 
 corporate.4.t:0 "Victory of the Peabody Energy INC"
 corporate.4.d:0 "Today is a day that will be remembered throughout history, the day the company reformed America through an eternal will found within the human spirit. Our victories were earned through the blood of our enemies, and the sacrifices of proper men. To the people who find themselves under our employment, do understand you earn the right to work. In the coming months, we will conduct analysis and surveys to find what job best fits you. Remember, good work comes hard but always work with a smile on your face. \n\nWe are not fighters for an old man's dream, for the fighting has ceased and the old man has awakened. We are the Company, we are the American dream, we are the Corporation of American States."
 corporate.4.a:0 "Welcome to our family, sincerely, the Founder."
 
 corporate.5.t:0 "An Offer From West Virginia"
 corporate.5.d:0 "The mercenaries who rule West Virginia have offered us their services.\nWe are afraid that accepting such an offer might legitimize their power, but their help might be necessary."
 corporate.5.a:0 "Accept their deal"
 corporate.5.b:0 "We don't negotiate with those who profit from war and misery."
 
 corporate.6.t:0 "Our Terms Were Accepted"
 corporate.6.d:0 "We are glad to inform you that [FROM.GetNameDef] has accepted our very generous offer. The money shall start coming the moment our men enter their soil."
 corporate.6.a:0 "Excellent!"
 
 corporate.7.t:0 "With The Rifle On My Side"
 corporate.7.d:0 "Victory, that is what the preachers cry from the spires of their temples, what commanders tell the soldiers in their service, what we tell the people of Appalachia. They have fought each other every single year since the fall, yet now we exclaim victory to the masses. Our country lies in waste from bombardment and warfare, but now we have finally achieved that pressing objective that has eluded us for so long, victory. If we truly hope to maintain what we have won, we must learn from our past, and we must be better. It is time for us to realize that it's the people of Appalachia that is our strength, they are our greatest resource. Though, if one is to look out their window, they will have one simple question, is this truly victory?"
 corporate.7.a:0 "Victory means profit"
 
 
 corporate.8.t:0 "Bloody Monday"
 corporate.8.d:0 "The dark day has finally come for us all, and now all of Appalachia must suffer for our sins. We pushed them too far and now the foundation has given in, taking us all down with them. Many of our shareholders have pulled out and fled, and I'm unaware of the location nor allegiance of my staff. Smaller groups have already begun sticking their flags down across our territory. While most have been taken care of, a pair of groups still stand tall, the Mercenaries and the NRA. Both have a wealth of weaponry to demonstrate their power. The mercenaries draw away many from our security forces, and the NRA has been a home for disillusioned workers. They are both the greatest threat to our continued existence, but we are not finished with them yet. The company was forged with fire, and we will go out with blazing fury. To whoever receives this message, choose now or face our angels of death. Tomorrow will be a day where the whole world will hear the screams of Appalachia."
 corporate.8.a:0 "The Mercenaries come out on top!"
 corporate.8.b:0 "The Corporations maintain their grip!"
 corporate.8.c:0 "The NRA rises to power!"
 
 corporate.9.t:0 "Ownership over Appalachia"
 corporate.9.d:0 "Everywhere the mountains touch is under our domain. From the beaches of Virginia, to the Ohio valley, our people are finally united. Appalachia has brought us together, and we will make her proud. Though there are plenty who seek to destroy what we have accomplished, today we may have brought prosperity to the mountain, but tomorrow we will bring peace to the entire former United States."
 corporate.9.a:0 "Phase 1, Completed"
 
