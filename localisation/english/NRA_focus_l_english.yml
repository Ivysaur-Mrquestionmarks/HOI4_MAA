 NRA_Blue_Donkey:0 "The Blue Donkey"
 NRA_Blue_Donkey_desc:0 "We're here to chew gum and kick ass, and we're all out of ass, damn."
 NRA_Corporate_Fuel:0 "Unlimited Fuel"
 NRA_Corporate_Fuel_desc:0 "I love the smell of some good old black gold burning."
 NRA_Slavery:0 "Modern Slavery"
 NRA_Slavery_desc:0 "Ancient people must've done it for a reason, we can only benefit from a little bit of unpaid labor!"
