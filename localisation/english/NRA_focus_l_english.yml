 w_v.1.t:0 "The Second Battle Of Blair Mountain"
 w_v.1.d:0 "It happened. We have reached the point of no return."
 w_v.1.a:0 "Which side are YOU on?"
 
 w_v.3.t:0 "Comrade Tucker"
 w_v.3.d:0 "We must liberate the people of Appalachia."
 w_v.3.a:0 "Appalachia Rise Up!"
 
 w_v.6.t:0 "The Corporation's Counterattack"
 w_v.6.d:0 "We must destroy Tucker."
 w_v.6.a:0 "Better dead than Red"
 
 
 
 
 
 
 tucker.2.t:0 "An Interview"
 tucker.2.d:0 "Welcome everyone to the first broadcast of RFN, your Red Fox News. Today we have a special guest that we know you're all dying to hear from, our Supreme Commander, Comrade Carlson.\n\n"Thank you, Dante. I'm quite pleased with what you all have done with the place. The entire set almost reminds me of my own one."\n\nThe reporter looked flattered, "Thank you Comrade, I'm sure you're still twice the host any of us are. Now, let us get into some of the viewers' questions. Nancy from Leon wants to know what your plans are going forward with elderly care?"\n\nTucker smiled, "The elderly are responsible for the progress of yesterday. It is our responsibility to protect those individuals and grant them a peaceful end."\n\n"I think we have time for one final question, a Mr. Peterson from Atlanta wants to know your plan for convincing those who see our cause as radical?" \n\nCarlson lowered his brow, and took a moment to collect his thoughts. "One can not expect to convince everyone of the right path, but that does not mean we can not try. It is best to offer them a kind hand at first, but if they reject it, then it is our duty to drag them to progress by force. However, if they dare to harm our family and our friends, then by fire and fury we will defend ourselves. My will be done, your will be done, our will be done. Once they realize our commitment to progress, they will bow before us and confess their misgivings.""
 tucker.2.a:0 "Drain The Swamp!"
 
 tucker.3.t:0 "Proclamation of Independence"
 tucker.3.d:0 "No longer shall we coward and hide in the mountains, praying that those great predators would look us over for more inviting prey. From today forward, we will have our backs against each others and our rifles pointed straight towards the enemy. Let us not pretend that we are not a worthy opponent, as we were not the first to lay claim to the mountain in the falls aftermath. That inhuman corporation enslaved all of you before, but we fought back, and we won. Let that be a lesson to you all of our might. Let that be a lesson to you all of the strength within our characters. Let that be a lesson to all who would oppose us, that from this day and forever onward, Appalachia belongs to her people."
 tucker.3.a:0 "Life is good"
 
 tucker.4.t:0 "Mothman!"
 tucker.4.d:0 "Carlson stood behind his desk, looking through his windows out into the industrious West Virginian countryside. His military advisors had arrived minutes earlier, but Carlson had given them no attention, until the sun finally made its way past the mountains. Carlson turned and gave each of the three youthful military men a stare that sent shivers down their spines. It was at that moment that Carlson gave them a new lesson to learn from. \n\n"Gentlemen, in war, what is something more effective than bullets?" They shifted around, unable to answer. "Fear is the word you're looking for, and we have the ability to forge a sword of fear to strike directly into the heart of that grave enemy." They looked somewhat puzzled, but started following. "We live in a very superstitious region, with some even following the mythical Moth Man as a deity. However, this could be used to our advantage. If we are able to implement precise strikes, using darkness and rumors, we will cause panic across our enemies line's." He moved forward and asked if the men understood, they all replied with a nod. "Good, let's get to work men, we have a monster to wake.""
 tucker.4.a:0 "Who knows..."
 
 tucker.5.t:0 "The 4th Industrial Revolution"
 tucker.5.d:0 "When a man is shown that his work is being put towards the betterment of his friends and family, his spirit is lifted. Before the fall, American men suffered from the desire to make more and more money to protect their loved ones. Now, we have no need for that, as we all work towards the same goal. The release of that eternal strain can be felt across society, as the engine of our industry burns brighter than ever before. Each day, more and more flock to our cause, and each day, more hands are put to work with the goal of keeping our nation's heart beating. This is why we will defeat our enemies, they lack the human spirit, they lack our will to bear it."
 tucker.5.a:0 "The Cogwheel is our Ouroboros"
 
 tucker.6.t:0 "The Power of the Atom"
 tucker.6.d:0 "Breaking news, Supreme Commander Carlson announced a national investment towards harnessing Nuclear energy. While he faced push back from environmentalists and those who worried about the future of coal production, Carlson made it clear that any power produced by the plants would reduce the overall carbon footprint of coal while allowing it to continue being a part of West Virginian society. \n\nWorld leaders fear that this may open the door to Commander Carlson developing Nuclear weapons, though his office has come out with a statement proclaiming that they do not process such weapons and do not plan to in the near future. These words have done little to calm the nerves across the pond, as only the future will know how truthful they are. "
 tucker.6.a:0 "Call Mr. Kim!"
 
 tucker.7.t:0 "Our Way of Flying"
 tucker.7.d:0 "The days of Napoleon are over, as our war will be decided through air superiority. we must command that air if our brothers are to be freed from their oppressors. We must harness the skies and bring liberation from above. Let us harnish the spirit of revolution to strike fear into the oppressors, and hope into the hearts of the oppressed. Soon our brothers and sisters across the former United States will lift their hands to the sky and praise their angels. "
 tucker.7.a:0 "Up in the Sky..."
 
 tucker.8.t:0 "Our Way of Marching"
 tucker.8.d:0 "The greatest strength at our disposal is the indomitable spirit of mankind. The soviets taught us just how far that spirit can be pushed to, during Stalingrad, Lenningrad, and the determination to not take a single step back. With each step that our soldiers take, our reach expands, with every family saved from tyranny, our family grows, and with each bullet fired, our enemies fall before us."
 tucker.8.a:0 "...Down in the Land..."
 
 tucker.9.t:0 "Our Way of Sailing"
 tucker.9.d:0 "The greatest empire in our history dominated the world through their naval power. The formally United States held the globe in their hands through shire force of will and naval power. The Japanese, a small island compared to its neighbors, brought the world to its knees through pure naval supremacy. It is the navy who's back protects the army's rear. We must learn the lessons of history, and learn from the mistakes of empires fallen, for if we do so, we will bring peace and order to chaos. "
 tucker.9.a:0 "...And across the Sea"
 
 tucker.10.t:0 "Call Our Allies"
 tucker.10.d:0 "Carlson opened up the Zoom meeting with a potential ally in his great crusade against corporate greed. The irony did not escape him that the man about to grace his screen was one that he personally criticized during his days hosting a prime time television show. Though it was not all bad, as he did compliment the man at times, especially during former President Trump's tenure in office. However the entire situation wasn't that odd in comparison to the broader chaos at their door. There was no normal anymore, so the unexpected must naturally become the expected. \n\nSuddenly the man's phase took over the screen, the hermit king himself, Kim Jong Un, had a massive smile plastered across his face. "I'm very pleased by your presents Mr. Carlson, it's always good to have some eyes and areas so close to the two American giants. We have much work to do" "
 tucker.10.a:0 "What a busy day!"
 
 tucker.11.t:0 "Our Destiny Manifested"
 tucker.11.d:0 "With victories in both Tennessee and Pennsylvania, Comrade Carlson took the stage outside the Capital to speak personally with his adoring supporters. During the impassioned remarks, Carlson made sure to make his plan clear going forward with the integration and reconstruction process. \n\n"To those who find themselves under a new banner, we welcome you with open arms. To those who fear us and seek to undermine our principles, know that we will show you compassion and love on a level not seen by any nation before. We will rebuild the roads, we will rebuild the towns and cities, we will rebuild the safety and security that all good people deserve. We are grateful to have you all in our family, and we hope you will join us in bringing prosperity and progress throughout North America." \n\nOur Supreme Commander ended his speech with a personal thanks to the workers who powered our armed forces along with acknowledging the men and women who died for our cause."
 tucker.11.a:0 "Lincoln would be proud!"
 
 tucker.13.t:0 "Capitalism"
 tucker.13.d:0 "Capitalism, the greatest economic evil to ever be unleashed upon the populace. I won't deny, it did have its place and day, though it has long since passed. I recall the day I was radicalized, it was a cold day when I was fishing in Central Park. There was a man who came up to me and struck a conversation, he was young and hopeless. The American dream was denied to him, even after all he did to achieve it. He went to college, he got a Job, he stayed out of debt, but nothing worked. The American dream had become a nightmare. It was at this moment that my eyes were opened, and I finally saw the flaws in Capitalism. Though it took time for me to find the solution, and I found myself clinging to other toxic beliefs before finding the truth. "
 tucker.13.a:0 "Gone, now and forever"
 
 tucker.14.t:0 "Nazism"
 tucker.14.d:0 "Too many of my friends have fallen to this disgusting fallacy, yet I can't deny the power within their voice. Charlottesville solidified their power in my mind, as it shifted such a massive part of the population, even the President had to step carefully to not step on their toes. I won't lie, I used them as an important tool in my rise. The only difference between myself and those fools was that my rhetoric outclassed them. They may have been successful at putting on a show, but they were deeply flawed when it came down to convincing the moderate. No average person would dare vote or support someone waving a Swastika, but they would support someone who used their fears as a sword. Both use the same talking points, but one does it with a smile. Truly, if I had to put down the one thing that separates the two it would be presentation. "
 tucker.14.a:0 "A mistake"
 
 tucker.15.t:0 "Liberalism"
 tucker.15.d:0 "I think we all grow up liberal, for only in the eyes of a child does such an ideology seem tempting. I too thought I was a liberal once, but then I grew up, and left that behind with my toys and childhood innocence. It doesn't sound bad on paper, the idea that all should be equal, but it is in the execution of said equality that the entire system falls apart. They lack the ability to protect their own in times of chaos, which we find to be of abundance. This is where I separate from my liberals, I know the power of a big stick and the willingness to put the needs of the many above the desire to protect all. That is what they truly lack in understanding, you can never protect everyone, nor will you be able to convince everyone of your cause without some force. They are good hearted, honestly they are, but they're simply too polite to hold meaningful power. "
 tucker.15.a:0 "It always was an Illusion"
 
 tucker.16.t:0 "Progressivism"
 tucker.16.d:0 "The progressives have had a long and storied history, from one of the greatest Presidents to the blue haired heroines. It can not be understated what role they had in the destruction of the formerly United States, but also in the creation of my own family. They first flocked to Bernie in ‘16, before following him out west during the fall. However, not every single one was able to make it, and many flocked to my ranks in the early stages of the great fall. It is very likely that I wouldn't be able to be here if it wasn't for them. Many of them were my commanders and some still serve me loyally to this day. It is sad that so few actually stayed true to our cause, but I suppose that is the price one pays when dealing with the extremes. They are similar to the liberals, for they truly do want to make the world better, but they differ for they are willing to burn it all just to stop their opponents from gaining a foothold. I respect them for their drive and commitment, but their time has come and passed. Tomorrow is a new day, and it is time to embrace new ideologies. "
 tucker.16.a:0 "Like Sodom and Gomorrah"
 
 tucker.19.t:0 "The Green M&M"
 tucker.19.d:0 "To the people of the commonwealth, I speak to you now with a troubling message, our dream is being attacked from the inside. Those within the most horrible aspects of leftism have flocked to our ranks due to our compassion, but they have overstayed their welcome. These childless, Godless, humanoids seek to destroy us from the inside. Our enemies have sent these heretics to disrupt our family. They seek to confuse the youth and destroy our families. The strong familiar unit, which produced children who would hold up the glorious flag of our cause, is being attacked. Those who do not do their part to keep our society working are the ones who will doom us all. Now, we understand that asking people to only focus on reproduction is frankly too far, we aren't even asking this, as many children would love to be adopted and shown the light by a loving couple. Yet, they reject even this basic task of our family. The worst is what they do to our children, the beauty of youthful women is corrupted by their tendrils. They have all that is good forcibly ripped from them, and end up bringing others down with them. If you are a young woman listening, please, I ask you to do your part to uplift the men around our nation who too often find themselves lost and broken. Women, I call on you to bring this nation to the end goal, be the light for a man and that man will lead you to the promised land."
 tucker.19.a:0 "I... I guess?"
 
 tucker.12.t:0 "Going Back Home"
 tucker.12.d:0 "California, Tucker's homeland... infested with liberals acting as communists, filled with anarchists, deprived by its original beauty... We cannot stand this, this will be our last battle, our last conquest for a better America, wish me luck dear.\nA letter from an anonymous soldier."
 tucker.12.a:0 "We are almost done!"
 
 tucker.21.t:0 "The Spoils of War"
 tucker.21.d:0 "Reports from Hagerstown suggest that Tim Pool has agreed to step down and join Supreme Commander Carlson earlier today. After the recent conflict between the "Compound" and our nation, some speculated what role this small region would play in Comrade Carlson's grand scheme. The compound has proclaimed its independence from both Trumpist and Bidenist forces, similar to ourselves, but had struggled to maintain complete independence from outside influence due to their limited geopolitical reach. Carlson justified the intervention into the Compounds territory as a "Cleaning up" effort. He claimed that one of the major powers would subjugate those people, and that it is our responsibility to rescue the compound from themselves. In the aftermath of the compound's destruction, Tim Pool was contacted directly by Carlson, who set up a meeting soon after. Our Commander used his previous relationship with Pool to negotiate proper terms. Given the alternative options was seeking aid from either Unionist or Federalist, or joining Carlson, Pool picked the path of least bloodshed. It is expected that further integration efforts will be made over the coming weeks, as the compound offers an important strategic position between the great powers."
 tucker.21.a:0 "The revolution is unstoppable!"
 
 tucker.20.t:0 "Comrade Tucker invites us to join the Charleston Pact!"
 tucker.20.d:0 "Glorious comrade tucker has made great efforts to reach out to us to create an alliance. With this fruitful cooperation, we may forge a new future together"
 tucker.20.a:0 "We accept Comrade Tucker's generous invitation"
 tucker.20.b:0 "Unfortunately, we have different ideas for the revolution..."
 
 tucker.24.t:0 "Appalachian Proclamation of Independence"
 tucker.24.d:0 "Good evening citizens, Channel 38 is pleased to issue a message from the supreme chairman regarding the future. We ask the viewers at home to please be quiet, as Mr. Carlson is about to speak. \n"The enemy is at the door, and the sun has all but been blocked out, you would not be wrong to assume these are dark days. Though, one could also assume, correctly, that the higher the pressure, the stronger the will. It is with that mindset that I remind the populace of their resolve. I remind you, that pressure can make the strongest of diamonds, and in our great nation, I see diamonds in your eyes. Yesterday was a dark day, tomorrow is uncertain, but today will be a day to remember. We are done with being forced into a corner, it is time for us to bear our teeth, it is time for us to embrace family. Today is a glorious day, and tomorrow is looking brighter already.""
 tucker.24.a:0 "How did they..."
 
 tucker.22.t:0 "Tucker Carlson Requests Alaska"
 tucker.22.d:0 "A communication has arrived from West Virginia requesting the possibility of transferring Alaska to the new Appalachian state. The West Virginians have been our loyal allies and we even invested into their territory, it should be wise to accept their request since they are closer to unifying the old United States, which, if successful, means we get a very powerful ally.\nWhat should we do?"
 tucker.22.a:0 "Our mission here is done, we agree"
 tucker.22.b:0 "To hell with Tucker!"
 
 tucker.17.t:0 "The Morning After"
 tucker.17.d:0 "We won. The civil war is over. The people have risen up and defeated the NRA, the Mercenaries of the Vinnell l PMC and even the Corporate guard. West Virginia is finally ours, the people are free, and this is all thanks to Tucker Carlson and his comrades.\nBut now we have to rebuild West Virginia, it won't be easy, but we shall never surrender."
 tucker.17.a:0 "Time to get back to work!"
 
 tucker.18.t:0 "The Night Before"
 tucker.18.d:0 "We did it... we finally did it! Somehow, against all odds, we won. We unified the old United States of America. We helped the people, we destroyed the old and rotten ideas and we are once again a global superpower.\nSo Tucker, are you happy? This is all thanks to you, our loyal and great Chairman.\n\nAnd Tucker was writing his speech, surrounded by his friends."
 tucker.18.a:0 "Congratulations Chairman Tucker!"
 
 tucker.99.t:0 "Thank You For Playing!"
 tucker.99.d:0 "Well, you did it, it must feel good, doesn’t it? I hope you had fun playing as West Virginia, this is my first country I've ever coded and I hope it was a very pleasant experience for you. This is dedicated to everyone, especially you, my dear reader. Well, be ready for my next project eheh, my work isn't done yet! See you in Rio Grande.\nWelcome to Blood Meridian."
 tucker.99.a:0 "See you next time!"
 
 
 
 
 
 #categories
 NRA_International_Diplomacy:0 "International Diplomacy"
 NRA_International_Diplomacy_desc:0 "We must find like-minded people all around the world and we must do our best to gain their support and their international recognition."
 
 
 
 #decisions 
 NRA_A_Cheerful_Meeting_With_Putin:0 "A Cheerful Meeting With Putin"
 NRA_A_Cheerful_Meeting_With_Putin_desc:0 "Russia is without any doubt the leading Eurasian superpower with China now, despite this, both the Kremlin and the average Russian citizen are great supporters of our cause, we must organize a meeting with Putin."
 NRA_A_Trip_To_Chairman_Xi:0 "A Trip To Chairman Xi"
 NRA_A_Trip_To_Chairman_Xi_desc:0 "Despite China officially supporting California, our diplomats received news that Xi is also interested in helping us, we should accept this generous offer."
 NRA_A_Gift_From_Maduro:0 "A Gift From Maduro"
 NRA_A_Gift_From_Maduro_desc:0 "Venezuela has lots of oil but its economy could be doing better... We may help them with buying some oil."
 NRA_A_Mission_For_Assad:0 "A Mission For Assad"
 NRA_A_Mission_For_Assad_desc:0 "Ba'athism is probably one of the ideologies that can best explain our ideas to the outside world, helping our friends in Syria could give us more international recognition and it could train our soldiers to fight in different terrains."
 NRA_Offer_Shelter_To_Castros_Loyalists:0 "Offer Shelter To Castro's Loyalists"
 NRA_Offer_Shelter_To_Castros_Loyalists_desc:0 "After the brutal civil war in Cuba, we have decided to invite Castro's loyalists that are forced to flee from the Federalist backed rebellion."
 NRA_An_Handshake_With_Ortega:0 "An Handshake With Ortega"
 NRA_An_Handshake_With_Ortega_desc:0 "Nicaragua is one of the few countries in the world that had the courage to stand out against America, meeting with Ortega would be beneficial for us."
 NRA_A_Cup_Of_Tea_With_Kim:0 "A Cup Of Tea With Kim"
 NRA_A_Cup_Of_Tea_With_Kim_desc:0 "The North Korean regime is our best ally outside of America, we should strengthen our ties with them."
 NRA_An_Exchange_With_Khamenei:0 "An Exchange With Khamenei"
 NRA_An_Exchange_With_Khamenei_desc:0 "Even if Iran is an Islamic republic, Tehran is still open to recognize us and even to sell us some drones, this would give our country a great advantage against our foes."
 
 
 #faction
 NRA_charlestone_pact_faction:0 "Charleston Pact"

 
 
 ########################## CORPORATE WEST VIRGINIA #########################
 NRA_The_Appalachian_Disaster:0 "The Appalachian Disaster"
 NRA_The_Appalachian_Disaster_desc:0 "The board of directors have gotten grim news that many have been fearing for a while now. The communists rumored to be led by ex-Fox News commentator Tucker Carlson have begun a full-blown revolt against the Corporation’s rule, causing many workers within the mines and factories to abandon their posts and join the communist snakes. While it pains for us to kill off such valuable employees and work experience, the Peabody Energy Corporation knows that if your workers do not fall in line, then it is cheaper to fire and replace them then to give in to their ludicrous demands. We’re going to have to work overtime dealing with this disaster and pay for our loyal employees will have to be temporarily halted in order to garner funds needed to deal with the reds. Hopefully this doesn’t cause more employees to buy Carlson’s lies…"
 NRA_Conscript_New_Mercenaries:0 "Conscript New Mercenaries"
 NRA_Conscript_New_Mercenaries_desc:0 "While the corporation has always relied on private employment of mercenary groups in order to make sure its assets were well defended, it's clear that the recent disaster has caused many of these groups to lose faith in our company and try to pull out of their contracts with us. However, making sure to remind these mercenary groups of the "real" conditions of their contracts will force them to continue their service with us, even if we have to correct their faulty memories on the fine print and terms. We can also propose the same contract to outside mercenary groups looking for work, especially those who are known to be ideologically anti-communist. One group in particular, the Vinnell  group, even pledged their service to the company without us even having to make an offer to them. While this does mean one less begrudging mercenary group to pay, their well-known ties with the Confederacy and the Kanyeist regime have caused some members of the board to question Vinnell ’s real motives in their employment to us."
 NRA_Concessions_To_The_NRA:0 "Concessions To The NRA"
 NRA_Concessions_To_The_NRA_desc:0 "Carlson’s leftists weren’t the only group the Corporation had to deal with while overseeing West Virginia. Before the revolt, many parts of the state who claimed loyalty to the republican-tied NRA would often cause minor skirmishes with our mercenary defense forces. Due to the communist revolt however, many NRA cells seem to have turned their attention from targeting our mercenaries to targeting the leftists wherever they pop up, with many even fighting alongside and giving aid to our hired troops. Because of this, the board believes that we could get NRA cells on our side if we allow the NRA to operate in West Virginia once again. This would include opening association buildings and rifle associations in towns across the state, but there would be a clear restriction that any anti-corporate sentiment or action taken by NRA members would result in a local association being closed down and its members all punished accordingly. We have to keep a watchful eye over the NRA, as their Trumpist rhetoric since the collapse of the nation might end up causing more problems for us in the future."
 NRA_Invite_AntiCommunist_Fighters:0 "Invite Anti Communist Fighters"
 NRA_Invite_AntiCommunist_Fighters_desc:0 "Despite the current situation making many within the board of directors fear that the communists have a hold over the common people with their lies, this is far from the case. Many within and without West Virginia hold a strong hatred towards the ideology that is communism, and most are fanatical enough to even put their lives on the line in order to kill what they perceive to be the scum of the earth. If the corporation can advertise itself as a bastion of anti-communism and allow for these fanatics to operate within our borders, we can hopefully begin a wave of counterterrorism with these groups using whatever they have at their disposal just to kill some communist bastards. We can even create a bounty system where these individuals can be rewarded various amounts of money for varying accomplishments, from simply reporting suspicious activities to bringing in communist fighters dead or alive for the company to handle. There are even ideas to bring some of these fighters into corporate sponsored mercenary groups as a way to act as political commissars, instilling the hatred of communism into the mercenaries we employ and rooting out any potential sympathizers."
 NRA_Learn_From_Pinochet:0 "Learn From Pinochet"
 NRA_Learn_From_Pinochet_desc:0 "If there is one name in history that resounds within the hearts of all anti-communists, it's Pinochet. Augusto Pinochet, president of Chile from the 70s to 90s, is famous for leading the charge against the communists slowly trying to take over his country, as well as employing the famous "Helicopter Tours" that many online anti-communists worship as the most effective way of dealing with communists. As is natural with a war like this, there are many of those living under corporate loyal areas who seem to harbor sympathy to Carlson’s terrorists, whether it be corporate employees or civilians. The board has decided that we must instill a fear into any aspiring communist or rebel, one that will be glorified in the same vein as Pinochet’s famed tours. Many probably won’t question a helicopter flying around the mountains or dense forests of Appalachia during times like these, and by the time they see the bodies falling from the aircraft, it’ll be too late for the leftist scum to talk about it to anybody anyways."
 NRA_Protect_Our_Assets:0 "Protect Our Assets"
 NRA_Protect_Our_Assets_desc:0 "When dealing with an uprising such as this, foreign funding and weapons deliveries alone won’t give the corporation the foundation needed to win. Our various domestic assets, from our energy plants to our armories and small-scale manufacturing centers, have been at constant risk of communist infiltration and sabotage. The board will thus implement certain workplace "adjustments": armed guards will be posted inside and outside of every corporate owned facility, making sure that no employees attempt any sort of sabotage of production. The guards will also patrol the various company towns and roads that surround our assets, allowing us to more effectively guard ourselves and intercept any potential communist assaults or cells preparing themselves on the outside in loyal territory. Many employees might be disturbed by the constant body checks and armed guards inside their workplace, but if anything this will help them work even harder as to not piss off any guards who think they just might be slacking in order to let the communists gain the upper hand!"
 NRA_Help_From_The_GOP:0 "Help From The GOP"
 NRA_Help_From_The_GOP_desc:0 "Despite the Peabody Energy Corporation attempting to be neutral in the conflict between the Democrats and Republicans, it's clear to the board that if we want our company’s position to survive, we need outside assistance. Naturally, the Democrats north of us would most likely refuse any pleas of assistance, despising our rule after seeing how we’ve governed West Virginia and even more so after our recent agreements with the NRA. So, the only valuable faction that we believe will be willing to give us funding is none other than the Trumpist GOP in the west. After showing the Trumpist government how we’ve allowed their loyal dogs of the NRA to operate freely within our borders and making a good case of being fighters against the tyranny of communism, we can hopefully secure funding and overall support from the GOP that will greatly help us with fighting against the reds. We can even allow them to provide the NRA cells with proper military equipment, increasing their effectiveness in fighting the communists even more alongside our mercenaries."
 NRA_Advisors_From_Kanye:0 "Advisors From Kanye"
 NRA_Advisors_From_Kanye_desc:0 "Although our mercenary groups are as professional as money can buy, they are not all one monolith operating on the same orders and structure. Many of these groups, while given general orders by corporate loyal military analysts and strategists we’ve hired, often deploy varied tactics and plans of attack that can often lead to different mercenary groups clashing with one another or destroying precious corporation property. Because of this, the board has voted to hire military advisors and strategists from none other than Kanye himself. Despite being relatively new in existence and still plagued by internal political issues, Kanye’s Confederacy has the remnants of many professional US military personnel, much like its predecessor back during the Civil War. By making a case for ourselves to the Kanyeist regime as to the value of sending advisors our way, we can get outside help in structuring and organizing our current armed forces, being able to somewhat unify our forces when it comes to strategy and battle plans."
 NRA_Anti_Leftist_Crusade:0 "Anti Leftist Crusade"
 NRA_Anti_Leftist_Crusade_desc:0 "While the Peabody Energy Corporation attempts to pride itself on having a secular mindset, one cannot ignore the uses that religion can often have when dealing with dissent. Not only that, but our outward appearance has never been a particularly positive one, with many seeing us as just a soulless corporation that is fighting upset workers due to alleged "terrible" working conditions. So corporate’s media and marketing teams have come up with a plan: by marketing our side in this fight as being the defenders of freedom and religion against tyrannical and godless communists, we can hopefully create a reputation for ourselves as being a positive force in the world by purging West Virginia of freedom hating terrorists. We can also control what media gets shown, showing the terrible actions of the communists and all the destruction they cause while making sure our own image reinforces the idea that we are protectors of freedom and faith to the masses. Our crusade against leftism can inspire those still doubtful of our abilities to fight for our cause, increasing our potential manpower and hopefully creating soldiers that will fight and die for what they believe in for our own gain."
 NRA_The_Final_Battle:0 "The Final Battle"
 NRA_The_Final_Battle_desc:0 "After all of our preparation and hard work, it is finally here. We finally have the military capabilities needed to properly push back Carlson's terrorists while also gaining support from the employees of West Virginia by positioning ourselves as crusaders against communism. The Mercenaries and NRA cells, armed to the teeth with foreign bought weapons, stand ready for our Confederate advised high command to commence the final operation. Whatever fears or worries of failure the corporation has for this push into communist territory must be silenced or dealt with forcibly, as we cannot let fear plague the minds of our corporate crusaders while they prepare for the battle of their lifetimes. Soon, the fate of this entire conflict will be decided with one ending; Tucker Carlson being dragged out of whatever dirty hut he’s holed up in and beaten so hard that he’ll never be able to seduce the masses with his lies ever again!"
 NRA_Business_As_Usual:0 "Business As Usual"
 NRA_Business_As_Usual_desc:0 "Now that the rebellion has been dealt with, we can return to making money."
 NRA_The_Harsh_Reality:0 "The Harsh Reality"
 NRA_The_Harsh_Reality_desc:0 "The board can no longer deny the state of our nation. While our actions have led to a victorious wave of stability on paper, maps are simply drawn by men and never represent the breathing populace. Yes, we have cut off the head of the hydria, but the messages persist. The man is dead, but the ideas and environment to sprout another rebellion remain a constant threat. If the board refuses to look beyond what is on "paper", we will lose everything. If the Corporation is to march towards tomorrow, we must be willing to make the proper adjustments, even if it impacts our profit motives."
 NRA_Put_Them_Back_To_Work:0 "Put Them Back To Work"
 NRA_Put_Them_Back_To_Work_desc:0 "It no doubt feels soul crushing to many of our workers that their alleged "liberators" ended up failing in their mission to liberate themselves from our rule, but the simple fact of the matter is that we don’t care. They wouldn’t be any better off under communist rule anyways, with the only difference being they wouldn’t even be able to afford food if history has shown us anything. So, while we’re sure it was really fun for our workers to LARP as Russians and Chinese for a while, we need to get the message out that playtime is over. We will start to put our workers back in their places and get production restarted so that we can continue rebuilding our assets and start making money in order to repay our war debts. They will unfortunately have to go without pay until further notice, and if they don’t like it then we’ll just replace them with people who do. Various construction firms that we collaborated with before the civil war seem to have survived the fighting, so we can write them various IOUs in order to convince them to collaborate with us once again and start rebuilding assets to get the money flowing once more. Some of our financial advisors have warned us about writing IOUs when we can’t guarantee payment, but what else do they suggest we do when the damn construction companies won’t work with us any other way?!"
 NRA_Call_Trump:0 "Call Trump"
 NRA_Call_Trump_desc:0 "While our relationship with Donald Trump is diminishing at best, we cannot deny that he is a potential source of money that we should try to turn to in our times of struggles. Despite our differences, Trump should no doubt be sympathetic to our cause as he himself was a man from business roots with his overreaching organization that holds control over a variety of his business ventures. While his current position is not ideal to generously give our corporation a small loan that will at the very least allow us to pay for our workers, perhaps we can make a case for ourselves that will make us appear as more of a long-term investment rather than a short term one. When we call Trump, we can attempt to convince him to invest in us by giving him special privileges once he becomes president once again, especially legal ownership over the state once he returns to his proper offices. Are these promises hollow and not genuine? Absolutely, but in the modern USA, disingenuous promises are how states and people survive in this anarchy. Let’s just hope he buys it…"
 NRA_Learn_With_Kanyes_Forces:0 "Learn With Ye's Forces"
 NRA_Learn_With_Kanyes_Forces_desc:0 "The Confederate army, while controversial, is no doubt a great ally for us. Joint exercises and intelligence sharing are good steps to ensure a positive and fruitful partnership."
 NRA_Bribe_Scientists:0 "Bribe Scientists"
 NRA_Acquire_Drones:0 "Acquire Drones"
 NRA_Mass_Expansion_Of_Industry:0 "Massive Expansion Of Our Industries"
 NRA_Learn_From_Our_Mistakes:0 "Learn From Our Mistakes"
 NRA_Produce_More_Energy:0 "Produce More Energy"
 NRA_Bring_Here_The_Goodies:0 "Bring Here The Goodies"
 NRA_The_Economy_Is_Saved:0 "The Economy Is Saved"
 NRA_Meet_The_Mercenaries:0 "Meet The Mercenaries"
 NRA_Meet_The_Mercenaries_desc:0 "Without mercenaries, we most likely would have lost the civil war and we all would be dead in a mass grave about now. And while sure, we may have had to go behind their backs and "correct" their contracts in order for them to stay with us longer than they probably wished to, we think that our best course of action is to meet with this vast coalition of mercenaries we have assembled and to discuss things going forward. This coalition seems to be headed by the Vinnell l group, a mercenary group that has suspiciously been loyal to the point where they even rejected pay raises for their services in the civil war. The Vinnell l group has shown itself to be quite charismatic among their fellow mercenary groups, so we will go to them first in order to initiate a meeting with the numerous mercenary groups and discuss various things, such as further employment plans and pay discussions. Hopefully in this meeting, we can start a discussion on various things like pay decreases or laying certain underperforming groups off of the payroll completely. Make no mistake, this WILL upset some of the groups involved, but hopefully the Vinnell group can calm them down and make them accept our terms without doing anything dangerous."
 NRA_Expand_Our_Industries:0 "Expand Our Industries"
 NRA_Expand_Our_Industries_desc:0 "Despite the Peabody Energy Corporation being mainly focused on the coal industry, we have to accept the fact that our current situation does not favor coal if our numbers are anything to go off of. While we aren’t going to completely shift our priorities away from coal and energy production, we have to begin focusing on other industries and operations in order to start seeing overall profit again. West Virginia has a variety of different opportunities for this: We could start lumber mills to sell to our partnered construction firms to help reconstruction, or we could start manufacturing civilian and military goods to a small extent to sell both domestically and abroad. We could also begin construction of company towns in order to create our own economy that the employees will have to abide by so that we won’t suffer from the challenges of our current economy. However, this will require us essentially forcing our workers out of their previous homes to live within our company towns, but at least they won’t have to pay rent! All they’d have to do is adhere to the town economy regulated and managed purely by us…"
 NRA_Mass_Survelliance:0 "Mass Surveillance"
 NRA_Mass_Survelliance_desc:0 "West Virginia is one of those states where it can often be difficult to get a reading on what's happening, whether due to a lack of infrastructure or the inherent nature of the Appalachians just causing problems. It's clear that if we want to solidify our rule over West Virginia again, we need to ramp up surveillance. We’ll get to work on putting in the necessary infrastructure, both physical and digital, to monitor the people living in West Virginia and to make sure that no undesirable actions happen within our workplaces and controlled areas. Now, eventually word WILL get out that we are doing this, and trying to be covert about these plans will only make the eventual discovery worse from a PR perspective. So, we’ll look back on what the US government did back in the early 2000s and use the same excuse: We are doing it to root out terrorism, and you have nothing to fear if you have nothing to hide while we do so!"
 NRA_Implement_AI:0 "Implement AI"
 NRA_Implement_AI_desc:0 "It should be a surprise to absolutely no one that the locals of Appalachia can’t navigate a computer to save their lives or plan an effective economic model even if there was a gun pointed to their head. However, the board has recently suggested a fix to this issue that could make things a thousand times easier for our corporation as a whole. AI, while somewhat stigmatized and seen as a joke by many in the world, could allow us to plan and manage our economic plans as many computers already do for many different corporations around the world. Not only will AI eliminate the risks of human error and bias in its calculations, but it will speed up the planning process that would normally take ages to do with human hands. Hopefully the locals aren’t scared by the effectiveness of this technology, or cry about it stealing a job they were never going to be offered in the first place!"
 NRA_Purge_The_Rebels:0 "Purge The Rebels"
 NRA_Purge_The_Rebels_desc:0 "As with any civil war, a rebellion surrendering doesn't immediately lead to every single one of their members throwing in the towel as well. Even though we have Carlson in our custody, we still get reports from our mercenaries about fire fights and engagements with communist rebels long after their leader has been captured. The board, in collaboration with the various mercenary groups we’ve employed, has agreed upon a plan of purging the remaining rebels within West Virginia with no remorse. Mercenary patrols and stations will be increased tenfold in the places that are considered hotbeds for rebel activity. We also shouldn’t take any chances for rebels to leave the state and regroup either, so we’ll need to have airtight border control to make sure none slip through the cracks. Finally, we should make sure that the rebels don’t try to move their activities into low-threat areas of West Virginia, so a moderate increase of mercenary activity will have to happen there as well, regardless of what the locals think."
 NRA_Re_Open_The_Market:0 "Reopen The Market"
 NRA_Re_Open_The_Market_desc:0 "As a semblance of peace finally begins to return to West Virginia, we can finally begin to reopen the state to outside businesses and investors once again. This move will have to be accompanied by a massive PR campaign to showcase how safe West Virginia is now that the communists have mainly been dealt with. This will involve various investor targeted videos showcasing the natural beauty and resource potential of West Virginia, and we should even conduct tours for outside investors at many of our pristine company towns to make sure they feel comfortable investing their money in our state and corporation. Of course, we will still hold a monopoly over West Virginia and its energy resources like coal, but we can allow outside investors to invest in other, trivial things such as consumer goods or entertainment. If we try hard enough to present West Virginia as the perfect place for capitalism to settle down, then we will no doubt cause our profits to skyrocket in no time!"
 NRA_Pressure_The_National_Rifle_Association:0 "Pressure The National Rifle Association"
 NRA_Pressure_The_National_Rifle_Association_desc:0 "Collaborating with the NRA during the civil war did prove to be useful in several aspects, but now since the fighting has mainly stopped with the capture of Carlson, we’ve been presented with a new problem. Many of the main areas that the NRA were fighting in during the civil war they’ve now been de facto ruling as their own autonomous areas, with corporate authority often being ignored in favor of the NRA’s. To anybody smart enough, this is a clear disaster just waiting to happen if it goes unaddressed, so we will have to take measures to ensure that the NRA knows who is really in control of the state. We’ll begin by drafting new terms of cooperation that the NRA must follow if they wish to continue operating inside of West Virginia, such as increased adherence to corporate laws and being forced to allow us to go about our economic business without disruptions. Will this anger the association? Absolutely, but we can’t just allow our authority to be subverted because a bunch of gun nuts who are more loyal to Trump than the corporation said so."
 NRA_More_Guns_For_The_Mercenaries:0 "More Guns For The Mercenaries"
 NRA_More_Guns_For_The_Mercenaries_desc:0 " As we continue to re-establish our control over the state, our mercenaries will require a boatload of new weapons and military hardware to efficiently carry out their duties and contract obligations. These guns can come mainly from foreign arms dealers who will happily take our money in exchange for their wares, but we also shouldn’t ignore the possibility of expanding our interest towards domestic arms manufacturing centers, especially in NRA controlled areas. The mercenaries will no doubt be happy that they have new toys to test out on any would-be rebels, especially since they’ve been getting bored ever since the rebel situation has died down significantly. Curiously, one of our board members has noticed that a good majority of these guns have been given to the Vinnell group, who claims to be a middleman in distributing them to the other mercenary groups in our stead. Given their loyalty however, we don’t think this will cause any issues."
 NRA_Build_New_Natural_Gas_Wells:0 "Build New Natural Gas Wells"
 NRA_Build_New_Natural_Gas_Wells_desc:0 "The Peabody Energy Corporation’s bread and butter has always been old and reliable coal. However, a new business opportunity has been discovered that Mr. Grech and the board would be absolute maniacs to refuse. Our hired geologists have discovered several potential sources of natural gas inside of West Virginia that previously went undiscovered for whatever reason and given how many things in this world use natural gas, it would be criminal of us not to jump on this opportunity and profit off of it. Collaborating with our construction company partners, we will go out into these areas and begin construction of brand-new natural gas wells, which will allow us to produce natural gas alongside our primary production of coal. With these new discoveries, we can monopolize our natural gas resources by selling them to various states and groups across the USA who no doubt desperately need it, essentially causing a nationwide reliance on us in order to fuel their cars and military vehicles. They might claim our prices are outrageous, but let's be real, when has gas NEVER been outrageously expensive in this country?"
 NRA_Mass_Mechanization:0 "Mass Mechanization"
 NRA_Mass_Mechanization_desc:0 "Despite the majority of our coal extraction and processing being done with human hands, we as a board realize that our profit margins and speed of production could be hastened tenfold if we move forward towards more mechanization of our labor. The board, with assistance from our AI planning software, has drawn up plans that will see the purchasing and mass implementation of machine hardware that will do the work that has been done traditionally by human workers. Now, naturally with this process, numerous workers will no doubt be angered at the board’s decision to replace them with emotionless machinery. We can hopefully mitigate this anger by training workers in the field of machinery maintenance, as well as reassigning them to other posts either within the same company town or reassigning them to a different company town to meet a need for workers elsewhere. Could this still cause people to be angry over our decisions? Absolutely, but as always, the workers always get informed of the risks and possibilities when agreeing to their terms of employment. If they do not like this change, they can take it up with Human Resources, although it would probably save them the trouble of waiting without a home and just accepting the reassignment."
 NRA_The_Trial_Of_Tucker_Carlson:0 "The Trial Of Tucker Carlson"
 NRA_The_Trial_Of_Tucker_Carlson_desc:0 " Finally, after the grueling shitshow that was this damn uprising, after all the ambushes by hillbilly communists and rotting pickup truck drive-bys, we finally have that rat bastard Tucker Carlson under custody. Many both on the board and in the hired armed forces wanted to just shoot him and dump the body somewhere never to be found, but Mr. Grech had a different idea for what to do with this self-proclaimed "revolutionary". Putting on a trial not too dissimilar to the Nuremberg Trials, where firsthand accounts of soldiers and civilian "victims" of Carlson’s group of rebels, obviously attended by media and TV crews to broadcast across the divided nation. Of course due to the nature of the trial, and the fact that Carlson had been beaten to a pulp to the point where talking was a difficult task, Carlson and whatever leadership of his clique we could find alive were not allowed to defend themselves. After about a week of testimonies and evidence brought forward, the jury filled with Mercenaries, NRA fighters, and "independent" peers found Carlson and his groupies guilty of mass destruction and death, being given the death penalty. Of course, this sentence would include one of the most luxurious helicopter tours of their lives before their execution, and the board even made their execution pay-per-view to profit off of Carlson’s demise!"
 NRA_Strange_Reports:0 "Strange Reports"
 NRA_Strange_Reports_desc:0 "The board has been notified by the corporation’s surveillance teams with strange reports that are starting to make Mr. Grech and the board worried. For starters, we’ve been receiving reports of protests in specific areas, not communist protests but Trumpist aligned protests. Digging deeper shows that many of these protests have come up in areas heavily influenced by the NRA that the corporation has been at odds with since attempting to curtail NRA influence. What's more is that a good majority of our mercenary groups have stopped responding to corporate communications, with surveillance efforts showing that they’ve started communicating on non-corporate, closed off channels we have no access to. Even the Vinnell group, the one group we presumed to be the most loyal to our corporation, has seemingly ghosted us and any attempts to get in contact with their leaders have been met with silence."
 NRA_Chaos_In_The_Streets_Again:0 "Chaos In The Streets Again"
 NRA_Chaos_In_The_Streets_Again_desc:0 "We now have definitive confirmation that the protests were directly orchestrated by the damn NRA, and they’ve begun to get out of hand. NRA members have begun to conglomerate into one massive group, equipping themselves with the guns they love more than life itself, and have begun to march towards corporate headquarters. While the march is still far away from our corporate headquarters, we have another problem that spells doom for our company. We finally managed to infiltrate the closed communications between our hired mercenary groups, and the bastards have been planning a full-blown putsch on our headquarters as well, headed by the fucking Vinnell l group no less! The bastards had been biding their time for God knows how long, and now they’ve finally caught us off guard. Both groups are causing damage across West Virginia, with the NRA march essentially being a convoy of looters and rioters while the Mercenaries have begun to use their military equipment to take over or destroy our various communication centers in the state. The only loyal forces we have to even try to deter this threat are the various non-mercenary security details, with the main bulk of our forces being stationed here at corporate HQ. We need to act. FAST."
 NRA_Bloody_Monday:0 "Bloody Monday"
 NRA_Bloody_Monday_desc:0 "The workers are panicking, the bankers are fleeing, and the boss is no more. Fear has brought the company to its knees and has created a potential power vacuum. Multiple factions are clinging for any positioning over the other, yet the company's day is not completely over, and if they have an ace up their sleeve it's now or never. The future of Appalachia is uncertain, but one thing is clear, change is coming."
 NRA_The_Mercenaries_Putsch:0 "The Mercenaries Putsch"
 NRA_The_Mercenaries_Putsch_desc:0 "After enduring months of corporate bullshit, after all the shitty battles and orders they’ve sent us, and after all the pay cuts and contract changes, the Mercenaries have finally had enough. The mercenary groups, united behind the charismatic Vinnell group, have managed to overrun the headquarters of those corporate bastards, finally putting a bullet in the head of Grech and his damned board of directors. We’ve also managed to sideline those hick bastards of the NRA and solidify ourselves as the dominant force within West Virginia. It’ll sure as hell be a difficult task to deal with everything in West Virginia now that we’re calling the shots, but we sure as hell don’t mind mowing down those who don’t agree with our "unique" way of doing things. Besides, the payments coming in from President West from down south was an offer you’d have to be a moron to refuse!"
 NRA_The_NRA_March:0 "The NRA March"
 NRA_The_NRA_March_desc:0 "Finally, after months of dealing with godless communists pillaging our homes and having to give lip service to the corporate kings who have ruled our great state for too long, the true patriots of the NRA have finally regained control of West Virginia for the United States! After storming their den of corruption and sin, the brave fighters with the NRA have since then arrested most of the high-ranking officials of the Peabody Energy Company, as well as actively fighting whatever remnants of their bandit mercenaries still exist in our home. No longer will the moral and hard-working folks of West Virginia be exploited by unpatriotic corporations or be robbed by their mercenary bandits. Starting today, the good men and women of the NRA will rebuild our great state back to its moral and comfortable spot within the wider union as a whole. Let Biden’s cheaters in Washington and Kanye’s conmen in Atlanta hear this slogan: They can take West Virginia when they pry it from our cold, dead hands!"
 NRA_The_Corporation_Move:0 "The Corporation Move"
 NRA_The_Corporation_Move_desc:0 "Despite everything we’ve built feeling like it's been falling apart since those damn communists rose up, the Peabody Energy Corporation still stands supreme in West Virginia. The disloyal mercenaries have run into the mountains or left the state altogether, and those gun obsessed hicks at the NRA have been scattered and disorganized to the point where they couldn’t take down corporate security even if they had a rocket launcher. Everything that has happened since the communist uprising has also given us a very…unique position that we’d love to exploit. Given the chaotic nature of West Virginia at the moment, we can happily begin to take measures that solidify Mr. Grech and the board’s control over the state even further, allowing our profit margins to skyrocket. The Trumpists and Bidenist clowns might call us soulless, or that we wish to ruin the great state of fucking West Virginia, but all we know is how to survive in the world those two assholes created for us."
 NRA_Proclaim_Mercenaries_Rule:0 "Proclaim Mercenaries Rule"
 NRA_Proclaim_Mercenaries_Rule_desc:0 " We are soldiers foremost, not double-crossing politicians. However, many both inside and outside of West Virginia believe that this could be the dawn of a new era, one where mercenaries can finally have a home of their own where they won’t be dragged down by the bullshit of corporate double-speak or political ruminating. This idea seems to be quite popular among many of the groups that have made up our strange mercenary coalition, so by the orders of the Vinnell group we will begin to transform West Virginia into a state never seen before in history. A state run by mercenaries who have no borders but have a global homeland that they can rely on to take them in and prove their worth in their work, free from the red tape and corporate wrong thinking that many of our brothers abroad suffer from. The world might spit on us and call us nothing more than bandits, but that just means they can find somebody else to fight their damn wars."
 NRA_Lock_And_Ready:0 "Lock And Ready"
 NRA_Lock_And_Ready_desc:0 "The NRA and us mercenaries have never exactly gotten along. They view us as unpatriotic soldiers who would rather sell our work than fight for any stupid country, and we view them as nothing more than a bunch of hicks with a gun fetish. During the crisis, the mercenaries and NRA were forced to cooperate due to mutual interests of not having our brains blown out by communist scum, but since the end of corporate rule in West Virginia the NRA has begun to annoy us once again. So, going along with the plans drafted by the Vinnell group, the coalition of mercenary groups will coordinate a mass takeover of NRA facilities and manufactories in order to finally neuter the fuckers once and for all. Those stupid enough to try and stop us will have their bodies riddled with lead, and if getting rid of the NRA means burning down a few of their facilities and loyal towns in the process, then we sure as hell don’t have a problem with that. Fortunately for us, killing is one of those things that get easier the more you do it."
 NRA_Cleaning_The_Country:0 "Cleaning The Country"
 NRA_Cleaning_The_Country_desc:0 "As with any sort of newly established authority like this, there's going to be about a million pains in our asses for the near future. Somehow you still have corporate snakes trying to spread lies about our coalition, the NRA and their cult of gun fetishists shooting any mercenaries they see, and you even have the occasional hillbilly community still holding on to the words of that fucker Carlson. It seems as though we’re going to have to start doing something about all these fuckers before they can get the upper hand over our groups. The Vinnell group, with coordination and input from the mercenary coalition, has devised a system of patrols and bounties that will be followed by all mercenaries, allowing for specific jobs to be chosen individually and allowing for higher pays for doing specific actions such as bringing in potential dissenters. Is this system stolen from the corporate days? Hell yeah, but if a system works then you sure as hell don’t try to fix it."
 NRA_Above_The_Army:0 "Above The Army"
 NRA_Above_The_Army_desc:0 "Mercenaries are who we are because of our time in whatever nation’s army that we come from. We also are who we are because of seeing through the bullshit of a national army and all its lies of pride and glory, despite many of us coming home and receiving neither of those things. So, as we establish a global homeland for our kind, we will make it very clear that there is no place for any army men looking for glory or pride. We do not offer the oppressive regimented lifestyle that tortured us all before we knew war, and we most certainly do not offer the promises of glory or pride like we were. Instead, the main thing that we offer is one thing and one thing only: brotherhood. Because at the end of the day, it's not the drill sergeants or the armchair generals that matter in war, it’s the men you fight alongside with and kill the enemy with that matters most to us. So we see ourselves above the damn army, and anybody looking to stop us will get a fist full of brotherly whoopass."
 NRA_Improve_Strategic_Infrastructure:0 "Improve Strategic Infrastructure"
 NRA_Improve_Strategic_Infrastructure_desc:0 "Despite there being ideas and proposals from the mercenary coalition to start rebuilding certain civilian areas so our boys wouldn’t have to deal with army living conditions all the time, the Vinnell group knows that the main priority in terms of our state’s survival is the strategic infrastructure found within West Virginia. A state like ours cannot survive unless we can improve the infrastructure of West Virginia to a point where it’s easier for an armed convoy to get through it than civilian transportation. So, utilizing civilian paid construction teams, we’ll outline a complete renovation of West Virginia’s military infrastructure, allowing us to defend the area a hell of a lot better than we currently can. Not only that, but it’ll help our boys more effectively keep the peace in West Virginia and keep any ungrateful civilian bastards in line."
 NRA_Goodbye_Mr_Trump:0 "Goodbye Mr. Trump"
 NRA_Goodbye_Mr_Trump_desc:0 "Not gonna lie, after raiding all the corporate armories and vaults for their weapons and cash, we gotta thank the Don for indirectly giving us a pretty good starting position. However, we all know that due to our treatment of his boys at the NRA and the Vinnell group’s connection with President Kanye down south, Donald Trump would never support us or our state no matter how cheap we could make our services to him. So, the Vinnell  group has decided to publicly announce West Virginia’s dissociation with the United States, as well as making sure to give lip service to our good friends in the Confederacy. This will no doubt anger the GOP and Trumpists all across the country, but it's what we have to do if we need to be taken seriously in the world. Besides, if we do need any help, we can always rely on the Confederates for protection if certain developments come up. God knows that the democratic asses won’t help."
 NRA_A_True_Mercenary_State:0 "A True Mercenary State"
 NRA_A_True_Mercenary_State_desc:0 "After months of various developments and ideological experiments, the Vinnell group and the mercenary coalition can safely say that a true mercenary state is becoming a reality as the days go by. More and more mercenaries from abroad have decided to take up shop here; the living and work conditions for mercenaries have been praised by both insider and outsider mercenaries, and the identity we are helping to shape within our state is something to be awestruck by. There are even talks by some of the more entrepreneuring members of the coalition about making ourselves a hub that will monopolize the entire mercenary market, forcing any nation that wants to hire our brothers to go through our terms rather than the anarchic system mercenaries had before. Sure the civilians inside West Virginia often won’t stop complaining, but you know what? If they want to be treated with respect, then go through the training we provide and become a mercenary inside of crying like a little bitch all the time. And if you don’t want to? Then shut the fuck up and do what we say, civilian."
 NRA_Buy_More_Guns:0 "Buy More Guns"
 NRA_Buy_More_Guns_desc:0 "Given the recent influx of demands for guns within our state, it’s clear to us that the current manufacturing capabilities of West Virginia are not capable of meeting the growing demand for weapons. So, the Vinnell group will begin looking for long-term weapons dealers to provide our state with the guns needed to protect and govern it without any logistical issues. Naturally the first place we should look is within the Confederacy, as the Vinnell group has reassured the coalition that they are fully willing to provide us with weapons with a rumored reduced price tag. Other buyers both domestic and international will still be on the table, but our safest bet is to take Vinnell’s word and rely on the Confederacy to provide us with a short-term investment."
 NRA_Meet_The_New_Boss:0 "Meet The New Boss"
 NRA_Meet_The_New_Boss_desc:0 "The Vinnell group has gathered the other mercenary groups in the coalition to announce a new change in how we run things. The group has organized a meeting with the Confederate president, Kanye West, in order to discuss the possibilities of strengthening Confederate control over West Virginia and our state as a whole. Their reasoning is that if we allow Kanye and his Confederacy to "oversee" things in West Virginia, then it’ll allow us mercenaries to stop focusing on the grueling and mind-numbing politics side of things and refocus on what we were born to be: mercenaries. The Vinnell l group reassures the other mercenary groups that we will still be able to retain our autonomy and authority within West Virginia, the only change being that we occasionally will have to align with some standards and demands from our new boss from Atlanta. Besides, with how much more money and guns we’ll be given in the process, it’ll make life so much easier for those wanting to make a name for themselves here in good old West Virginia!"
 NRA_Return_Of_The_Old:0 "Return Of The Old"
 NRA_Return_Of_The_Old_desc:0 "When the nation broke apart and the Peabody Energy Corporation illegally occupied the country under its rule, many families and communities were torn apart due to them forcing their company’s employment onto the good people of West Virginia, not even mentioning the environmental damages they’ve caused due to their practices. Now that the corporation and their bandits have lost control over our homes, we can finally begin to settle back down into our ways of life and heritage. NRA fighters will return back to their homes and come back together to pick up the pieces of their broken communities, allowing life without bloodshed to return to the Appalachian Mountains, if only for a brief period. This might not heal the scars that the fighting has caused within our young men and women, but hopefully smelling the biscuits and gravy being served for dinner after so long can help the scars fade, allowing the same loving environment to heal our citizens back into normalcy. Let the men and women rest, and hopefully their children will never have to go through what we have had to go through ourselves."
 NRA_Work_With_The_GOP:0 "Work With The GOP"
 NRA_Work_With_The_GOP_desc:0 "Now that corporate authority in West Virginia has broken down and crumbled, it's time for the state government of West Virginia to be reformed and the institutions protecting its people reinstated. In order to do this, it is in our people’s best interest to work alongside any GOP remnants that have survived in hiding in West Virginia during the corporation’s rule in order to rebuild our state government. We can do this by reopening Republican controlled offices and centers in order to invite older GOP members into our government while also attracting a new generation of republicans who can hopefully bring a new but traditional perspective on things. Not only this but inviting GOP members from the Trumpist controlled areas of the nation will give outside expertise and help, as well as furthering our connections and relationship with the true president of the United States of America. Of course, many of these members are proud associates of the NRA, so our guns and rights will no doubt be protected as we rebuild our homes!"
 NRA_Rebuild_Our_Homes:0 "Rebuild Our Homes"
 NRA_Rebuild_Our_Homes_desc:0 "Corporate rule over West Virginia didn’t help our infrastructure, as hundreds of thousands of people were forced out of their homes and put into shoddy company towns that had the same living conditions as a prison. The conflict with the communists made the situation even worse, as the numerous abandoned houses and towns were used as cover by both sides in the conflict, causing even more damage to these once comfortable and homely environments. Now that the conflict has ended and we have control over our homes once more, we can get to working towards rebuilding our towns and cities back into what we remember them as. By forming numerous construction legions and having them go across the state and rebuilding homes and buildings for our people, we can hopefully provide housing for the various displaced families and communities that either were made homeless during the conflict or left the state but are coming back. We can also renovate the various company towns that the corporation propped up and give them a certain West Virginian flair to them."
 NRA_A_Professional_Militia:0 "A Professional Militia"
 NRA_A_Professional_Militia_desc:0 "Despite our victories over the corporation kings and their mercenary rabble, that doesn’t mean the NRA can just sit around all day not trying to make sure our communities are protected and safe. Many of the mercenary groups that haven’t disbanded or left West Virginia still roam the Appalachian mountains, hiding and causing trouble for our people. So, as our good old friend the second amendment so elegantly states, we’ll go on to form a professional and well-regulated militia that will be the base for our state security for the time being. To avoid decentralizing ourselves further, we will only approve the creation of a single government sponsored militia, where they will be trained by ex-drill sergeants and veterans that will hopefully give our militiamen the training they need to deal with threats both inside and outside of West Virginia. We're gonna show those soldiers-for-hire boys what real and true dedication to defending one’s home REALLY means!"
 NRA_Diversify_Our_Industries:0 "Diversify Our Industries"
 NRA_Diversify_Our_Industries_desc:0 "The corporation that ruled our state was first and foremost an energy company, and ever since they came into control of West Virginia they dedicated the majority of our workforce and construction on coal mines and energy plants. While we’re glad that we were able to have the industry needed to power our homes so that we aren’t all living in darkness, the current position of West Virginia has reminded us that we cannot live on having our entire industry be purely energy-based. So, the economists in our rebuilding state government have devised a plan to diversify our industry, with the first order of business being to deem some energy plants as unnecessary and try to convert them into other types of industry, like civilian goods or arms manufacturing plants. These repurposed plants will be given to more experienced businessmen loyal to our cause, and we’ll make damn sure that none of these businessmen try to recreate another corporate hellhole that we had to live through for God knows how long. We can also incentivize smaller businesses and entrepreneurs to come forward with their plans, and whilst many might disagree with this next part, the government can provide them the government fundings necessary to kickstart the West Virginia economy back into normalcy."
 NRA_Funds_For_Trump:0 "Funds For Trump"
 NRA_Funds_For_Trump_desc:0 "The NRA has always had our main support base be from republicans and other members of the GOP, and in recent years especially from Trumpists. As we all know, Donald Trump was the real winner of the 2020 election, but the crybaby democrats cheated in due to Trump directly interfered with their plans of tyranny. We also owe it to President Trump for sending our boys in the NRA money and guns while we were fighting the corporation and communists, as well as a large portion of our members being supporters of Trump himself. Because of this, as well as recently taking over Peabody Energy’s liquid assets, why don’t we show our appreciation for the President’s generous support over the years? We’re sure that the ex-board members of the corporation won’t mind if their vaults of dirty money go towards supporting our benefactors to the west of us, and this will no doubt receive praise from the President himself for our brave and unyielding defense of freedom from tyranny."
 NRA_Helping_The_Farmers:0 "Helping The Farmers"
 NRA_Helping_The_Farmers_desc:0 "The one major thing that the corporation neglected while ruling West Virginia was our dear farmers. Not only were many farmers forced into arduous labor they weren’t raised for, but many who were left behind were either too old or unsupportive in the corporate ran-economy to actually make ends meet. Now that we’re in control, we can finally go back to supporting our hard-working farmers by reintroducing many workers back into the farmer lifestyle, as well as giving government funding for farmers who have been struggling since the war ended. We hope that by supporting these farmers, we not only prevent further starvation of our population due to lack of domestic food producers, but we can also reinvigorate West Virginia’s culture of farmer communities that can hopefully last generations to come."
 NRA_Promote_Christian_Values:0 "Promote Christian Values"
 NRA_Promote_Christian_Values_desc:0 "One of the worst crimes that the corporation and communists ever could have inflicted on West Virginia was the utter desecration of our churches. The corporate sinners forced many to abandon our religious traditions in order to work in their dens of greed, and the godless communists outright destroyed many churches in our state that have been here as long as the state itself! It's clear to the NRA that the values and teachings of Christ must be brought back into the minds of our citizens, hopefully recreating the once proud culture we had before it was all taken away from us by the corporation and the communists. One of the benefits we can hopefully get from this is a more traditional support base, as well as allowing communities to heal even further by not feeling as though God had abandoned his children in their time of need."
 NRA_Siding_With_The_True_President:0 "Siding With The True President"
 NRA_Siding_With_The_True_President_desc:0 "It's time for West Virginia to formally side with the morally right side in this conflict that has destroyed our nation. We all know that President Trump was cheated when the results came in during the 2020 elections, with sleepy Joe Biden and his posse of convicts purposefully trying to prevent a great man from getting his deserved reelection. Not only that, but it's been a common fear in West Virginia that Biden and his crew will eventually come after West Virginia and bring it into the fold of their traitorous government. Our time is limited, and with our freedom and culture at stake, we will have to formally declare our support with the true government of the United States. In doing so we hope that President Trump will come to our aid if the traitorous Bidenists attempt any sort of military invasion, and we can hope that one day, we can return West Virginia back to normalcy under the banner of the red, white and blue and be able to call ourselves AMERICANS once more!"
 NRA_Total_Corporate_Control:0 "Total Corporate Control"
 NRA_Total_Corporate_Control_desc:0 "The inefficiency of the pre-uprising system, as well as the chaos created from it during the uprising, has given Mr. Grech and the board of directors a new outlook on how things should be. The laissez-faire way of relying on the free market and independent actors, such as independent mercenary groups and construction firms, only caused an untold amount of unnecessary paperwork and bullshit that came to bite us in the ass later on during the crisis. So, the corporation has decided that it must have complete and total control over all manners of governance and infrastructure going from here on out. All infrastructure and construction will be controlled by newly formed branches of the Peabody Energy Corporation, all forms of legal governance will be dealt with under a large umbrella of corporate legal teams and committees that will sort out crimes and punishments that are best suited for the corporation’s interests, and all manners of civilian goods and services sales must be approved and then subsumed into the larger corporation as a whole to make sure that we still hold a complete monopoly on everything in West Virginia. It’s also crucial for our media team to be the only form of news media legally shown in West Virginia, being able to control the flow of information both inside and outside of the state. Many idealists will say that this violates individual will and the free market, but what they don’t seem to realize is that individual will means jack shit if not backed up with the power to use it, and the free market is just as mythical as fucking Bigfoot in today’s society. If there exists a market in West Virginia, it WILL be owned by our corporation."
 NRA_Money_Talks:0 "Money Talks"
 NRA_Money_Talks_desc:0 "It should be clear to anybody who isn’t blind or stupid that, surprisingly, a corporation taking control over an entire state isn’t going to make the people living in said state happy. Although this doesn’t necessarily mean that we can only deal with dissenters by shoving them in front of a firing squad. As it should be obvious by now, money is the driving force of the modern age, and the little people living in the modern age desire money over anything if it means leading to their pitiful life goals. So, the universal solution to many of our problems is simple: bribery. The mercenaries giving us trouble in the mountains? Offer them money to turn on their fellow mercenaries and cause a small-scale civil war within their ranks. The local sheriffs and NRA members? Buy their loyalty and soon the people who support them will follow their word. The outside media attempting to report on events regarding West Virginia? Send their corporate boards a gift to make sure that the stories don’t see past the drawing boards. The term "everybody has a price" is slightly untrue, as there are most likely going to be self-righteous pricks who think that their morals are above their economic position. So, we’ll coin a new saying: for every person who doesn’t have a price, there will be somebody with a price who’s just as good."
 NRA_Special_Institutions:0 "Special Institutions"
 NRA_Special_Institutions_desc:0 "After the communist uprising was crushed and the ensuing coup attempts by the mercenaries and NRA were defeated, we’ve just been haphazardly keeping prisoners of war in various facilities and warehouses, anywhere that the corporation is willing to fill empty space. However, new plans approved by Mr. Grech himself have envisioned a new plan for these prisoners of war and future dissenters that will hopefully get the message across that we aren’t fucking around. We will build special institutions and facilities called "labor prisons" to put our POWs and general dissenters in, all the while making them fulfill construction and production quotas without ever even paying them. They lost the right to a fair wage when they went against the corporation, and this will be reflected on their permanent record which we can use to slash their pay if they ever get out of their prison sentence. We also can’t take any chances in our civilian production centers as well, so we will have to substantially increase our surveillance of civilian centers and workplaces so that none of our workers and employees get any ideas about sabotage or theft. This might create a paranoid population that worries about being monitored 24/7 and risk having their pay cut, but that’ll just incentivize them to work even harder and be more loyal in the future then!"
 NRA_Create_The_Corporate_Guard:0 "Create The Corporate Guard"
 NRA_Create_The_Corporate_Guard_desc:0 "Our experience with mercenaries has been a humbling one that we are not willing to relive. Mercenaries have been shown to be unfaithful to our corporation’s ambition, and we cannot allow another putsch attempt to happen again with our armed forces. So, the board will oversee the creation of a state-wide fighting force, one with the training and equipment of a professional army while staying unwaveringly loyal to the corporation and its interests. The brand new "Corporate Guard" will be open to anybody not willing to work in the various factories and mines that we own, where they will be trained by foreign hired professionals and trainers to give them the skills needed to protect the corporation’s assets and property in West Virginia, as well as being proud enforcers of the corporation’s will if we ever need to "repossess" assets both domestic and foreign. We will also need to put them through rigorous "Corporate Loyalty Sessions" where they will be expected to profess their loyalty to the corporation and be indoctrinated in our values and beliefs. We also still have many loyal anti-communist fighters who served as political commissars to the mercenaries, so it would help us to reuse their skills in the new Corporate Guard. In order to incentivize the members even more, we will make a rewards system where the more loyal or corporate benefitting acts a soldier does, they will be given more options in terms of equipment and weapons, allowing them to prove their loyalty to the entire Guard by showing their better equipment. Loyalty will get you raises and new toys, while disloyalty will get you dropped out of the helicopter and labeled a communist."
 NRA_Expand_Coal_Extractions:0 "Expand Coal Extractions"
 NRA_Expand_Coal_Extractions_desc:0 "Ignoring our recent expansions into other fields, our primary monopoly has and always will be energy. Coal has and always will be the most tried and true source of energy known to man, and with our growing industrial base in various fields, we will need to expand our primary energy industry as well. So, the board will go ahead with accepting the proposal of expanding current coal mines and extraction centers tenfold, employing hundreds to thousands more people and fueling our other corporate ran industries to a degree unheard of in West Virginia. We will also send out geochemical and geophysical surveys to locate previously unknown deposits of coal, where we then can begin construction on more coal extraction centers to fuel our industry even more. There will no doubt be many within and without West Virginia that will bitch and complain about this move, crying about the "poor environment" and the "unhealthy effects of coal on people ''. What these idiots don’t seem to realize is that we cannot and will not have the capacity to care unless it begins to hurt productivity and our profit margins."
 NRA_Eliminate_Workers_Rights:0 "Eliminate Workers Rights"
 NRA_Eliminate_Workers_Rights_desc:0 "If there is any term that has caused an untold amount of anguish in every single high-ranking member of the corporation, it’s "workers rights''. The communists wouldn’t shut up about it while they were sucking off Tucker Carlson, and even the conservative NRA cells were using that slogan to slander our proud company. So you know what? Mr. Grech and the board are done trying to keep up the denial and facade that has only garnered us headaches and mental breakdowns in the past. From this day forward, any semblance of a desire in our workers to organize and get their precious "rights"  will immediately be responded with harsh punishment and mass firings. Unless an arrest worker can plead their case and distance themselves from any of these ideals or movements, they will be sent to our labor prisons to work for the corporation for free until their sentences are up, where they then can go back to working for the corporation with their pays permanently slashed for the rest of their lives. When you work for the Peabody Energy Company, you work and get paid on the terms WE give you, with absolutely 0 exceptions and excuses. "
 NRA_Purge_The_NRA_And_The_Mercs:0 "Purge The NRA And The Mercs"
 NRA_Purge_The_NRA_And_The_Mercs_desc:0 "The time has come for us to deal with several thorns in our side that have been plaguing us even before the communist uprising. There still exist mercenary groups hiding in the Appalachian Mountains and forests that still attempt to oppose our rule for their damn "contract violations" from during the revolt. Not only that, but the inbred, gun fucking hicks of the NRA have continued to operate within various towns across West Virginia, with numerous cases of shootings orchestrated by their members targeted towards our loyal employees and higher ups. So we say no more. We are done letting these fuckers get in the way of our rule and progress, and we will be damned if we let another mercenary or hick get in the way of our goals."
 NRA_Fuck_The_Climate:0 "Fuck The Climate"
 NRA_Fuck_The_Climate_desc:0 "There's been one major complaint that we have been getting from both inside West Virginia and so-called "experts" outside of the state. For some reason, there are people won’t shut the fuck up about how our coal-based industry and extraction centers are contributing to climate change and global warming. Well, guess what, West Virginia is on the precipice of the fifth industrial revolution, going back to the roots of industry as its foundation and fostering a prosperous system that the corporate state can profit from. We are on the verge of making a system that works and that many other states can emulate for themselves, and people would rather bitch and complain about hotter summers and warmer winters than actual progress?! If the planet didn’t want to be exploited and made hotter, then it should have killed off our ancestors when it had the chance. So to the tree huggers and complainers out there, our company motto is this; Fuck the climate. The Earth is our bitch. The heat of progress is manifested."
 NRA_True_Egoism:0 "True Egoism"
 NRA_True_Egoism_desc:0 "Honestly, no matter what our media companies say or what our actions are, people outside of West Virginia will always just hate us. The shitheads in Washington just bitch and complain about how unethical we are, the sore losers following Trump are still bitter their precious NRA isn’t running the state, and places like Kanye’s Confederacy and Bernie’s west coast are either too chaotic to be stable allies or hate us anyways due to their own fucking morals and beliefs. So, if the entire nation and world hates us for who we are, then we will return the feeling tenfold. Our state will be run based on the philosophy of Egoism: we mine and use coal because we believe it is in our best interests, not others. We keep an iron grip over our employees and workers because we believe it is what we believe will benefit ourselves the most, not adhere to a false sense of altruism. And most importantly of all: the current United States and the world are all wrong in their approach to things and should be told otherwise because WE believe it to be so, not because they claim otherwise. In summary? We hate the world because we believe them to be wrong."
 NRA_With_The_Rifle_On_My_Side:0 "With The Rifle On My Side"
 NRA_With_The_Rifle_On_My_Side_desc:0 "The final shot was fired last morning, but today peace and silence stretch across the mountains. War is hell, but victory is sweet. Appalachia has been stretched as far as she can go, from a fallen nation to regional wars, and finally to victory. We can no longer feel remorse for what has happened, only look forward to a new tomorrow, a new Appalachia."
 NRA_Invade_The_Compound:0 "Invade The Compound"
 NRA_Invade_The_Compound_desc:0 "For far too long, the area of northern West Virginia has been ruled by a renegade group calling their base "The Compound". The Compound has done nothing but broadcast radio shows and music that has caused massive amounts of dissent across the Eastern States, including West Virginia. While The Compound might have distracted potential enemies of our plans in West Virginia with their cries of rebellion, we believe that if this goes on for too long, then West Virginia will be embroiled in another internal conflict once more. So, to test the capabilities of our new armed forces, we will work towards a full-scale occupation of The Compound to finally make West Virginia whole again."
 NRA_Integrate_Them:0 "Integrate Them"
 NRA_Integrate_Them_desc:0 "As expected, the Compound’s 'army' was easily dealt with, and the infamous base is finally ours. Our immediate next steps should be converting the base and its radio equipment to be utilized by our government, either for a government sponsored media outlet or for private military communications. The time following our annexation of The Compound might call for an increased military presence, as resistance cells are still hiding among the areas that The Compound had control over. The occupation will continue until the proper policing authorities can be established, and peaceful normalcy can return the people of northern West Virginia."
 NRA_Take_Out_Kentuchy:0 "Take Out Kentucky"
 NRA_Take_Out_Kentuchy_desc:0 "Now that West Virginia has been secured by our government, it’s finally time for us to look outwards at potential targets for our nation to attack in order to achieve our long-term goals. One of these places is none other than Kentucky, essentially a warlord state run by the deranged Colonel, claiming legitimacy from his mascot namesake. Our justification for our invasion should be easy: by making the Colonel’s insanity known to the wider United States, as well as their various "tyrannical" actions, then we should face little to no pushback nationally for invading Kentucky and claiming it as our own."
 NRA_Another_One:0 "Another One"
 NRA_Another_One_desc:0 "After defeating the Colonel’s soldiers and finally occupying the last areas of Kentucky, we can safely say that the state is ours, at least in occupation. Much like how we dealt with The Compound, our first steps should be to repurpose any military buildings that operated under the Colonel’s rule to serve our soldiers, and then go on to establish a proper authority that will govern the state in a way that doesn’t require occupation. Given how much larger Kentucky is compared to the lands taken by The Compound however, it will no doubt take much longer to convince the people of Kentucky to accept our rule and root out any remnants of the Colonel’s army left in the state."
 NRA_March_To_The_Ocean:0 "March To The Ocean"
 NRA_March_To_The_Ocean_desc:0 "When looking at potential targets for expansion, none other falls within our sights more than Virginia, our eastern counterpart. The only reason why our two states are separated was mainly due to us not joining with the Confederacy when the Virginian state government did. Speaking of the Confederates, we can use their presence to our advantage, creating a justification to "protect West Virginia’s state security" from their aggression. As bold of a claim as this might be coming from us, we cannot deny that if the Confederacy gets too close and too cocky, we will eventually be on their chopping block. If we take Virginia now, we can hopefully at least build up before any potential invasions from the south can overrun our state. Not only that, but having at least partial control over the state’s sea borders will help grow our economy immensely!"
 NRA_A_Beach_For_West_Virginia:0 "A Beach For West Virginia"
 NRA_A_Beach_For_West_Virginia_desc:0 "For the first time in West Virginia's history, our state’s border gazes towards the Atlantic Ocean. We seek to integrate the state of West Virginia under our state’s government in a similar manner to what we did with The Compound, however a new problem is awaiting us when integrating the state. Since our government has never had to deal with the bureaucracy and lawmaking involved with holding several trade and military ports, we will have to create that bureaucracy from scratch if we want to keep the beach and profit from the ports on it. This will take an arduously long time, having to meet with local fishermen businesses and look at past examples for how this has been done, but our end goal is eventually to get the ports up and running again so that our economy can continue its growth. Our government’s flag flies on the piers and docks of the Virginian coast, and we intent to make sure it’s the ONLY flag that flies there for a very long time."
 NRA_The_Fools_In_Ohio:0 "The Fools In Ohio"
 NRA_The_Fools_In_Ohio_desc:0 "Ohio has always been one big foolish mess, even when the United States was still together. Now, 3 fools in Ohio claim to hold power in their "Triumvirate", which more or less means that they couldn’t decide who should be leader and so they never truly picked a single one. Because of this political nightmare of a system plaguing Ohio, we can exploit this instability by attacking and claiming Ohio’s resources for ourselves. We really don’t think anybody who matters would care if Ohio fell under our control anyways, as both major sides in the USA seem to have a grudge with one or more of the dictators running the state. We can even target the aging railroad system as our first targets, though due to their age we should be cautious as to not cause any serious derailments…"
 NRA_The_Heart_Of_The_Belt:0 "The Heart Of The Belt"
 NRA_The_Heart_Of_The_Belt_desc:0 "With Ohio under our government’s control, we can begin to integrate them into the wider political structure of West Virginia. One of the main things that Ohio is famous (or rather infamous) for is being the heart of the Rust Belt, the aging industrial heartland of the United States that was left to rot for the longest time before the eventual collapse of the nation. Alongside creating the proper bureaucratic measures to govern Ohio, we should send out teams of industrial analysts to look over the industrial ruins and see if any sectors are able to be repaired or even fully renovated to fit modern times. We should send out teams of soldiers to defend them, however, as we’ve gotten reports that many resistance cells hide within the industrial ruins, and we don’t want to risk any of our analysts being captured or killed. We should especially be careful when dealing with railroad repairs, as any sort of train derailment can cause serious damage, especially regarding trains with dangerous and hazardous materials…"
 NRA_Ownership_Over_Appalachia:0 "Ownership Over Appalachia"
 NRA_Ownership_Over_Appalachia_desc:0 "Everywhere the mountains touch is under our domain. From the beaches of Virginia to the Ohio Valley, our people are finally united. Appalachia has brought us together, and we will make her proud. Though there are plenty who seek to destroy what we have accomplished, today we may have brought prosperity to the mountain, but tomorrow we will bring peace to the entire former United States."
 NRA_Prepare_For_Enemy_Planes:0 "Prepare For Enemy Planes"
 NRA_Produce_More_Energy_desc:0 "West Virginia is one of the most resource-rich states in the country, primarily in coal. With a bit of whipping, we can bump our numbers up and make even more money!"
 NRA_Bring_Here_The_Goodies_desc:0 "As we dig, we are finding more rare earth minerals, this will be a great boon to our economy and production capabilities."
 NRA_Offshore_Industries_desc:0 "We do not have much room or manpower for industrial fabrication, but with our abundant resources, we can easily pay some other country to produce our stuff for us."
 NRA_The_Economy_Is_Saved_desc:0 "After the uprising by that nepo baby-turned revolutionary, our economy took a massive hit; however, with quick thinking, we were able to get it going better than ever before."
 NRA_Construct_New_Roads_desc:0 "West Virginia has never been known for great roads, but with our increased economic output, a need to upgrade roads and the funds to pay for it have arisen." 
 NRA_Mass_Expansion_Of_Industry_desc:0 "If we are going to compete with our stronger neighbors, we will need to massively expand our industrial production."
 NRA_Learn_From_Our_Mistakes_desc:0 "If we are ever going to get better, we must learn from our mistakes and build upon where we went wrong."
 NRA_Bribe_Scientists_desc:0 "So, we need scientists, but we closed all the universities for conspiring against us, what are we gonna do? That's right! Bribe other people’s scientists to defect!"
 NRA_Acquire_Drones_desc:0 "It has been proven that drones are the next great thing in warfare, so not having any would put us at a disadvantage, and that would be foolish. Let's not be foolish and get drones."
 Learn_From_Kanyes_Forces_desc:0 "Our friends in the CSA have offered to let us train our troops in their facilities, we should take them up on this generous offer."
 NRA_Support_Our_Troops_desc:0 "Patriotism is the key to winning over a populace. With some investment, we will have people going from "Stop whipping me, I'm tired!" to "I will work harder for our troops, so no need to whip me!""
 NRA_Prepare_For_Enemy_Planes_desc:0 "Fighting without a proper air defence is suicide. This is an investment we must make."
 NRA_The_Federalist_Threat_desc:0 "The Federalists wish to take our land to fuel their communist war machine; we will need to greatly prepare to fight this threat."
 NRA_Intensify_The_Production_Of_Bunkers_desc:0 "West Virginia has a great tool for its defense, mountains, but they alone will not save us from those who wish to attack us. Now, mountain bunkers are what will do that."

 
 NRA_The_Federalist_Threat:0 "The Federalist Threat"
 
 NRA_Support_Our_Troops:0 "Support Our Troops"
 
 NRA_Intensify_The_Production_Of_Bunkers:0 "Intensify The Production of Bunkers"
 
 NRA_Offshore_Industries:0 "Offshore Industries"
 
 NRA_Construct_New_Roads:0 "Construct New Roads"
 
 ### post Appalachia unification ###
 
 NRA_Joining_Kanye:0 "Joining Kanye"
 NRA_Joining_Kanye_desc:0 "Embrace the music man and reject the Clown. From today forward, the company will move closer to our southern brothers. May God and our shareholders look favorably upon us."
 NRA_The_Launchpad_For_Future_Invasions:0 "The Launchpad For Future Invasions"
 NRA_The_Launchpad_For_Future_Invasions_desc:0 "With our alliance forged in the South we can bare our teeth towards the North. The fallen Presidents seek to encroach and enslave us once more, but our brotherhood will remain defiant and firm. It may be time to listen to the words of old men, it may be time to talk softly and carry a big stick."
 NRA_The_Situation_South:0 "The Situation In The South?"
 NRA_The_Situation_South_desc:0 "The situation in the south has turned sour after the death of Kanye. Without their leader holding all factions together by shoestrings, a power vacuum has spread from the Carolinas to New Orleans. While our shareholders did hope for a more fruitful military alliance, the close ties between our two nations pose an even more profitable alternative."
 NRA_The_Dixie_Crisis:0 "The Dixie Crisis"
 NRA_The_Dixie_Crisis_desc:0 "We can no longer delay it; the war of southern secession has raged too close to home. The company must set forth policies to contain the conflict while pursuing the most profitable outcome.  "
 NRA_Our_Own_Conquest:0 "Our Own Conquest"
 NRA_Our_Own_Conquest_desc:0 "It is said that the south has a rebel spirit, well Johnny Reb will have to be taught a lesson once again. The instability to the south must be rectified before they jeopardize our profit margins. Take up arms men, the company has some acquisitions to put in line. "
 NRA_Help_The_Dixie_Republic:0 "Help The Dixie Republic"
 NRA_Help_The_Dixie_Republic_desc:0 "There are 3 certainties in life: death, taxes, and that an army is always loyal to its commander."
 NRA_Our_Earned_Freedom:0 "Our Earned Freedom"
 NRA_Our_Earned_Freedom_desc:0 "The Founder fought tooth and nail for the right to live freely, and it is these lessons that we must hold onto in these trying times. Sometimes profit margins are not the center of all things. Sometimes, only a bounty can get things done."
 NRA_Give_Back_To_The_People:0 "Give Back To The People"
 NRA_Give_Back_To_The_People_desc:0 "We are not the monsters that the red traitor Carlson accused us of. Our people are well fed, provided with good jobs, and a place to lay their heads, yet all we ask of them is their loyalty to the company. Everything costs and nothing is free, except our companies' love for our workers. "
 NRA_Expand_Our_Arms_Factories:0 "Expand Our Arms Factories"
 NRA_Expand_Our_Arms_Factories_desc:0 "With the loss of our ally to the South, the company must become self-reliant once again. The production of arms and ammunitions are the key to our continued independence from those who'd call themselves masters. "
 NRA_Research_Better_Artillery:0 "Research Better Artillery"
 NRA_Research_Better_Artillery_desc:0 "One by land and two by sea, but it is the school of Artillery which proclaims mastery of both. From the earth we shall plant our feet and through the air we shall push back the enemy. "
 NRA_Acquire_Tanks_And_Trucks:0 "Acquire Tanks And Trucks"
 NRA_Acquire_Tanks_And_Trucks_desc:0 "From the time of the Romans, the ability to impose one's will on the battlefield is the undisputed king of determining the winner. It was not until the world wars that the greatest tool of will was put into action, the modern tank. "
 NRA_Buy_Some_Ports:0 "Buy Some Ports"
 NRA_Buy_Some_Ports_desc:0 "Our status as a landlocked nation has hindered our reach on the global market. With the south engulfed in war, we finally have the opportunity to break away from our America-focused market and provide aid to our embattled allies. We shall present an offer they simply can't refuse. "
 NRA_BackStab_Dixie:0 "Backstab Dixie"
 NRA_BackStab_Dixie_desc:0 "Nothing personal, it's just good business. The company has determined that the south is nothing more than a bad product, only men for the military company."
 NRA_Raid_The_Great_Lakes:0 "Raid The Great Lakes"
 NRA_Raid_The_Great_Lakes_desc:0 "For the PMC to survive, we must seize the bounty we put ourselves on the Great Lakes. The old heart of America, the power of the Rust Belt, will light our touch from Michigan to Georgia. No contract is too large to fail."
 NRA_Finish_Orange_Man:0 "Finish Orange Man"
 NRA_Finish_Orange_Man_desc:0 "Purge the traitor, the man who caused America and her empire to fall. All those who have died, all those who have lost their livelihood, all those who never received their American dream, can all be blamed on one man. Though the PMC would certainly like to thank him, if it weren't for him, we'd never reach such high profitability. Without him, there would be no conflict for us to use. Maybe we can send him a fruit basket. "
 NRA_Expand_Operations_Into_The_Rockies:0 "Expand Our Operations Into The Rockies"
 NRA_Expand_Operations_Into_The_Rockies_desc:0 "The PMC views the existence of a free Rockies to be a hazard to recruitment for the PMC. The Rockies, her people and resources, would be put to their optimal use under proper supervision."
 NRA_Wake_Up_Sleepy_Joe:0 "Wake Up Sleepy Joe!" 
 NRA_Wake_Up_Sleepy_Joe_desc:0 "The old man at the wheel, maybe if someone else was in his shoes the world would've made it through the turbulence. Alas, chaos breeds decay, and the continued existence of the federation is a continued bite on a healing world. The PMC will see to it that order is restored to chaos and that the proper medication is used to smite the decay. "
 NRA_Get_Maine_For_Ourselves:0 "Get Maine For Ourselves"
 NRA_Get_Maine_For_Ourselves_desc:0 "The people of Maine are relentless and proud people, this makes them the perfect workers for factories. Additionally, Maine possesses the perfect geopolitical region for us to influence our Northern neighbors in their trying times, yet another market for our soldiers. Oh, what wonders could the company do with Maine, and to think, she's just right there for the taking. "
 NRA_Reach_The_Pacific_Ocean:0 "Reach The Pacific Ocean"
 NRA_Reach_The_Pacific_Ocean_desc:0 "Those who reject us have taken refuge in darkest of places, where the light only just grasps. Beyond the Rockies in the California valley lies the last 'free people'. They sit there in chaos while rejecting peace and order. Worst of all, they reject the beauty of contracts and bounties and embrace selfish debauchery. Our shareholders have made it clear that those beyond the Rockies must be brought into the light. "
 NRA_Militaires_Sans_Frontieres:0 "§1Militaires Sans Frontières§!" 
 NRA_Militaires_Sans_Frontieres_desc:0 "We are the bearers and defenders of the American dream. The torch of security died long ago, but the light of contract security glows brighter every day. The PMC shall be a beacon of security from coast to coast. However, we have learned many lessons since the dark days of strife. Perhaps the ideals of Smith can only go so far, perhaps it is time for the company to change  prerogatives. The protection of our contractors must take priority above all. It is in our continued existence that we prove the Indomitable will of humanity. God bless America and God bless the Vinnell PMC"
 
 NRA_Joining_Trump:0 "Joining Trump"
 NRA_Joining_Trump_desc:0 "We’ve been separated from America for too long. Now that we have full control over our land, we can finally rejoin the true President of the United States of America."
 NRA_Trump_Spearhead:0 "Trump's Spearhead"
 NRA_Trump_Spearhead_desc:0 "Our unique geographical position has given us a unique military position. We are in a prime position to launch an offensive against the Federalist tyrants that plague the Northeast."
 NRA_The_Situation_West:0 "The Situation West"
 NRA_The_Situation_West_desc:0 "A tragedy has struck in the West. Donald Trump, the President of America, is dead. Now, we must decide the direction for not only us, but all of America."
 NRA_The_Best_Rifles_In_The_World:0 "The Best Rifles In The World"
 NRA_The_Best_Rifles_In_The_World_desc:0 "America has had many great names in the world of gunsmithing. John Moses Browning, Samuel Colt, Eliphalet Remington, William Ruger, Horace Smith, Daniel B. Wesson, and Oliver Winchester are just a few of these names. If we are to reunite America, we must follow their example."
 NRA_New_Trumpist_Industries:0 "New Trumpist Industries"
 NRA_New_Trumpist_Industries_desc:0 "Trump always wanted to build a strong American industry. While we aren’t in a position to do this for all of America, we can ensure that his vision will be realized here."
 NRA_New_Military_Workshops:0 "New Military Workshops"
 NRA_New_Military_Workshops_desc:0 "A war requires soldiers, and soldiers require guns. To help ensure our brave troops get what they need, several new military workshops will be constructed in order to increase our production of firearms."
 NRA_Open_New_Docks:0 "Open New Docks"
 NRA_Open_New_Docks_desc:0 "The enemies of liberty will not only be found in the lower 48, but also in locations separated from us by great swathes of ocean. If we are to take down these tyrants, we must be prepared to brave the seas."
 NRA_Get_New_Military_Advisors:0 "Get New Military Advisors"
 NRA_Get_New_Military_Advisors_desc:0 "With the untimely death of Trump, many of his former military advisors are left with no place to go, and no organization to give their advice to. Thankfully, for both us and them, our military command is ready to welcome these brave men and women with open arms."
 NRA_Improve_The_Highways:0 "Improve The Highways"
 NRA_Improve_The_Highways_desc:0 "Our highways have never been the best, even before the Civil War. With the need for good infrastructure becoming more important than ever, we can finally take the time and the resources to improve this vital network."
 NRA_Inherit_Trumps_Will:0 "Inherit Trump's Will"
 NRA_Inherit_Trumps_Will_desc:0 "While Trump may be dead, his ideals are not. If America is truly to be brought back into the light of freedom and liberty, someone must take up the fight Trump left behind. That someone is us."
 NRA_Unite_With_The_WCZ:0 "Unite With The Western Command Zone?"
 NRA_Unite_With_The_WCZ_desc:0 "To our west lies the Western Command Zone. Once a bastion of Trumpist support in the Liberal West, it has experienced turmoil in recent times. Perhaps we can reach out to these sons and daughters of freedom, and bring them back into the fold?"
 NRA_Unite_With_Utah:0 "Unite With Utah?"
 NRA_Unite_With_Utah_desc:0 "To our west lies the lands of Utah, also called Deseret, has recently come out of a war with its neighbors. A land full of conservative values and people, they are not too far off from what Trump envisioned. Maybe we could bring them back into America?"
 NRA_Destroy_Commiefornia_And_Cascadia:0 "Destroy Commiefornia And Cascadia"
 NRA_Destroy_Commiefornia_And_Cascadia_desc:0 "California and Cascadia. The blights of America. Before the Civil War, they were hotbeds of Communism, freedom hating, God denying Communism, and it seems that the Civil War only made these issues worse. If we are to truly reunite America, we must not only secure these regions, but also destroy the red menace that has taken root there."
 NRA_Burn_Down_The_South:0 "Burn Down The South"
 NRA_Burn_Down_The_South_desc:0 "The lands of Dixie have always been troublesome. While they have always been supporters of Conservatism, they’ve also been too attached to their secessionist views. Once, long ago, the brave General Sherman taught them a lesson they seem to have forgotten. Let’s teach them it again, and this time, we’ll make sure they don’t forget."
 NRA_Liberate_The_West:0 "Liberate The West"
 NRA_Liberate_The_West_desc:0 "While we may have secured the Pacific Coast, there are still many who suffer under the warlords and extremists that plague the west. To not only save these people, but save America, we must liberate all western states."
 NRA_Fix_The_North:0 "Fix The North"
 NRA_Fix_The_North_desc:0 "The once heart of American industry has fallen into disrepair. Under the misguided ideals of Libertarianism and other similar ideologies have done little to repair these vital regions of America. It is our duty, as the heirs of Trump, to shake the rust off this region and bring it into the bright future that awaits America."
 NRA_Save_The_East:0 "Save The East"
 NRA_Save_The_East_desc:0 "Now is finally the time. For too long, the Federalist tyrants have occupied Washington D.C. and the historic lands where America first began. We must march east, to secure not only America’s future, but the future of all that live there."
 NRA_Another_Day_Another_Banger:0 "§OAnother Day Another Banger§!"
 NRA_Another_Day_Another_Banger_desc:0 "Without Trump, many thought that the conservative movement would falter and fall apart, that America would never truly rise again. We have proved them wrong! We have secured all of America and are now in a prime position to achieve Trump’s dream. The American eagle can once again fly free and true through the skies!"
 
 
 
 ### Peabody Energy coal path ###
 
 NRA_Our_Own_Way:0 "Our Own Way"
 NRA_Our_Own_Way_desc:0 "The Company has determined that the only way forward, the risky way forward, the profitable way forward, is to go alone."
 NRA_The_Second_Phase:0 "§YThe Second Phase§!"
 NRA_The_Second_Phase_desc:0 "We’ve finally expanded past the fucking nightmare that is West Virginia, and the board of directors are celebrating this as if we won World War 2 all over again. To Mr. Grech, however, conquering the neighboring states around us was only phase 1 of a greater plan he had for the United States. Unbeknownst to the board, Mr. Grech has started drafting his own plans for further expansion of not only the corporate state government, but also expansion of our corporate state borders as well. The United States needs a new type of leadership, not one of senility or once great businessmen playing by the rules of some old piece of paper. What it truly needs is for a system of great and powerful men to rule and govern under the Peabody Energy Corporation’s hand, one that will make sure the nation dictates the market of its resources and won’t be coerced or fooled by any communists or double-crossing politicians. The Second Phase shall begin."
 NRA_Absolute_Control:0 "Absolute Control"
 NRA_Absolute_Control_desc:0 "For too long the unions and the workers that belong to them have been causing issues, and worse, hurting our bottom line. Now that things have somewhat stabilized, we can get to securing our rule over the land."
 NRA_Allow_Unethical_Experiments:0 "Allow Unethical Experiments"
 NRA_Allow_Unethical_Experiments_desc:0 "The main problem with the previous era of capitalism and how corporations acted within it was how it tried to follow along "ethical" laws set by meddling governments. But now that the corporation is the state that governs things, we can begin to dip our feet into projects and ideas that the governments of the past would bitch and cry about. We have a few projects in mind, especially in regards to how workers can be influenced physically to work harder in their environments without being tired or having their work take a toll on their health. We can do this by injecting the food given to them with stimulants and drugs, or by just outright giving them the drugs outright in order to see the immediate effects. Another idea proposed is related to the Corporate Guard, and how certain drugs or stimulants can improve combat effectiveness and proficiency in order to make them better soldiers. A workforce of restless and untiring laborers and an army of super soldiers was only ever being prevented due to fake morals, and we’re here to show just how great our experiments will make our corporate state!"
 NRA_Censorship_Of_The_Press:0 "Censorship Of The Press"
 NRA_Censorship_Of_The_Press_desc:0 "The most important and fundamental "human right" that our company holds firm is the right of the press, though said press should be the right press to make sure our consumers are properly informed."
 NRA_Ports_All_Over_The_World:0 "Ports All Over The World"
 NRA_Ports_All_Over_The_World_desc:0 "Wait we have ports?"
 NRA_Craft_Better_Guns:0 "Craft Better Guns"
 NRA_Craft_Better_Guns_desc:0 "It is well known that conflict drives innovation. Due to our home-grown conflict, we've been able to innovate. With both theoretical and practical knowledge, we'll be able to produce a better product for our soldiers."
 NRA_Invade_The_Great_Lakes:0 "Invade The Great Lakes"
 NRA_Invade_The_Great_Lakes_desc:0 "To our north, the Great Lakes region has fallen under the control of Libertarians and other, similar, groups. While they could be a viable group of business partners, they're still held back by their politics and idealism. By invading them, we'll be able to not only bring proper security to the land, but we'll also be able to make quite the bonus from the war." 
 NRA_The_Red_Elephant:0 "The Red Elephant"
 NRA_The_Red_Elephant_desc:0 "In the Grand Old Party, the Party of Lincoln and the current party of Trump led to the collapse of the United States. Though it is not all bad, for the fires have set the stage for a new day. The territories which cling onto the Orange make up the breadbasket of America, if the company wants to keep their workers happy, it will need to invest large sums towards the incorporation of such territories. "
 NRA_Hunt_For_Ivory:0 "§RHunt For Ivory§!"
 NRA_Hunt_For_Ivory_desc:0 "Georgie Orwell once wrote a story of the fallout of shooting an elephant, but he was a filthy socialist. The company has come to the conclusion that the old republican elephant's continued existence no longer serves their profit motives. "
 NRA_The_Blue_Donkey:0 "The Blue Donkey"
 NRA_The_Blue_Donkey_desc:0 "That poor old man was put in a position to lead and ended up destroying everything built before. The Party of Roosevelt has seen better days and once held strong ties with the company. However, those days are long since passed, and those Democrats are either dead or purged. Just as the party, the company must be ready to evolve. The company must consider alternative sources of income. "
 NRA_Free_Leather:0 "§BFree Leather§!"
 NRA_Free_Leather_desc:0 "The former United States is an ocean of unrealized gains, and it is time the company prepared to tap into that unlimited potential. Within their borders lay the most important economic hubs of the western hemisphere. The company views these cities as prime targets for expansion and are ready to commit everything towards full acquisition. "
 NRA_Partneship_With_Chiquita:0 "Partnership With Chiquita"
 NRA_Partneship_With_Chiquita_desc:0 "Despite our corporate state model making us more or less isolated across the world diplomatically, we still hear of reports in various places of similar corporations attempting what we are succeeding at. Reports from Central America say that the Chiquita Corporation, a banana company infamous for its various "Banana Republics" during the 1920s, has once again thrown themselves in Central America in order to establish a corporate controlled state in Panama. Their position appears relatively stable all things considered, so instead of going it alone for the foreseeable future, then why don’t we try to expand outside of the States and abroad? Sure, nobody gives a rat’s ass about Panama or Central America, but any allies are better than no allies. We will send a corporate ambassador to the Chiquita offices in Panama, offering them a mutual partnership that will last as long as it is beneficial for us, and even establishing a new form of corporate embassy between corporate nations."
 NRA_Our_Eyes_In_Central_America:0 "Our Eyes In Central America"
 NRA_Our_Eyes_In_Central_America_desc:0 "We finally have an established presence in Central America, but to Mr. Grech, this is not enough for his grander vision for the new world. It is not enough for the CEO to simply have a corporate embassy present in Panama, for that doesn’t solidify any form of control over the region that serves our corporation’s interests. Instead, Mr. Grech demands our corporation actually acquire land assets in the region in order to start spreading our influence and resource potential. So far, the main area of land that the board has agreed on would be Nicaraguan canal, a newly built canal that the Nicaraguan government will no doubt allow us to purchase off of them in order to have Mr. Grech’s foothold in the region. Not only will this canal be an easy to set up transport hub and trade port to boost our profit numbers, but we can also have it serve as a base of training for the Corporate Guard for future engagements abroad, especially in Central America…"
 NRA_Take_Rest_Of_Central_America:0 "Take The Rest Of Central America"
 NRA_Take_Rest_Of_Central_America_desc:0 "Now that we finally have our own foothold in Central America, we can finally begin drafting plans of attack to take over the assets of the various Central American nations. This is a pivotal moment in our corporation’s history, as this is the first time our corporate state has fought and taken territory outside of the collapsed United States, and this will be a monumental occasion both morally for our corporation and diplomatically as the world can finally see the power of the Corporate Guard. The corporate model of governance will prevail above all others in the world, and we can start to ingrain that into the world’s thick skull by showing how successful it is in Central America. The natives might fucking hate it, but like many things, we couldn’t give any less of a shit."
 NRA_Improve_Our_Military_Tactics:0 "Improve Our Military Tactics"
 NRA_Improve_Our_Military_Tactics_desc:0 "The Corporate Guard has to be the best of the best, better than those shitass marines or whatever stupid groups exist in other countries. We need to prioritize improving our military tactics and strategy that will make us not only unique in how we approach things, but also better than whatever future enemy can throw at us. We also must further emphasize corporate loyalty when we instruct future commanders on the field, instilling within them the idea that wars will be fought by and for our corporation and not some dumbass ideals of nation or ideology. Soldiers, whether they like it or not, will fight and die for our corporation’s interests, and if they don’t like it? Then a good public display of punishment will put both the dissenters and onlookers in line."
 NRA_Learn_From_The_Civil_War:0 "Learn From The Civil War"
 NRA_Learn_From_The_Civil_War_desc:0 "It has been said that history is the greatest teacher any can learn from. Now, while the communist uprising against us by Tucker Carlson is something none of us want to even think about, we can’t deny that the tactics used during the civil war could usher in a new era of warfare that will further our goals of creating a unique and destructive combat doctrine. The scorched earth tactics and destructive guerilla warfare could be perfected even more under a stable and unified command structure. Corporate Guard engagements should seek to destroy as much of the battlefield infrastructure and industry as possible, so that in the case of any sort of counterattack reclaiming the area will be left with nothing to support their troops with. The Corporate Guard will also be instructed to never properly fight our enemies, utilizing the natural environment around them to use against their opponents in a massive campaign of attrition. Our corporation will never falter, and we will utilize anything we can against our foes and destroy anything that will inevitably be left behind."
 NRA_Fuel_Is_Always_There:0 "Fuel Is Always There"
 NRA_Fuel_Is_Always_There_desc:0 "If anybody in our corporation ever asks, "Is there enough fuel to support this?" they will get a one-way ticket to the labor prisons. We are the Peabody ENERGY Corporation god dammit, and we’ll be dead in the grave before we run out of fuel for our boys in the Corporate Guard. Dedicating specific gas wells to the production of fuel purely for the Corporate Guard will help make a surplus of fuel for our soldiers, ensuring that no truck or tank is left without gas. Hell will freeze over before we rely on others for fuel, and becoming self-reliant in that regard will have us skyrocket to the top of the world, above those relying on others just to afford gas."
 NRA_Continue_Industrial_Expantion:0 "Continue Industrial Expansion"
 NRA_Continue_Industrial_Expantion_desc:0 "It's not enough. It’s never fucking enough. The coal mines and gas wells are too small, the infrastructure is too underdeveloped, the fucking profits could "always be higher" says the analysts. Whatever god or force controls industry, it clearly hasn’t heard of slowing down, so like cultists following the gospel we too should never stop. Increase logging a thousandfold to clear areas for future mines and factories, make the construction teams work twice as long to speed up the process, constantly repave and expand the infrastructure so that not a single crack is left, and funnel anything and everything we produce down the throats of the international market. The industrial revolution will be one controlled by us, the gods of the new capitalist world, and our evangelization will never end as long as our names are worshiped in the same vein as deities!"
 NRA_Neo_Slavery:0 "Neo-Slavery"
 NRA_Neo_Slavery_desc:0 "Fuck our workers. All day every day we have to listen to their constant bitching and complaining about how shitty we treat them, or how their pay isn’t high enough, or how we APPARENTLY work them to near death. Well, then we shall do what any sensible company would do in our position and abolish the entirety of the working class. How does one do that, you may ask? It’s easy; First, you go across our nation and begin forcibly evicting workers who do not meet any sort of education exemptions we put in place. Then, we force all of the workers to live on sight in the rapidly expanding company towns so that they can get to work as soon as possible. Finally, you force them at gunpoint to work in whatever fields we dictate, whether it be on the factory lines or in the various construction teams that contribute to building new company towns and factories across our state. We won’t even bother with discussing terms of payment, instead giving them the choice to either work on our terms out of choice and still hold on to a semblance of free will, or we can put them in one of the various labor prisons to do the work we asked with no free will at all! The workers do not get to have rights or freedom, they are ours to use in order to progress mankind beyond the shackles of the present. The only freedom allowed will be given to those smart enough to use a fucking balancing sheet."
 NRA_Develop_New_War_Machines:0 "Develop New War Machines"
 NRA_Develop_New_War_Machines_desc:0 "People outside of our state will look in and call us nothing more than monsters waiting to be put down by whatever bullshit cause they adhere to. Because of this, we need to make sure that the monsters are armed to the teeth with tools of war so that those ideological assholes can never stop what we are doing. We have to erect countless factories dedicated solely to the manufacturing of guns, artillery, tanks, drones, ANYTHING that can be used to massacre whoever is stupid enough to wander into our den hoping to slaughter us. We will also create teams of weapons specialists and inventors in order to develop even more destructive and terrible war machines that will become infamous for being nightmarishly brutal. The Geneva Convention? That shitty document was created by people who could never understand our position in the world, and nobody ever will until they find themselves at the receiving end of our machines of war."
 NRA_Masters_Of_The_East:0 "Masters Of The East"
 NRA_Masters_Of_The_East_desc:0 "With the establishment of company branches across the Eastern United States, we have become the bearers of the American dream. Prosperity stretches across our borders, and it is our duty to bring those unfortunate souls into the light. "
 NRA_Greater_Dreams:0 "Greater Dreams"
 NRA_Greater_Dreams_desc:0 "While the company thanks the Confederacy for what they have done to assist us during our Civil unrest, their current situation has become more than unacceptable. We shall bring peace to them, one way or another. Through fire and flame, the south will be made whole again. "
 NRA_Sweet_Oil:0 "Sweet Oil"
 NRA_Sweet_Oil_desc:0 "While the environmentalists tried to sabotage the image of oil, the truth remains, it is the center of all industry. While the coal of West Virginia has kept our engine running, the substance itself cannot compare to the abundance of oil in Texas. With recent troubles and the ever-growing migration crises, the company has declared the present to be of the utmost viable times for company renovations "
 NRA_Expansion_In_Minnesota:0 "Expansion In Minnesota"
 NRA_Expansion_In_Minnesota_desc:0 "The ice lands of Minnesota hide a mountain of abundant resources. From their agricultural innovations, to one of our biggest rivals, the 3M corporation, for the company's profit margins to continue their growth, we must be prepared to expand. "
 NRA_The_Other_Mountains:0 "The Other Mountains"
 NRA_The_Other_Mountains_desc:0 "Those who seek to escape our gaze will tremble under our boots. The Republican experiment in the East along with the renegade state will be brought into subservience to the company. We will seize production of the agricultural means, and we shall have the national resources hidden in Yellowstone. Today we look down upon them from the Rockies, tomorrow we take what is rightfully ours"
 NRA_Up_North:0 "Up North"
 NRA_Up_North_desc:0 "The port cities of Maine pave the road into the global market and will provide useful economic value for our shareholders. In addition, those revolutionaries would put the company in prime positioning to push into the Canadian markets. "
 NRA_Crush_The_Mormons:0 "Crush The Mormons"
 NRA_Crush_The_Mormons_desc:0 "The Mormons pose an interesting challenge before the company. Their unity has allowed them to hold shape better than most regions, and they've proved to be a formative power beyond the Rockies. However, if we are to break into the western markets and beyond, they must not be allowed to see another day. "
 NRA_On_The_Other_Side_Of_The_Sea:0 "On The Other Side Of The Sea..."
 NRA_On_The_Other_Side_Of_The_Sea_desc:0 "Cascadia forms the weakest link of the pacific chain. If the company desires to break into the Asian market, it first must establish Pacific ports. Cascadia must fall for the company to prosper, for America to dream. "
 NRA_There_Are_Enemies:0 "...There Are Enemies..."
 NRA_There_Are_Enemies_desc:0 "California sits disunified and in chaos, thus it would take a great deal of resources to contain. While the company would prefer putting resources elsewhere, it can't be denied how much can be gained through direct investment. Not only would our oil supplies double, but our port access would more than triple. California shall dream once again. "
 NRA_Will_We_Finally_Be_Free:0 "...Will We Finally Be Free?"
 NRA_Will_We_Finally_Be_Free_desc:0 "Hawaii was once the bastion of American imperialism, and Alaska stood alone as the last frontier. Both have returned to their roots and thus have turned away from their American brothers. The company has come to the decision that it is time for these territories to return from where they came. Hawaii offers extensive trade roots into Asia and Oceania, while Alaska contains uncountable resources ready to be tapped into. "
 NRA_Atlas_Shrugged:0 "§YAtlas Shrugged§!"
 NRA_Atlas_Shrugged_desc:0 "America has finally begun to stir from her slumber. It is time for the dream to end, and for prosperity to become a reality. Every single factor of American society will be put towards the betterment of the company and the company will return that favor four times over. What greater wealth is there than to own your life and to spend it on growing?"
 
