 winter_war.1.t:0 "Legitimist Forces Planning to Attack!"
 winter_war.1.d:0 "Breaking news from the frontier, our scouts have reported movement to the North, as the Legitimists forces have begun massive military exercises on our border. War has become the way of life, and even in this moment, when we feel that peace is just around the corner, war once again calls our name. If we are to survive a direct assault by a major power, we must prepare for the inevitable. Our troops have already been placed on high alert, and battle tactics are being drawn up as we speak. The capital issued a decree that no matter what, Appalachia will stand. Tomorrow may be a dark day, but unity will lead us through to the light. This news station will continue to report on any new developments."
 winter_war.1.a:0 "Ready the army!"
 
 winter_war.2.t:0 "The American Winter War"
 winter_war.2.d:0 "It is War in Appalachia once again, as Legitimists forces cross over the Potomac and into our territory. Our glorious troops have set up defensive positions from the Shenandoah to the Monongahela River. Some in the capital believe a counter attack could be accomplished through Tygart Valley, while others view holding our current positions while waiting for a break in Legitimists lines to be the best path forward. Regardless, the capital is holding firm, as any fighting is miles from army command. Power seems to be stable throughout most of Appalachia, but recent infrastructure investments will be tested. Some have compared our current predicament to the Biblical story, David and Goliath, while others point to a historical example found in the Soviet-Finnish conflict. Both are adequate examples, as some claim the Legitimists outnumber us 2 to 1, though this has not deterred our troops, as one Commander put it, "We'll just shoot twice and go home". It is unknown how long this conflict will last, or what it'll cost to continue our independence, though one thing is certain, we will stand. "
 winter_war.2.a:0 "The Appalachian Spirit Will Endure!"
 
 winter_war.3.t:0 "Victory!"
 winter_war.3.d:0 "It has been one year to the date, since the Legitimists crossed into our lands, and we've stood tall ever since. While the tides of battle turned against us at times, we've been able to hold firm against the constant onslaught of troops being thrown against our mountain. Leaders in Washington have called for a white peace, which would stop the conflict and return our borders to the state they were a year ago. Our leaders have already begun conversations with Washington for a demilitarization period, ultimately as we both transition into peace times. However this does not mean either side will resume normal relations, as we expect hostile diplomatic relations to continue for the foreseeable future. On the other hand, Appalachia has proven to the world that our spirit is not easily broken. The capital has reported that multiple different nations, including fellow North American successor states, have applauded our mentality. One year ago we mentioned that this war would be a dark day for all of Appalachia, but that if we held firm we'd find the light. Today, we've found the light, today we've defined what it means to be a part of Appalachia. "
 winter_war.3.a:0 "At least we survived"
 
 winter_war.4.t:0 "A Stunning Victory"
 winter_war.4.d:0 "What many said could not be done has been accomplished, David has once again slain Goliath. After capturing Washington and pushing into Pennsylvania, the white flag has been waived and a truce offered by the Legitimists. For a quick end of the war, the Legitimists will cease control of Pennsylvania for the return of Washington D.C. This trade would allow for Appalachia access to the core industry while giving up the former capital of the United States. Polling shows a majority of residents support the trade, with a greater majority wanting a quick end to the war. The capital is expected to sign off on the trade this week, with an end to this war coming with the finalization of said trade. Demilitarization is also expected to follow with the peace deal, as troops will be kept to a minimum while we integrate our new territory. As for our citizens, migration check points will be established for any Legitimists citizens who decline Appalachian citizenship. Diplomatic relations are expected to stay hostile with the Legitimists, though other nations have already sent their congregations for our resolve. While it cost us thousands of lives to stay independent, our might have been put on displace for all to see, and to all those who may want to repeat the mistake made by the Legitimists, know that Appalachia will stand."
 winter_war.4.a:0 "Greater than anything we could have hoped for!"
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
