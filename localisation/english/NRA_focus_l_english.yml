 NRA_Kanye_Support:0 "Support From Kanye"
 NRA_Kanye_Support_desc:0 "In our efforts, our friends in the south have agreed to grant us their support."
 NRA_Crusade_Anti_Left:0 "Crusade Against The Left"
 NRA_Crusade_Anti_Left_desc:0 "Appalachia in recent years has always been a bulwark against the radical left, as an independent state we must continue these values."
 NRA_Restarting_The_Economy:0 "Restarting The Economy"
 NRA_Restarting_The_Economy_desc:0 "The civil war and lack of opportunity has left our economy in shambles. If we are to move forward, we must strive to repair it."
