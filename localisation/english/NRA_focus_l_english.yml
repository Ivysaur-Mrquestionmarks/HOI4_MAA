 w_v.9.t:0 "Entry 17, Reaching Appalachia"
 w_v.9.d:0 "After a long journey, I've made it to West Virginia. The wars in the north have ravaged the once beautiful landscapes. Terror attacks in New York have disrupted the electrical grid south of the Hudson, and the midwestern states are led by a smiling man with a boot. Trump and Biden may officially be at peace, but their followers have continued the war effort. There is nowhere safe, except the peaceful hills of Appalachia. I've taken up shelter in Brandonville, but I hope to make it towards Charleston in the coming days. The families I've stayed with have been kind, but they were very hesitant when I first arrived. It took some time, but I was able to gain their trust, which led to them explaining that many nearby had gone missing. Seems like folk tales, but many claim that men are raiding towns for anyone who can pick up a shovel and forcing them into labor deep in the mountains. The state government collapsed shortly after the fall, but the mines stay lit at night, many can see the smoke stacks for miles. My wife would always tell me that I get too close to stories that should be forgotten, but she's not here anymore to lend me those sweet words. I'm not sure where to start looking into these stories, but I know where I'll start, the capital. I hope to leave in the morning, if weather allows, for I believe this group could make for good company."
 w_v.9.a:0 "Seems like there's trouble down in Charleston, - T. C."

 w_v.10.t:0 "Entry 19: Arriving in Charleston"
 w_v.10.d:0 "Travel to the capital placed many challenges before me, as storms delayed the group for some time and multiple settlements needed our aid. Yet, we finally made it. I've broken away from the main group of travelers, as they intend to continue south towards the Confederacy or Florida. The reports I've heard must be true, Charleston has been overrun by a central group, who seems to be siphoning off the power provided by the mountain. Electricity powers homes for miles around, and the people don't seem to question where said power comes from. Many seem to not care, or at least want to carry on as if everything is as it was before, I can look out on the streets and see beautiful families, I must admit that I feel jealousy rising inside. Prayers are the only hope I have for the state of my children, for I've been unable to contact them since the fall. I must also confess my guilt, words can't describe how much I miss my Susan. She would want me to continue, and that is what I will do. After talking to some locals, I've found who is at the center of this town. It's a group formed by a group of coal barons that have formed a new conglomeration, they call themselves, the Company. If I am to find any truth about the claims from Brandonville, I'll need to gain an audience with this so-called Company."
 w_v.10.a:0 "Maybe I should talk to the locals, - T. C."

 w_v.11.t:0 "Entry 21: The Rot is Here"
 w_v.11.d:0 "The Company has been infected by the same rot that brought down the United States. After talking with the "Founder", they offered me a job as their chief of propaganda, which would come with my own show on television and radio. This seemed like a natural fit, given my history in both forms of media, but once I actually saw the actions taking place behind the scenes, I soured on that idea. The company has expanded its control across West Virginia, according to my friends in Brandonville. The families who helped me find a place away from the war are being subjugated and forced to do hard work with little to no pay. The fruits of their labor are shown here though, as they power our grid. Every single aspect of Appalachia has been funneled into the Company, and I can't imagine when it'll be enough. Men, women, and children are being forced into those mines or into those factories. Their happiness being stripped from their bodies, their souls being tormented through exhaustion. I can not stand by and allow this to happen, I must get this story out. I have some connections from my reporting days, they'll have a field day with the evidence I've gathered."
 w_v.11.a:0 "The devil may have gone down to Georgia, but he lived in Appalachia, - T. C."

 w_v.12.t:0 "Entry 24: First Night at the Camp"
 w_v.12.d:0 "They're everywhere. The company has a secret police force that followed me for days and they tapped my phones. Once they realized I knew, they raided my own room and I fled into the alley. The only person who would give me refuge was a raving hermit, who is connected to an underground ring of anti-capitalists. He gave me a bed in the sewers as long as I listened to him go on about communist theory and Soviet disinformation. Honestly it was quite enjoyable for a time, to be able to speak badly about the Company without being accused of a thought crime. Though everything eventually came crashing down, and soon we were found out and the man who protected me was executed before my eyes. Soon after I was brought to the Founder, my sentence was reduced out of pity. While many called for my head, it seems the Company saw that as a waste of resources. I was swiftly sent off to a labor camp in God knows where, but our main produce is coal. The mines are always ablaze, night and day, each worker labors though one 12 hour shift after another. I've only been here a day and I've already seen once healthy children being reduced to husks, families being torn apart, and disease corrupting the beauty of youth. They were promised the American dream, but received hell on Earth. An American nightmare would be preferable to this sinful existence. My bones betray me, as I am not as young as I once was, but my spirit remains firm. I will not die here, I will purge this place with holy retribution."
 w_v.12.a:0 "The Devils gonna make me a freeman, one of these days, - T. C."

 w_v.13.t:0 "Entry 31: Hell's Coming with Me"
 w_v.13.d:0 "Over the course of an hour, I've become the devil to some and a savior to others. The labor camp has been engulfed in flames, and all the guards are either burning or dashing into the woods. The irony is not lost on me that I was the match, both figuratively and literally. The plan to escape was not mine, it was formatted by a man who died months before my arrival, but the spirit of freedom kept it alive even after his last breath. Though it was in my words that the masses stirred, in secret I was able to send letters and give sermons to my friends, until they finally were ready to bring fire to their oppressors. The guards who survived all got down on their knees and begged for their lives. I took a moment to find the words, until finally my mouth moved for me, "I am the righteous hand of God, and I am the Devil you forgot. I'll be back, I guarantee." I'm not sure what comes next, but I will do whatever is needed to protect my people, my friends, and my family."
 w_v.13.a:0 "War has cost me one family, but rebirth has given me another, - T. C."

 w_v.14.t:0 "Entry 32: New Perspective"
 w_v.14.d:0 "We've become like a family out here, though that is to be expected after what we've been through. The group marched day and night to make sure the distance between us and the Company was great enough, eventually finding a spot south of Addison to settle down. The Company may control the entire region, but that doesn't mean they have eyes everywhere. Over the last week we've made a home for ourselves and other survivors. Truly I've never been more amazed by what humanity can do then right now, but at the same time I've seen the horrors of what our species is capable of. I can't shake the feeling that perhaps humanity can truly be better. The people who I call my friends are working, not for profit, but to make their own community better. Perhaps the ramblings of that hermit were not without merit. Perhaps the world can go round without money, without greed. Perhaps capitalism isn't the final frontier of the human race."
 w_v.14.a:0 "For the greater good I shall lay myself bare, - T. C."

 w_v.15.t:0 "Entry 35: My Eyes Have Been Opened"
 w_v.15.d:0 "I can no longer deny it, I can no longer pretend that the principles of collective action are not the future of human prosperity. I'm not comfortable calling myself a communist nor a socialist, but I won't deny that my new ideology doesn't resemble the former. I've also taken up somewhat of an authority figure within the group. This has allowed me to direct resources more efficiently than ever, additionally, we are constructing more shelters for more refugees. Most are coming from the north, where war has destroyed every state in between Trump and Biden's territories. However, a sizable number are survivors from the labor camps. Apparently our escape has inspired many to try the same, though it isn't anywhere near as large of a scale. I hope to one day spread my new found wisdom with those still in servitude, and soon those workers will seize the means of production for themselves. While I haven't landed on how we will accomplish this goal, I can say for certain that plans are already being put into motion. My eyes have been opened, and it is my duty to lead those wayward souls to the new light. We will burn down the capitalist Company, and bring humanity into the light."
 w_v.15.a:0 "I have seen the light, and I shall bring all of them to salvation, - T. C."

 w_v.16.t:0 "Corporate Memo #1"
 w_v.16.d:0 "Subject: The Carlson Event\n\nReports of the Nicholas Mining Camp suffering a catastrophic failure have been confirmed; however, the mine can be salvaged. We will need to provide considerable resources for the reconstruction of said camp, as the prisoners set much of it ablaze before retreating from our reinforcements. It has also been reported, from multiple guards, that Carlson was at the center of this revolt. It appears he has become somewhat of a hero to his fellow workers, though knowledge of his involvement has not spread to other camps, we will continue monitoring the situation. Going forward, we will increase security protocols for our other camps along with granting guards more immunity to conduct their services in whatever way they see fit. Current production levels are expected to catch up to expectations within the month, but further research will need to be done in the broader impact of a major break in labor."
 w_v.16.a:0 "Carlson must be dealt with sooner, or we risk him setting all of us ablaze, -The Founder"

 w_v.17.t:0 "Corporate Memo #2"
 w_v.17.d:0 "Subject: Continued Search for Carlson\n\nAccording to our chief of security, Carlson has set up camp somewhere within our border. While we hoped he had moved on towards the Confederacy or even the Farm, we must come to reality that he has continued to be present in our nation. Evidence of his compound's existence proves that he has future plans here in Appalachia. While we can not be sure of what said plans are, there is a fear that Carlson will try to infect our workers with false hopes and promises of prosperity. However, we feel that the chances of Carlson falling to communist sympathies, as some in our administration suggest, is quite unlikely. Carlson has had a long history of embracing the American dream, and we don't believe he would abandon the faith. There is still a chance to bring Carlson back into the Company, we hope to bring him in alive for re-education, as he can still serve us well. As for the reports that other camps have been exposed to the Carlson event, we will continue monitoring and promoting the truth in how we see it. We have found evidence of an uptick in escape attempts, but our increased security has kept the total number of escaped laborers within predicted perimeters. As for those who are caught, we have decided to increase our punishments, and we no longer discourage public executions. The situation is being monitored closely, and the search continues for Carlson's compound."
 w_v.17.a:0 "I'm not a bad guy, I'm just following the natural order, - The Founder"

 w_v.18.t:0 "Corporate Memo #3"
 w_v.18.d:0 "Subject: Carlson is our Top Priority\n\nAfter multiple attempted revolts, the Company has re-evaluated our priorities. Carlson must be taken out, one way or another. News of his revolt has spread to every labor camp, and guards have confiscated multiple manifestos exposing anti-capitalist sentiments, all claiming to be directly written by Carlson himself. While our experts were able to confirm that some writings are forgeries, they can't deny that some are written in a manner closely associated with Carlson's previous writings. We can no longer deny that Carlson has had some impact on our workforce, and we must bring him to justice. We will begin harsher work programs for our laborers, though some have claimed we're "working them to death". To those dissenters, we remind them of the on staff doctors who will administer painkillers so our workers can continue to function regardless of condition. The chances of further escalation, or even full revolution can not be ignored. Carlson has become the thorn in our side, and we've allowed it to become infected. Before, we have gone easy on him, and hoped he could be brought back into the fold, but now it is clear, the capturing of Tucker Carlson is our top priority."
 w_v.18.a:0 "Like the prodigal child, Tucker will come back to me, and I'll make sure no one ever tries to repeat his mistake again, - The Founder"
 
 
