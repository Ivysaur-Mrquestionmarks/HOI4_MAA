 NRA_Proffy_Militia:0 "Professional Militia"
 NRA_Proffy_Militia_desc:0 "Proffessional militias will patrol and squash dissent, just like true supporters of the second amendment would!"
 NRA_Help_Farms:0 "Help The Farmers"
 NRA_Help_Farms_desc:0 "Food production is always nice! If we continue to back and prop up our nation's farmers we should never go hungry."
 NRA_Stuff_For_Trump:0 "Help For Trump"
 NRA_Stuff_For_Trump_desc:0 "Trump's America is perhaps our greatest ideological ally, assisting him is a priority."
 NRA_Big_Money:0 "Making Profits"
 NRA_Big_Money_desc:0 "It would seem with a civil war going on there is high demand for what we offer, who would've known."
 NRA_Proffy_Guards:0 "Professional Guards"
 NRA_Proffy_Guards_desc:0 "We will train proffessional guard to protect our profit."
 NRA_No_More_Rights:0 "No Workers Rights"
 NRA_No_More_Rights_desc:0 "The less workers are allowed to complain, the more productive they are, it's simple economics."
 NRA_Corporate_Expansion:0 "Corporate Expansion"
