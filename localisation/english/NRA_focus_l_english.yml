 NRA_Second_Chaos:0 "The Second Chaos"
 NRA_Second_Chaos_desc:0 "Even after the civil war, political strife continues factionalism has developed within our nation and if not dealt with could lead to another civil war or worse."
 NRA_Military_Self_Destruction:0 "Military Self Destruction"
 NRA_Military_Self_Destruction_desc:0 "Our military is in a sorry state, divided by factionalism and barely a real military, it's gonna need some reforms."
 NRA_Army_Cope:0 "Army's Cope"
 NRA_Army_Cope_desc:0 "B-but we're the real army!! We have honor and morals and stuff we shouldn’t have to bow to these soldiers of fortune!!"
 NRA_Proffy_Mercenaries:0 "Professional Mercenaries"
 NRA_Proffy_Mercenaries_desc:0 "Who needs honor when your greatest motivator could be money?"
 NRA_Rebuilding_The_Stuff:0 "Rebuilding Our Homes"
