 NRA_CEO_Of_Appalachia:0 "The CEO Of Appalachia"
 NRA_CEO_Of_Appalachia_desc:0 "From the river to the mountains, Appalachia is our company assets!"
 NRA_Banana:0 "Bananas From Chiquita!"
