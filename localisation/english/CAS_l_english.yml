l_english:
 CAS_guerilla_warfare:0 "The West Coast War"
 CAS_guerilla_warfare_desc:0 "We are fighting for our survival against Sanders and his Bolshevik Republic!"
 CAS_learn_from_americas_past:0 "Learn from America's Past"
 CAS_learn_from_americas_past_desc:0 "America is no stranger to guerilla warfare. We can make good use of these lessons and use them against the Bolsheviks."
 CAS_taliban:0 "Learn from the Taliban"
 CAS_taliban_desc:0 "The Taliban of Afghanistan lived in mountainous terrain not entirely dissimilar from our Cascadia! We can learn a lot from how they waged war"
 CAS_learn_from_viet_cong:0 "Learn from the Viet Cong"
 CAS_learn_from_viet_cong_desc:0 "The Viet Cong, some poor peasant farmers, managed to defeat the armies of both America and China! Most impressive..."
 CAS_learn_from_werwolf:0 "Learn from Werwolf"
 CAS_learn_from_werwolf_desc:0 "Perhaps not as good an example as the Taliban or the Viet Cong, but the New Awakening who we have so desparately sided with are adamant that we implement similar policies."
 CAS_teach_them_our_lessons:0 "Teach the Bolsheviks our Lessons"
 CAS_teach_them_our_lessons_desc:0 "We have learnt a lot, and are now effectively grinding Sanders' forces to a decisive halt. Soon our independence shall be fully secured!"
 CAS_surviving_a_coup:0 "Surviving a Coup"
 CAS_surviving_a_coup_desc:0 "That was close! We almost ended up under a Nazi Dictatorship! Phew!"
 CAS_reclassify_ss:0 "Reclassify the SS"
 CAS_reclassify_ss_desc:0 "Sadly the SS divisions still hold an unprecedented level of control and ability to wage war within our country, even with their leadership in tatters after the coup. We shall pardon low-ranking SSmen and give them a new opportunity in our new Cascadian Security Service."
 CAS_rally_portland_democracy:0 "Rally Portland Democracy"
 CAS_rally_portland_democracy_desc:0 "Portland is the Capital of our Democracy!"
 CAS_unspoken_alliance:0 "The Unspoken Alliance"
 CAS_unspoken_alliance_desc:0 "The Republican Party within Cascadia is obviously more aligned with our views than the New Awakening, and will join us in an unwritten alliance."
 CAS_send_radicals_to_mountains:0 "Send the Radicals to the Mountains"
 CAS_send_radicals_to_mountains_desc:0 "Keeping the most radical of the CSS patrolling less hospitable areas like the Mountains or the Desert and keeping them out of urbanised areas will ensure their values don't spread too far"
 CAS_rees_plan:0 "The Rees Plan"
 CAS_rees_plan_desc:0 "Field Marshal Raymond Rees, champion of our independence, says he wants complete, unhindered access over the army for his own plans."
 CAS_ready_for_elections:0 "Ready for Elections"
 CAS_ready_for_elections_desc:0 "With the Aftermath of the Coup dealt with, we can now prepare for free and fair elections."
 CAS_american_cromwell:0 "The American Cromwell"
 CAS_american_cromwell_desc:0 "Nazi sons of bitches have no right to exist on American soil! We'll show them what for!"
 CAS_democracy_needs_us:0 "Guardians of Democracy"
 CAS_democracy_needs_us_desc:0 "We will serve as a transitionary stage towards democratic freedoms"
 CAS_secure_oregon:0 "Secure Oregon"
 CAS_secure_oregon_desc:0 "Oregon is vital to our defence against the Bolsheviks"
 CAS_push_them_into_the_countryside:0 "Push them into the Countryside"
 CAS_push_them_into_the_countryside_desc:0 "We must purge our internal lands of Nazis, and push them deep into the countryside!"
 CAS_crush_the_holdouts:0 "Crush the Hold-Outs"
 CAS_crush_the_holdouts_desc:0 "We'll finally finish these bastards off! Nowhere to run!"
 CAS_conference_of_liberty:0 "Conference of Liberty"
 CAS_conference_of_liberty_desc:0 "We'll hold a conference with all the political parties to discuss redemocratisation processes"
 CAS_denazification:0 "Denazification"
 CAS_denazification_desc:0 "If even the Germans can handle it, surely  it should be an easy task for us!"
 CAS_elections_await:0 "The Election Awaits"
 CAS_elections_await_desc:0 "It's nearly time to hold the first Cascadian Presidential Election!"
 CAS_the_presidential_election:0 "The First Cascadian Presidential Election"
 CAS_the_presidential_election_desc:0 "Here we go!"
 CAS_liberal_victory:0 "Liberal Party Victory"
 CAS_liberal_victory_desc:0 "The Liberal Party, built out the ashes of the old Democratic Party, have won election!"
 CAS_cascadian_tory_victory:0 "Cascadian Tory Party Victory"
 CAS_cascadian_tory_victory_desc:0 "The Cascadian Tories, built out the ashes of the old Republican Party, have won the election!"
 CAS_whig_victory:0 "Whig Party Victory"
 CAS_whig_victory_desc:0 "Arthur MacArthur IV, son of esteemed general Douglas MacArthur, has come out of hiding and totally stormed the polls for his new Whig Party!"
 CAS_embrace_larp:0 "Embrace the LARP"
 CAS_embrace_larp_desc:0 "Under our direction, Cascadia will become an Army with a State!"
 CAS_insular:0 "Insularism"
 CAS_insular_desc:0 "We should just keep to ourselves"
 CAS_the_crown:0 "The Crown"
 CAS_the_crown_desc:0 "We are a radical, revolutionary state. We need radical, revolutionary ideas! Such as-- a Kingdom!"
 CAS_the_sceptor:0 "The Sceptor"
 CAS_the_sceptor_desc:0 "We shall rule in a Bonapartist Republic with an iron sceptor, directing all that happens in this land"
 CAS_prepare_legislation:0 "Prepare the Legislation"
 CAS_prepare_legislation_desc:0 "A lot of legal code needs to be rewritten in preparation for the Kingdom."
 CAS_an_empty_throne:0 "An Empty Throne"
 CAS_an_empty_throne_desc:0 "There are no suitable candidates for the Throne of Cascadia. Until one can be found, we will maintain the Lord-Protector model."
 CAS_mission_to_japan:0 "Rees goes to Tokyo"
 CAS_mission_to_japan_desc:0 "Marshal Rees will travel to Tokyo to consider inviting a member of the Japanese Royal Family to Cascadia"
 CAS_search_for_a_king:0 "Searching for a King"
 CAS_search_for_a_king_desc:0 "There MUST be someone of good Cascadian stock ready to be King. There MUST be. There must be...."
 CAS_japanese_military_contracts:0 "Nippon Military Contract"
 CAS_japanese_military_contracts_desc:0 "Following the fall of the United States, the Imperial Japanese Army was rapidly reactivated and Japan is by now once again a military power. We would do well to engage in contracting with them."
 CAS_jingoism:0 "Jingoism"
 CAS_jingoism_desc:0 "Jingoism is cool and good. Just ask Tony Blair!"
 CAS_puritanism:0 "Cascadian Puritanism"
 CAS_puritanism_desc:0 "It worked for Olly"
 CAS_lord_protectors_armies:0 "The Lord-Protector's Armies"
 CAS_lord_protectors_armies_desc:0 "We will raise a mighty army"
 CAS_whip_up_monarchism:0 "Whip Up Monarchist Sentiment"
 CAS_whip_up_monarchism_desc:0 "Remember, it was Rees who saved you all from the Nazis! He knows what's best!"
 CAS_militarism:0 "Militarism"
 CAS_militarism_desc:0 "War Support will keep our heads in the game"
 CAS_cascadians_war_cry:0 "The Cascadian War Cry"
 CAS_cascadians_war_cry_desc:0 "YOORAAA"
 CAS_banzai:0 "BANZAI!"
 CAS_banzai_desc:0 "Tennōheika Banzai!"
 CAS_new_order:0 "The New Order"
 CAS_new_order_desc:0 "Last Days of Amerika"
 CAS_streng_geheim:0 "Streng Geheim"
 CAS_streng_geheim_desc:0 "Top secret!"
 CAS_einheitspakt:0 "Der Einheitspakt"
 CAS_einheitspakt_desc:0 "We'll form a faction"
 CAS_the_white_swastika:0 "Up the White Swastika!"
 CAS_the_white_swastika_desc:0 "We look forward, much unlike those Atomwaffen spergs!"
 CAS_down_with_the_black_swastika:0 "Down with the Black Swastika!"
 CAS_down_with_the_black_swastika_desc:0 "Pessimism is gay and cringe!"
 CAS_secret_police:0 "Secret Police"
 CAS_secret_police_desc:0 "Keep the rebels in check"
 CAS_contact_albertans:0 "Contact the Aryan Guard"
 CAS_contact_albertans_desc:0 "Kyle McKee and his insurgency in Alberta should be contacted"
 CAS_night_long_knives:0 "Second Night of Long Knives"
 CAS_night_long_knives_desc:0 "Not all Nazism is good Nazism."
 CAS_alliance_with_mckee:0 "Alliance with McKee"
 CAS_alliance_with_mckee_desc:0 "We'll ally with Kyle McKee's Aryan Guard in Canada"
 CAS_speerism:0 "Speerism"
 CAS_speerism_desc:0 "Speer knew what was up!"
 CAS_vancouver_war:0 "The Vancouver War"
 CAS_vancouver_war_desc:0 "We need to sort out the situation in the Vancouver War. Do we press on or give up?"
 CAS_end_home_front_troubles:0 "End the Troubles on the Home Front"
 CAS_end_home_front_troubles_desc:0 "We need to fix the home front to succeed in the West"
 CAS_military_industrial_complex:0 "Military Industrial Complex"
 CAS_thank_god_for_army:0 "Thank God For The Army!"
 CAS_thank_god_for_army_desc:0 "The Army is the reason we're here! We'd do well to significantly increase military funding"
 CAS_end_the_complex:0 "End the Complex"
 CAS_end_the_complex_desc:0 "America suffered from an inescapable Military Industrial Complex. We cannot let the same thing befall us."
 CAS_odinist_moment:0 "Odin's Blessing"
 CAS_odinist_moment_desc:0 "We must return to the true white man's roots, to Vinland. Wotan will give us his blessing and we will create a true Viking state."
 CAS_anarcho_fascism:0 "Anarcho-Fascism"
 CAS_anarcho_fascism_desc:0 "Former Brother Donnovan, who now goes by 'Wotansson', believes strongly in the principal of 'Anarcho-Fascism'. While this is a total oxymoron, we will try our hardest to replicate it."
 CAS_christian_moment:0 "God's Mission"
 CAS_christian_moment_desc:0 "The Lord sent the New Awakening and the Reverend Richard Butler to this impure world to conduct a great cleansing!"
 CAS_lords_prayer:0 "The Lord Guides Us"
 CAS_lords_prayer_desc:0 "We are guided by none other than God himself, through his holy prophet Reverend Butler!"
 CAS_memories_of_murphy_ranch:0 "Memories of Murphy Ranch"
 CAS_memories_of_murphy_ranch_desc:0 "In the 30s, Murphy Ranch was an area of California controlled by a group known as the Silver Legion. It was shut down due to the Jewish War, but the intention was to turn it into an American fortress of Fascism, to spread our ideals across the continent. We shall revive Murphy Ranch, and lead a glorious crusade against the Bolsheviks in Los Angeles."
 CAS_end_theocracy:0 "End the Theocracy"
 CAS_end_theocracy_desc:0 "In our Easternmost lands lies a despotic dictatorship, an evil breakaway, a legacy of the Old America. Matthew Shea and his corruptions of Christianity must be eliminated, and only then will Cascadia be safe."
 CAS_purify_east:0 "Our Eleven Years' War"
 CAS_purify_east_desc:0 "Although hopefully it won't actually take Eleven Years this time round."
 CAS_can_only_be_one:0 "The End of Liberty"
 CAS_can_only_be_one_desc:0 "There's only enough room in this mountain range for one dictatorship. It would look bad for our legitimacy if we allow Matt Shea's theocracy to continue to exist."
 CAS_work_with_shea:0 "Work with the Prophet"
 CAS_work_with_shea_desc:0 "Matt Shea and his fiefdom in the East are certainly... amenable to our views. We should send a delegation of our government to help develop his lands- and keep a close eye on him while we're at it. It's not like he could refuse."
 CAS_green_victory:0 "Green Party Victory"
 CAS_green_victory_desc:0 "The Green Party have successfully manouvered around a Right-Wing vote split and secured their political hegemony over the Liberals!"
 CAS_seize_press:0 "Seize Press Control"
 CAS_seize_press_desc:0 "We must act quick and seize press control to completely secure our control"
 CAS_finish_montana:0 "Finish Montana"
 CAS_finish_montana_desc:0 "Liberty has finally submitted to our fold. Montana, in comparison, may be a struggle to bring under our reign. There will be no peaceful option in reunification, and the fight ahead will be difficult amid the rugged terrain. We must strike unsuspectingly, and fast! "
 CAS_cross_rockies:0 "Cross the Rockies"
 CAS_cross_rockies_desc:0 "The Rockies will be the most treacherous lands to cross, and they are occupied by a small nation. We are not to underestimate them. We will have to take everything we learned from Liberty and Montana to swiftly destroy the western command zone. After this, we will finally meet the occupants of the Great Basin and Colorado Plateau face to face."
 CAS_integrate_the_legion:0 "Integrate the Legion"
 CAS_integrate_the_legion_desc:0 "With the Legionnaires victorious in California we can join forces to destroy our enemies. Together for Victory!"
 CAS_invade_utah:0 "Crush Judeo-Mormonism"
 CAS_invade_utah_desc:0 "The Mormons of Deseret continue to carry the scourge of Judeo-Christian values in the west, if we are to succeed in our constant struggle against Judaism they must be brought down and put in their place."
 CAS_crush_false_nazis:0 "Purge the False Nazis"
 CAS_crush_false_nazis_desc:0 "The Atomwaffen are perhaps the biggest threat to our shared beliefs. Little more than losers in skull masks, they could never hope to succeed like we have, and they must be integrated into the true bulwark against our shared threats."
 CAS_legion_of_west_america:0 "The Legion of Western America"
 CAS_legion_of_west_america_desc:0 "The time has come and we have unified the west, no longer simply Cascadia, we have taken up the mantle of the west and we must prepare to carry the torch of fascism east to liberate the remaining parts of North America."
 CAS_corporationism:0 "Corporatism"
 CAS_corporationism_desc:0 "We must follow the model of Corporatism and establish government control over both business and labor to control economic stimulus and rebuild our economy."
 CAS_the_program:0 "Implement the Program"
 CAS_the_program_desc:0 "With our territories ever growing we must enact a final solution to the untermenschen problem. The Program will see all enemies of the state taken into custody and “reoriented” to our purposes."
 CAS_labor_camps:0 "Labor Camps"
 CAS_labor_camps_desc:0 "Our captured enemies, the untermensch, and race traitors will be forced to work for the state for the rest of their miserable lives in our glorious Labor Camps. They will serve the state and bolster the economy to give their worthless lives some meaning."
 CAS_von_braun_legacy:0 "Von Braun's Legacy"
 CAS_von_braun_legacy_desc:0 "The legacy of Werner Von Braun in Germany and America is to be respected and we must emulate his example and show our enemies the might of the missile."
 CAS_wunderwaffe:0 "Wunderwaffen"
 CAS_wunderwaffe_desc:0 "In our struggle against the Jewish threat in America and worldwide, we must produce super weapons of our own to secure our final victory."
 CAS_valhalla_military:0 "Valhalla Awaits!"
 CAS_vallhalla_awaits:0 "Valhalla Awaits"
 CAS_vallhalla_awaits_desc:0 "With Odin’s Blessing we shall go into battle knowing Valhalla Awaits us and we shall fight with no fear in our hearts."
 CAS_militaristic_christianity:0 "The Army of God's Chosen People"
 CAS_militaristic_christianity_desc:0 "We are the Army of God’s Chosen People! With God on our side we are unstoppable! All the Untermensch shall fall beneath the Sword of God."
 CAS_christ_military:0 "Army of Christ"
 CAS_invade_bc:0 "Invade British Columbia"
 CAS_invade_bc_desc:0 "We should invade British Columbia now that Canada has collapsed to claim the true borders of Cascadia!"
 CAS_greater_cas:0 "Greater Cascadia"
 CAS_greater_cas_desc:0 "Now that most of Cascadia is under its rightful rulers, we can proclaim a somewhat united Greater Cascadia!"
 CAS_idaho_claims:0 "Claims on Idaho"
 CAS_idaho_claims_desc:0 "Idaho is considered part of Cascadia, so we should reclaim it"
 CAS_jefferson_claims:0 "Claims on Jefferson"
 CAS_jefferson_claims_desc:0 "Jefferson is considered part of Cascadia, so we should reclaim it"
 CAS_deregulate_private_sector:0 "Deregulate the Private Sector"
 CAS_deregulate_private_sector_desc:0 "The private sector is the backbone of the economy. Ensuring jobs, exports, and weapons. In these trying times, allowing some cut corners may be beneficial!"
 CAS_support_small_business:0 "Support Small Businesses"
 CAS_support_small_business_desc:0 "Who doesn't like supporting small businesses?"
 CAS_decrease_tax:0 "Decrease Taxes"
 CAS_decrease_tax_desc:0 " As we promised during our election campaign, we intend to lower the taxes. We hope that maintaining our  promises will ensure trust and stability between the new government and our citizens."
 CAS_second_red_scare:0 "The Second Red Scare"
 CAS_second_red_scare_desc:0 "Even united, America stood under threat of communism from the east. Now, the enemy of the people is on the mainland, just south of us, in California..."
 CAS_open_more_starbucks:0 "Open More Starbucks"
 CAS_open_more_starbucks_desc:0 "The liberal workforce needs their morning cup of joe. To ensure our workers stay efficient and happy, we will grant generous loans to individuals who seek to franchise the popular coffee chain."
 CAS_climate:0 "Climate Action"
 CAS_climate_desc:0 "The Climate Crisis has only been exacerbated by America’s fall so we must take immediate action to combat this threat within our lands"
 CAS_steal_nw_federation_idea:0 "Steal Northern Federationism"
 CAS_steal_nw_federation_idea_desc:0 "Northern Federationism is an idea that originated in Montana. However, they are unable to achieve its goals, so we must co-opt it in order to see it fulfilled."
 CAS_invade_montana:0 "Invade Montana"
 CAS_invade_montana_desc:0 "Montana Stands in our way of regional domination and it must be destroyed for the safety and glory of Cascadia."
 CAS_attack_Canada:0 "Attack Western Canada"
 CAS_attack_Canada_desc:0 "Many have claimed British Columbia as part of Cascadia for decades, now it is time to act to make it true!"
 CAS_attack_ida:0 "Conquer the WCZ"
 CAS_attack_ida_desc:0 "The Western Command Zone is nothing but a Trumpist puppet state and it must the conquered for the Glory of Cascadia."
 
 #Starting branch
 CAS_rally_anti_communists:0 "Rally the Anti-Communists"
 CAS_rally_anti_communists_desc:0 "As of right now, we are the only significant faction standing up to the Red Menace on the West Coast. If we fall, the west will fall to communism. We must work together to defend our values!"
 CAS_curtail_nazis:0 "Curtail the Militias"
 CAS_curtail_nazis_desc:0 "The Nazi militias have obtained too much influence in our armed forces. If we keep associating with them, aid for our cause from foreign powers against communism may be withdrawn!"
 CAS_purge_nazis_from_military:0 "Purge the Nazi Militias"
 CAS_purge_nazis_from_military_desc:0 "Now that the West Coast War is over, we can deal with the other extreme. The failed coup and this purge will show every nazi how we deal with them in Cascadia."
 CAS_expand_militia_autonomy:0 "Expand Militia Autonomy"
 CAS_expand_militia_autonomy_desc:0 "Whether we like it or not, we are too dependent on these militias to fight the red scum. Further integration and expansion will help us in our conflict and push us towards victory."
 CAS_reach_out_to_the_center_left:0 "Reach Out to the Center-Left"
 CAS_reach_out_to_the_center_left_desc:0 "Although our rhetoric against the left has been harsh lately, we must remember that we are still a part of the center-left. Expanding recruitment campaigns in big cities will help us counter the growing alt-right infiltration in our military, at least, for the time being."
 
 #Military branch
 CAS_the_cascadian_military:0 "The Cascadian Military"
 CAS_the_cascadian_military_desc:0 "With the war of independence won, we must work on reorganizing our armed forces properly. No longer just a collection of militias, but a properly organized fighting force ready to tackle the current national situation."
 CAS_the_cascadian_army:0 "The Cascadian Army"
 CAS_the_cascadian_army_desc:0 "The core of our armed forces is our Army. We will grow from our history of guerrilla warfare and expand from there, properly organizing ourselves and creating a force we can be proud of and our enemies afraid of."
 CAS_cascadian_guns:0 "Cascadian Guns"
 CAS_cascadian_guns_desc:0 "The basis of any soldier's kit is their rifle. So far, we’ve done with mostly pre war weapons, from both civilian and military sources, but if we’re to become a truly professional fighting force, we must manufacture and design our own gear to fit our needs, starting with our rifles."
 CAS_cascadian_canons:0 "Cascadian Cannons"
 CAS_cascadian_canons_desc:0 "Artillery has been a crucial aspect of warfare ever since the first cannons. were created in the 15th century, and not much has changed since then. During the war our forces lacked proper high ordinance weaponry so we must invest into developing our own home made artillery."
 CAS_cascadian_strategy:0 "Cascadian Grand Strategy"
 CAS_cascadian_strategy_desc:0 "As a young nation with an even younger army, developing our own military doctrine to suit our national defense needs is crucial. While guerrilla tactics did us well against the communists, we must evolve our strategy and planning."
 CAS_cascadian_apcs:0 "Cascadian APCs"
 CAS_cascadian_apcs_desc:0 "The first step in our mechanization plans is making modern Armored Personnel Carriers, or APCs. These will provide our troops higher mobility, defense against light arms and even offensive capabilities, perfect for any growing army."
 CAS_mass_mechanisation:0 "Mass Mechanisation"
 CAS_mass_mechanisation_desc:0 "After deliberation, our high command has decided to focus on mass production of mechanized equipment to attempt to fully mechanize our army. To do this, we will lower costs where we can during production and design, and while some quality concerns are raised, they pale in comparison to the potential of a fully mechanized Cascadian Army."
 CAS_mass_production:0 "A Mobile Army"
 CAS_mass_production_desc:0 "With the recent mechanization program, our troops are faster and more agile than ever, striking our enemies before they even see us coming. Further investments in this sector shall solidify us as the most mobile army in the West."
 CAS_top_of_the_line_mechanisation:0 "Top of the Line APCs"
 CAS_top_of_the_line_mechanisation_desc:0 "We will focus our efforts on having high end, technologically advanced and high quality vehicles we can afford. While this means we won’t be able to fully mechanize our forces, we will be able to rely on a small yet powerful mechanized force, supported by our leg infantry."
 CAS_cascadian_armour_core:0 "The Cascadian Armor Core"
 CAS_cascadian_armour_core_desc:0 "We will focus our armored efforts on a small, but highly professional and deadly Armor Core, focusing our tanks, APCs and IFVs together to achieve greater results. They shall be the tip of our spear, pointed right at our enemies heart."
 CAS_the_cascadian_airforce:0 "The Cascadian Airforce"
 CAS_the_cascadian_airforce_desc:0 "During the war against the communists, we were never in a position to build an air force of our own, safe for the occasional civilian plane, drone or helicopter that is. Now however, we are an independent nation, and we must defend all sides of it, including the air. We will organize a new, Cascadian Air Force for this end."
 CAS_cascadian_drones:0 "Cascadian Drones"
 CAS_cascadian_drones_desc:0 "Drones, from military Reapers to the ones the neighbor got his kid, are becoming more and more vital in conflicts worldwide. From intel gathering to dropping explosives on enemy positions, drones are cheap to make and don’t put our men at risk. Investing into them is a no brainer."
 CAS_reinforce_cascadia_skies:0 "Defend Our Skies"
 CAS_reinforce_cascadia_skies_desc:0 "Our air force’s main goal must be the protection of our skies from foreign powers, be they spy planes, fighters or bombers, they must be fought before they do harm to our people. Building new and improved airbases throughout our nation is a great step towards this goal."
 CAS_keep_our_workers_safe:0 "Keep Our workers safe"
 CAS_keep_our_workers_safe_desc:0 "In modern warfare, attacking an enemy's supply line through strategic bombing is seen as second nature and an important role of any sufficiently large air force. To counteract this, we will devise plans and designs to effectively make our factories as bomb proof as possible, maintaining production safe and sound even if our skies darken with enemy bombers."
 CAS_project_wingman:0 "Project Wingman"
 CAS_project_wingman_desc:0 "We havea critical lack of expertice in our airforce.\nIf we desire to survive, we must catch up by any means posible. Thankfully we have recived multiple offers from expirience and questionable individuals willing to train our airforce... at a price"
 CAS_cascadian_figthers:0 "Cascadian Fighters"
 CAS_cascadian_figthers_desc:0 "To maintain supremacy over both our airspace and the enemies, we shall develop and produce new fighter models. These new jets will be deadlier, faster, stronger than anything we’ve flown before."
 CAS_cascadian_helicopters:0 "Cascadian Helicopters"
 CAS_cascadian_helicopters_desc:0 "While not as combat capable as airplanes, helicopters more than make up for it in versatility. From medevac to gunships, they are crucial, both in and out of combat. Investing into them will be crucial for Cascadia's military in the future."
 CAS_recover_stealth_technology:0 "Recover Stealth Technology"
 CAS_recover_stealth_technology_desc:0 "Before the civil war, the USAF had developed plenty of stealth technologies for their aircraft, rendering them practically invisible to radar systems. Unfortunately, since then we haven’t been able to replicate these technologies, either due to their complexity or high price. We must spend time and resources to try and find blueprints, scientists, anything that may help us rediscover this technology."
 CAS_recover_airforce_documents:0 "Recover Airforce Documents"
 CAS_recover_airforce_documents_desc:0 "If there was one thing the United States of old knew, it was how to run an air force. Blueprints, design specs, training manuals, these documents are invaluable for any nation to build their air force out of, and fortunately, there are several USAF bases within our territory. If we scope them out and really dig through them, we are bound to find something good eventually."
 CAS_cascadian_strategic_deterrence:0 "Cascadian Strategic Deterrence"
 CAS_cascadian_strategic_deterrence_desc:0 "Ever since the first nuclear weapon was detonated in 1945, the people of Earth have lived in fear. Fear of nuclear annihilation, of utter destruction, but no more. We will build a series of missile defenses, ready to shoot down any plane or missile threatening to harm the good people of Cascadia."
 CAS_cascadian_nukes:0 "Cascadian Nukes"
 CAS_cascadian_nukes_desc:0 "We stand on the precipice of something truly magnificent and unprecedented. The Cascadian nuclear program will ensure freedom for the people of Cascadia forevermore, building the ultimate deterrence and setting us far above any other mere warlord in the remains of the country. We are right there, just a little more.."
 CAS_the_cascadian_navy:0 "The Cascadian Navy"
 CAS_the_cascadian_navy_desc:0 "Our nation is blessed with a great and beautiful coastline, but sadly, this is a threat in times of war. We were lucky the Pacific Fleet mostly ignored us during the war, but now we must learn from them, and build a fleet of our own."
 CAS_rebuild_seattle:0 "Rebuild Seattle"
 CAS_rebuild_seattle_desc:0 "Now that the great city of Seattle is back in our hands, we will have to spend some time and resources rebuilding it. From the infrastructure, to businesses and homes, to the city’s ports, Seattle is a goldmine we must invest into before reaping its rewards."
 CAS_expand_seattle_docks:0 "Expand the Seattle Dockyards"
 CAS_expand_seattle_docks_desc:0 "Seattle will be the home of Cascadia’s Navy, with its large preexisting infrastructure and naval history. Investing into newer dockyard facilities will be a great boon to our nation’s young Navy."
 CAS_expand_the_olympia_port:0 "Expand the Olympia Port"
 CAS_expand_the_olympia_port_desc:0 "Seattle pledged its loyalty to California and their communists, showing us that they are unfortunately, not a reliable ally. Instead, we will work to expand the port of Olympia, just south of Seattle, into our main naval hub."
 CAS_the_olympia_docks:0 "Olympian Dockyards"
 CAS_the_olympia_docks_desc:0 "Due to our efforts and investments, Olympia is quickly becoming one of the North Pacific’s greatest ports, so why stop now? We will further invest into their nascent dockyard sector, to build the ships which shall one day defend Cascadia’s waters."
 CAS_assess_our_position:0 "Asses Our Position"
 CAS_assess_our_position_desc:0 "While we have a burgeoning navy, our sailors and captains are less than experts. Developing a naval culture and doctrine will undoubtedly take time, but we can get started now. By analyzing our neighbors and rivals, we can know our needs and advantages, and work off that for now."
 CAS_cascadian_destroyers:0 "Cascadian Destroyers"
 CAS_cascadian_destroyers_desc:0 "Destroyers are the bedrock of a modern fleet. Well equipped to fight other vessels, submarines and aircraft, they are a veritable swiss army knife of the seas. Developing our very own models will go a long way for our Navy."
 CAS_cascadian_submarines:0 "Cascadian Submarines"
 CAS_cascadian_submarines_desc:0 "Submarines are critical in a nation’s national Security. Able to slip past most ships, they allow a much larger range of action and freedom of mobility, especially if rockets are involved in the question. Investing into these vessels will be an investment into Cascadia's future."
 CAS_develop_our_navy:0 "The Cascadian Naval Institute"
 CAS_develop_our_navy_desc:0 "Our Navy has come a long way since the days of the West Coast War, but there is still much to be done. Founding an official naval institute to train our future sailors and captains is an important part in creating a true naval culture, and cementing ourselves as a genuine naval powerhouse."
 CAS_cascadian_crusiers:0 "Cascadian Crusiers"
 CAS_cascadian_crusiers_desc:0 "The top of the line, the creme of the crop, the cherry on top. Cruisers are truly the most advanced ships in most nations' naval arsenal, and Cascadia shall be no different. Creating our own cruisers will be vital to ensuring our seas are safe and our waters calm."
 
 #Japanese Conquests
 CAS_west_coast_claimant:0 "A Shattered American West"
 CAS_west_coast_claimant_desc:0 "The American West has been shattered every since 2021, with continuing fragmentation as time progresses. We now find ourselves in a unique position to take advantage of it."
 CAS_lessons_from_the_independence_war:0 "Lessons From the West Coast Wars"
 CAS_lessons_from_the_independence_war_desc:0 "Cascadia has saw more warfare than most since the Fall of America and this has left us with a great deal of military experience we can use to finally finish the wars once and for all"
 CAS_annex_border_states:0 "Annex Border States"
 CAS_annex_border_states_desc:0 "After the Treaty of Seattle we saw the creation of the border states as a buffer between us and California. We must conquer these states to strike at the heart of the beast."
 CAS_conquer_cali:0 "Crush the Communists"
 CAS_conquer_cali_desc:0 "Sanders' Commune in California shall have its corruptive influence end and we will take it for ourselves to ensure our domination over the Pacific."
 CAS_annex_baja:0 "Claim the Rest of California"
 CAS_annex_baja_desc:0 "With Mexico falling into a similar state as America the opportunity has arisen for California to be reunited under us."
 CAS_canadian_coast:0 "Conquer the Canadian Corridor"
 CAS_canadian_coast_desc:0 "For us to achieve our destiny of conquering Pacific North America we must establish control over what many call the Canadian corridor of British Columbia and The Yukon"
 CAS_seize_alaska:0 "Seize Alaska"
 CAS_seize_alaska_desc:0 "Alaska is disconnected and divided, but holds great resources for our War Machine. Our destiny will be fulfilled and Alaska shall be ours!"
 CAS_seize_hawaii:0 "The Second Pearl Harbor"
 CAS_seize_hawaii_desc:0 "Just like our Majesty’s Ancestors did back in 1941 we must attack Pearl Harbor, but we will go further and subjugate the entirety of Hawaii under our glorious rule, Banzai!!"
 CAS_sun_rises_in_the_west:0 "The Rising Sun of the West"
 CAS_sun_rises_in_the_west_desc:0 "We have succeeded! With the Pacific under our control we are unstoppable! We are the Empire of the Rising Sun, we are the Empire Reborn, BANZAI!"
 
 
