 #Focuses
 SCA_Recovering_From_The_War:0 "Recovering From the War"
 SCA_Recovering_From_The_War_desc:0 "We have done it. We have defeated the radicals who threatened our nation and the south, once again, is under the control of the Federals. We must now work on, quite literally, rebuilding these scarred lands."
 SCA_Repairing_Roads:0 "Repairing the Roads"
 SCA_Repairing_Roads_desc:0 "The south’s already poor road condition was not helped by the collapse. With the help of northern experts, we will work as fast as we can to make our roads finally up to standard."
 SCA_Rebuild_Georgia:0 "Rebuild Georgia"
 SCA_Rebuild_Georgia_desc:0 "Georgia has always been the heart of the south, both culturally and economically. The Reconstruction of Atlanta in particular is key to the whole region’s stability and prosperity."
 SCA_Rebuild_North_Carolina:0 "Rebuild North Carolina"
 SCA_Rebuild_North_Carolina_desc:0 "North Carolina is the link between north and south, and so the federal government is very interested in its speedy rebuilding process. With their help we will make our northern siblings a proud state of their own."
 SCA_Rebuild_Alabama:0 "Rebuild Alabama"
 SCA_Rebuild_Alabama_desc:0 "Alabama has always had a bad reputation for ignorance and poverty, but we can work on repairing that bad reputation. Investments into the region’s businesses and governments for a quality rebuilding process."
 SCA_Rebuild_Mississipi:0 "Rebuild Mississippi"
 SCA_Rebuild_Mississipi_desc:0 "Mississippi has been in a sorry state since before the war started, so much so that even other states are thankful for Mississippi or else they’d rank the worst of all 50 states. While we may not fully change this aspect of the state, we can certainly try and rebuild it to an at least pre-war level."
 SCA_Rebuild_Arkansas:0 "Rebuild Arkansas"
 SCA_Rebuild_Arkansas_desc:0 "Arkansas was one of the states to see the latest fighting in the war, and as such its wounds are much fresher than those of other states. But while the battles may still be fresh in people’s minds, we can start rebuilding this state much earlier than others in comparison."
 
 SCA_Arresting_Republicans:0 "Arresting Extremists"
 SCA_Arresting_Republicans_desc:0 "If it wasn’t for those fucking Trumpists and Klansmen and Panthers and Libertarians and Kanyeists, none of this would have happened! Arrest them all already!"
 SCA_Restoring_Order:0 "Restoring Order"
 SCA_Restoring_Order_desc:0 "Even with our enemies capitulating, guns have not gone silent. From guerrillas and bushwackers to simple thieves and looters, the average person would think one of Vermin’s Anarchists had won the war. This simply won't do."
 SCA_FRA_Weapons_Shipment:0 "Secure Weapons Shipments"
 SCA_FRA_Weapons_Shipment_desc:0 "Both to fight rebels and Trumpists in the future, we must make sure our northern siblings can send us all the equipment we might need in the future by simplifying bureaucracy and establishing direct links with military companies."
 SCA_Restoring_Our_Broken_Economy:0 "Restoring Our Broken Economy"
 SCA_Restoring_Our_Broken_Economy_desc:0 "The South’s economy was effectively deatomized by the war. From destroyed factories to burnt farms to collapsed offices. We must make sure people and businesses are safe and sound while rebuilding happens."
 SCA_Economic_Recovery:0 "Economic Recovery"
 SCA_Economic_Recovery_desc:0 "With rebuilding in full swing, we can already start to see the effects of this in our economy. The budget is balancing itself once again, poverty and inflation sharply decreased and employment rates rise dramatically."
 SCA_Reopen_Banks:0 "Reopen Banks"
 SCA_Reopen_Banks_desc:0 "Most banks were forced to close at the outbreak of war in the south, taking their money and expertise with them to safer shores. Now, we must invite them back to the south to do their business for the sake of our economy."
 SCA_Economic_Reform:0 "Reform the Financial System"
 SCA_Economic_Reform_desc:0 "The old Confederate financial system was riddled with loopholes and contradictions, making it hard for businesses to work here. We must take inspiration from the north’s financial system to make it more attractive for investors and entrepreneurs to work here."
 SCA_Beginning_A_Full_Recovery:0 "Beginning a Full Recovery"
 SCA_Beginning_A_Full_Recovery_desc:0 "Every day the quality of life increases. People move from the streets into homes and young people find jobs and leave their radicalism behind. This is the entire purpose of the Reconstruction Authority, and we are proud of the good work we’ve done here."
 
 SCA_Rebuilding_Factories:0 "Rebuilding Factories"
 SCA_Rebuilding_Factories_desc:0 "Our southern industry was ravaged both during the first months and during the Dixie collapse. Rebuilding and repairing factories will be a long process, but it is a needed step in the right direction."
 SCA_Restocking_Factories:0 "Restocking Factories"
 SCA_Restocking_Factories_desc:0 "For factories to be productive, they need raw materials to turn into products. We will work tirelessly to reestablish supply lines and trade with others to ensure a healthy supply of raw materials."
 SCA_FRA_Funds:0 "Secure Federalist Funding"
 SCA_FRA_Funds_desc:0 "With the south back in federal hands, we also need to restart federal funding to our states to begin rebuilding."
 SCA_Begin_Exporting_Cash_Crops_To_Biden:0 "Export Cash Crops to the Federalists"
 SCA_Begin_Exporting_Cash_Crops_To_Biden_desc:0 "The South is a considerably more fertile and rich region than the north east. Exporting cotton, sugar and tobacco to our northern friends is an easy way to fill our coffers."
 SCA_Restore_Order_In_Southern_States:0 "Order Restored in the South"
 SCA_Restore_Order_In_Southern_States_desc:0 "We have done it! The south is back and better than ever, but we must now face our future and the future of the country in relation to the Federalists."
 
 SCA_Annexation:0 "Annexation"
 SCA_Annexation_desc:0 "There is no other choice. Our job here is done and we must return into the Federalist fold to focus on the truly important threats."
 SCA_Joining_The_Faction:0 "Joining the Legitimists"
 SCA_Joining_The_Faction_desc:0 "The path forward is clear. We will remain a united Southern Reconstruction Zone and join the legitimists, for united we stand and divided we fall."
 SCA_Puppet:0 "The Second Reconstruction Period"
 SCA_Puppet_desc:0 "“Orders are in from DC. We are to dissolve the Southern Reconstruction Authority and create individual authorities over the states. This will ensure we do not fall to authoritarianism or become too overextended."
 
 SCA_Reindustrializing_The_South:0 "Reindustrializing the South"
 SCA_Reindustrializing_The_South_desc:0 "While rebuilding is mostly over by now, we can still work on our industry. We were never as industrial as the north, but we should invest into trying to match them for our own independence."
 
 SCA_governor_of_the_south:0 "Appoint a Military Governor"
 SCA_governor_of_the_south_desc:0 "To properly enforce our laws and maintain our rule throughout the south, we shall appoint military governors throughout the region to maintain a firm hand."
 SCA_uniting_the_south:0 "Uniting the South"
 SCA_uniting_the_south_desc:0 "With the internal situation relatively stable, we must turn our heads to the rest of the south. Many traitors still stand all around us, and this must not be allowed."
 SCA_seize_florida:0 "Seize Florida"
 SCA_seize_florida_desc:0 "Florida is Trump’s southern base, and a core part of the south. We must march forwards and strike before they are fully integrated into Trump’s traitorous faction."
 SCA_integrate_florida:0 "Integrate Florida"
 SCA_integrate_florida_desc:0 "With Florida now under our command, we will integrate their infrastructure and governance into our own and begin deprogramming the state of the horrors Trump’s spawn created here."
 SCA_seize_texas:0 "Seize Texas"
 SCA_seize_texas_desc:0 "To our west lies the Lone Star state. Once a part of the Confederacy, they are trying to play the neutrality card this time. Neutrality in this time is merely passive treason, and the Golden Rose shall be plucked from the soil."
 SCA_integrate_texas:0 "Integrate Texas"
 SCA_integrate_texas_desc:0 "The guns have fallen silent and the Texans failed to defeat our righteous army. Reconstruction groups are moving in and secessionist cells are being battled as we speak. Texas will be a proper state whether they want it or not."
 SCA_seize_virginia:0 "Return Virginia to the Fold"
 SCA_seize_virginia_desc:0 "Unfortunately, Virginia fell to it’s own internal problems. We shall take this worry off the government's back and take Virginia for ourselves."
 SCA_integrate_virginia:0 "Integrate Virginia"
 SCA_integrate_virginia_desc:0 "Once a traitor state, we believed Virginia to have learnt the error of their ways and become a loyal state. We were wrong, but we won't give them a third chance to betray us."
 SCA_seize_kentucky:0 "Seize Kentucky"
 SCA_seize_kentucky_desc:0 "To our north sits the insanity of the Coronel’s Kentucky. Fried chicken is a true southern delicacy and we will not allow it’s good name to be tarnished by this violent psychopath."
 SCA_integrate_kentucky:0 "Integrate Kentucky"
 SCA_integrate_kentucky_desc:0 "Kentucky fell quick and easy. The people greet us as liberators and integration is expected to be faster than in other states."
 
 SCA_holding_elections:0 "Holding Elections"
 SCA_holding_elections_desc:0 "What defines us if not our democracy? We will prepare elections at every level to be held in the near future for all of our Reconstruction Districts."
 SCA_expanding_reconstruction_districts:0 "Expanding Reconstruction Districts"
 SCA_expanding_reconstruction_districts_desc:0 "While all of Kanye’s old Confederacy is under federal rule now, many parts of the south are still far from our grasp. To truly finish reconstruction we must rectify this."
 SCA_march_into_florida:0 "March Into Florida"
 SCA_march_into_florida_desc:0 "Florida is a dangerous state right to the south of us. The upcoming battle will be difficult, but with our righteous fury we will be sure of our victory."
 SCA_military_district_florida:0 "Military District of Florida"
 SCA_military_district_florida_desc:0 "After the fall of Florida, we will expand the current district of West Florida into the rest of Florida and rename it accordingly."
 SCA_march_into_texas:0 "March Into Texas"
 SCA_march_into_texas_desc:0 "The Texans have a history of treason and rebellion, and so far they have gotten away with their most recent attempt at independence. We will march like Sherman once did and end their sedition, hopefully once and for all."
 SCA_military_district_texas_louisiana:0 "Military District of Texas-Louisiana"
 SCA_military_district_texas_louisiana_desc:0 "We will expand the district of Louisiana into Texas as a way to punish the western traitors. Let’s see how they like being merged with their eastern cousins."
 SCA_march_into_virginia:0 "March Into Virginia"
 SCA_march_into_virginia_desc:0 "Once a safe legitimist state, Virginia fell to internal problems just like the Confederacy did. We must not weep for too long as we must mobilize and take down the old traitor’s capital."
 SCA_military_district_greater_carolina:0 "Military District of Greater Carolina"
 SCA_military_district_greater_carolina_desc:0 "The states of North Carolina, South Carolina and Virginia are interesting for their positions regarding the rest of the south. More liberal than other southern states, with similar culture and values, it is a controversial but necessary step to unite all three states into a Greater Carolina."
 SCA_march_into_kentucky:0 "March Into Kentucky"
 SCA_march_into_kentucky_desc:0 "Kentucky is ruled by fascist traitors and corporationists. Our march north will be swift and righteous."
 SCA_military_district_appalachia:0 "Military District of Appalachia"
 SCA_military_district_appalachia_desc:0 "Taking their similar culture and history into account, we will expand the existing district of Appalachia into Kentucky’s old lands for the sake of simplicity for our bureaucrats."
 
 SCA_FRA_southern_reconstruction:0 "Southern Reconstruction"
 SCA_FRA_southern_reconstruction_desc:0 "Once again, the Union’s forces have defeated the Southern Armies, though this time it was our brave friends in South Carolina who took down this evil themselves. We now face the great challenge of a Second Reconstruction. Let’s ensure this one goes better than the first."
 SCA_FRA_strengthen_garrisons:0 "Strengthen the Garrisons"
 SCA_FRA_strengthen_garrisons_desc:0 "While the war itself is over, there is still a lot of resistance against our Reconstruction efforts. We will make sure our garrisons are strong enough to defend against Bushwhackers and Trump alike."
 SCA_FRA_the_legitimist_cause:0 "The Legitimist Cause"
 SCA_FRA_the_legitimist_cause_desc:0 "The Federal High Command is of course delighted with the news of our victory. Together with Southern commanders we will ensure we are absolutely ready for the final battle with Trump’s forces."
 SCA_FRA_joint_war_games:0 "Joint War Games"
 SCA_FRA_joint_war_games_desc:0 "Southern Troops and Generals have been through hell, and there is much they can show Northern troops to make them the best soldiers they can possibly be."
 SCA_FRA_recruitment_campaigns:0 "Recruitment Campaigns"
 SCA_FRA_recruitment_campaigns_desc:0 "No matter what Trump and his goons say, the Legitimist cause is righteous. Liberty and democracy is something worth fighting for. Do you want to know more?"
 SCA_FRA_dixie_and_the_yanks_united:0 "Dixie and the Yanks, United"
 SCA_FRA_dixie_and_the_yanks_united_desc:0 "The penalty of treason is death. No north no south. The Union forever."
 SCA_FRA_icrease_armaments_factories_subsidies:0 "Increase Armaments Factories Subsidies"
 SCA_FRA_icrease_armaments_factories_subsidies_desc:0 "Killing two birds with one stone, subsidizing weapons manufacturers will give us the necessary firepower to win the civil war, as well as provide valuable jobs to the South."
 SCA_FRA_expand_southern_airbases:0 "Expand Southern Airbases"
 SCA_FRA_expand_southern_airbases_desc:0 "Most generals agree, the south will be vital in the upcoming war. We must ensure local airbases are up to our standards to make use of our superior airforce as effectively as possible over the Southern skies."
 SCA_FRA_reopen_dockyards:0 "Reopen Dockyards"
 SCA_FRA_reopen_dockyards_desc:0 "The South has an immense coastline, ripe for rebuilding our fleet. While some point out that the war against Trump will be almost entirely land based, we must ensure we are not caught off guard at sea."
 SCA_FRA_expand_fuel_reserves:0 "Secure Fuel Reserves"
 SCA_FRA_expand_fuel_reserves_desc:0 "Napoleon once said an army marches on its stomach. Our modern horse's stomachs are filled by one thing: Oil. We must create a strategic oil reserve to ensure we don’t end up like Napoleon himself."
 SCA_FRA_joint_weapons_development:0 "Joint Weapons Development"
 SCA_FRA_joint_weapons_development_desc:0 "The South is full of brilliant minds and capable facilities. Using these to develop the best armament possible for our troops is an obvious solution we take advantage of as quickly as possible."
 SCA_FRA_special_research_division:0 "Special Research Division"
 SCA_FRA_special_research_division_desc:0 "The 21st century army develops quickly, with new technologies being tested almost daily on the American battlefield. By pooling our resources into a determined research division we can ensure we are at the absolute edge of military tech."
 SCA_FRA_modern_warfare:0 "Modern Warfare"
 SCA_FRA_modern_warfare_desc:0 "The Second American Civil War is perhaps the most complex military conflict in history. Never before have armies using the same equipment and on such a large scale fought each other. This never before seen advanced warfare requires adaptability and brilliant minds to win."
 SCA_FRA_research_group:0 "The Southern Research Sharing Group"
 SCA_FRA_research_group_desc:0 "Long have people considered southerners dumb and backwards. No more. The brilliant minds of the South will help the Federalists win this war in collaboration with their Northern colleagues."
 SCA_FRA_developing_the_south:0 "Developing the South"
 SCA_FRA_developing_the_south_desc:0 "Unfortunately, the South has never been known as the industrial heartland of our nation. While this might not be changed, we will certainly try to boost it’s currently lacking industrial base."
 SCA_FRA_developing_the_carolinas:0 "Developing the Carolinas"
 SCA_FRA_developing_the_carolinas_desc:0 "North and South Carolina are states with long histories, being among the original 13 all the way back  in 1776. It’s a shame they have gradually lost importance as the nation grew, but now we have the chance to give these venerable states some of the respect they deserve."
 SCA_FRA_integrate_infrastructure:0 "Integrate Infrastructure"
 SCA_FRA_integrate_infrastructure_desc:0 "A good way to improve both of the Carolinas economies is to further integrate both states, starting with their infrastructure. This will improve supply lines and generally make life easier for everyone."
 SCA_FRA_attract_investors_to_carolina:0 "Attracting Investors"
 SCA_FRA_attract_investors_to_carolina_desc:0 "The Carolinas are prime real estate for investments, from the cities of Charlotte, Augusta and Raleigh to the ports of Charleston and Wilmington, we will make sure Carolina is the word on every business owner’s mind."
 SCA_FRA_carolina_unification:0 "Unite the Carolinas"
 SCA_FRA_carolina_unification_desc:0 "With all our work done so far, it is time we take the final step. Uniting the Carolinas is a clear solution to creating a stronger state. While this may prove controversial to some of the locals, the benefit both to the nation in large and their own economy is undeniable."
 SCA_FRA_developing_the_south_atlantic:0 "Developing the South Atlantic"
 SCA_FRA_developing_the_south_atlantic_desc:0 "Ah, Georgia. The Heart of the South, culturally, politically and economically. Unfortunately, it has been one of the states hit the hardest by the war. Investing into its development is a clear step into winning the war as a whole."
 SCA_FRA_reopen_georgia_tech:0 "Reopen Georgia Tech"
 SCA_FRA_reopen_georgia_tech_desc:0 "The Georgia Institute of Technology is one of the South’s premier higher learning faculties. Though it was forced to close during the war like a lot of our learning institutions, the recent stability has allowed the institution to finally reopen. This will provide a great boon to our future research capabilities."
 SCA_FRA_reopen_major_ports:0 "Reopen Major Ports"
 SCA_FRA_reopen_major_ports_desc:0 "Savannah and other port cities in the south were left to rot during the civil war, with the Confederates finding few people to trade with. With our global connections, these facilities will finally return to their full potential."
 SCA_FRA_develop_metro_areas:0 "Develop Metro Areas"
 SCA_FRA_develop_metro_areas_desc:0 "Before the war, Atlanta was one of the greatest cities in our nation. Now, it’s people lay on the streets, sheltering under the rubble of their homes and workplaces. This same story has happened again and again throughout the south. Let us do all in our power to save these metropolises and they will pay us back in kind, rebuilding their industries and economy."
 SCA_FRA_the_southern_manufacturing_boom:0 "The Southern Manufacturing Boom"
 SCA_FRA_the_southern_manufacturing_boom_desc:0 "We have done it. Through generous investments and a lot of work, the South has finally started seeing some real growth. This industry will help not only the people of the region, but of our entire republic."
 SCA_FRA_developing_the_mississippi:0 "Developing the Mississippi"
 SCA_FRA_developing_the_mississippi_desc:0 "“For a long time, the States of Mississippi, Louisiana, Arkansas and Alabama have been some of the poorest in the nation, and the civil war has not helped at all. With some investment and hard work, we can finally help out the people in these states."
 SCA_FRA_expand_gulf_trade:0 "Expand Gulf Trade"
 SCA_FRA_expand_gulf_trade_desc:0 "While Mexico and the Caribbean states fell into chaos much like our own nation, the gulf is still full with trade opportunities. From Central America to the north of South America, increasing trade in the Gulf will be a major boost to the entire region."
 SCA_FRA_invest_in_cashcrop_production:0 "Invest in Cash Crop Production"
 SCA_FRA_invest_in_cashcrop_production_desc:0 "No, we’re not doing that again. But the point still stands, the south is in a prime location for growing cash crops like sugar and tobacco which have been scarce since the start of the civil war, and if they’re successful enough, exportation is a very real possibility."
 SCA_FRA_poverty_relief_aid:0 "Poverty Relief Aid"
 SCA_FRA_poverty_relief_aid_desc:0 "The Mississippi delta has constantly been one of our poorer regions, with even other southern states mocking Mississippi since at least they’re doing better than it. While not a perfect solution, poverty relief should help improve the quality of life in this region."
 SCA_FRA_modernize_rural_infrastructure:0 "Modernize Rural Infrastructure"
 SCA_FRA_modernize_rural_infrastructure_desc:0 "One of the main reasons for the South’s poverty is its crumbling infrastructure. Decades of neglect and corruption have left the infrastructure to rot. By rebuilding it we will improve the lives of the locals as well as allowing for more economic activity in the region, benefitting us all."
 SCA_FRA_developing_appalachia:0 "Developing Appalachia"
 SCA_FRA_developing_appalachia_desc:0 "Maybe the region most forgotten in the entire nation, Appalachia has been in a tough spot ever since coal was abandoned for oil. However, the region still has a lot to offer the nation, and we will make sure to use it to its fullest potential."
 SCA_FRA_exploit_natural_resources:0 "Exploit Natural Resources"
 SCA_FRA_exploit_natural_resources_desc:0 "Appalachia’s old mountains are rich in mineral wealth the nation can still use. Investing into the extractive industry will really help out the local economy."
 SCA_FRA_reviving_the_automotive_industry:0 "Reviving the Automotive Industry"
 SCA_FRA_reviving_the_automotive_industry_desc:0 "Ever since the civil war began, trade with China, Japan and other car manufacturers has become near impossible, and as such there’s a golden opportunity to revive the old car industry, and what better place to start than old Appalachia."
 SCA_FRA_increase_energy_output:0 "Increase Energy Output"
 SCA_FRA_increase_energy_output_desc:0 "Even during Roosevelt’s time, Tennessee and Appalachia’s hydrological resources were exploited by the TVA to power the region. With proper investment and modernizing the infrastructure, the region can provide a great boost to not only the regions but the entire nation's energy grids."
 
 SCA_rural_folk_education:0 "Expand Rural Education"
 SCA_rural_folk_education_desc:0 "The south’s backwards and stupid image comes mostly from the poor education in rural regions. Investing into new and improved schools in poorer areas will drastically increase their quality of life and trust in the government."
 SCA_hurricane_proofing:0 "Hurricane Proofing"
 SCA_hurricane_proofing_desc:0 "Our lands are sadly regular victims of Hurricanes. While not as bad as our Floridian neighbors, god bless em, we are still at risk. Hurricane-proofing important government centers and businesses will make us take the hit better."
 SCA_restore_public_trust:0 "Restore Public Trust"
 SCA_restore_public_trust_desc:0 "One of the reasons the south felt abandoned and prone to radicalism was a corrupt and lying government. With our hard work, public trust in the government is finally high once again."
 SCA_expand_civil_engineering:0 "Expand Civil Engineering"
 SCA_expand_civil_engineering_desc:0 "We must invest into engineering programs and grants to speed up the rebuilding process and create a brighter future for the south."
 SCA_update_school_standards:0 "Update School Standards"
 SCA_update_school_standards_desc:0 "Education is the key to the future of any nation. We will make sure southern schools are up to date with federal standards and curriculums."
 SCA_update_training_standards:0 "Update Training Standards"
 SCA_update_training_standards_desc:0 "With the advance of military technology, we must make sure our plans and doctrines are top of the line as well."
 SCA_expand_the_military_industrial_complex:0 "Expand the Military Industrial Complex"
 SCA_expand_the_military_industrial_complex_desc:0 "We must prioritize military industry if we wish to destroy Trump and the rest of the traitors. A healthy injection of capital should be good enough for now."
 
 SCA_an_iron_fist_in_the_south:0 "An Iron Fist in the South"
 SCA_an_iron_fist_in_the_south_desc:0 "The traitors must never be allowed to hold power in the south again. We learnt from the first reconstruction that any lighter hand will inevitably result in their gain of power once again. It won't be allowed this time."
 SCA_reintroduce_mandatory_enlistment:0 "Reintroduce Mandatory Enlistment"
 SCA_reintroduce_mandatory_enlistment_desc:0 "While the southern traitors were defeated, millions of traitors still stand in our west. From Trump to the Communists and Nazis, we must have as many men as needed in our army at all times to be ready for an inevitable war."
 SCA_subvert_the_fra:0 "Subvert the [FRA.GetName]"
 SCA_subvert_the_fra_desc:0 "Our Northern allies, while friendly, are soft handed in their approach to traitors. We must softly guide them towards less self-destructive policies."
 SCA_expanding_surveillance:0 "Expanding the Surveillance System"
 SCA_expanding_surveillance_desc:0 "Traitors and subversives hide among us. We must develop new ways of keeping an eye on our people and root out traitors whenever we find them. From more cameras, AI ran surveillance and stricter border controls, every weapon must be used in this secret war."
 SCA_isolate_the_legislature:0 "Isolate the Legislature"
 SCA_isolate_the_legislature_desc:0 "To maintain the primacy of the armed forces over the southern reconstruction zone we must keep a tight leash on the legislature’s powers. Some accuse us of subverting democracy, but we are maintaining the systems needed for a democracy alive in the first place."
 SCA_suspend_the_bill_of_rights:0 "Suspend the Bill of Rights"
 SCA_suspend_the_bill_of_rights_desc:0 "While an exceptional document, the Bill of Rights is flawed, for it did not anticipate it being used for treasonous purposes. Suspending some of its amendments is a sadly necessary measure we must take."
 SCA_protect_our_citizens_first:0 "Protecting the Citizens First"
 SCA_protect_our_citizens_first_desc:0 "Some among our cabinet propose we suspend rights? Are they mad? The thing that separates us from the traitors is our respect for the constitution and its greatness. By suspending even a single right, we become no better than the traitors we face."
 SCA_expedite_judicial_processes:0 "Expedite Judicial Processes"
 SCA_expedite_judicial_processes_desc:0 "The amount of traitors clogging our justice system is truly staggering. We shall alter judicial processes to make them faster and simpler for us to show justice to all, may they be traitors or not."
 SCA_purge_the_extremists_and_populists:0 "Purge the Extremists and Populists"
 SCA_purge_the_extremists_and_populists_desc:0 "Despite our best efforts, there still exist Communists, Fascists and Trumpists within our lands. We must redouble our efforts, infiltrate their organizations and do all possible to destroy them once and for all."
 SCA_do_what_the_first_reconstruction_couldnt:0 "Doing What the First Reconstruction Couldn't"
 SCA_do_what_the_first_reconstruction_couldnt_desc:0 "We have managed to purge extremism from the south. Racial violence, terrorism, these are all things of the past under our rule, and we intend for it to last."
 SCA_supervised_democracy:0 "A Managed Democracy"
 SCA_supervised_democracy_desc:0 "We must ensure that while democracy returns to our lands, it is a democracy where radical populism isn’t allowed. Far right and left candidates are banned, conservatives are tightly watched, and subversive rallies are broken up. It is all for the Union."
 SCA_permanent_constitutional_suspension:0 "Permanently Suspend the Constitution"
 SCA_permanent_constitutional_suspension_desc:0 "They just never learn, do they? They see traitors and vote them in. They celebrate lynchings and militias. What more does it take? They want us to do it, don’t they? They think we’re bluffing? Fine, they’re about to get what they fucking deserve."
 SCA_a_solid_blue_south_reforged:0 "A Solid Blue South Reforged"
 SCA_a_solid_blue_south_reforged_desc:0 "For almost a century, the south was an undefeatable Democratic wall. While this changed after the Civil Rights Act was signed, we have returned the south to it’s natural ruling party"
 
 
 SCA_organizing_reconstruction:0 "Organizing Reconstruction"
 SCA_organizing_reconstruction_desc:0 "This Second Reconstruction will be just as difficult if not more than the first one. We must balance this act carefully lest we join our predecessors in failure."
 SCA_political_amnesty:0 "Political Amnesty"
 SCA_political_amnesty_desc:0 "“Ever since the 60s, the GOP has been the dominant force in the south. We cannot call ourselves democratic if the party most people voted for isn’t allowed to participate? We will meet Republican leaders and carry out a deal ensuring their loyalty in exchange for participation in elections."
 SCA_ban_the_gop:0 "Ban the GOP"
 SCA_ban_the_gop_desc:0 "It’s due to the Republicans' cultish devotion to Trump that this war even started in the first place! While it may be unpopular, eventually history will prove this was the right move for long term progress and stability."
 SCA_work_with_southern_leaders:0 "Work With Southern Leaders"
 SCA_work_with_southern_leaders_desc:0 "While it’s true that many administrators worked with Kanye’s confederacy, we must come to terms with the fact they are needed to run the Reconstruction Districts. We will work out a deal to ensure their loyalty."
 SCA_strip_citizenship_from_traitors:0 "Strip Citizenship From Traitors"
 SCA_strip_citizenship_from_traitors_desc:0 "They didn’t want to be part of America? Fine, they won’t be Americans anymore. If they worked for the Confederate government, they won’t be able to vote, serve or receive social security. We’ll call in help from the north to replace the traitors."
 SCA_suspend_the_second_amendment:0 "Suspend the Second Amendment"
 SCA_suspend_the_second_amendment_desc:0 "The second amendment is a threat to our overall stability. Enemy militias and insurgents have too easy a time to find weapons to use against us. However, now we will keep them on a much tighter leash."
 SCA_incorporate_militia_in_military:0 "Incorporate Militia in Military"
 SCA_incorporate_militia_in_military_desc:0 "Most of our soldiers during the civil war were part of militias, many of which didn’t disband after the war. We will work with these veterans to fully integrate them into our armed forces and bring their weapons and experience with us."
 SCA_ban_hate_speech:0 "Ban Hate Speech"
 SCA_ban_hate_speech_desc:0 "Racism and violence were one of the key reasons the whole civil war began in the first place. By criminalizing verbal or written violence targeting someone’s race, culture or sex, we can prevent violent groups from forming in the first place."
 SCA_ensure_right_to_discourse:0 "Ensure the Right to Discourse"
 SCA_ensure_right_to_discourse_desc:0 "We must not restrict the first amendment, no matter how much we disagree with our rivals. Discourse is the basis of a healthy democracy after all."
 SCA_rehabilitation:0 "Rehabilitation"
 SCA_rehabilitation_desc:0 "We must give people second chances. Making the mistake of joining radicals during the civil war shouldn't be a lifetime ban from the political machine. People can grow and be better if we give them the chance."
 SCA_monitoring_elections:0 "Monitored Elections"
 SCA_monitoring_elections_desc:0 "While democracy is a beautiful thing, it is easy to corrupt. We will ban radicals and previous confederate or radical supporters from running and prevent any kind of voter suppression and electoral interference."
 SCA_garrison_question:0 "The Garrison Question"
 SCA_garrison_question_desc:0 "Now that a good amount of time has passed, people are once again asking for the need for continued federal garrisons in the south. Whether to keep them, send them off or even expand them might be one of our most consequential choices."
 SCA_same_old_south_dot_dot_dot:0 "The South Never Changes..."
 SCA_same_old_south_dot_dot_dot_desc:0 "Once again, it seems reconstruction failed to live up to it’s goals. Many radicals were pardoned, Trumpists hold office and while the average person has it better than a couple years ago, many wonder if anything has really changed since 2015."
 SCA_steady_as_she_goes:0 "Continue the Status-Quo"
 SCA_steady_as_she_goes_desc:0 "Moderation has prevailed and while the second reconstruction succeeded in wiping most dangerous influences from radicals and violence in the region, a lot of compromises had to be made and many will question the true success of reconstruction in the future."
 SCA_permanent_reconstruction:0 "A Permanent Reconstruction"
 SCA_permanent_reconstruction_desc:0 "We have taken the radical choice and declared reconstruction to be permanent for the south. Generations will be needed to fully wipe the remnants of Confederatism and Trumpism from the region, but we are confident we will be able to do it, and when the day finally comes, it will be the dawn of a wholly new age."
 SCA_on_the_right_side_of_history:0 "On the Right Side of History"
 SCA_on_the_right_side_of_history_desc:0 "Previously, the south has constantly been wrong. From slavery, to civil rights, education and religious fanaticism. Now however, we can build a new future for the whole south. One based on tolerance and freedom, not hate and division."
 
 SCA_the_next_step:0 "The Next Step"
 SCA_the_next_step_desc:0 "Now that the south is united under the Legitimist Banner, the next phase in the reunification of America can commence."
 SCA_await_the_call:0 "Awaiting the Call"
 SCA_await_the_call_desc:0 "Our job is done for now, we must now wait for the [FRA.GetName] to request our assistance in their war."
 SCA_conduct_army_reforms:0 "Conduct Army Reforms"
 SCA_conduct_army_reforms_desc:0 "The army shouldn't just sit around and do nothing while we wait! We can always better ourselves and make sure our army is ready to fight."
 SCA_a_different_red_scare:0 "A Different Red Scare"
 SCA_a_different_red_scare_desc:0 "To ensure the people are motivated to fight, we must remind them of the terrible conditions they were under during GOP and GOP-adjacent control of the south."
 SCA_inherit_the_legitimists:0 "Inherit the Legitimists"
 SCA_inherit_the_legitimists_desc:0 "Now that the [FRA.GetName] has capitulated, we remain as one of the last bastions of legitimism in the former United States."
 SCA_a_change_in_course:0 "A Change in Course"
 SCA_a_change_in_course_desc:0 "Recent developments in the [FRA.GetName] are worrying to say the least, and no longer align with our vision."
 SCA_there_can_only_be_one:0 "There Can Only Be One"
 SCA_there_can_only_be_one_desc:0 "There can't be 2 leaders of the Legitimist forces of the former United States! Only one can remain, and we are the true bastion of Legitimism."
 SCA_dominate_the_rustbelt:0 "Dominate the Rustbelt"
 SCA_dominate_the_rustbelt_desc:0 "The Rustbelt slipped from our grasp during the initial stages of the collapse. However, we return to the fold now."
 SCA_reach_out_to_milley:0 "Reach Out to Milley"
 SCA_reach_out_to_milley_desc:0 "Marshal Milley and his 'Ice Legion' in Minnesota share similar views with us. Perhaps it would be better to cooperate rather than fight each other."
 SCA_sweep_the_great_lakes:0 "Sweep the Great Lakes"
 SCA_sweep_the_great_lakes_desc:0 "The Great Lakes are one of the final areas in the East that are not under our control. We will fix that oversight."
 SCA_pushing_out_west_rockies:0 "Push Through the Rockies"
 SCA_pushing_out_west_rockies_desc:0 "Now that the major threats in the East Coast and the Midwest have been dealt with, we can turn our attention west."
 SCA_rush_the_coast:0 "Retake the West Coast"
 SCA_rush_the_coast_desc:0 "Taken advantage of by populists and warlords, the West Coast used to be a stronghold for those who shared our views. We must return it to its former glorious state."
 SCA_alaska_and_hawaii_situation:0 "Send Ultimatums to Alaska and Hawaii"
 SCA_alaska_and_hawaii_situation_desc:0 "The final 2 states that we have not been able to take control of are Alaska and Hawaii. It is now time to finish this and reclaim the mantle of the United States once and for all."
 SCA_the_reconstruction_zone_of_america:0 "The Reconstruction Zone of America"
 SCA_the_reconstruction_zone_of_america_desc:0 "We have finally done it, America has been reunified. There will be a lot of work to do in the future, and we can only hope for a speedy reconstruction period."
 
 SCA_consolidate_the_military_government:0 "Consolidate the Military Government"
 SCA_consolidate_the_military_government_desc:0 "Now that we are no longer subordinate to the [FRA.GetName], a few changes are in order."
 SCA_drop_the_facade:0 "Drop the Facade"
 SCA_drop_the_facade_desc:0 "Aligning with the [FRA.GetName] was just a means to an end, and now that the south has been reunified, we can show our true colors."
 SCA_a_new_military_constitution:0 "A New Military Constitution"
 SCA_a_new_military_constitution_desc:0 "The current constitution has been... restricting to say the least. Time to remove the shackles of accountability and ensure our control."
 SCA_enemy_citizens_are_traitors:0 "Enemy Citizens are Traitors"
 SCA_enemy_citizens_are_traitors_desc:0 "Any enemy citizen is a traitor, and should be treated as such. They either defect to our cause, or need to be reeducated..."
 
 
 
 
