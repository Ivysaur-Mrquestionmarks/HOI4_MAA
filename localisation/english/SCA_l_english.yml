 # SCA War tree
 SCA_The_National_Army_of_South_Carolina:0 "The National Army of South Carolina"
 SCA_The_National_Army_of_South_Carolina_desc:0 "We are now an independent state, and so our current National Guard should be expanded and altered to meet our new needs."
 SCA_McCarty_and_the_Army_of_South_Carolina:0 "McCarty and the Army of South Carolina"
 SCA_McCarty_and_the_Army_of_South_Carolina_desc:0 "General Roy Van McCarthy has left retirement to serve his state and nation one more time. As a very respected and capable military figure, he shall serve as our primary general and help us turn this army into a force to be reckoned with."
 SCA_Whipping_this_rag_tag_army_into_shape:0 "Whipping This Rag-Tag Army Into Shape"
 SCA_Whipping_this_rag_tag_army_into_shape_desc:0 "Currently, our army is mostly comprised of militias and some old national guardsmen, just like most armies in this war. But we must be better, use our experienced commanders as the basis of a new training program to make sure we have the finest, bravest soldiers the south has ever seen."
 SCA_Learning_from_Civil_War_campaigns:0 "Learning from Civil War Campaigns"
 SCA_Learning_from_Civil_War_campaigns_desc:0 "Another great war was once fought here in the south. While in that war our state was the first of the traitors, we have learnt our lesson and are fighting for the right side of history this time. We must look to the past and understand that war’s failures and successes and evolve from them to become a more effective fighting force."
 SCA_McCartys_March_South:0 "McCarty's March South"
 SCA_McCartys_March_South_desc:0 "We will embody the spirit of Sherman, we will march unshakenly and with justice as our banner, liberty as our weapon and freedom as our battlecry. We will restore the Union by any and all means necessary. The penalty of treason is death."
 SCA_securing_south_carolina:0 "Secure South Carolina"
 SCA_securing_south_carolina_desc:0 "We must make sure Confederate loyalists are fully routed from our state. We will use existing government infrastructure and experience to make South Carolina a truly safe and loyal state."
 SCA_solidify_northern_control_south_carolina:0 "Solidify Northern Control"
 SCA_solidify_northern_control_south_carolina_desc:0 "North and South Carolinians have never gotten along well, but in trying times such as these we must put our differences aside. Before the war, North Carolina was one of the few competitive southern states, and we will use that liberal history to our advantage to reinforce our control over the region."
 SCA_request_legitimist_economic_support:0 "Request Legitimist Economic Support"
 SCA_request_legitimist_economic_support_desc:0 "Everyone in the country understands how important the current war in the south is. We need to ensure our northern benefactors support us to their full capabilities, even though we may have to offer favors and concessions to them."
 
 
