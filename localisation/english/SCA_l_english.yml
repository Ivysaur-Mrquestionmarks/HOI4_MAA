 south_carolina.10.d:0 "What a wild ride it has been. From a small rebellion in South Carolina to reuniting the United States, you definitely accomplished a lot. I really hope you had fun and enjoyed your time playing.\n\nP.S. Were you able to find the secret path?"
 south_carolina.10.a:0 "Thanks for Playing!"
 
