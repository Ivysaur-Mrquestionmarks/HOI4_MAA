l_english:
#Focuses

#Starting Tree

 LAS_declare_new_vegas:0 "Declare New Vegas"
 LAS_declare_new_vegas_desc:0 "After so many trials and tribulations, we've achieved our greatest goals. Goodbye Las Vegas, and hello New Vegas!"
 
 LAS_the_meeting:0 "The Meeting"
 LAS_the_meeting_desc:0 "Alright, now that it's done, let's get these clowns off the streets. They did their thing, and their job is now finished."
 
 LAS_get_real_allies:0 "Get Real Allies"
 LAS_get_real_allies_desc:0 "It is clear now we can't keep trusting these guys, but we also can't just rule the whole city by ourselves. We need collaborators we can trust and who most importantly, won't get in our way."
 
 LAS_sabotage_the_nerds:0 "Sabotage the Nerds"
 LAS_sabotage_the_nerds_desc:0 "These gamers really think they can beat us? We hold all the cards, we play chess while they try to play Uno, they're not a threat. Still, it's best to try and get them off the board as soon as possible. They're bad for business after all."
 
 LAS_break_their_knees:0 "Break their knees"
 LAS_break_their_knees_desc:0 "What do they know about actual violence? What do they know about what it takes to rule and control people? Who the hell do they think they are? They want to play a game? Fine, let's show them what our new friends know about playing it."
 
 LAS_showdown_at_wynn_casino:0 "Showdown at the Wynn Casino"
 LAS_showdown_at_wynn_casino_desc:0 "Wynn and his mob allies have utterly failed to curtail the New Vegas Militias. Now the courier, will attempt to cheat fate once again, and prove the House too, can lose."
 
 LAS_render_unto_courier:0 "Render unto Courier"
 LAS_render_unto_courier_desc:0 "And so the Courier, who had cheated fate once in the Las Vegas City Hall, cheated fate once again, and the Mojave was forever changed."
 
 LAS_take_control_of_strip:0 "Taking control of The Strip"
 LAS_take_control_of_strip_desc:0 "The Gem of the Mojave is now in our hands, and we finally find ourselves in a position to make real change, but we must stabilize the region before anything else can happen."
 
 LAS_reward_the_army:0 "Rewarding our Army"
 LAS_reward_the_army_desc:0 "We must not forget, it was only thanks to our brave soldiers that we were able to secure our victory in New Vegas. They have all earned a great reward for their service and bravery."
 
 LAS_cement_our_rule:0 "Cement our Rule"
 LAS_cement_our_rule_desc:0 "Unfortunately, being a product of a countercoup is not great for our image as a truly stable nation. We'll work to make sure our people recognize us as legitimate."
 
 LAS_new_vegas_secured:0 "New Vegas Secured"
 LAS_new_vegas_secured_desc:0 "At long last, we have no other rivals in the city capable of threatening our rule. We can finally begin remodeling the city into the true New Vegas."
 
 LAS_seize_casinos:0 "Seize the Casinos"
 LAS_seize_casinos_desc:0 "The casinos, the backbone of Vegas economy, have long overstepped their role in the city, acting as kingmakers at best and like kings themselves at worst, and not the good type of Kings. As punishment, we shall nationalize their casinos, using them to propel our city forwards rather than letting them hoard their wealth."
 
 LAS_fight_crime:0 "Fighting Crime"
 LAS_fight_crime_desc:0 "The Mob, an iconic part of Old Vegas, threw in their hat with Wynn and his cronies. While weakened, both them and many other criminals, from looters to murderers, now run rampant in our city. We must find them and ensure proper justice is served upon them."
 
 LAS_restore_order:0 "Restoring Order"
 LAS_restore_order_desc:0 "We will ensure the city of New Vegas is orderly and peaceful. Our citizens have long lived in fear of violence, from the civil war around us to the coups that have taken place recently, but no more shall they be prisoners of fear. They will be free to live in a proper, orderly nation once again."
 
 LAS_win_hearts_and_minds:0 "Hearts and Minds"
 LAS_win_hearts_and_minds_desc:0 "Where Wynn and his mob allies offered fear, we offer compassion and friendliness. We will be charitable with the people of New Vegas, unlike the greedy Wynn and his cronys."
 
 LAS_rebuild_postal_service:0 "Rebuilding the Postal Service"
 LAS_rebuild_postal_service_desc:0 "An often undervalued aspect of old America was its postal system. A well-oiled, coordinated system that more often than not worked incredibly well. Sadly, with America's death, so too died the Postal system, but we can rebuild it. The new Mojave Express will serve our nation and its people cheaply, efficiently and safely."
 
 LAS_make_oct_23_a_national_holiday:0 "Make October 23rd a National Holiday"
 LAS_make_oct_23_a_national_holiday_desc:0 "There is one reason above all else we are where we are today, Fallout: New Vegas. The inspiration for our soldiers and our leaders, the standard of hope for the people, it was all possible thanks to this little game. To commemorate it, we will officially make October 23rd, the date the bombs dropped in 2077, New Vegas Day, to always commemorate the game that got us all here."
 
 LAS_our_direction:0 "Our Direction"
 LAS_our_direction_desc:0 "The streets are safe. Crime has been contained. The people are happy. Now, we will once again look towards our courier for a path forwards."
 
 #NCR Path
 
 LAS_for_the_republic:0 "For the Republic"
 LAS_for_the_republic_desc:0 "Eureka!"
 
 LAS_building_a_government:0 "Building a Government"
 LAS_building_a_government_desc:0 "If we want to become an actual nation and not just a glorified militia we have to do some serious government-building. We must begin working on creating a proper, functioning, body of government for the sake of our people and country."
 
 LAS_establish_an_executive_branch:0 "Establish an Executive Branch"
 LAS_establish_an_executive_branch_desc:0 "Our nation's executive branch shall be a council headed by the Courier, with a cabinet appointed by him. He and his cabinet will make decisions on national matters and overall make the best decisions possible for our nation."
 
 LAS_establish_a_legislative_branch:0 "Establish Legislative Branch"
 LAS_establish_a_legislative_branch_desc:0 "The republic's legislative branch shall be a unicameral legislature, known as The Senate, and it will be in charge of passing laws, approving presidential appointments to the executive council, and advising and even blocking the Executive branch in accordance with the law. Each member of the Senate will be directly elected by their constituents, and will uphold our democratic values."
 
 LAS_establish_a_judicial_branch:0 "Establish a Judicial Branch"
 LAS_establish_a_judicial_branch_desc:0 "Our nation's new Judicial branch will be in charge of dealing out the law to our people, in a fair and equal manner. With local, state, and federal courts with a Supreme Court to uphold the constitution and be the final say in all legal matters, every citizen will have a free and fair judicial system upholding their rights. By empowering our courts, we can ensure no one is above the law and people don't go around taking justice into their own hands."
 
 LAS_build_departments:0 "Build up Departments"
 LAS_build_departments_desc:0 "Apart from the three main branches of government, our nation will need dedicated Departments for administrating the minutiae of governmental work, from scientific research to land management, foreign relations, infrastructure, and anything else a real country needs to function."
 
 LAS_appoint_judges:0 "Appointing Judges"
 LAS_appoint_judges_desc:0 "Unfortunately, our new judicial branch is currently lacking in judges to staff it, and since our nation as a whole lacks many judges as is, we'll have to appoint and train lawyers and anyone else with legal experience to the positions we desperately need."
 
 LAS_send_an_ambassador_to_bidone:0 "Send an Ambassador to [FRA.GetName]"
 LAS_send_an_ambassador_to_bidone_desc:0 "To our east, the [FRA.GetName] is clearly the most legitimate successor to the United States of old, and it embodies the democratic ideals of the New California Republic. We will try to be friendly with them, and hopefully acquire their support for our cause."
 
 LAS_build_election_infrastructure:0 "Build Election Infrastructure"
 LAS_build_election_infrastructure_desc:0 "We can't simply declare an election season open and wing it from there. No, we must establish legal and also physical infrastructure to ensure our democratic system in the future. From determining polling places, campaigning regulations, regulating political advertisements and donations, it will take some time before everything is in place for our first proper elections."
 
 LAS_rebuild_government_services:0 "Rebuild Government Services"
 LAS_rebuild_government_services_desc:0 "Ever since the collapse of the United States, the people of Vegas haven't really seen proper government services, until now. We still have work to do, but trust in the government is at an all time high, and we must work to deliver even more for our people."
 
 LAS_governance_restored:0 "Governance Restored"
 LAS_governance_restored_desc:0 "We finally have a true, functional, and soon to be democratic government in place here in New Vegas. Even when faced with challenges and threats, the people have risen up to the task and beaten these challenges to the ground. Our nation and our people are excited and at long last, hopeful for the future."
 
 LAS_reach_out_to_the_legitimists:0 "Reach out To the Legitimists"
 LAS_reach_out_to_the_legitimists_desc:0 "The Legitimists in Washington are of course, the rightful American government. If we hope for both legitimacy and support, we must reach out to them for help."
 
 LAS_plan_the_mojave_campaign:0 "Plan the Mojave campaign"
 LAS_plan_the_mojave_campaign_desc:0 "To our east lie the great deserts of the American Southwest. Sadly, they are ravaged by violence and chaos. We must go forth and free their people from fear and violence in the name of liberty and democracy."

 LAS_plan_elections:0 "Planning the Elections"
 LAS_plan_elections_desc:0 "We must start organizing and readying the nation for our elections. Defining polling places and speech and debate days is important to ready our nation for this momentous day."

 LAS_liberate_the_mojave:0 "Liberate the Mojave"
 LAS_liberate_the_mojave_desc:0 "Today, we are the waves of the Pacific, pushing ever eastwards. We are the sequoias rising from the Sierra Nevada, defiant and enduring. We must now go, and liberate the people who call the Mojave home."

 LAS_election_ncr:0 "Election Day!"
 LAS_election_ncr_desc:0 "At long last, we can fulfill our democratic promises to the people of New Vegas."

 LAS_question_non_aggro_pact_pra:0 "Non-Aggression Pact with the [PRA.GetName]?"
 LAS_question_non_aggro_pact_pra_desc:0 "To our west, the [PRA.GetName] are clearly our greatest threat and could probably march into New Vegas with little we could do to stop them. By ensuring a mutual non aggression treaty, we can focus on our true threats without constantly worrying about our backside being attacked, but it might still prove an unpopular move with those who wish to reclaim California itself first and foremost."

 LAS_victory_new_vegas_party:0 "Victory of the New Vegas Party"
 LAS_victory_new_vegas_party_desc:0 "The New Vegas Party has won the election! Running a campaign based on reclaiming the lands of the Republic and strengthening our nation. With their victory at the ballot box, now comes the hard part, achieving victory in the battlefield."

 LAS_victory_independence_party:0 "Victory of the Independence Party"
 LAS_victory_independence_party_desc:0 "The Independence Party has won the elections! With a campaign focused on declaring true independence from the rest of the country and ensuring neutrality and peace in the greater civil war, it easily won over the war-weary population of the city, who want nothing more than peace and development."

 LAS_declare_neutrality:0 "Declaration of Neutrality"
 LAS_declare_neutrality_desc:0 "The people of our young republic don’t want war, they’ve seen enough of it for several lifetimes already. By officially declaring our policy of neutrality we can make one thing clear: No New Vegans will fight and die for a pointless cause anymore."

 LAS_declare_independ_republic_mojave:0 "Declare the Independent Republic of the Mojave"
 LAS_declare_independ_republic_mojave_desc:0 "For too long we’ve only focused on Las Vegas as our core identity, however we’ve long held many lands which share almost nothing with the city itself. To better represent an important part of our people, as well as distinguishing ourselves from the previous government, we shall take a new name for ourselves. From now on, we shall be known as the Independent Republic of the Mojave!"

 LAS_build_forts:0 "Building Fortifications"
 LAS_build_forts_desc:0 "To ensure our independence against the large threats around us, we will greatly invest into building strategic fortifications around our borders. We will become the American Switzerland, an impregnable fortress too costly to be worth invading."

 LAS_our_oasis_secured:0 "Our Oasis Secured"
 LAS_our_oasis_secured_desc:0 "Any enemy who might dare strike into our deserts will rest eternally in the Mojave. Every cliff will become a fortress, and every citizen an experienced soldier. Our home, our Oasis in the American wasteland, shall never again be prey to another power."

 LAS_liberate_the_rockies:0 "Liberation of the Rockies"
 LAS_liberate_the_rockies_desc:0 "Our clearest target now is directly to our north. The Rocky Mountains are currently occupied by several warlord states which greatly threaten our position. Defeating them and ensuring our position across the mountains will be a crucial step for our plans."

 LAS_retake_california:0 "Retaking our Homeland"
 LAS_retake_california_desc:0 "At long last, we are ready to go back to our true home, California. The battle will be harsh, but we will inevitably prevail. From New Vegas to San Francisco, we are the true heirs of the New California Republic!"

 LAS_capture_the_frontier:0 "Capturing the Frontier"
 LAS_capture_the_frontier_desc:0 "Cascadia, or more specificly Portland has lived in infamy in our community or many years now. Its reputation will be improved by our liberation."

 LAS_the_west_saved:0 "The West is Saved"
 LAS_the_west_saved_desc:0 "From Bellingham to San Diego, and from San Francisco to Salt Lake City, the west is united. The flag of our Republic stands tall and proud, for it has achieved what many thought a fantasy. Now however, we must face what our future holds now that our immediate goals have been achieved."

 LAS_join_fra:0 "Joining the Legitimists"
 LAS_join_fra_desc:0 "The legitimists of the east stand as the rightful government over the whole of the old United States of America, and have proven supportive of our government in the past. We shall salute our rightful commander in chief and work with them to restore Liberty and Democracy to the rest of the nation."

 LAS_our_kimball:0 "Our Kimball"
 LAS_our_kimball_desc:0 "While we agree with the [FRA.get.name] on many things, we must focus on our true goals. We will never bend the knee to a foreign ruler ever again!"

 LAS_a_new_constitution:0 "A New Constitution"
 LAS_a_new_constitution_desc:0 "If we hope to one day unite the rest of the nation under our banners, we must undertake great reforms in our government. Our current constitution will have to be entirely replaced with a new, more functional one."

 LAS_declare_ourselves_new_america:0 "Declaration of the New American Republic"
 LAS_declare_ourselves_new_america_desc:0 "We are no longer just the [LAS.GetName], for we don’t represent just the people of the west. Instead, we will declare ourselves as the New American Republic, a new start for the whole country, free of the sins and mistakes of the past United States."

 LAS_march_east:0 "Marching East"
 LAS_march_east_desc:0 "We are ready to commence our reunification plan. The first obstacle in our way east are the statelets and claimants of the Great Plains and Texas. We shall march and drive over their great open grounds and fields and use them to fuel our own advance further east."

 LAS_sic_semper_tyrannis:0 "Sic Semper Tyrannis"
 LAS_sic_semper_tyrannis_desc:0 "In Washington, the tyrants of old America lounge within their marble palaces. Their rot was what led to the fall of the nation in the first place. To begin again, we must topple them from their high towers and establish ourselves as the true America!"

 LAS_reunite_america:0 "Reuniting America"
 LAS_reunite_america_desc:0 "There remain a lot of warlords and rival governments all across the nation. To truly bring peace and liberty to the union we must take down these groups. Any American living under oppression brings great grief to our whole nation."

 LAS_remove_symbols_of_opression:0 "Remove the Symbols of Oppression"
 LAS_remove_symbols_of_opression_desc:0 "There are many great symbols glorifying oppression throughout our lands. From Confederate statues to Trump’s towers, we must remove and reutilize these sites and materials for our own goals and motives."
 
 LAS_expand_the_senate:0 "Expanding our Senate"
 LAS_expand_the_senate_desc:0 "Our current Senate, established years ago, is far, far too small to represent the people of America. By building a new capitol in New Vegas, we’ll be able to vastly expand the number of Senators representing our people and give representation to our new territories."

 LAS_make_new_currency:0 "Making a New Currency"
 LAS_make_new_currency_desc:0 "To further distance ourselves from the failed United States, we will replace the US Dollar of old with a New American Dollar. Our new currency will also bring us a fresh start in other matters of the economy."
 
 LAS_follow_dharma:0 "Follow the Way of Dharma"
 LAS_follow_dharma_desc:0 "Dharma, while unclear if a mythical figure or a philosopher within the world of Fallout, was established as a great inspiration to the founders of the New California Republic. Some of the moral teachings of Dharma are very much applicable to reality, as found in hinduism and buddhism. Making this religion a reality will encourage morality and pacifism in our weary and traumatized people."

 LAS_rebuild_america:0 "Rebuild America"
 LAS_rebuild_america_desc:0 "With the whole of America under our rule, we can now fully work towards rebuilding our old homes and cities. The American people, industrious as ever, will surely face this challenge head on like all others before it."

 LAS_remove_term_limits:0 "Remove term limits"
 LAS_remove_term_limits_desc:0 "Why would a great ruler be forced to step down simply because they’ve been ruling for a long time? Term limits are an inefficient and undemocratic regulation of our political system we shall do away with. Why change something when it works?"

 LAS_legalize_all_gambling:0 "Legalize all Gambling"
 LAS_legalize_all_gambling_desc:0 "We shouldn’t forget our humble origins from the City of Las Vegas. Gambling, while controversial as always, did become an important part of our economy in those early years, and it can still remain so. If only we do away with these pesky gaming regulations, profits will come rolling in!"

 LAS_the_new_american_republic:0 "The New American Republic"
 LAS_the_new_american_republic_desc:0 "The United States of America, with all its crimes and mistakes, has been swept away by history. In its place, the New American Republic rises. A nation that emerged from the Wastelands of the west to bring freedom and egalitarian democracy to the entire country, a nation fit for a wholly new world."

 LAS_building_up_our_army:0 "Building up our Army"
 LAS_building_up_our_army_desc:0 "Currently, our armed forces consist of ragtag militias, militarized police officers, and a few veterans to round it up. If we are to ensure the survival and prosperity of our nation, we must work to build a new army from the ground up."

 LAS_arming_the_militias:0 "Arming the Militias"
 LAS_arming_the_militias_desc:0 "Our current militias, while having some experience in tactics and small arms, are severely outgunned by our neighbors armed forces. Equipping and training even our most recent recruits with advanced weaponry will give us an edge in future conflicts."

 LAS_promoting_officers:0 "Promote Officers"
 LAS_promoting_officers_desc:0 "Our current officer corps, while capable, simply lacks much of the experience and rank needed to effectively command our new armed forces. By making changes across our command structure we can alleviate the pressure on our officers and further professionalize our young army."

 LAS_new_military_structure:0 "Establishing a New Military Structure"
 LAS_new_military_structure_desc:0 "Our existing military apparatus is, plain and simple, outdated. As our neighbors' armies expand and develop, we must not only match but also surpass them if we are to have any hopes of victory."

 LAS_professionalizing_the_militias:0 "Professionalizing the Militias"
 LAS_professionalizing_the_militias_desc:0 "Our existing militias will need to be reorganized into true soldiers, with proper training and organization befitting a true military force rather than an armed group."

 LAS_continue_expansion:0 "Continuing Expansion"
 LAS_continue_expansion_desc:0 "Our current military reforms have gone a long way towards turning us into a force to be reckoned with, but we must not stop here. We must maintain this momentum to turn us into a true powerhouse, with more and better equipped soldiers, fielding modern equipment and under the command of exceptional officers."

 LAS_a_true_army:0 "A True Army"
 LAS_a_true_army_desc:0 "We can no longer consider our defense handled by mere militias and conscripts, but rather by a professional and trained army. We can now match and even best the larger powers around our nation, but there are always new heights to be reached, are there not?"

 LAS_establish_a_miliary_research_department:0 "Establish a Military Research Department"
 LAS_establish_a_miliary_research_department_desc:0  "Cortez couldn’t have bested the Mexica without muskets, and the Second World War would have been a hell of a lot longer without the atom bomb. With new resources at our disposal, we’ll be able to create a dedicated Military Research Department, ensuring we won’t end up like the Mexica or the Japanese in a few years time."

 LAS_build_ranger_divisions:0 "Establishing Ranger Divisions"
 LAS_build_ranger_divisions_desc:0 "At long last, we’re set to establish a proper Ranger corps within our armed forces. While unfortunately not as exceptional and powerful as the ones of the NCR, they’re still the best of our best, and a true symbol of our young republic."

 LAS_patrolling_the_mojave_in_comfort:0 "Patrolling the Mojave in Comfort"
 LAS_patrolling_the_mojave_in_comfort_desc:0 "Patrolling the Mojave sure makes you wish for, I mean, not much really, all our soldiers are well equipped and supplied. Maybe a working coffee machine would be nice."

 LAS_the_state_of_our_economy:0 "The State of Our Economy"
 LAS_the_state_of_our_economy_desc:0 "Frankly, our economy is ashes. With the power struggle, the civil war and the regular economic issues Vegas had even before the civil war. We’ll really have to get to work on fixing it before we can focus on anything else."

 LAS_raise_casino_taxes:0 "Raise the Casino Taxes"
 LAS_raise_casino_taxes_desc:0 "Despite it all, the Casinos remain profitable. They have much more than they need, and we have much less than we need. It’s only fair that they contribute their fair amount."

 LAS_seize_mob_assets:0 "Seize the Mob Assets"
 LAS_seize_mob_assets_desc:0 "The infamous Vegas Mob. Vital in establishing a lot of the city itself back in the 40s and 50s, but their time has at last run out. Their influence and support for Wynn has put them directly at odds with our government, and their failure in the power struggle wasted a lot of their remaining power. Now we can simply mop up what remains and seize their resources for ourselves."

 LAS_print_more_money:0 "Print More Money"
 LAS_print_more_money_desc:0 "While inflation is something we’d generally rather avoid, there are times where it can be very useful to our economy. Increasing our money supply by printing more money to shore up our liquid assets is seen by most of our economists as a wise move at this time. "

 LAS_raise_corporate_taxes:0 "Raise the Corporate Tax"
 LAS_raise_corporate_taxes_desc:0 "Many corporations took refuge in our city after the outbreak of the civil war, seeing us as an oasis of stability in the region. These corporations brought with them a great boon to our economy, but we can still do more by increasing our corporate taxes. After all, it’s not like they have anywhere else to go."

 LAS_privatize_unessasary_assets:0 "Privatizing Unnecessary Assets"
 LAS_privatize_unessasary_assets_desc:0 "We have seized a large number of assets from Casinos and Mob Warehouses to Factories and Infrastructure. Unfortunately, many of these sites serve no immediate function to us, and maintaining them running is eating up a large amount of the budget. Auctioning the more unimportant sites both reduces costs and earns us a good amount of money."

 LAS_raise_income_taxes:0 "Raise Income Taxes"
 LAS_raise_income_taxes_desc:0 "To increase our income, there is no simpler way than to raise taxes. Sure, increasing income taxes will probably be an unpopular move, but people will understand its necessity soon enough."

 LAS_wealth_taxes:0 "Establishing a Wealth Tax"
 LAS_wealth_taxes_desc:0 "The wealthy population of our city, many of them refugees from their home states, has long remained untouched by taxes, keeping most of their wealth in assets rather than cash. This loophole has stayed open for long enough, and it’s high time they paid their fair share."

 LAS_tax_breaks_for_the_lower_class:0 "Tax Breaks for the Lower Class"
 LAS_tax_breaks_for_the_lower_class_desc:0 "With our recent rise in income, we have the financial stability to lower taxes for the lower brackets of earners in the city. This will prove widely popular and beneficial for the economy, as the more money they have the more they can spend."

 LAS_war_bonds:0 "Buy War Bonds!"
 LAS_war_bonds_desc:0 "With the nation in a state of war, we will start issuing war bonds and selling them to the public. This will help finance the costs of war while not raising taxes unpopularly. Do your part! Buy Vegan Victory Bonds!"

 LAS_war_taxes:0 "Establishing War Taxes"
 LAS_war_taxes_desc:0 "To ensure our government can finance its military machine, we will raise temporary war taxes on the populace. While unpopular, these will help ensure victory on the battlefield. Surely people can’t be too opposed to that right?"

 LAS_a_thriving_economy:0 "A Thriving Economy"
 LAS_a_thriving_economy_desc:0 "Our economy is not only doing as well as before the war, but it has even surpassed it. More businesses are opening up, more people are employed and out of poverty, and more money is coming into the country. Not bad for a bunch of gamers."

 LAS_rebuild_vegas_industry:0 "Rebuild Vegas' Industry"
 LAS_rebuild_vegas_industry_desc:0 "Vegas has never been an indusrial city, and America's deindustrialization killed a lot that it did have. It is imperative we begin to rebuild our industrial base."
 
 LAS_get_casinos_running:0 "Get the Casinos Running"
 LAS_get_casinos_running_desc:0 "The Casinos were seized following our coup against Wynn, leaving them in a state of limbo. Their operation is nessassary for our economy and the profits can go towards economic diversification."
 
 LAS_build_consumer_goods_factories:0 "Construct Consumer Goods Factories"
 LAS_build_consumer_goods_factories_desc:0 "Our people have had to deal with many of their favorite good either being exorbitantly expensive or unavilable. This will be fixed by increasing domestic production."
 
 LAS_expand_mining:0 "Expand the Mines"
 LAS_expand_mining_desc:0 "Nevada has always been rich in resources, only needing to be exploited. We will utilize these resources for our people."
 
 LAS_tourism_advertisements:0 "Tourism Advertisments"
 LAS_tourism_advertisements_desc:0 "Just because the country is in civil war doesn't mean tourism is dead. In fact it can even increase it, especially if you let them stay."
 
 LAS_build_military_industry:0 "Expand Military Industry"
 LAS_build_military_industry_desc:0 "To supply our troops we must expand our military production."
 
 LAS_promote_immigration:0 "Promote Immigration"
 LAS_promote_immigration_desc:0 "Has your government stolen your house? Killed your family? Tried to Conscript You? Come to New Vegas, a land of Freedom!"
 
 LAS_industrial_research:0 "Industrial Research"
 LAS_industrial_research_desc:0 "Just building factories is one part of an industrial economy, it is also imperative to continue to discover new and better industrial technologies."
 
 LAS_expand_production_effciency:0 "Expand Production Effciency"
 LAS_expand_production_effciency_desc:0 "While expanding industry is great, if it is inefficient it is nearly useless. We cannot allow inefficentcies in our industry."
 
 LAS_a_restored_industry:0 "An Industrialized Vegas"
 LAS_a_restored_industry_desc:0 "New Vegas is now a modern, indusrial city fit to supply our people and military."
 
 #Independent Path
 
 LAS_independent_vegas:0 "Independent Vegas"
 LAS_independent_vegas_desc:0 " "
 
 
 
 #Legion Path
 
 LAS_cold_cold_heart:0 "Cold Cold Heart"
 LAS_cold_cold_heart_desc:0 "The state of Vegas is everything we stand against, a den of vice, hedonism, prostitutes, whores and modernism. If we are to create a truly great Empire, great big changes must come."

 LAS_burn_the_casinos:0 "Burn The Casinos"
 LAS_burn_the_casinos_desc:0 "The Casinos of Vegas. The symbol of vice and immorality. These bases of degenerates will be burned down to the ground. It will be our signal to all who reside in this territory that the age of corruption and immorality is no longer."

 LAS_destroy_hedonism:0 "Destroy Hedonism"
 LAS_destroy_hedonism_desc:0 "Hedonism doesnt just destroy the self. But also brings down great nations. A hedonist does not have discipline nor professionalism; their heads only full with thoughts of debauchery and all sorts of immoral and degenerative thoughts. People like these have no place within our new state and will be purged mercilessly and efficiently "

 LAS_the_legion_reborn:0 "The Legion Reborn"
 LAS_the_legion_reborn_desc:0 "The degenerates and heathens within our territory have been cleansed for now. And to everyone here, our goals are clear. Today, we will proclaim the rebirth of the Legion. Based on the foundations and virtues of Rome.

 LAS_legio_aeterna:0 "Legio Aeterna"
 LAS_legio_aeterna_desc:0 "The Legion is Eternal, the legion stands strong and alone. We are destined to conquer and rule. The wasteland will be purified. The Continent United and we will exist to see it all."

 LAS_aeterna_victrix:0 "Aeterna Victrix"
 LAS_aeterna_victrix_desc:0 "Nothing less than victory is acceptable to our legion. We will no longer just be happy with half-measures, capitulation and partial successes. Half-measures and compromise is the reason why America has rotted and collapsed, and the Legion does not intend to follow in its footsteps."

 LAS_martial_our_men:0 "Martial our Men"
 LAS_martial_our_men_desc:0 "Our legion does not exist to only cling upon this thin slice of land. It exists to expand and conquer. And for this monumental task, we will need men, much more men. Every able bodied man will be recruited into the legion as the main bulk of our fighting force. 

 LAS_establish_the_cult_of_mars:0 "Establish the Cult of Mars"
 LAS_establish_the_cult_of_mars_desc:0 "Mars, the God of war. He is the symbol of legionary military might. Mars represents the ideal legionary. Strong, powerful and ready for conquest. All within the legions rank will revere Mars and his ideals."

 LAS_instill_loyalty:0 "Instill Loyalty"
 LAS_instill_loyalty_desc:0 "Those who work for us must be completely and utterly loyal to our cause. Unknowingly handing weapons and teachings onto people with dubious loyalty will come back to bite us later, not thinking twice before betraying us. We will make sure this doesnt happen, under any circumstance."

 LAS_a_living_god:0 "A Living God"
 LAS_a_living_god_desc:0 "Ceasar is not a mere mortal like the slaves and profligates. He is the Son of Mars, a Living God. While the wretched profligates worship dead Jews on sticks or their own hedonism we worship honor, tradition, strength, and loyalty. Mars et Caesar cum legione stant!"

 LAS_teachings_of_the_malpais_legatus:0 "Teachings of the Malpais Legate"
 LAS_teachings_of_the_malpais_legatus_desc:0 "The Malpais Legate teaches us that tasks should not be delayed without reason. Overlooking any small detail or error will only lead to it growing into a bigger problem. We will learn from example, that without foresight and planning a battle is already lost."

 LAS_teachings_of_legatus_lanius:0 "Teachings of Legate Lanius"
 LAS_teachings_of_legatus_lanius_desc:0 "Legate Lanius, the butcher, teaches us we must not show quarter to our enemies and also to not underestimate them. Enemies of the legion should be crushed brutally and efficiently. Those who are equal in strength shouldnt be thought of as easy game because being cocky also spells doom for the attacker."

 LAS_hold_a_census:0 "Hold a Census"
 LAS_hold_a_census_desc:0 "To get a better idea of what we have to work with, the legionary command will hold a nationwide census to figure out and plan the best and most effective ways of restructuring society, industry and the military. It will also help us to keep track of our slave population and if any holdouts yet exist."

 LAS_find_infiltrators:0 "Find Infiltrators"
 LAS_find_infiltrators_desc:0 "To defeat your enemy, first you must know them. We can’t expect the legion to simply go ahead and bang their heads on an enemy we know nothing about. It is stupid and suicidal. Across the country, we will find existing and recruit new agents and informants whose task will be to infiltrate enemy society and the frontlines. Feeding us crucial information, laying out sabotage and even taking down any personnel who might cause a problem for us."

 LAS_crucify_the_disobedient:0 "Crucify the Disobedient"
 LAS_crucify_the_disobedient_desc:0 "Many think they can disobey our commands and get away with it. But they will be proven wrong. They will be punished for their insolence, but not in private, no. Their fate will be shown across the nation as their bodies stay stuck upon the pole for all to see. To strike fear into the hearts of any opportunist who may dare to think about crossing the path of the Legion."

 LAS_send_a_message:0 "Send a Message"
 LAS_send_a_message_desc:0 "Its not mindless savagery, its about striking fear in their hearts and minds. To show them what lies for any profligate heathen. No crime will go unpunished, and their fates will be etched into the minds of all to make sure they are constantly reminded."

 LAS_enforce_loyalty:0 "Enforce loyalty"
 LAS_enforce_loyalty_desc:0 "A loyal legionary fights for the Legion till his last breath, a disloyal one will betray it the moment the opportunity arises. This simply cannot do, any doubt, question or fatigue must be hammered out. Their hearts and minds must be fine tuned to serve the legion wholeheartedly. Loyalty training will be enforced throughout their entire career, remind them of what they are and who they serve, or else."

 LAS_a_loyal_legion:0 "A Loyal Legion"
 LAS_a_loyal_legion_desc:0 "All are loyal under the banner of the Legion. Heart void of fear and doubt, men marching in unison, completely servile and primed to follow the Legions will. They know better than to betray us or to be corrupted by the lies of profligates. Together we are strong and a force to be reckoned with."

 LAS_from_vulpes_to_caesar:0 "From Vulpes to Caesar"
 LAS_from_vulpes_to_caesar_desc:0 "Caesar, aka Jason Spisak, before he became our leader served the Legion as the voice actor for Vulpes Inculta in Fallout New Vegas. His dedication to his work turned a character that wouldve been a forgettable messenger into the face of the legion fandom. Now he stands as Caesar, our God. However the legacy of Vulpes will forever be remembered in the heart of our Legion."

 LAS_nova_roma:0 "Nova Roma"
 LAS_nova_roma_desc:0 "Many people used to call America the new Rome due to many of its similarities, not only in its successes but also in its failures. America was the Roman Republic, its establishment rotted, its morals corrupt, its population degenerate and hedonistic, its army nothing more than bumbling fools carrying the weapons of titans. And now, just as the Roman Republic, America has collapsed under its own rotting carcass. Like a phoenix from the ashes, we rise, like Caesar crossing the Rubicon, like Augustus at Actium the Roman Empire Rises. Here, at this city that once was the place of pilgrimage for the profligates now rises not New Vegas, but Nova Roma"

 LAS_purify_utah:0 "Purify Utah"
 LAS_purify_utah_desc:0 "For what seems like the second time in history. The Mormons have become independent again. Betraying their masters in Denver and attempting to cut out their own land amidst the chaos. But the sudden independence and betrayal of their former masters has left the territory of Utah chaotic and unprepared for the arrival of our Roman Empire. This was shown when they attacked us and our temporary allies. Now its time to secure our borders and bring purification to these lands."

 LAS_uta_round_up_slaves:0 "Mormon Slaves"
 LAS_uta_round_up_slaves_desc:0 "Historically, Mormons were known for their value of working together, be it building a working civilization from scratch or raising a militia strong enough to cause enough trouble for America’s authority. This will definitely be a good use for us. These slaves will be put to work mainly for construction and repairs. We hope they continue to contribute to the Legion with their labour. Or else."

 LAS_uta_purge_the_weak:0 "Purge Utah"
 LAS_uta_purge_the_weak_desc:0 "The Mormons have always been the rebellious type, constantly yearning for independence. It is a respectable trait, but one which runs counter to our plans. We will make sure to break these zealots so thoroughly that they may never attempt nor hope to rebel against us. Plus these lands are home to other groups, weaker and unfit for service to our Legion. These people will be strung up as a warning to any profligates who dare oppose our Legion."

 LAS_purify_california:0 "Purify California"
 LAS_purify_california_desc:0 "California, the land of the profligates. The degeneracy of Vegas scaled up to span an entire nation. California is the complete opposite of what we, the Legion, stand for. And yet as fate destined it to be. California is our biggest challenge and opponent we have yet to fight. So let it, let us spill the blood of our enemies onto the battlefield and may fate and strength decide who will be the victor in this new age for America."

 LAS_cal_round_up_slaves:0 "Round up Californian Slaves"
 LAS_cal_round_up_slaves_desc:0 "The profligates within California are weak and dull. But surprisingly enough, there are also those who are opposites. It is said that in California lies a large number of these, Latinos and Mexicans. Mexicans were known for their cheap labour and hard work letting the old America exploit their labour well enough. Yes…..we can use this for ourselves greatly, better than the Americans."

 LAS_cal_purge_the_weak:0 "Purge The Profligates"
 LAS_cal_purge_the_weak_desc:0 "California is the land of hedonists, profligates, degenerates and whatever adjective we can bring up. They are debased. These degenerates give no benefit to the Legion and thus these wealings are to be purged to cleanse our newly acquired territory. Their corpses strung upon the crosses lining roads and highways will remind everyone living under us what new world they live under now."

 LAS_purify_the_rockies:0 "Purify The Rockies "
 LAS_purify_the_rockies_desc:0 "The North West of America, like every other territory of the former country, has broken off into independent states. Their forest and mountainous regions give them a great vantage for guerillas and underground fighters who may use the territory to launch attacks on our positions. This is not something we can let happen."

 LAS_rock_round_up_slaves:0 "Enslave the Mountaineers"
 LAS_rock_round_up_slaves_desc:0 "The vast wilderness of the American North East and Cascadia has made it a region prime for hunters, scavengers, lumberjacks, carpenters, and mountaineers. By Legion laws, many of these men will be turned to slaves, and their expertise is to be used for our benefits. Their young enrolled into Legionary schools to be trained and indoctrinated."

 LAS_rock_purge_the_weak:0 "Purge the Weak"
 LAS_rock_purge_the_weak_desc:0 "The strong consume the weak. It is the law of nature and reality itself. Us and the population within the Rockies are acutely aware of this fact. While this land is home to many who are fit for our Legion, their cities also are home to plenty of weak, useless people. So it is no surprise this is what would have happened eventually. We wont let ourselves be bogged down by dead weight and a bloated, useless populace."

 LAS_purify_texas:0 "Purify Texas"
 LAS_purify_texax_desc:0 "Texas had always been the most eager for independence. The collapse of America was most welcomed in and greatly benefited Texas. This is why Texas will not easily give up their newly gained freedom. Our goals run counter to theirs, and simply letting them be will also allow the profligates to gain a stronghold. Texas is still fresh and only recently came out of a political and environmental crisis. Now is the best time ever to attack them and put down the Texan spirit."

 LAS_tex_round_up_slaves:0 "Round up Texan Slaves"
 LAS_tex_round_up_slaves_desc:0 "Texans are one of the more unique tribes within America. Known for their familiarity with their land, frontier mindset and heavy use of firearms. Their skills are highly valuable and many of their ideals can be assimilated into our Legionary structure."

 LAS_tex_purge_the_weak:0 "Texan Purge"
 LAS_tex_purge_the_weak_desc:0 "Even as many parts of the Texan culture group can be moulded to fit our Legions it will be equally, if not more, difficult to make them snap out of their tribal loyalty. Plus there are many weaklings worth nothing but the cross. But this is what the Legion is made for, no amount of difficulty is too much for us, and we will always come up top to ride along into the new tomorrow with the withering corpses of those unfit to serve line the road."

 LAS_purify_the_south:0 "Purify the South"
 LAS_purify_rockies_desc:0 "The Confederates, once a doomed delusional rebellion, now resurrected under an equally delusional man. If we werent purging the world of the profligate rot, Kanye and his goons would serve as a perfect example of chem abuse and profligate idiocy. It would take days to list all things wrong with the Confederacy and the failed states born from it. But we are warriors, not poets. Delusional or not, they will be put down all the same."

 LAS_south_round_up_slaves:0 "Round up the Southerners"
 LAS_south_round_up_slaves_desc:0 "Funnily enough, it is very ironic and absurd considering what we are doing right now. A state who was born for the sole task of holding slavery is now being enslaved by our Legion. The Confederates may have thought only skin color determines who is a slave or not. They were fools to believe such a simple idea. Its strength that determines it, and we have made this fact clear. Let these larpers know what REAL slavery looks like."

 LAS_south_purge_the_weak:0 "Purge The South"
 LAS_south_purge_the_weak_desc:0 "The Confederacy and its breakaways are filled with nothing more than mentally ill zealots, delusional ideologues and opportunist spineless scum. Degenerates like these are not even fit to be a slave in our Legionary Empire. Their weak willed chem addicted profligate bodies will make great roadsigns."

 LAS_purify_the_plains:0 "Purify The Plains"
 LAS_purify_the_plains_desc:0 "The territory of one of the main contenders of the American civil and the reason for any of this happened. His followers believe he is the new Caesar. Or even a God-Emperor of sorts. But words and titles alone will not hold up against our might. Let the false prophet and his followers hurl themselves against us. History will show them who will be the victor."

 LAS_plains_round_up_slaves:0 "Round up Great Plains Slaves"
 LAS_plains_round_up_slaves_desc:0 "Ah, the Great Plains of America. The heartland contains large swathes of land perfect for agriculture. The inhabitants of this territory have worked in these fields for generations and have great experience. Their expertise as slaves in our empire will bear great fruit. We can make sure to fully use this advantage to its fullest. Our supplies will be plenty and no Legion will go into battle starved without food."

 LAS_plains_purge_the_weak:0 "Purge The Pretenders"
 LAS_plains_purge_the_weak_desc:0 "The followers of the False Prophet. This Donald Trump is a fanatic and zealous just as much as we are. Getting rid of them will not be easy. But what we lack in weaponry, we make up for in willpower. It will not matter how many they sacrifice to destroy our rule. They will all fall just the same as their Prophet and saviour."

 LAS_purify_the_great_lakes:0 "Purify The Great Lakes"
 LAS_purify_the_great_lakes_desc:0 "The Great Lakes territory holds the worst if not the most vile forms of Globalist heathens. These free-marketers, tech-shamens, chem-pushers and self obsessed freedom loving degenerates. These Libertarians are everything wrong with this modern world, endless vice, rejection of nature, self obsession and parasocialism. They are debased and corrupt, they deserve no quarter. Let the globalist world order see that the Legion does not take kindly to degenerate profligates."

 LAS_gla_round_up_slaves:0 "Enslave The Great Lakes"
 LAS_gla_round_up_slaves_desc:0 "Despite the hedonist degenerate libertarians who were occupying the great lakes. This territory was once the main and biggest industrial hub in the Americas. Known for its factories and workers. The newly gained workers, turned slaves, will be put to work within these factories to produce all necessary things to continue supplying our Legion. The true might of the Rust belt will be unleashed and unshackled from the production of useless materials and products."

 LAS_gla_purge_the_weak:0 "Purge The Great Lake Degenerates"
 LAS_gla_purge_the_weak_desc:0 "The Legion has no place for debased, corrupt, chem-addicted cronies and weak willed degenerates who bear zero respect for authority. Empires are built on strength, discipline and willpower. All the things these degenerates, these libertarians, stand for. Let us put their heads on spikes along roads and crucify the degenerates across the region to show the world what profligates truly deserve."

 LAS_purify_the_northeast:0 "Purify The North East"
 LAS_purify_the_northeast_desc:0 "Ahead of us lies the other main contender whos to decide the destiny of this land called America. They are the same debased, corrupt globalists who have poisoned this nation. Sowing rot across its body. These remnants, these enclave among history still cling to the old world. But the Legion does not care for what is old, the strong eat the weak. History comes and goes, and the old is replaced by the new. The last remnant of the old world will be snuffed out completely. There will be no hope under the banner of the bull. Only servitude, conquest and strength."

 LAS_ne_round_up_slaves:0 "Round up North Eastern Slaves"
 LAS_ne_round_up_slaves_desc:0 "Although most of the newly gained slaves for the North East arent as useful as the ones from back West. More educated slaves, mainly in machinery and medicine, can still help the legion in certain aspects. Despite how the profligate might portray us as. We are not simple minded brutes. We know how to properly use anything we can get our hands on."

 LAS_ne_purge_the_weak:0 "Purge The Establishment"
 LAS_ne_purge_the_weak_desc:0 "Simply conquering a territory is not enough. You must destroy any ideas of rebellion and hope. Simply keeping any resemblance of the old world here is dangerous and continues feeding the profligates the false hope of rebellion and freedom. The Legion will make sure to utterly destroy and erase any traces of the old world. Be it monuments, locations, government personnel, bureaucrats, or oligarchs. All must go."

 LAS_purify_north_america:0 "Purify North America"
 LAS_purify_north_america_desc:0 "Rome did not become an Empire simply by standing idly by. No, it took initiative, and so must we. Keeping contenders and neighbours who despise you is not good for security. Not to mention how dissidents can escape and seek shelter from your enemies and plot your demise while not looking. Rome made sure this did not happen. And so will the Legion."

 LAS_from_legion_to_empire:0 "From Legion to Empire"
 LAS_from_legion_to_empire_desc:0 "Now America lies under the heel of Almighty Caesar, with no one left to oppose his enlightened rule. The need for the legion is at an end, and now we are truly the Roman Empire."

 LAS_a_triumphant_legion:0 "A Triumphant Legion"
 LAS_a_triumphant_legion_desc:0 "A new Golden Age dawned for the West. One of strength, devotion and servitude. We are free from the corruption and debasedness of the profligates before us. We have shown the world what true willpower and strength look like, and they know better than to anger or pester the bull. The banner of the Bull soars on top of everyone and will do so for centuries beyond."

 LAS_establish_the_consul_offciorium_ab_famulatus:0 "Establish the Consul Officiorum ab Famulatus"
 LAS_establish_the_consul_offciorium_ab_famulatus_desc:0 "To manage the number of slaves we currently have and we will gain through our conquests, the Consul Officiorum ab Famulatus will be created. Run by professional legionaries well educated on human resource management, it will allow for max efficiency and much better uses of the slaves."

 LAS_round_up_the_profligates:0 "Round up the Profligates"
 LAS_round_up_the_profligates_desc:0 "Now that we have secured our control over New Vegas we will round up all the profligates remaining in our territory. They can make up for their degeneracy and hedonism by serving as the toilers of the Legion."

 LAS_make_them_farm:0 "Make them Farm"
 LAS_make_them_farm_desc:0 "The Legion cannot march forward with an empty stomach. And using normal farming would overwhelm our subjects in the countryside, no. This issue can be solved by using the vast number of slaves we have accumulated from our takeover and conquests."

 LAS_make_them_build:0 "Make them Build"
 LAS_make_them_build_desc:0 "Many of the slaves we have are able bodied men and many of them are healthy enough to work in manual labor. While our Legionaries are busy conquering, these slaves will meanwhile work to build new infrastructure within our land and repair those from our conquests."

 LAS_make_them_work_in_workshop:0 "Make them work in the Workshops"
 LAS_make_them_work_in_workshop_desc:0 "Of course, with the use of slaves within other sectors of our industry, they can also be put to work within our workshops to produce plenty of military equipment for us free from any forms of stagnation and slowing down production."

 LAS_expand_farming_infrastructure:0 "Expand Farming Infrastructure"
 LAS_expand_farming_infrastructure_desc:0 "The use of slaves for farming has born fruits, allowing our legionaries to be supplied with free food and vegetables, keeping them well fed. In conclusion, this system has worked splendidly and thus will be expanded more across our territories to make use of the continuous influx of slaves."

 LAS_break_their_backs:0 "Break their Backs"
 LAS_break_their_backs_desc:0 "Just because we have shown them mercy by letting them be slaves instead of slaughtering them outright, does not mean we are weak. If we do not assert our control over the slaves and make it clear who holds the power, they may start plotting against us. Such a sensitive part of our economy cannot be allowed to fall into chaos. Plus cracking down on them will help to increase their productivity. We will make sure to keep them weak and servile enough to know not to mess with Legion."

 LAS_expand_the_workshops:0 "Expand the Workshops"
 LAS_expand_the_workshops_desc:0 "The production of weaponry and supplies has exploded since our use of slaves within our factories. As we conquer more and more land, we receive more slaves and have a need for more equipment to conquer and punish the profligates. Expanding our current methods of production will continuously supply us with a steady amount of goods. A perfect balance will be achieved."

 LAS_expand_horse_breeding:0 "Expand Horse Breeding"
 LAS_expand_horse_breeding_desc:0 "Although the modern may have left cavalry behind, it doesn't mean they have become obsolete. We are not the type to rely on modern military equipment that continues to break down and needs constant fueling. Cavalry, meanwhile, are low maintenance without needing so much to keep them running. Not to mention horses have played major roles within the history of countless Empires and conquerors."

 LAS_business_is_booming:0 "Business is Booming"
 LAS_business_is_booming_desc:0 "Thanks to our proper utilisation of slaves and expanded infrastructure to optimise slave labour output, our economy has reached new heights we did not even know possible. Across the empire, our farms yield crops to feed the entire Legion, industry and infrastructure are built rapidly and without delay, and our factories create endless amounts of goods. Our Legionaries do not have to worry about a lack of food, supplies, or weaponry. Our great economy is fully subservient to us and benefits us greatly."

 LAS_a_supplied_legion:0 "A Supplied Legion"
 LAS_a_supplied_legion_desc:0 "Even the most seasoned Centurion without proper weaponry and medical supplies will get worn out and eventually defeated after continuous combat. Logistics for an army is as important as the weapons they wield and the willpower of each soldier. Our economy is capable of handling this very task and will be utilised to the fullest extent."

 LAS_find_more_slaves:0 "Find More Slaves"
 LAS_find_more_slaves_desc:0 "As our ever growing Legion marches across the former territories of the United States, we gain new lands with more population and industry. Many profligates hide from us in every nook and cranny. These cowards will no longer hide from our legion. We will track them down and put them to work."

 LAS_look_for_refugees:0 "Look for Refugees"
 LAS_look_for_refugees_desc:0 "The raging civil war across the Americas has created an influx of refugees coming from any and all parts of the country. It would be unwise not to allow these whelps in and put them to work. It would be far more beneficial to have them instead of the enemy. And lets not forget how the original Rome was forged. We are simply following in the footsteps of Rome."

 LAS_send_the_frumentarii:0 "Send the Frumentarii"
 LAS_send_the_frumentarii_desc:0 "Getting slaves and laborers is easy, but finding those with exceptional capabilities in more complex and industrial positions will be hard to find. This is where our Frumentarii come in. Letting our enemy have people doing complex work only hurts us. But having those people work for us instead of them is a great plan. Our Frumentarii will go deep into enemy territory and capture enemy operatives and personnel, bringing them back to us. So we can put them to work and put their skills to good use for the Legions benefit."

 LAS_expand_the_consul_offciorium_ab_famulatus:0 "Expand the Consul Officiorum ab Famulatus" 
 LAS_expand_the_consul_offciorium_ab_famulatus_desc:0 "To the creation of Consul Officiorum ab Famulatus has come a long way and has served us well so far, but as our Legion grows, the number of slaves we obtain grows too. Such numbers of slaves is be too much for them to manage; thus, we will expand the Consul Officiorum ab Famulatus without further delay. The faster we do this, the faster we can put these whelps to use."

 LAS_expand_slave_infrastructure:0 "Expand Slave Infrastructure"
 LAS_expand_slave_infrastructure_desc:0 "The system that manages the transport, usage and housing of slaves must be expanded and built up in our new territories and future ones too if we are to utilize their full potential. Vast swathes of American land hold great amounts of resources and farmland. Not using them to their full potential will be shameful for us."

 LAS_promote_more_slave_masters:0 "Promote more Slave Masters"
 LAS_promote_more_slave_masters_desc:0 "The Consul Officiorum ab Famulatus is great and all, but the agency itself cannot directly manage every single slave. There must be a middleman for those. Junior Legionaries and those working in the existing Consul Officiorum ab Famulatus will be given new positions and promoted as slave masters to manage the slaves more intimately. Of course, local loyalists will also be given this rank, lowering pressure from our own Legionaries."

 LAS_expand_slave_pens:0 "Expand Slave Pens"
 LAS_expand_slave_pens_desc:0 "More slaves are always good but cramming them into one small place like sardines only brings more insufficiencies. It also makes them easily get sick and become a burden. The pens where slaves are stored need to be made bigger and expanded so they can be kept there without much issue. This allows us to also be more effective in picking and choosing slaves."

 LAS_outsource_work_to_slaves:0 "Outsource more work to the Slaves"
 LAS_outsource_work_to_slaves_desc:0 "There are many jobs within society that are well more iffy for normal people to work. But they are still necessary. But this isnt a problem for us. We have slaves for these types of usually unsanitary jobs. While our Legionaries and citizens can live normal and civil lives, the slaves will work in the shadow so our society may always function and our citizens can enjoy the prosperity they deserve."

 LAS_expand_slave_healthcare:0 "Expand Slave Healthcare"
 LAS_expand_slave_healthcare_desc:0 "A dead slave is a useless slave, a sick slave is a burden. The Legion may want to keep slaves submissive and servile, but it doesnt mean we will let them kneel over and die, it would be a waste and a drain on our resources. A portion of supplies will be saved up to treat the slaves and keep them healthy so they may continue working. Of course we wont give them the same healthcare as citizens and legionaries; we cant have them getting too strong and rising up."

 LAS_set_up_training_centers:0 "Set up Training Centers"
 LAS_set_up_training_centers_desc:0 "Most people in modern times have no knowledge on how to work in the field or how to do laborious work. Without at least a basic knowledge on how to do things, the slaves are as good as useless. Newly gained slaves who do not have experience or knowledge will get sent to our newly made training centers to be taught how to do tasks they will be assigned to in the future."

 LAS_soldiers_pensions:0 "Soldiers Pensions"
 LAS_soldiers_pensions_desc:0 "One of the main goals of our Legion is to burn the slate clean and bring upon a new Golden Age under the Banner of the Bull. And the builders of this dream are our Legionaries. It would be hypocritical for us not to provide rewards to our soldiers after they have completed their task of conquest. We will set aside funds and rewards for Legionaries who have served the Legion well and for those who have come back from service. The Legionnaire is the backbone of our Empire, and thus he will be compensated greatly."

 LAS_a_legionary_economy:0 "A Legionary Economy"
 LAS_a_legionary_economy_desc:0 "Our economy has soared new heights never imagined by us, we are unshackled by the bondage of globalist market thoughts. We run on efficiency and without delay. While the profligates continue to dwell in their entanglements of a multi-layered, overly complicated system, we live in prosperity, and most importantly, we do not forget our humanity, our oneness with Earth and Nature. We stand free from the profligate vices and illnesses. Our Golden Age is secured and may it never end!"


