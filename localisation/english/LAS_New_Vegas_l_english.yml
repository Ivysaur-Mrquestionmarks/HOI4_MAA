l_english:
#Focuses

#Starting Tree

 LAS_declare_new_vegas:0 "Declare New Vegas"
 LAS_declare_new_vegas_desc:0 "After so many trials and tribulations, we've achieved our greatest goals. Goodbye Las Vegas, and hello New Vegas!"
 
 LAS_the_meeting:0 "The Meeting"
 LAS_the_meeting_desc:0 "Alright, now that it's done, let's get these clowns off the streets. They did their thing, and their job is now finished."
 
 LAS_get_real_allies:0 "Get Real Allies"
 LAS_get_real_allies_desc:0 "It is clear now we can't keep trusting these guys, but we also can't just rule the whole city by ourselves. We need collaborators we can trust and who most importantly, won't get in our way."
 
 LAS_sabotage_the_nerds:0 "Sabotage the Nerds"
 LAS_sabotage_the_nerds_desc:0 "These gamers really think they can beat us? We hold all the cards, we play chess while they try to play Uno, they're not a threat. Still, it's best to try and get them off the board as soon as possible. They're bad for business after all."
 
 LAS_break_their_knees:0 "Break their knees"
 LAS_break_their_knees_desc:0 "What do they know about actual violence? What do they know about what it takes to rule and control people? Who the hell do they think they are? They want to play a game? Fine, let's show them what our new friends know about playing it."
 
 LAS_showdown_at_wynn_casino:0 "Showdown at the Wynn Casino"
 LAS_showdown_at_wynn_casino_desc:0 "Wynn and his mob allies have utterly failed to curtail the New Vegas Militias. Now the courier, who had cheated fate once in the Las Vegas City Hall, will attempt to cheat fate once again, and the Mojave will forever be changed."
 
 LAS_render_unto_courier:0 "Render unto Courier"
 LAS_render_unto_courier_desc:0 "And so the Courier, who had cheated fate once in the Las Vegas City Hall, cheated fate once again, and the Mojave was forever changed."
 
 LAS_take_control_of_strip:0 "Taking control of The Strip"
 LAS_take_control_of_strip_desc:0 "The Gem of the Mojave is now in our hands, and we finally find ourselves in a position to make real change, but we must stabilize the region before anything else can happen."
 
 LAS_reward_the_army:0 "Rewarding our Army"
 LAS_reward_the_army_desc:0 "We must not forget, it was only thanks to our brave soldiers that we were able to secure our victory in New Vegas. They have all earned a great reward for their service and bravery."
 
 LAS_cement_our_rule:0 "Cement our Rule"
 LAS_cement_our_rule_desc:0 "Unfortunately, being a product of a countercoup is not great for our image as a truly stable nation. We'll work to make sure our people recognize us as legitimate."
 
 LAS_new_vegas_secured:0 "New Vegas Secured"
 LAS_new_vegas_secured_desc:0 "At long last, we have no other rivals in the city capable of threatening our rule. We can finally begin remodeling the city into the true New Vegas."
 
 LAS_seize_casinos:0 "Seize the Casinos"
 LAS_seize_casinos_desc:0 "The casinos, the backbone of Vegas economy, have long overstepped their role in the city, acting as kingmakers at best and like kings themselves at worst, and not the good type of Kings. As punishment, we shall nationalize their casinos, using them to propel our city forwards rather than letting them hoard their wealth."
 
 LAS_fight_crime:0 "Fighting Crime"
 LAS_fight_crime_desc:0 "The Mob, an iconic part of old Las Vegas, threw in their hat with Wynn and his cronies. While weakened, both them and many other criminals, from looters to murderers, now run rampant in our city. We must find them and ensure proper justice is served upon them."
 
 LAS_restore_order:0 "Restoring Order"
 LAS_restore_order_desc:0 "We will ensure the city of New Vegas is orderly and peaceful. Our citizens have long lived in fear of violence, from the civil war around us to the coups that have taken place recently, but no more shall they be prisoners of fear. They will be free to live in a proper, orderly nation once again."
 
 LAS_win_hearts_and_minds:0 "Hearts and Minds"
 LAS_win_hearts_and_minds_desc:0 "Where Wynn and his mob allies offered fear, we offer compassion and friendliness. We will be charitable with the people of New Vegas, unlike the greedy Wynn and his cronys."
 
 LAS_rebuild_postal_service:0 "Rebuilding the Postal Service"
 LAS_rebuild_postal_service_desc:0 "An often undervalued aspect of old America was its postal system. A well-oiled, coordinated system that more often than not worked incredibly well. Sadly, with America's death, so too died the Postal system, but we can rebuild it. The new Mojave Express will serve our nation and its people cheaply, efficiently and safely."
 
 LAS_make_oct_23_a_national_holiday:0 "Make October 23rd a National Holiday"
 LAS_make_oct_23_a_national_holiday_desc:0 "There is one reason above all else we are where we are today, Fallout: New Vegas. The inspiration for our soldiers and our leaders, the standard of hope for the people, it was all possible thanks to this little game. To commemorate it, we will officially make October 23rd, the date the bombs dropped in 2077, New Vegas Day, to always commemorate the game that got us all here."
 
 LAS_our_direction:0 "Our Direction"
 LAS_our_direction_desc:0 "The streets are safe. Crime has been contained. The people are happy. Now, we will once again look towards our courier for a path forwards."
 
 #NCR Path
 
 LAS_for_the_republic:0 "For the Republic"
 LAS_for_the_republic_desc:0 "Eureka!"
 
 LAS_building_a_government:0 "Building a Government"
 LAS_building_a_government_desc:0 "If we want to become an actual nation and not just a glorified militia we have to do some serious government-building. We must begin working on creating a proper, functioning, body of government for the sake of our people and country."
 
 LAS_establish_an_executive_branch:0 "Establish an Executive branch"
 LAS_establish_an_executive_branch_desc:0 "Our nation's executive branch shall be a council headed by the Courier, with a cabinet appointed by him. He and his cabinet will make decisions on national matters and overall make the best decisions possible for our nation."
 
 LAS_establish_a_legislative_branch:0 "Establish Legislative branch"
 LAS_establish_a_legislative_branch_desc:0 "The republic's legislative branch shall be a unicameral legislature, known as The Senate, and it will be in charge of passing laws, approving presidential appointments to the executive council, and advising and even blocking the Executive branch in accordance with the law. Each member of the Senate will be directly elected by their constituents, and will uphold our democratic values."
 
 LAS_establish_a_judicial_branch:0 "Establish a Judicial branch"
 LAS_establish_a_judicial_branch_desc:0 "Our nation's new Judicial branch will be in charge of dealing out the law to our people, in a fair and equal manner. With local, state, and federal courts with a Supreme Court to uphold the constitution and be the final say in all legal matters, every citizen will have a free and fair judicial system upholding their rights. By empowering our courts, we can ensure no one is above the law and people don't go around taking justice into their own hands."
 
 LAS_build_departments:0 "Build up Departments"
 LAS_build_departments_desc:0 "Apart from the three main branches of government, our nation will need dedicated Departments for administrating the minutiae of governmental work, from scientific research to land management, foreign relations, infrastructure, and anything else a real country needs to function."
 
 LAS_appoint_judges:0 "Appointing Judges"
 LAS_appoint_judges_desc:0 "Unfortunately, our new judicial branch is currently lacking in judges to staff it, and since our nation as a whole lacks many judges as is, we'll have to appoint and train lawyers and anyone else with legal experience to the positions we desperately need."
 
 LAS_send_an_ambassador_to_bidone:0 "Send an Ambassador to [FRA.GetName]"
 LAS_send_an_ambassador_to_bidone_desc:0 "To our east, the [FRA.GetName] is clearly the most legitimate successor to the United States of old, and it embodies the democratic ideals of the New California Republic. We will try to be friendly with them, and hopefully acquire their support for our cause."
 
 LAS_build_election_infrastructure:0 "Build Election Infrastructure"
 LAS_build_election_infrastructure_desc:0 "We can't simply declare an election season open and wing it from there. No, we must establish legal and also physical infrastructure to ensure our democratic system in the future. From determining polling places, campaigning regulations, regulating political advertisements and donations, it will take some time before everything is in place for our first proper elections."
 
 LAS_rebuild_government_services:0 "Rebuild Government Services"
 LAS_rebuild_government_services_desc:0 "Ever since the collapse of the United States, the people of Vegas haven't really seen proper government services, until now. We still have work to do, but trust in the government is at an all time high, and we must work to deliver even more for our people."
 
 LAS_governance_restored:0 "Governance Restored"
 LAS_governance_restored_desc:0 "We finally have a true, functional, and soon to be democratic government in place here in New Vegas. Even when faced with challenges and threats, the people have risen up to the task and beaten these challenges to the ground. Our nation and our people are excited and at long last, hopeful for the future."
 
 
 
 #Independent Path
 
 LAS_independent_vegas:0 "Independent Vegas"
 LAS_independent_vegas_desc:0 " "
 
 
 
 #Legion Path
 
 LAS_cold_cold_heart:0 “Cold Cold Heart”
 LAS_cold_cold_heart_desc:0 “The state of Vegas is everything we stand against, a den of vice, hedonism, prostitutes, whores and modernism. If we are to create a truly great Empire, great big changes must come.”

 LAS_burn_the_casinos:0 “Burn The Casinos”
 LAS_burn_the_casinos_desc:0 “The Casinos of Vegas. The symbol of vice and immorality. These bases of degenerates will be burned down to the ground. It will be our signal to all who reside in this territory that the age of corruption and immorality is no longer.”

 LAS_destroy_hedonism:0 “Destroy Hedonism”
 LAS_destroy_hedonism_desc:0 “Hedonism doesnt just destroy the self. But also brings down great nations. A hedonist does not have discipline nor professionalism; their heads only full with thoughts of debauchery and all sorts of immoral and degenerative thoughts. People like these have no place within our new state and will be purged mercilessly and efficiently ”

 LAS_the_legion_reborn:0 “The Legion Reborn”
 LAS_the_legion_reborn_desc:0 “The degenerates and heathens within our territory have been cleansed for now. And to everyone here, our goals are clear. Today, we will proclaim the rebirth of the Legion. Based on the foundations and virtues of Rome.

 LAS_legio_aeterna:0 “Legio Aeterna”
 LAS_legio_aeterna_desc:0 “The Legion is Eternal, the legion stands strong and alone. We are destined to conquer and rule. The wasteland will be purified. The Continent United and we will exist to see it all.”

 LAS_aeterna_victrix:0 “Aeterna Victrix”
 LAS_aeterna_victrix_desc:0 “Nothing less than victory is acceptable to our legion. We will no longer just be happy with half-measures, capitulation and partial successes. Half-measures and compromise is the reason why America has rotted and collapsed, and the Legion does not intend to follow in its footsteps.”

 LAS_martial_our_men:0 “Martial our Men”
 LAS_martial_our_men_desc:0 “Our legion does not exist to only cling upon this thin slice of land. It exists to expand and conquer. And for this monumental task, we will need men, much more men. Every able bodied man will be recruited into the legion as the main bulk of our fighting force. 

 LAS_establish_the_cult_of_mars:0 “Establish the Cult of Mars”
 LAS_establish_the_cult_of_mars_desc:0 “Mars, the God of war. He is the symbol of legionary military might. Mars represents the ideal legionary. Strong, powerful and ready for conquest. All within the legions rank will revere Mars and his ideals.”

 LAS_instill_loyalty:0 “Instill Loyalty”
 LAS_instill_loyalty_desc:0 “Those who work for us must be completely and utterly loyal to our cause. Unknowingly handing weapons and teachings onto people with dubious loyalty will come back to bite us later, not thinking twice before betraying us. We will make sure this doesnt happen, under any circumstance.”

 LAS_a_living_god:0 “A Living God”
 LAS_a_living_god_desc:0 “Ceasar is not a mere mortal like the slaves and profligates. He is the Son of Mars, a Living God. While the wretched profligates worship dead Jews on sticks or their own hedonism we worship honor, tradition, strength, and loyalty. Mars et Caesar cum legione stant!”

 LAS_teachings_of_the_malpais_legatus:0 “Teachings of the Malpais Legate”
 LAS_teachings_of_the_malpais_legatus_desc:0 “The Malpais Legate teaches us that tasks should not be delayed without reason. Overlooking any small detail or error will only lead to it growing into a bigger problem. We will learn from example, that without foresight and planning a battle is already lost.”

 LAS_teachings_of_legatus_lanius:0 “Teachings of Legate Lanius”
 LAS_teachings_of_legatus_lanius_desc:0 “Legate Lanius, the butcher, teaches us we must not show quarter to our enemies and also to not underestimate them. Enemies of the legion should be crushed brutally and efficiently. Those who are equal in strength shouldnt be thought of as easy game because being cocky also spells doom for the attacker.”

 LAS_hold_a_census:0 “Hold a Census”
 LAS_hold_a_census_desc:0 “To get a better idea of what we have to work with, the legionary command will hold a nationwide census to figure out and plan the best and most effective ways of restructuring society, industry and the military. It will also help us to keep track of our slave population and if any holdouts yet exist.”

 LAS_find_infiltrators:0 “Find Infiltrators”
 LAS_find_infiltrators_desc:0 “To defeat your enemy, first you must know them. We can’t expect the legion to simply go ahead and bang their heads on an enemy we know nothing about. It is stupid and suicidal. Across the country, we will find existing and recruit new agents and informants whose task will be to infiltrate enemy society and the frontlines. Feeding us crucial information, laying out sabotage and even taking down any personnel who might cause a problem for us.”

 LAS_crucify_the_disobedient:0 “Crucify the Disobedient”
 LAS_crucify_the_disobedient_desc:0 “Many think they can disobey our commands and get away with it. But they will be proven wrong. They will be punished for their insolence, but not in private, no. Their fate will be shown across the nation as their bodies stay stuck upon the pole for all to see. To strike fear into the hearts of any opportunist who may dare to think about crossing the path of the Legion.”

 LAS_send_a_message:0 “Send a Message”
 LAS_send_a_message_desc:0 “Its not mindless savagery, its about striking fear in their hearts and minds. To show them what lies for any profligate heathen. No crime will go unpunished, and their fates will be etched into the minds of all to make sure they are constantly reminded.”

 LAS_enforce_loyalty:0 “Enforce loyalty”
 LAS_enforce_loyalty:0 “A loyal legionary fights for the Legion till his last breath, a disloyal one will betray it the moment the opportunity arises. This simply cannot do, any doubt, question or fatigue must be hammered out. Their hearts and minds must be fine tuned to serve the legion wholeheartedly. Loyalty training will be enforced throughout their entire career, remind them of what they are and who they serve, or else.”

 LAS_a_loyal_legion:0 “A Loyal Legion”
 LAS_a_loyal_legion_desc:0 “All are loyal under the banner of the Legion. Heart void of fear and doubt, men marching in unison, completely servile and primed to follow the Legions will. They know better than to betray us or to be corrupted by the lies of profligates. Together we are strong and a force to be reckoned with.”

 LAS_from_vulpes_to_caesar:0 “From Vulpes to Caesar”
 LAS_from_vulpes_to_caesar_desc:0 “Caesar, aka Jason Spisak, before he became our leader served the Legion as the voice actor for Vulpes Inculta in Fallout New Vegas. His dedication to his work turned a character that wouldve been a forgettable messenger into the face of the legion fandom. Now he stands as Caesar, our God. However the legacy of Vulpes will forever be remembered in the heart of our Legion.”

 LAS_nova_roma:0 “Nova Roma”
 LAS_nova_roma_desc:0 “Many people used to call America the new Rome due to many of its similarities, not only in its successes but also in its failures. America was the Roman Republic, its establishment rotted, its morals corrupt, its population degenerate and hedonistic, its army nothing more than bumbling fools carrying the weapons of titans. And now, just as the Roman Republic, America has collapsed under its own rotting carcass. Like a phoenix from the ashes, we rise, like Caesar crossing the Rubicon, like Augustus at Actium the Roman Empire Rises. Here, at this city that once was the place of pilgrimage for the profligates now rises not New Vegas, but Nova Roma”

 LAS_purify_utah:0 “Purify Utah”
 LAS_purify_utah_desc:0 “For what seems like the second time in history. The Mormons have become independent again. Betraying their masters in Denver and attempting to cut out their own land amidst the chaos. But the sudden independence and betrayal of their former masters has left the territory of Utah chaotic and unprepared for the arrival of our Roman Empire. This was shown when they attacked us and our temporary allies. Now its time to secure our borders and bring purification to these lands.”

 LAS_uta_round_up_slaves:0 “Mormon Slaves”
 LAS_uta_round_up_slaves_desc:0 “Historically, Mormons were known for their value of working together, be it building a working civilization from scratch or raising a militia strong enough to cause enough trouble for America’s authority. This will definitely be a good use for us. These slaves will be put to work mainly for construction and repairs. We hope they continue to contribute to the Legion with their labour. Or else.”

 LAS_uta_purge_the_weak:0 “Purge Utah”
 LAS_uta_purge_the_weak_desc:0 “The Mormons have always been the rebellious type, constantly yearning for independence. It is a respectable trait, but one which runs counter to our plans. We will make sure to break these zealots so thoroughly that they may never attempt nor hope to rebel against us. Plus these lands are home to other groups, weaker and unfit for service to our Legion. These people will be strung up as a warning to any profligates who dare oppose our Legion.”

 LAS_purify_california:0 “Purify California”
 LAS_purify_california_desc:0 “California, the land of the profligates. The degeneracy of Vegas scaled up to span an entire nation. California is the complete opposite of what we, the Legion, stand for. And yet as fate destined it to be. California is our biggest challenge and opponent we have yet to fight. So let it, let us spill the blood of our enemies onto the battlefield and may fate and strength decide who will be the victor in this new age for America.”

 LAS_cal_round_up_slaves:0 “Round up Californian Slaves”
 LAS_cal_round_up_slaves_desc:0 “The profligates within California are weak and dull. But surprisingly enough, there are also those who are opposites. It is said that in California lies a large number of these, Latinos and Mexicans. Mexicans were known for their cheap labour and hard work letting the old America exploit their labour well enough. Yes…..we can use this for ourselves greatly, better than the Americans.”

 LAS_cal_purge_the_weak:0 “Purge The Profligates”
 LAS_cal_purge_the_weak_desc:0 “California is the land of hedonists, profligates, degenerates and whatever adjective we can bring up. They are debased. These degenerates give no benefit to the Legion and thus these wealings are to be purged to cleanse our newly acquired territory. Their corpses strung upon the crosses lining roads and highways will remind everyone living under us what new world they live under now.”

 LAS_purify_rockies:0 “Purify The Rockies ”
 LAS_purify_rockies_desc:0 “The North West of America, like every other territory of the former country, has broken off into independent states. Their forest and mountainous regions give them a great vantage for guerillas and underground fighters who may use the territory to launch attacks on our positions. This is not something we can let happen.”

 LAS_rock_round_up_slaves:0 “Enslave the Mountaineers”
 LAS_rock_round_up_slaves_desc:0 “The vast wilderness of the American North East and Cascadia has made it a region prime for hunters, scavengers, lumberjacks, carpenters, and mountaineers. By Legion laws, many of these men will be turned to slaves, and their expertise is to be used for our benefits. Their young enrolled into Legionary schools to be trained and indoctrinated.”

 LAS_rock_purge_the_weak:0 “Purge the Weak”
 LAS_rock_purge_the_weak_desc:0 “The strong consume the weak. It is the law of nature and reality itself. Us and the population within the Rockies are acutely aware of this fact. While this land is home to many who are fit for our Legion, their cities also are home to plenty of weak, useless people. So it is no surprise this is what would have happened eventually. We wont let ourselves be bogged down by dead weight and a bloated, useless populace.”

 LAS_purify_texas:0 “Purify Texas”
 LAS_purify_texax_desc:0 “Texas had always been the most eager for independence. The collapse of America was most welcomed in and greatly benefited Texas. This is why Texas will not easily give up their newly gained freedom. Our goals run counter to theirs, and simply letting them be will also allow the profligates to gain a stronghold. Texas is still fresh and only recently came out of a political and environmental crisis. Now is the best time ever to attack them and put down the Texan spirit.”

 LAS_tex_round_up_slaves:0 “Round up Texan Slaves”
 LAS_tex_round_up_slaves_desc:0 “Texans are one of the more unique tribes within America. Known for their familiarity with their land, frontier mindset and heavy use of firearms. Their skills are highly valuable and many of their ideals can be assimilated into our Legionary structure.”

 LAS_tex_purge_the_weak:0 “Texan Purge”
 LAS_tex_purge_the_weak_desc:0 “Even as many parts of the Texan culture group can be moulded to fit our Legions it will be equally, if not more, difficult to make them snap out of their tribal loyalty. Plus there are many weaklings worth nothing but the cross. But this is what the Legion is made for, no amount of difficulty is too much for us, and we will always come up top to ride along into the new tomorrow with the withering corpses of those unfit to serve line the road.”

 LAS_purify_the_south:0 “Purify the South”
 LAS_purify_rockies_desc:0 “The Confederates, once a doomed delusional rebellion, now resurrected under an equally delusional man. If we werent purging the world of the profligate rot, Kanye and his goons would serve as a perfect example of chem abuse and profligate idiocy. It would take days to list all things wrong with the Confederacy and the failed states born from it. But we are warriors, not poets. Delusional or not, they will be put down all the same.”

 LAS_south_round_up_slaves:0 “Round up the Southerners”
 LAS_south_round_up_slaves_desc:0 “Funnily enough, it is very ironic and absurd considering what we are doing right now. A state who was born for the sole task of holding slavery is now being enslaved by our Legion. The Confederates may have thought only skin color determines who is a slave or not. They were fools to believe such a simple idea. Its strength that determines it, and we have made this fact clear. Let these larpers know what REAL slavery looks like.”

 LAS_south_purge_the_weak:0 “Purge The South”
 LAS_south_purge_the_weak_desc:0 “The Confederacy and its breakaways are filled with nothing more than mentally ill zealots, delusional ideologues and opportunist spineless scum. Degenerates like these are not even fit to be a slave in our Legionary Empire. Their weak willed chem addicted profligate bodies will make great roadsigns.”

