 # Events
 kentucky.1.t:0 "The Rebellion"
 kentucky.1.d:0 "The time has come to oust the Colonel's vile armies and destroy his perverted vision of a degraded Kentucky. Although we may range vastly in terms of ideology, we all share a common goal of wanting to free our beautiful state from the evils of the Colonel. \n\nFOR KENTUCKY!"
 kentucky.1.a:0 "Kentucky, Rise!"
 kentucky.2.t:0 "Beginning of the Continental Congress"
 kentucky.2.d:0 "With the Colonel ousted, the time has come to hold a grand congress on the future of Kentucky! Three parties stand out the most, with the former Democrats organizing into the Labor Party, the Republicans and Libertarians combining forces to create a new Tea Party, and Parrot's National-Bolshevik Traditional Workers Party."
 kentucky.2.a:0 "Three Cheers for Kentucky!"
 kentucky.3.t:0 "Tea Party Celebrations"
 kentucky.3.d:0 "The Tea Party has held state-wide celebrations for the successful revolution, they are very popular."
 kentucky.3.a:0 "You haven't even been elected yet!"
 kentucky.4.t:0 "Labor demand TWP exclusion from the Congress"
 kentucky.4.d:0 "The Labor members participating in the Continental Congress are demanding that the Traditional Workers Party be excluded from the Congress due to their more authoritarian and supremacist nature.\n\nMatthew Parrott has blasted Labor, calling them hypocrites and "just as bad as The Colonel.""
 kentucky.4.a:0 "Here we go..."
 kentucky.5.t:0 "The Tea Party defends the TWP"
 kentucky.5.d:0 "Though making absolutely clear that they do not align in the slightest with the Traditional Workers Party, the Tea Party has stood in their defence saying that they have every right to participate in the Congress. Indeed, Matt Bevin points out that the rebellion may not have even been possible let alone successful without the support of the TWP stormtroopers."
 kentucky.5.a:0 "Who will win the debate?"
 kentucky.6.t:0 "TWP holds rallies against Labor"
 kentucky.6.d:0 "In response to the Labor demand for TWP exclusion, the TWP has held rallies across Kentucky protesting the demand. \n\n"The IRONY!" Matt Parrott was heard shouting. "These so-called defenders of democracy want to ban us from participating in it! Just like the Colonel!""
 kentucky.6.a:0 "I think I can see where this is going..."
 kentucky.7.t:0 "TWP Rallies turn violent"
 kentucky.7.d:0 "The Tradtional Workers Party rallies have begun turning into riots, as members begin firebombing stores and looting, while left-wing militants agitate and counterprotest. Both sides blame each other for the incidents, and it only feels like it will get worse."
 kentucky.7.a:0 "Not another Charlottesville..."
 kentucky.8.t:0 "Congress Bans the Traditional Workers Party"
 kentucky.8.d:0 "In the wake of the violent rallies held by the TWP, the right wing of the Congress has found themselves unable to defend the party anymore and the Labor motion to ban the TWP from participation has passed. May God save Kentucky from this madness."
 kentucky.8.a:0 "Parrott must be livid."
 kentucky.9.t:0 "Parrott protests the ban"
 kentucky.9.d:0 "Using buzzwords such as "unconstitutional" and "undemocratic", Matthew Parrott has blasted the Continental Congress following the ban of his party, the Traditional Workers Party. His supporters are becoming more militant and fervent, with many protests already organized."
 kentucky.9.a:0 "He doesn't matter anymore."
 kentucky.10.t:0 "Traditional Workers Party storms the Congress"
 kentucky.10.d:0 "Following the ban of the TWP from the Continental Congress, their violent activities only multiplied in both scale and nature. During a particularly large rally, members of the TWP storm the Continental Congress in scenes not entirely dissimilar from what happened in D.C. on January 6th 2021."
 kentucky.10.a:0 "The Security Forces successfully beat back the violent protestors"
 kentucky.10.b:0 "Parrott is sneaked in and lets the rioters in"
 kentucky.11.t:0 "Election Day"
 kentucky.11.d:0 "With the Traditional Workers Party now in tatters following the failed coup, and their members being actively persecuted by the full extent of the law, the time has come to decide Kentucky's future. Greg Fischer and Andy Beshear rally their former Democrats, now organized as the Labor Party, while Matt Bevin is given formal leadership of the Tea Party."
 kentucky.11.a:0 "The Tea Party!"
 kentucky.11.b:0 "The Labor Party!"
 kentucky.12.t:0"A Finger Lickin Good Deal"
 kentucky.12.d:0"The Kentucky Civil War is perhaps one of the first proper proxy wars in North America. There are troops supported by Trump's government, Biden's government and us as well. While it is clear that a Trump backed Kentucky would not impact us as badly as a Biden backed Kentucky, we would rather see the state be more aligned with our Southern values. We have reached a deal with various Kentucky government diplomats in order to secure that the civil war lands in favor of the Colonel. If we assist the Colonel's government we will see the state become a satellite of the CSA, which could expand our influence on the continent exponentially. Not to mention a Confederate aligned Kentucky could see a business boom as KFC would effectively be the property of our great leader, Kanye West. Effectively speaking, if the Mad Colonel wins, we win; so let's give them everything they need."
 kentucky.12.a:0"Lets go to kentucky"
 kentucky.13.t:0"Rebels Ask for Support"
 kentucky.13.d:0"Rebels aligned with our cause in Kentucky have reached out to us in desperate need of aid.  Supplying them would be a great boost to their ability at undermining our opponents and will allow us to secure influence in the region."
 kentucky.13.a:0"We support our friends"
 kentucky.14.t:0"The impossible"
 kentucky.14.d:0"Against all odds, we have won in Kentucky. Despite funding from the Trump administration, despite inferior training with out troops we pulled it off. The colonel gave  a speech today decrying his opponents as he televised max executions of the rebel forces. He gave his speech eating a bucket of chicken and spoke of how it takes more than just an orange to take down a chicken, obviously a jab at the Trump administration. We could care less for his celebration. We could care less for the beheadings and the purges. By having a friendly government to the north of us we have greater influence in the region against both the Trump states and the Biden states. This is a victory for us as Confederates. The executives of KFC are celebrating and so are we."
 kentucky.14.a:0"We did it"
 kentucky.15.t:0 "Parrott Offers a Pact"
 kentucky.15.d:0 "[KFC.GetLeader] has come to us with an offer of a military alliance, for the sake of uniting America under a Nationalist, economically left group. However, [KFC.GetLeader] has expressed opinions of racial and ethnic superiority, and believes his following of the Russian Orthodox Faith somehow makes him superior."
 kentucky.15.a:0 "We'll make a deal with the devil"
 kentucky.15.b:0 "Tell that Neo-Nazi scumbag where he can shove his pact."
 kentucky.16.t:0 "No Luck with [NRA.GetLeader]"
 kentucky.16.d:0 "The [FROM.GetAdjective] government has rejected our proposals completely, and even followed it up with a denunciation and all sorts of unsavoury insults.\n\nIt looks like there will be no allying with the NazBols in [FROM.GetName]."
 kentucky.16.a:0 "Did they have to be so rude about it?"
 kentucky.17.t:0 "Kentucky Requests to Join the Loyalists"
 kentucky.17.d:0 ""
 kentucky.17.a:0 "Yes, for the greater good."
 kentucky.17.b:0 "No, we don't need them."
 kentucky.18.t:0 "The Opportunity"
 kentucky.18.d:0 "Taking advantage of the situation we currently find ourselves in, a group of black-nationalist communists have revolted!"
 kentucky.18.a:0 "Crush these commies!"
 kentucky.18.b:0 "For the true revolution!"
 kentucky.20.t:0 "The End of the Hunt"
 kentucky.20.d:0 ""
 kentucky.20.a:0 "We shall make an example of these revolters."
 
 
 kentucky.21.t:0 "Kentucky returns to the fold"
 kentucky.21.d:0 "We have recently been contacted by [KFC.GetName], who have recently self-elected a Pro-Trump president, wishing to fight side by side with the rest of America...\n\n...On the condition of continued autonomy after the Union is restored. What say we?"
 kentucky.21.a:0 "Their fighting spirit will be most valuable."
 kentucky.21.b:0 "No deals with secessionists!"
 kentucky.22.t:0 "[KFC.GetName] Asks for Arms"
 kentucky.22.d:0 ""
 kentucky.22.a:0 "Of Course"
 kentucky.23.t:0 "Confederate Arms Arrive"
 kentucky.23.d:0 ""
 kentucky.23.a:0 "Just what we needed!"
 kentucky.24.t:0 "Our Prey Strikes" 
 kentucky.24.d:0 ""
 kentucky.24.a:0 "We are on their scent..."
 kentucky.25.t:0 "Hunting Prey"
 kentucky.25.d:0 ""
 kentucky.25.a:0 "They've elluded us once more..."
 kentucky.26.t:0 "Going Out For a Hunt"
 kentucky.26.d:0 ""
 kentucky.26.a:0 "A few political assassinations never hurt anyone"
 kentucky.27.t:0 "Today's Prey: Donkey and Elephant"
 kentucky.27.d:0 ""
 kentucky.27.a:0 "But the main prize still got away..."
 kentucky.28.t:0 "The Mad Colonel's Hunt"
 kentucky.28.d:0 "We are hearing unconfirmed reports coming out of [KFC.GetName] about mass state-sponsored political violence. Many question if they can even call it state sponsored, as the company controls everything. Republicans and Democrats unite in a rare occasion to denounce the Colonel's government and demand he immediately step down."
 kentucky.28.a:0 "A Powderkeg waiting to explode..."
 
 fried_chicken.1.t:0 "The West Has Fallen..."
 fried_chicken.1.d:0 "A young boy picks up an apple from the local food mart, a rare treat these days. Though his smile fades after turning the fruit around in his hand, noticing the rotten insides under the otherwise pristine flesh. His mother had told him of such tricks that sellers would make their produce seem fresh, but a small squeeze would show just how far down decay truly went. Suddenly, a voice pierced through the crowd; it came from a single source that entranced those around. A man standing atop a box gave an impassioned speech, which the boy thought would halt the Earth's rotation entirely. \n\nThe boy moved closer, pushing through the crowd, until he saw him. The man seemed to be a military veteran, with a scar across his cheek and a chip missing from his ear. Finally, he could make out the words of the man. "I look around you lot today, and I shed a tear... openly, for what we have lost. I shed a tear openly, for we have all done so privately; don't for a moment deny such a thing. We were once great, our children were safe, oh God, did we have it all in those days. Look what they have done to us, what they stole from us, all for their inability to do what was right. When we dare to even mention such, they denounce us, now and forever. They say we are full of fear, full of prejudice, full of hate for the minorities. My neighbors, do you not see, we are the minorities. Look around you, we, we, we are the minorities for loving our country is a minority, to live free of oppression, to be free from those who mean use harm appears to be a minority opinion. We all know it, in our hearts, that this country is no longer recognizable to the one our parents or their parents built. They came in and they corrupted this once great nation to its core. Even in the good times, when we appeared to be at our greatest, that was only a pretty coat of paint over a rotten core." \n\nAs the man spoke, the boy's heart was engulfed with flames. He looked down at his apple, remembering a time when he did not have to stoop so low as to consume rot. He tightened his grip and threw the apple on the ground, stomping it out, cleansing the rot."
 fried_chicken.1.a:0 ""I will not be a minority, not in my own country.""
 
 fried_chicken.2.t:0 "An American Querfront?"
 fried_chicken.2.d:0 "Matt Parrott straightened his suit, checking over the various little details, something which had become almost ritualistic at this point. Suddenly, the door opened, "They're ready for you, Mr. Parrott. The whole nation may be out there."  \n\nParrott marched up the stairs, taking the stage, placing his hand up to allow his eyes time to adjust to the light. It truly did seem the whole nation was there to see him. Wasting no time, he spoke with vigor, "Neighbors, I come to you in this dire hour, for we are at the threshold of history. In this moment, we decide whether to let our culture die, or do we fight to restore those American values that sprang the greatest empire, which would make the Romans buckle. But you see, neighbors, we can not do this alone, for we are outnumbered and outflanked everywhere we turn. It may be a minority opinion to believe in this once great nation, but I tell you this: I long for the day when I am never a minority again. Is this not what you want as well? Do you not want your children to grow up in a nation surrounded by those who share the same values and culture? Where strange and corrupted ideals won't take their hearts and turn them against you?" \n\nParrott paused, allowing the cheers to roll over him like a tsunami, "You are my family, as dictated by God Almighty, and now we must bring others into the fold. They remain in power because they keep using quiet. So many proper men and women believe just as much as you and I do in a great nation, but they are not given the tools or information to understand why we find ourselves in this predicament. Most just put their heads down and ignore these pressing issues facing the species. So I have but one simple request: if you want to save our nation, our people, our family. Go forth to your neighbors and join them. Speak to them in their language and on their level, connect with them. If they are angry, direct their anger towards our movement. If they are afraid, point to our enemies and make them monsters. If they are poor, show them what was taken from them, those who stole prosperity, their birthright, from them. Do not let them silence you, for we will not go quietly into the night. We will rage, rage until those around us understand how devoted our convictions truly are. God bless you all, and let us make America right again." "
 fried_chicken.2.a:0 "Three cheers for National Bolshevism!"
 
 fried_chicken.3.t:0 "A National Dish"
 fried_chicken.3.d:0 "Earlier today, the Parrott addressed concerns regarding supply lines and food availability for the coming crop season. Recent reports have indicated that food insecurity was on the rise, as the average weight, calorie intake, and rates of malnourished children have all increased based on leaked reports. The Parrott's office has strongly disputed these claims, stating they are "nothing more than an attempt from outside forces to destabilize our great nation." However, official data has demonstrated an increase in food scarcity, though to a lesser extent than the previously leaked reports. In an attempt to avert a potential crisis and regain popular support, the Parrotts have announced the Kentucky National Dish, a bucket of Kentucky Fried Chicken. Additionally, rations of KFC menu items, such as tenders, sandwiches, fries, and much more. The Kentucky Surgeon General, Dr. Sanchez, claimed in a press conference that "the use of fried Chicken in our diets will increase the overall caloric intake of our population, while preserving our precious resources. We want every family from across America to know they can rely on KFC and KFC-affiliated brands to serve them during these trying times." These announcements directly conflict with previous standards, though experts from the administration have stated research will be announced in the coming weeks. "
 fried_chicken.3.a:0 "Man, I wanted Taco Bell..."
 
 fried_chicken.4.t:0 "A Light"
 fried_chicken.4.d:0 "Matt Parrott takes in the morning sky, noting the dancing colors that map up God's mastery over the arts. He walks over to a shelf, examining the books, until his eyes find a journal. Curiosity ignites intrigue as his hand slowly pulls it forth. He did not recognize the book, nor the author, though it was likely placed there by his staff during the renovations. Taking a sip of Coffee, Parrot takes a seat and opens the oddity.\n\n"Everything was perfect, we had achieved objectives beyond our most fanatical member's imagination. Yet for the past few days, that thing has burrowed itself into my mind, laying siege to each of my mind's neurons until its bright light engulfs the essence of my soul. I write this message now as a testimony of what occurred that night."\n\nChuckling to himself, Parrott flipped through the pages. Someone had placed a delectable horror piece, and while he was well-read in most genres, horror often gave him a rush of energy.\n\n"It started a few days ago, after I picked my daughter up. We... we are doing our best these days. Her mother was taken soon after the collapse, but we've made it so far. I had a good, stable job, until recently, of course, and my mental health has passed the new test pushed out recently. All that being said, something happened that night. While watching cartoons with my daughter, I suddenly noticed a flicker in the lights. One moment, we were watching Saturday morning cartoons, then suddenly, the evening news was on before me. I searched the house, looking for that flicker, until I sat down once more. On the table in the corner, it was coming from...the lamp. I know not how long my eyes locked on the lamp, yet the light is buried in my mind; I see its illumination even in sleep. My daughter is staying with her Grandparents, but I have not left the couch. I am afraid of this lamp, but only now do I realize why that lamp is not real..."\n\nParrott let out a loud laugh, pushing aside the absurdity of a lamp being so terrifying, until he noticed a flicker. Turning to his right, Parrot locked eyes with his own lamp; something about it seems off..."
 fried_chicken.4.a:0 "I see... a light."
 
 fried_chicken.5.t:0 "Waking Up"
 fried_chicken.5.d:0 "With each passing day, Parrott found the lamp harder to resist. His mind was drawn to it as if he were a fly. No matter how much he tried, the lamp's light shone through. He tried unplugging it, throwing it away, breaking it, shutting the power to the building off, everything. Yet, every afternoon, the lamp was there, shining bright. The texture was off; the normal cloth felt like cold steel. Weeks went by, and his nation wondered where their leader had disappeared to as he stayed indoors day and night. For a time, he found a balance, allowing the lamp to remain present from a distance. That was until the light seeped into his dreams, and his mind buckled under the strain. He screamed and raged against the light, but nothing could stem to brightness. This cycle continued, with the light growing in intensity, ultimately leading to his entire room being swarmed in its embrace. The blinding light struck him like a spear, and Parrott, exhausted and weak, fell asleep for the first time in days."
 fried_chicken.5.a:0 "Whe-where am I?"
 
 fried_chicken.6.t:0 "Reality"
 fried_chicken.6.d:0 "Parrott shut out of bed, blinded by the bright light flowing from every corner of his room, until the reality smashed against the cliffs of his psyche. He was not home; this was some foreign place unknown to him or his followers. Suddenly, his attention is snapped forward, and a pair of medical professionals enters the room. Parrott attempts to launch towards them, but feels the tension of restraints, withdrawing any escape attempt.\n\nThe younger doctor stepped forward, "Good evening, Mr. Parrott. I am Dr. Wilson, and this is Dr. Gregory. We have received reports of extreme distress from untreated mental conditions that impact your ability to function within normal levels. If you are willing to cooperate with us, we can all tackle this together, allowing you to get back on your feet sooner rather than later. Can you tell us about any dreams that occurred during your sleep?"\n\n Dr. Gregory flanked the bed, walking with a noticeable limp. Sweat began flowing from every pore as Parrott continued to strain against the chains. These doctors must be a form of trickery; this simply can not be. "Do you know who I am? Do you not recognize my face or those who are surely on their way this moment? My name is Matt Parrott, I am the leader of these great United States, and I will not be left to the care of a crippled or semite."\n\nThe men wrote something down in their journal, "And how did you become the leader of America, Mr. Parrott?" \n\nBewilderment crossed his face, "What? How could you..." Something about this room only now presented itself to Parrott, the clock to his left. It was an old analog clock, one he remembered as a child, and then he looked forward to the calendar. The year, no, that could not be, the year was 1980."
 fried_chicken.6.a:0 "THIS CAN'T BE, THEN WHAT HAVE I BEEN DOIN-"
 
 fried_chicken.7.t:0 "UN Extremist Studies Subject Matt Parrott"
 fried_chicken.7.d:0 "The UN General Assembly gathered at the capital, New York City, as a celebration of humanity's greatest achievement, unifying as one. Secretary General Stacy Abrams took the stage, presented a triumphant speech on how far we all had come. She noted the elimination of certain diseases, such as Tuberculosis, Measles, and HPV. Further, the 20 sustainable development goals were achieved 3 years ahead of schedule, and Earth was fueled largely through Solar, Nuclear, and Hydroelectricity, contributing to the stability of global temperatures. Her final point addressed the need for expanding our space exploration capabilities and the continued demilitarization of states. "The Solar System is our destiny, friends. Let us put down arms and build towards a greater tomorrow, one where our children hold the stars themselves within their fingers." \n\nMeanwhile, the extremist Matt Parrott continues to be observed by UN psychologists and medical professionals. The man's delusions were so strong that he was deemed a permanent danger to peace and stability. His conviction that he was the ruler of America and his ability to stoke fears in an uneducated populace led to multiple revolts against local governments. Through these events, in a small part, led to the establishment of a united humanity. His actions were so violent and violent, that many started to view each other as human, rather than the "other". On the anniversary of the Universal Declaration of Humanity, Secretary Abrams visited Parrott. "I know you're hate remains strong, but I want to thank you. I thank you for we could never have done this without you. While those actions are evil, ironically, you may have indirectly saved far more lives in the long run. Maybe one day, you will be able to come home; until then, just live each day trying to make them better than the last. Sleep well, Comrade.""
 fried_chicken.7.a:0 "So delusional he convinced himself that a different reality was real..."
 
 fried_chicken.8.t:0 "[KFC.GetName] Requests the Return of the Jackson Purchase!"
 fried_chicken.8.d:0 "[KFC.GetName] kindly requests that we return the Jackson Purchase now that they have aligned with us. This area was a part of the former state of Kentucky, and they want to prove their loyalty as a Loyalist Kentucky that is fully united."
 fried_chicken.8.a:0 "Sure"
 fried_chicken.8.b:0 "Better under our management"
 
 fried_chicken.9.t:0 "[KFC.GetName] Wants to Join Our Faction!"
 fried_chicken.9.d:0 ""
 fried_chicken.9.a:0 "Sure"
 fried_chicken.9.b:0 "Screw off"
 
 fried_chicken.10.t:0 "Gambling the Fiscal Year [GetYear] Budget" 
 fried_chicken.10.d:0 "Gov. Beshear has announced an audacious plan to fund his fiscal policies for the coming year, with multiple new initiatives being brought into the state, with the programs taking the most attention coming in the form of gambling. While this move was unexpected, the legalization of gambling was not unprecedented. Before the collapse, in 2018, the Supreme Court ruled the federal ban on gambling to be unconstitutional, leading to movements to legalize such acts across the formerly united states. Additionally, the Kentucky lottery system ran continuously until late 2020, while the Kentucky Derby generates millions through online betting worldwide. In fact, it was reports from the previous Derby that spurred Beshear to bring back our state lottery, along with the legalization of gambling. While some from the more conservative walks of the state government protested this decision, citing biblical teachings and the fears that these actions will drive men to sin, the Governor seems to have compromised with both sides by using the revenue to directly fund school and infrastructure programs to revitalize our population. Based on the early projections, roughly $500,000 of additional tax revenue is expected to stem directly from these initiatives. It appears that Mr. Beshear bet it all on black and pulled it off; time will tell if he doubles down."
 fried_chicken.10.a:0 "I'm on a hot streak Ma!"
 
