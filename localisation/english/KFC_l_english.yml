 ### Dem KFC Joint Tree
 KFC_FRA_VIR_legitimists_in_kentucky:0 "A Legitimist Kentucky"
 KFC_FRA_VIR_legitimists_in_kentucky_desc:0 "After many long and hard fought battles, Kentucky can finally join the legitimate side in the Second American Civil War."
 KFC_FRA_VIR_receive_dc_funding:0 "Receive Funding from DC"
 KFC_FRA_VIR_receive_dc_funding_desc:0 "Kentucky has a large deficit due to large development projects. Funds from the Washington Government would prove to be vital."
 KFC_FRA_VIR_request_assistance_with_faring_mechanization:0 "Request Assistance With Farming Mechanization"
 KFC_FRA_VIR_request_assistance_with_faring_mechanization_desc:0 "Our lands, while not as fruitful as those in the Plains or California, are still capable of feeding our people. With technology and mechanisation, we can maximize our agricultural output and compete with Trump’s agricultural production."
 KFC_FRA_VIR_rebuild_factories:0 "Rebuild Factories"
 KFC_FRA_VIR_rebuild_factories_desc:0 "The civil war has devastated the industry of every state in our Union. We must use our combined resources and invest into rebuilding our light and heavy industries."
 KFC_FRA_VIR_join_research_sharing:0 "Joint Research Sharing"
 KFC_FRA_VIR_join_research_sharing_desc:0 "It’s only logical we put our nation’s brightest minds together. By sharing our knowledge we will all grow stronger as a union."
 KFC_FRA_VIR_fourth_research_slot_locked_behind_state_control:0 "Diffusion of Research"
 KFC_FRA_VIR_fourth_research_slot_locked_behind_state_control_desc:0 "With the success of our joint research, the logical next step is further investment into our own research facilities."
 KFC_FRA_VIR_industrial_revitalization:0 "Industrial Revitalization"
 KFC_FRA_VIR_industrial_revitalization_desc:0 "Our recent collaboration and investments with our allies have given way into a small industrial boom within our territory. The more factories producing goods, both civilian and military, the more capable we will be to face our enemies."
 KFC_FRA_VIR_expand_infrastructure:0 "Expand Infrastructure"
 KFC_FRA_VIR_expand_infrastructure_desc:0 "With shared investments and expertise, we can help our allies develop their infrastructure wherever they lack it."
 KFC_FRA_VIR_espionage_integration:0 "Espionage Integration"
 KFC_FRA_VIR_espionage_integration_desc:0 "With intelligence becoming as important as ever in modern warfare, any experience and help our allies could provide would be greatly appreciated."
 KFC_FRA_VIR_fortify_the_borders:0 "Fortify the Borders"
 KFC_FRA_VIR_fortify_the_borders_desc:0 "Unlike Trump’s plan of building a wall along our southern border, these fortifications will help us repel an actual invasion. Primarily from Trump in fact."
 KFC_FRA_VIR_scare_trump:0 "Ready for Trump"
 KFC_FRA_VIR_scare_trump_desc:0 "The men are ready, the guns are loaded, and the explosives are armed. Together with our allied states, we are as ready as we will ever be for a restarted war against Trump and his band of traitors."
 KFC_FRA_VIR_increase_resource_extraction_efforts:0 "Increase Resource Extraction Efforts"
 KFC_FRA_VIR_increase_resource_extraction_efforts_desc:0 "Kentucky’s land is rich in resources the Federalist cause is always in need of to reunite our nation. We would be fools not to use them."
 KFC_FRA_VIR_solve_border_dispute_with_vir:0 "Solve the Virginian Border Dispute"
 KFC_FRA_VIR_solve_border_dispute_with_vir_desc:0 "Early on in the war, the Coronel invaded the chaotic state of Virginia and took over the Cumberland Gap. Now that Kentucky is an ally, they should have no issue returning the land to their rightful owners after we ensure they will be paid a proper compensation."
 KFC_FRA_VIR_the_best_of_friends:0 "The Best of Friends"
 KFC_FRA_VIR_the_best_of_friends_desc:0 "<3"
 KFC_FRA_VIR_joint_training:0 "Joint Training"
 KFC_FRA_VIR_joint_training_desc:0 "Our southern allies have plenty of combat experience. Organizing joint training is a surefire way to increase our collective military capacity."
 KFC_FRA_VIR_provide_reports_from_kfc_civil_war:0 "Provide Combat Reports from the Liberation War"
 KFC_FRA_VIR_provide_reports_from_kfc_civil_war_desc:0 "Our proud allies in Kentucky gained a lot of experience on both sides of guerrilla warfare and facing mercenary forces. This experience is incredibly useful to our commanders."
 KFC_FRA_VIR_invade_west_virginia:0 "Invade West Virginia"
 KFC_FRA_VIR_invade_west_virginia_desc:0 "Ah, West Virginia. One of the most beautiful states in our nation, which was sadly taken over by ruthless corporations and madmen. With our gallant allies we surround the state and we have a perfect chance to free the people of West Virginia once and for all."
 
 #Nazbol Joint Tree
 KFC_NRA_VIR_joint_nazbol:0 "A National-Bolshevik Union"
 KFC_NRA_VIR_joint_nazbol_desc:0 "Being realistic, there is no way to unite the United States of America on our own. We must gather allies for our victory."
 KFC_NRA_VIR_the_pact_of_blood:0 "The Pact of Blood"
 KFC_NRA_VIR_the_pact_of_blood_desc:0 "We are brothers in arms, bound by blood. Our struggle is one."
 KFC_NRA_VIR_train_new_storm_troopers:0 "Train Storm Troopers"
 KFC_NRA_VIR_train_new_storm_troopers_desc:0 "Our ideology needs a paramilitary wing to enforce our policies domestically and secure the party itself."
 KFC_NRA_VIR_sponsor_military_parades:0 "Sponsor Military Parades"
 KFC_NRA_VIR_sponsor_military_parades_desc:0 "The best way to show our collective success is through military parades!"
 KFC_NRA_VIR_indoctrinate_the_army:0 "Indoctrinate Our Armies"
 KFC_NRA_VIR_indoctrinate_the_army_desc:0 "Collectively indoctrinating our militaries using a standard method will bolster the loyalty of all soldiers who fight for the Charleston Pact."
 KFC_NRA_VIR_pool_research_funds:0 "Pool Research Brains"
 KFC_NRA_VIR_pool_research_funds_desc:0 "We are currently very lacking individually in terms of technological expertise. Working with our brothers in arms will aid in our research and development."
 KFC_NRA_VIR_the_wonder_weapons:0 "Wunderwaffen"
 KFC_NRA_VIR_the_wonder_weapons_desc:0 "Yes that's it! There's the weapon that will give us our ultimate victory!"
 KFC_NRA_VIR_embrace_eugenics:0 "Embrace Eugenics"
 KFC_NRA_VIR_embrace_eugenics_desc:0 "Eugenics are a wondrous thing that ensures in the future all whites will be as beautiful and pure as possible. We must take great strides into ensuring the success of these policies."
 KFC_NRA_VIR_adopting_pseudoscience:0 "Adopt Pseudoscience"
 KFC_NRA_VIR_adopting_pseudoscience_desc:0 "What some call lies we call alternative facts. We will not tolerate the lies of the liberal mainstream scientists any longer!"
 KFC_NRA_VIR_the_minority_question:0 "The 'Minority Question'"
 KFC_NRA_VIR_the_minority_question_desc:0 "Hmmmm..."
 KFC_NRA_VIR_increase_pay_for_white_workers:0 "Increase Pay for White Workers"
 KFC_NRA_VIR_increase_pay_for_white_workers_desc:0 "White workers have been robbed for decades through policies like Affirmative Action. Time for compensation!"
 KFC_NRA_VIR_strip_minority_worker_protection:0 "Strip Minority Labor Rights"
 KFC_NRA_VIR_strip_minority_worker_protection_desc:0 "If they’re going to be in our country, they better work ten times more than a white man at the very least."
 KFC_NRA_VIR_send_minorities_to_the_mines:0 "Send Minorities to the Mines!"
 KFC_NRA_VIR_send_minorities_to_the_mines_desc:0 "The MINERities are miners now."
 KFC_NRA_VIR_reunification:0 "Unification"
 KFC_NRA_VIR_reunification_desc:0 "It is time to let the world know the American White working class stands united together!"
 KFC_NRA_VIR_a_union_of_equals:0 "A Union of Equals"
 KFC_NRA_VIR_a_union_of_equals_desc:0 "We have all done our work in fighting for the White Working Class and deserve our on slice of the pie."
 
 
