l_english:
 KFC_state_beneath_his_feet:0 "A State Beneath His Feet"
 KFC_state_beneath_his_feet_desc:0 "Though the Mad Colonel and his mercenary army of sellswords and foreigners may trample us and subdue us, there's no reason for us not to resist! We'll form a new Kentucky, a state right beneath his feet."
 KFC_organising_dissidence:0 "Organising Dissidence"
 KFC_organising_dissidence_desc:0 "We're not gonna stand a chance unless we organise and prepare. Random, spontaneous bouts of civil dissidence will be easily quelled by the Colonel's armies."
 KFC_face_of_kentucky:0 "The Face of Kentucky"
 KFC_face_of_kentucky_desc:0 "Brigadier General Brian Howay was one of the few high ranking officers to stay behind in Kentucky during that election business in D.C., and when the Colonel came with his private army he had no choice but to submit. But in secret, he shall organise and prepare a great rebellion!"
 KFC_the_mayor:0 "The Mayor"
 KFC_the_mayor_desc:0 "Mayor of Louisville Greg Fischer has shown himself to be a valuable asset to the dissidence movement, openly speaking out against and attacking The Colonel. His position protected by his people, Louisville is one of the only places in all of Kentucky safe from the Colonel's grasp. We'll contact him, and see if he can help us organise a rebellion."
 KFC_the_traditionalist:0 "The Traditionalist"
 KFC_the_traditionalist_desc:0 "Another valiant, though relatively unpopular, fighter against The Colonel is Neo-Nazi Matthew Parrott. Though under normal circumstances we wouldn't even consider working with him... we are not in normal circumstances. His group, the New Traditionalist Worker's Party, has been one of the most effective faucets of armed resistance to The Colonel, and we'd do well to enlist his support."
 KFC_the_populist:0 "The Populist"
 KFC_the_populist_desc:0 "Matt Bevin, former governor of Kentucky, has been leading the largest state-wide resistance movement, primarily supported by the Tea Party. Enlisting his support will be essential to secure the popular mandate to oust The Colonel."
 KFC_louisville_pd:0 "Secure the Louisville PD"
 KFC_louisville_pd_desc:0 "Using our new connection, we can contact the Louisville Police Department and ensure their support for us when the time comes."
 KFC_harass_merc_supplies:0 "Harass Mercenary Supply Lines"
 KFC_harass_merc_supplies_desc:0 "Parrott is no stranger to nor does he have any quarrel with terrorism. We'll sabotage the supply liines of The Colonel's private army, and damage his ability to quickly react to opposition."
 KFC_meet_tea_party:0 "Meet with the Tea Party"
 KFC_meet_tea_party_desc:0 "The Tea Party is a patriotic libertarian organisation which wants to return to the days of the American Revolution. We'll give them their revolution!"
 KFC_utilise_connections:0 "Utilise US Conference of Mayors Connections"
 KFC_utilise_connections_desc:0 "As elected president of the US Conference of Mayors, Fischer has countless connections all across the United States. We should try and garner support for our rebellion from outside Kentucky."
 KFC_buy_time:0 "Buy Time"
 KFC_buy_time_desc:0 "By adopting the TWP's advanced tactics for maintaining secrecy and hiding from The Colonel, we can buy a lot of time before we are forced out into the open."
 KFC_1776:0 "The 1776 Division"
 KFC_1776_desc:0 "Military veterans from across Kentucky are flocking to the Tea Party in a form of armed resistance known as the '1776 Division'. We would do well to employ their capabilities."
 KFC_time_is_right:0 "The Time Is Right!"
 KFC_time_is_right_desc:0 "We have gained all our allies and prepared all our men! Now's the time to push the wicked Colonel and his foreign armies out of our Kentucky!"
 KFC_second_constitutional_convention:0 "The Second Constitutional Convention"
 KFC_second_constitutional_convention_desc:0 "With the Mad Colonel and his insanity overthrown, we have finally achieved freedom! Now is time to call a great convention to decide the future of Kentucky."
 KFC_the_governor:0 "The Governor"
 KFC_the_governor_desc:0 "Former Governor Andy Beshear is an extremely popular figure. Rallying behind him might give us the boost we need to defeat the Colonel."
 KFC_sway_the_national_guard:0 "Sway the National Guard"
 KFC_sway_the_national_guard_desc:0 "Some in the National Guard are still loyal to their former governor. We can use their help to defeat the Mad Colonel."
 KFC_donors_from_fra:0 "Donors from [FRA.GetName]"
 KFC_donors_from_fra_desc:0 "Beshear is the only one that can ensure a Legitimist Kentucky! We can use this as leverage to gain support from the [FRA.GetName]."
 
 
 
 KFC_rise_of_evil:0 "Rise of Evil"
 KFC_rise_of_evil_desc:0 "Matthew Parrott's Traditionalist Worker's Party has couped the Constitutional Convention, and secured control of Kentucky! They promise peace, socialism and prosperity, but they have other ideas in mind..."
 
 KFC_kentucky_stormtroopers:0 "Kentucky Stormtroopers"
 KFC_kentucky_stormtroopers_desc:0 "We'll make elite units of Stormtroopers to overrun the enemy's lines and destroy them."
 KFC_conscript_coloureds:0 "Conscript Coloureds"
 KFC_conscript_coloureds_desc:0 "One thing Hitler got wrong back in the 40s was simply keeping ethnic unpleasantries in camps. They took up resources, they didn't help the war effort. The Soviets had a good idea with Penal Battalions. We'll conscript our ethnics into suicide battalions (moderated with White Officers, naturally.)"
 KFC_awaken_white_working_class:0 "Awaken the White Working Class"
 KFC_awaken_white_working_class_desc:0 "We have the potential to do whatever we want. We built empires. We spread Christianity. It's a white man's world, you're just living in it!"
 KFC_groundwork_for_a_navy:0 "Groundwork for our Navy"
 KFC_groundwork_for_a_navy_desc:0 "Now that we have access to the sea, we must ensure our coast stays protected from the enemies of the white race."
 KFC_our_own_gestapo:0 "Our Own Gestapo"
 KFC_our_own_gestapo_desc:0 "The German Gestapo was brilliant in ensuring the safety of the German volk from its enemies, and we must have our own guarantees."
 KFC_integrate_nationalist_militias:0 "Integrate White Nationalist Militias"
 KFC_integrate_nationalist_militias_desc:0 "There are many groups that share a similar view on what the future of our nation should be. We need all the help we can get, and we shouldn't let minor issues get in the way of our common goals."
 KFC_adapting_from_the_cw:0 "Adapting from the Civil War"
 KFC_adapting_from_the_cw_desc:0 "Fighting the Colonel has shown us how underprepared we were to fight our larger neighbors. We must adapt our armed forces to remedy this."
 KFC_follow_guderians_doctrine:0 "Follow Guderian's Doctrine"
 KFC_follow_guderians_doctrine_desc:0 "Heinz Guderian was a visionary! Mobile warfare was and still is the future!"
 KFC_dominate_the_skies:0 "Dominate the Skies"
 KFC_dominate_the_skies_desc:0 "We must ensure our skies are safe from any enemy attack."
 KFC_accelerate_fighter_research:0 "Accelerate Fighter Research"
 KFC_accelerate_fighter_research_desc:0 "We have fallen behind in aircraft  development compared to other American states. We must advance ourselves and progress past the others."
 KFC_drone_innovations:0 "Drone Innovations"
 KFC_drone_innovations_desc:0 "Drones are relatively cheap and extremely effective compared to traditional CAS. A worthy investment."
 KFC_enhancing_flight_doctrine:0 "Enhancing Flight Doctrines"
 KFC_enhancing_flight_doctrine_desc:0 "We must standardize our flight strategies in order to dominate the skies."
 KFC_pride_of_the_white_race_the_airforce:0 "The Airforce: Pride of the White Race"
 KFC_pride_of_the_white_race_the_airforce_desc:0 "Our airforce and its might is something we are proud about and something we can show off to the rest of the world."
 
 KFC_american_legion:0 "The American Legion"
 KFC_american_legion_desc:0 "We'll create a crack team of troops to send around America, as our agents for the TWP."
 KFC_invade_appalachia:0 "We need those coal mines!"
 KFC_invade_appalachia_desc:0 "To our North lies the land of Appalachia. We need those coal mines to fuel our war effort- attack!"
 KFC_a_possible_ally:0 "A Possible Ally?"
 KFC_a_possible_ally_desc:0 "With Tucker Carlson's revolution in Appalachia, he has formed a government that is both conservative and socialist. Perhaps we have more in common than he would think..."
 KFC_we_are_appalachia:0 "We're the Appalachia, Now."
 KFC_we_are_appalachia_desc:0 "With Appalachia conquered, there is no sense in continuing to call ourselves 'Kentucky'. We're Appalachia, now."
 KFC_the_empire_of_kentucky:0 "Our New Empire"
 KFC_the_empire_of_kentucky_desc:0 "Kentucky will be remembered, centuries from now, not as a subserviant state but as a glorious Empire!"
 KFC_hegemony:0 "American Hegemony"
 KFC_hegemony_desc:0 "We are the legitimate successor state to America!"
 KFC_nazbol_confederacy:0 "A Bolshevist Confederacy"
 KFC_nazbol_confederacy_desc:0 "The CSA had a right idea- the first one, that is. White rule over all, but we shall improve on that with socialist economics. However, this abomination to our South is nothing like this. We shall put Kentucky forward as a successor to the Confederacy."
 KFC_crush_free_state:0 "Crush the Free State"
 KFC_crush_free_state_desc:0 "The [AFS.GetName] has been a thorn to our north for far too long. They must be dealt with."
 KFC_crush_virginia:0 "Anschluss Virginia"
 KFC_crush_virginia_desc:0 "Virginia is the last of the major Appalachian states that are free from our control, something that will change in the near future..."
 KFC_another_ally:0 "Another Ally?"
 KFC_another_ally_desc:0 "The rise of Jackson Hinkle in Virginia brings to power someone with a similar ideology in mind to govern the state. Perhaps we can reach out to them and form an alliance?"
 KFC_intervene_in_tennesee:0 "Intervene in Tennessee"
 KFC_intervene_in_tennesee_desc:0 "The Dixie Collapse has provided a golden opportunity for us to seize the southernmost parts of Appalachia."
 KFC_a_stranglehold_over_appalachia:0 "A Stranglehold Over Appalachia"
 KFC_a_stranglehold_over_appalachia_desc:0 "All of Appalachia now falls under our control. The National-Bolshevik movement can now solidify itself on the American Great Game."
 KFC_on_the_road_to_reunification:0 "The Road to Reunification"
 KFC_on_the_road_to_reunification_desc:0 "We are now in a position to pursue full reunification of the former United States of America. For the White American Working Class!"
 KFC_utilize_new_resources:0 "Utilize New Resources"
 KFC_utilize_new_resources_desc:0 "Our recent integration of conquered territories has netted us a great deal of resources we can now use to further our goals."
 KFC_turn_our_attention_northeast:0 "Turn Our Attention Northeast"
 KFC_turn_our_attention_northeast_desc:0 "These globalist scum have ruined America for too long. Their reign comes to an end now."
 KFC_end_the_great_replacement:0 "End White Exploitation in the Great Lakes"
 KFC_end_the_great_replacement_desc:0 "The Great Lakes have been controlled by the mega corporations that exploit our workers. We must free the white workers from this tyranny."
 KFC_the_true_maga_movement:0 "The True MAGA Movement"
 KFC_the_true_maga_movement_desc:0 "Donald Trump and his Republican Party have pretended to fight for the white working class while bowing down to the whims of corporations at the same time. We must show America that we are the true Make America Great Again movement."
 KFC_reign_in_north_rockies:0 "Return the North Rockies to the Fold"
 KFC_reign_in_north_rockies_desc:0 "We must continue our push westward by taking Montana, Wyoming, and Idaho."
 KFC_ally_awd:0 "Ally the AWD"
 KFC_ally_awd_desc:0 "We go a long ways back with the [HOP.GetName]. We can use our past connections as an advantage."
 KFC_support_the_northwest_front_initiative:0 "Support the Northwest Front"
 KFC_support_the_northwest_front_initiative_desc:0 "The Northwest Front Initiative, like us, want to save white Americans from globalist threats. We can find common ground."
 KFC_crush_suth_rocky_degenerates:0 "Crush South Rocky Degenerates"
 KFC_crush_suth_rocky_degenerates_desc:0 "The South Rockies are filled with Mormons, Natives, Illegals, and many more degenerates. We need to save this area from itself."
 KFC_reject_the_social_revolution_invade_west_coast:0 "Reject the West Coast Social Revolution"
 KFC_reject_the_social_revolution_invade_west_coast_desc:0 "Although we may see eye-to-eye on many economic issues with the Communists on the West Coast, their social revolution is something that throws the white American under the bus and we cannot stand for it!"
 KFC_finish_the_confederacy:0 "Finish the Confederacy"
 KFC_finish_the_confederacy_desc:0 "The Confederacy is filled with people that support our cause and people that want to end us for good. We must clean it up and ensure our supporters win."
 KFC_save_the_border_texas:0 "Secure the Texan-Mexican Border"
 KFC_save_the_border_texas_desc:0 "Many illegals still enter America through Texas. We must secure this border using our own means, as the Texan government has proved to be incompetent." 
 KFC_save_florida_from_illegals:0 "Save Florida From Illegals"
 KFC_save_florida_from_illegals_desc:0 "There are also many illegals living in Florida that must be purged."
 KFC_traditional_america_for_the_white_working_class:0 "A Traditionalist America for the White Working Class"
 KFC_traditional_america_for_the_white_working_class_desc:0 "We have finally done it, we can proclaim a new America under our vision for the future!"
 
 KFC_peace_socialism:0 "Peace and Socialism"
 KFC_peace_socialism_desc:0 "The Traditional Worker's Party stands for peace and socialism"
 KFC_root_out_opposition:0 "Root Out Opposition"
 KFC_root_out_opposition_desc:0 "Despite securing our rule in the bloody coup, the Tea Party is still very much alive and Fischer's heirs continue to oppose our rule. It's time for a purge, I think."
 KFC_seize_the_means:0 "Seize the Means of Production"
 KFC_seize_the_means_desc:0 "We must seize the means of production in order to secure a future for our children and the white race."
 KFC_stalinism:0 "Stalinism"
 KFC_stalinism_desc:0 "Stalin wasn't perfect- but he had some good ideas."
 KFC_strasserism:0 "Strasserism"
 KFC_strasserism_desc:0 "Now Strasser was a guy who had good ideas! It's a shame he never took power in his time."
 KFC_protect_christian_identity:0 "Protect Christian Identity"
 KFC_protect_christian_identity_desc:0 "Christianity has been under attack for far too long in the United States. We must protect our cultural and religious identity."
 KFC_the_west_has_fallen:0 "The West Has Fallen"
 KFC_the_west_has_fallen_desc:0 "The West has fallen, our darkest dreams have come true. From globalists to terrorist muslims and Satanic gays, we are under siege."
 KFC_white_welfare:0 "White Welfare"
 KFC_white_welfare_desc:0 "We must defend the white race from exploitation by greedy globalist corporations!"
 KFC_the_real_reparations_for_crime:0 "The Real Reparations"
 KFC_the_real_reparations_for_crime_desc:0 "Many have demanded that the white race be punished for slavery. However, what of the financial damages from disproportionate crime? Hmmmm...."
 KFC_cultural_protection_laws:0 "Cultural Protection Laws"
 KFC_cultural_protection_laws_desc:0 "To ensure that the disaster of the last century cannot repeat, we have taken measures to prevent the erasure of white culture."
 KFC_combat_drug_use:0 "Combat Drug Use"
 KFC_combat_drug_use_desc:0 "Drugs have ruined our nation and dragged a large portion of our people to Satanic gayism. We must stop the flow of this substance."
 KFC_a_new_querfront:0 "A New 'Querfront'"
 KFC_a_new_querfront_desc:0 "The Querfront was the alliance of the nationalists and the far left during the Weimar period of Germany. We all want the same thing, the best for the white American race."
 KFC_rewrite_history_books:0 "Rewrite History Books"
 KFC_rewrite_history_books_desc:0 "The history books paint us in a biased light. Something about "not letting history repeat itself" or whatever. That must change."
 KFC_a_new_national_dish:0 "A New National Dish"
 KFC_a_new_national_dish_desc:0 "We must decide a national dish to bolster pride..."
 KFC_patrol_the_cities:0 "Patrol the Cities"
 KFC_patrol_the_cities_desc:0 "There are many cities where illegals and Satanic gays roam freely. We must recruit to stop them."
 KFC_combat_demographic_issue:0 "Combat the Demographics Issue"
 KFC_combat_demographic_issue_desc:0 "For many decades now, the White population has been losing its percentage of the total American population. Not only that, birthrates have also been falling. We must fix these issues if we are to survive as a nation."
 KFC_close_nonwhite_immigration:0 "Close Non-White Immigration"
 KFC_close_nonwhite_immigration_desc:0 "The non-white immigrants have been sucking our country dry without leaving anything of value in return. We must stop their exploitation!"
 KFC_sterilize_those_who_arent_needed:0 "Sterilization Programs"
 KFC_sterilize_those_who_arent_needed_desc:0 "There are many methods to decrease unwanted populations..."
 KFC_outlaw_abortion:0 "Outlaw Abortion"
 KFC_outlaw_abortion_desc:0 "Abortion is murder, plain and simple. It's not like the other things we have done are murder."
 KFC_guarantee_childcare:0 "Guarantee Childcare"
 KFC_guarantee_childcare_desc:0 "All white babies deserve the proper care they need!"
 KFC_white_workers_paradise:0 "A Paradise for White Workers"
 KFC_white_workers_paradise_desc:0 "We have done it, we have now ensured that our citizens are taken care of."
 
 KFC_a_new_beginnning:0 "A New Beginning"
 KFC_a_new_beginnning_desc:0 "A new dawn has come for America, a dawn of a new Golden Age."
 KFC_assessing_what_we_have:0 "Assessing What We Have"
 KFC_assessing_what_we_have_desc:0 "Now that we have control over most of the former United States, we can see the cards we have been dealt with in order to accomplish our dreams."
 KFC_setting_up_reservations:0 "Setting Up Reservations"
 KFC_setting_up_reservations_desc:0 "Separate, but not equal!"
 KFC_nationalize_nonwhite_property:0 "Nationalize Non-White Property"
 KFC_nationalize_nonwhite_property_desc:0 "Anything that serves a minority is a nuisance, but anything the state can use but also serves a minority is a travesty we must not allow."
 KFC_a_white_ethnostate:0 "A White Ethnostate?"
 KFC_a_white_ethnostate_desc:0 "Almost, not quite there yet, but almost. Our dream will be accomplished by future generations.\n\nHm? What's that light?"
 KFC_looking_outwards:0 "Looking Outwards"
 KFC_looking_outwards_desc:0 "Now that we have consolidated our position in America, we can turn our attention to the world stage."
 KFC_retreat_into_isolation:0 "Retreat Into Isolation"
 KFC_retreat_into_isolation_desc:0 "There's no point dealing with other countries around the globe when we have a paradise at home."
 KFC_saving_canada:0 "Saving Canada"
 KFC_saving_canada_desc:0 "Like America, Canada has always been a white nation, but it is now in grave danger from immigrants and psychotic liberals alike. We must march and save our northern brothers."
 KFC_end_the_flow_of_drugs_for_good:0 "End the Flow of Drugs for Good"
 KFC_end_the_flow_of_drugs_for_good_desc:0 "Ever since Polk failed to destroy Mexico in 1848, America, if not the entire white world has been feeling its negative effects. From drugs to immigrants to shitty music, we must solve this question once and for all, for the wellbeing of all white children."
 
 
 KFC_washington_of_kentucky:0 "Washington of Kentucky"
 KFC_washington_of_kentucky_desc:0 "With the Tea Party comiing out on top in the Constitutional Convention, the so-called 'Washington of Kentucky' Matt Bevin has become the provisional president."
 KFC_contact_trump:0 "Contact Trump"
 KFC_contact_trump_desc:0 "Trump is the rightful president of the United States- and the rightful president of Kentucky!"
 KFC_independence:0 "Declare Independence"
 KFC_independence_desc:0 "We shall declare an independent Kentucky Republic."
 KFC_red_blot:0 "The Red Blot on the East Coast"
 KFC_red_blot_desc:0 "We are surrounded. Our enemies are numerous. We should prepare to hold a last stand from all sides."
 KFC_industrial_support:0 "Industrial Support"
 KFC_industrial_support_desc:0 "By working closely with Trump, we can both benefit "
 KFC_military_support:0 "Military Support"
 KFC_military_support_desc:0 "Same as before... this time with guns!"
 KFC_tea_party_rallies:0 "Tea Party Rallies"
 KFC_tea_party_rallies_desc:0 "We shall cement our rule by holding Tea Party rallies across the country!"
 KFC_donations:0 "Foreign Donations"
 KFC_donations_desc:0 "From across America, there are many people, especially people in high places, who are committed to the cause the Tea Party presents. They are willing to contribute... sizable donations."
 KFC_military_industrial_assistance:0 "Military Industrial Assistance"
 KFC_military_industrial_assistance_desc:0 "We should apply our new donations and reap military rewards."
 KFC_reach_across_the_board:0 "Reach Across the Board"
 KFC_reach_across_the_board_desc:0 "The President has no quams with working across party lines, and in a time of crisis such as this there is no greater reason to do so. We shall contact members of the opposition parties to see if they would be interested."
 KFC_a_true_democracy:0 "A True Kentucky Democracy"
 KFC_a_true_democracy_desc:0 "We won't fall back into party monopolies and crypto-dictatorships like most of the rest of America. We're Kentucky, we do it differently here."
 KFC_defend_our_democracy:0 "Defend our Democracy"
 KFC_defend_our_democracy_desc:0 "Like it or not, pacifism is dead in the water. We need to build a proper Kentucky guard to defend our fledgling democracy!"
 KFC_year_of_the_bible:0 "Year of the Bible"
 KFC_year_of_the_bible_desc:0 "Just as 2016 and 2017 were declared Year of the Bible, the overthrowal of the Mad Colonel warrants a similar celebration."
 KFC_blue_lives_matter:0 "Reiterate "Blue Lives Matter""
 KFC_blue_lives_matter_desc:0 "In 2017, we signed into law the Blue Lives Matter Bill, making it a hate-crime to attack a police officer. We will reiterate and reinforce this bill, and we will include other benefits and perks for Police Officers."
 KFC_concealed_carry:0 "Concealed Carry"
 KFC_concealed_carry_desc:0 "We'll have a gun in every hand!"
 KFC_right_to_work:0 "Right To Work"
 KFC_right_to_work_desc:0 "We have the right to work and we won't let Unions get in the way of that!"
 KFC_request_return_of_jackson_purchase:0 "Request the Return of Jackson Purchase"
 KFC_request_return_of_jackson_purchase_desc:0 "The Jackson Purchase was wrongfully seized by Pence and his group of traitors. Now that Kentucky is secured under Loyalist leadership, we can request its rightful return."
 KFC_privatize_medicare_and_medicaid:0 "Privatize Medicare and Medicaid"
 KFC_privatize_medicare_and_medicaid_desc:0 "The state should have never gotten involved with healthcare!"
 KFC_ban_sanctuary_cities:0 "Ban Sanctuary Cities"
 KFC_ban_sanctuary_cities_desc:0 "Sanctuary cities protect illegals who don't deserve to live in our states. They must be ended."
 KFC_request_trumpist_advisors:0 "Request Trumpist Advisors"
 KFC_request_trumpist_advisors_desc:0 "Our military is in a sorry shape at the moment. Requesting advisors from the true president will help us fix our military."
 KFC_fortif_the_west:0 "Fortify the West"
 KFC_fortif_the_west_desc:0 "Now that we have announced we are going against Trump, we need to ensure that our border is protected from any potential attack."
 KFC_reconciliation_with_the_opposition:0 "Reconcile the Opposition"
 KFC_reconciliation_with_the_opposition_desc:0 "The opposition share a similar goal with us. We all want what is best for Kentucky, we just disagree on how to achieve that goal."
 KFC_kentucky_united_and_ready:0 "Kentucky, United and Ready"
 KFC_kentucky_united_and_ready_desc:0 "Our beautiful state is ready to take on anything that comes our way now that we are united! The power of friendship prevails yet again!"
 KFC_overhaul_military_training:0 "Overhaul Military Training"
 KFC_overhaul_military_training_desc:0 "Our military is a mess right now, and we need quality soldiers to defend our state."
 KFC_reduce_state_employees:0 "Reduce State Employees"
 KFC_reduce_state_employees_desc:0 "The state shouldn't be the largest employer, to reduce costs we must privatize and cut jobs."
 KFC_expand_charter_schools:0 "Expand Charter Schools"
 KFC_expand_charter_schools_desc:0 "The promotion of charter schools and school choice have been key goals in our administration. We must expand the quality of education in our great state."
 KFC_promote_nuclear_family:0 "Promote the Nuclear Family"
 KFC_promote_nuclear_family_desc:0 "We must return to the traditional family to preserve American values."
 KFC_eliminate_inheritance_and_corporate_tax:0 "Eliminate Inheritance and Corporate Tax"
 KFC_eliminate_inheritance_and_corporate_tax_desc:0 "Inheritance and corporate tax is theft!"
 KFC_local_weapon_stashes:0 "Local Weapon Stashes"
 KFC_local_weapon_stashes_desc:0 "Our citizens must be equiped to deal with any circumstance!"
 KFC_guerilla_training_of_the_civilian_population:0 "Guerilla Training of the Civilian Population"
 KFC_guerilla_training_of_the_civilian_population_desc:0 "If our citizens ever find themselves under the occupation of those who oppose us, they must be trained to properly oppose the invaders."
 KFC_fortify_the_east:0 "Fortify the East"
 KFC_fortify_the_east_desc:0 "To the east the Bidenites and their crazy radical left ideas threaten the existence of our beautiful state. We must protect ourselves from a possible invasion."
 KFC_abortion_question:0 "The Abortion Question"
 KFC_abortion_question_desc:0 "Our birth rate has been collapsing for a while now, and we need to fix it."
 KFC_enemies_all_around_us:0 "Enemies All Around Us"
 KFC_enemies_all_around_us_desc:0 "We are surrounded by all fronts by those who threaten our liberty and independence. We must be prepared for the inevitable!"
 KFC_blitz_afs:0 "Blitz the [AFS.GetName]"
 KFC_blitz_afs_desc:0 "Ohio was once a beautiful Red State in the rust belt, but it was taken over by insane Anarchists, liberal Hippies, and mutinous Traitors. We stand at a perfect opportunity to reclaim the state for the Loyalists. With Trump’s backing, we cannot lose!"
 KFC_rustbelt_formable:0 "A Trumpist Rustbelt"
 KFC_rustbelt_formable_desc:0 "We now control much of the former Rustbelt, and now we only need to make it official."
 KFC_integrate_the_institutions:0 "Integrate the Educational Institutions"
 KFC_integrate_the_institutions_desc:0 "Now that many territories with great educational institutions are under our jurisdiction, we can reap their rewards to advance our technological prowess."
 KFC_support_southern_trumpists:0 "Support Southern Trumpists"
 KFC_support_southern_trumpists_desc:0 "There are many who sympathize with our cause in Dixie, we can exploit their support."
 KFC_move_the_capital:0 "Move the Capital"
 KFC_move_the_capital_desc:0 "Our capital must be moved to a more defendable position in the event we are invaded."
 KFC_ally_the_gla_question:0 "Ally the [GLA.GetName]?"
 KFC_ally_the_gla_question_desc:0 "We share a similar anti-statist view with the [GLA.GetName]. Maybe it is best if we ally them?"
 KFC_dont_tread_on_kentucky:0 "Don't Tread on Kentucky"
 KFC_dont_tread_on_kentucky_desc:0 "We fight to defend our state's rights, our pride, and our family!"
 KFC_secure_tennessee_border:0 "Secure Our Southern Border"
 KFC_secure_tennessee_border_desc:0 "Threats from the [CSA.GetName] need to be addressed. We must prepare for a potential invasion."
 KFC_host_appalachian_nra:0 "Host the Appalachian National Rifle Association"
 KFC_host_appalachian_nra_desc:0 "The National Rifle Association has supported our cause long before America's collapse. It is now time to return the favor."
 KFC_use_colonels_mercs:0 "Use the Colonel's Mercenaries"
 KFC_use_colonels_mercs_desc:0 "Many of the Colonel's mercenaries were just misguided. There is no reason why they can't help us out given our precarious situation."
 
 
 
 KFC_fischer_in_command:0 "Fischer in Command"
 KFC_fischer_in_command_desc:0 "Louisville Mayor Greg Fischer has come out on top in the Constitutional Convention, as many expected. A Liberal though pragmatic mayor, the only certainty that his election says is the alignment with Biden."
 KFC_bourbonism:0 "Bourbonism"
 KFC_bourbonism_desc:0 "Bourbonism is a phrase coined by the mayor identifying Kentucky's bedrock of financial stability that is based on the Bourbon industry. Every business and household in Kentucky is built on Bourbonism, and this is something we can exploit."
 KFC_toe_the_line:0 "Toe the Line"
 KFC_toe_the_line_desc:0 "While the conservatives may moan and groan, there's little reason for us not to toe the liberal line."
 KFC_great_retreat:0 "The Great Retreat"
 KFC_great_retreat_desc:0 "In order to maintain maximum stability, we shall create a bizarre blend of liberalism and conservatism, to create an administration truly representative of Kentucky."
 KFC_join_coalition:0 "Join the Legitimist Coalition"
 KFC_join_coalition_desc:0 "We should contact the Federal Republic and petition to join their coalition."
 KFC_build_whisky_distilleries:0 "Build Whisky Distilleries"
 KFC_build_whisky_distilleries_desc:0 "Pass the whisky!"
 KFC_whisky_for_washington:0 "Whisky for Washington"
 KFC_whisky_for_washington_desc:0 "In return for supplying D.C. with whisky, we can receive armaments"
 KFC_give_a_day:0 "Give A Day"
 KFC_give_a_day_desc:0 "We shall expand Louisville's "Give A Day" programme across all of Kentucky... and make it mandatory!"
 KFC_code_kentucky:0 "Code Kentucky"
 KFC_code_kentucky_desc:0 "We shall expand Louisville's programme of offering free coding training to all residents to the entire state"
 KFC_right_to_exist:0 "Kentucky's Right To Exist"
 KFC_right_to_exist_desc:0 "We will invest heavily into technology so that we can prove we have a right to exist- and defend that  right!"
 KFC_the_future_is_now:0 "The Future Is Now"
 KFC_the_future_is_now_desc:0 "Progressive Traditionalism is a real thing, I assure you!"
 KFC_state_orthodoxy:0 "Christian Orthodoxy"
 KFC_state_orthodoxy_desc:0 "Fuhrer Parrott is a self-proclaimed member of the Eastern Orthodox Church, and we shall represent this."
 KFC_tear_down_the_statues:0 "Tear Down The Statues"
 KFC_tear_down_the_statues_desc:0 "It's time to end Kentucky's unfortunate past. We shall tear down statues of Confederate Generals."
 KFC_protect_statues:0 "Protect the Statues"
 KFC_protect_statues_desc:0 "These statues are part of our heritage as a Border State in the Civil War, they represent Kentucky's conflicting and divided history- divisions we are now trying to heal with our Dixiecrat government."
 KFC_breonnas_law:0 "Breonna's Law"
 KFC_breonnas_law_desc:0 "In memory of Breonna Taylor, Louisville's law on no-knock warrants will be extended to all of Kentucky."
 KFC_labor_government:0 "First Labor Government"
 KFC_labor_government_desc:0 "The Labor Party has won the elections and will govern Kentucky!"
 KFC_beshear_government:0 "Beshear's Kentucky"
 KFC_beshear_government_desc:0 "Former Governor Andy Beshear has won by a great margin, and will retake his post and govern Kentucky."
 KFC_legalize_recreational_cannabis:0 "Legalize Recreational Cannabis"
 KFC_legalize_recreational_cannabis_desc:0 "Cannabis has been proven time and time again if regulated properly, it isn't dangerous. The extra tax money wouldn't hurt either."
 KFC_healthcare_is_a_human_right:0 "Healthcare is a Human Right!"
 KFC_healthcare_is_a_human_right_desc:0 "No person should be left to die or unable to access the care they need just because they can't afford it, especially if they are in Kentucky."
 KFC_guarantee_state_pensions:0 "Guarantee State Pensions"
 KFC_guarantee_state_pensions_desc:0 "FDR had the right idea, but social security is just the first step. Guaranteeing pensions will allow for greater financial stability for all citizens of Kentucky."
 KFC_protect_lgbt_rights:0 "Protect LGBTQ+ Rights"
 KFC_protect_lgbt_rights_desc:0 "It's time to but this culture war bullshit to rest. Love is love, we are all humans."
 KFC_replace_coal_with_clean_energy_jobs:0 "Replace Coal With Clean Energy Jobs"
 KFC_replace_coal_with_clean_energy_jobs_desc:0 "Working in the coal industry not only pollutes the environment but is dangerous for our workers! We also haven't forgotten who the coal companies sided with during the Kentucky Civil War."
 KFC_increase_workers_rights:0 "Safeguard Workers Rights"
 KFC_increase_workers_rights_desc:0 "The workers of the great state of Kentucky have been exploited for far too long. We must protect our workers to ensure people like the Mad Colonel can never gain power again."
 KFC_legalize_gambling:0 "Legalize Gambling"
 KFC_legalize_gambling_desc:0 "Expanding gambling not only expands our personal liberties but also brings in new revenue for our state. Let's put the [GetYear] budget on black!"
 KFC_take_in_fra_workers:0 "Invite Workers from [FRA.GetName]"
 KFC_take_in_fra_workers_desc:0 "Currently there's a job shortage in the [FRA.GetName]. We have many job offerings; inviting workers may prove beneficial for both parties."
 KFC_invest_in_arts_and_culture:0 "Invest in Arts and Culture"
 KFC_invest_in_arts_and_culture_desc:0 "Revitalizing arts and the cultural heritage of Kentucky will help us get back on our feet and rise once again!"
 KFC_reverse_rustbel_misfortunes:0 "Reverse Rustbelt Misfortunes"
 KFC_reverse_rustbel_misfortunes_desc:0 "Reversing de-industrialization will rejuvinate many dying communities, as well as increasing economic growth."
 KFC_bourbon_tourism:0 "Bourbon Tourism"
 KFC_bourbon_tourism_desc:0 "Come to Kentucky! We have the best Bourbon in the world!"
 KFC_protect_alcohol_from_sales_Tax:0 "Protect Alcohol from Sales Tax"
 KFC_protect_alcohol_from_sales_Tax_desc:0 "Alcohol is a major part of our economy, and we must remove any financial barriers that may increase its price!"
 KFC_nationalize_kfc:0 "Nationalize KFC"
 KFC_nationalize_kfc_desc:0 "KFC has caused irreversable damage to our great state, and they must pay for it."
 KFC_income_from_foreign_kfc:0 "Income from Foreign KFC Franchises"
 KFC_income_from_foreign_kfc_desc:0 "Now that we have control over KFC, we can gather revenue and use it for repairing our beautiful state."
 KFC_depoliticize_fast_food:0 "Depoliticize Fast Food"
 KFC_depoliticize_fast_food_desc:0 "The actions of the Mad Colonel do not reflect the views of the greater KFC company. Working with the company to provide relief to Kentuckians may be the best course of action."
 KFC_destroy_kfc_tacobell_combo_restaurants:0 "Destroy Combination KFC-Tacobell Restaurants"
 KFC_destroy_kfc_tacobell_combo_restaurants_desc:0 "We must protect our culture from any foreign influences. Kentucky Fried Chicken must be protected!"
 KFC_raise_minimum_wage:0 "Raise the Minimum Wage"
 KFC_raise_minimum_wage_desc:0 "Our minimum wage has stayed stagnant for decades now while the cost of living has gone up. Our people need income to live!"
 KFC_public_housing:0 "Public Housing"
 KFC_public_housing_desc:0 "Cleaning up the streets is an important platform the Labor Party campaigned on. Public housing is an important initiative to accomplish this."
 KFC_ready_to_fight:0 "Ready to Fight"
 KFC_ready_to_fight_desc:0 "We are now ready to fight for the Legitimist cause, for the real winners of the 2020 elections."
 KFC_intervene_in_tennesee_dem:0 "Intervene In Tennessee"
 KFC_intervene_in_tennesee_dem_desc:0 "With Kanye West’s death and his confederacy falling around him, we must act quickly to secure Tennessee as a safety cushion from the chaos in the South."
 KFC_crush_new_zion:0 "Crush Black-Zionist Nationalism"
 KFC_crush_new_zion_desc:0 "The beautiful city of Memphis was taken over by an insane group of so-called Black Hebrew Israelites. Whatever the hell’s wrong with them is not our concern, but they are armed and dangerous. It is our duty to step in and save Tennessee from these psychopaths."
 KFC_joint_invasion_of_AFS:0 "Secure a Bidenist Ohio"
 KFC_joint_invasion_of_AFS_desc:0 "Ohio was once a hub of Unionism and an important swing state, but fell first to Trump's populist madness and then to the even more insane Triumvirate. This madness has gone on for far too long and we must step in to save the people of Ohio from it."
 KFC_integrate_the_ohio_river_area:0 "Redraw Kentucky's Borders" 
 KFC_integrate_the_ohio_river_area_desc:0 "With the recent growth of our state there are many in our lands who do not consider themselves or their home Kentuckian. In fact, most of our new citizens aren't. This raises the opportunity to redraw the state's borders to better reflect current realities. Some wish to annex Ohio entirely, while others simply want to redraw districts and counties to simplify bureaucracy. Either way, administrative work should be considerably easier now."
 KFC_reign_in_virginia:0 "Rein in Virginia"
 KFC_reign_in_virginia_desc:0 "Virginia has betrayed the legitimist cause, and we must remind them where their true loyalties lie."
 KFC_not_only_kentucky:0 "Not Just Kentucky Anymore..."
 KFC_not_only_kentucky_desc:0 "We are now responsible for all of Appalachia, not just Kentucky."
 KFC_integrate_universities:0 "Integrate Virginian Schools"
 KFC_integrate_universities_desc:0 "University of Virginia, Old Dominion, Virginia Tech, these are all some of the finest learning institutions in the country and are now under our control. We must make an effort to ensure a consistent quality of education throughout our whole state."
 KFC_integrate_industry:0 "Integrate Virginian Industry"
 KFC_integrate_industry_desc:0 "With our recent reclamation of Virginia for the Federalists, we must take efforts to ensure their industry is integrated into ours to maximize production."
 KFC_attack_wva:0 "Attack [NRA.GetName]"
 KFC_attack_wva_desc:0 "“West Virginia, our fellow Appalachian state, is ruled by psychopaths and madmen. We must take arms to free them from their oppressors, just like we freed our own state."
 
 
 
 
 
