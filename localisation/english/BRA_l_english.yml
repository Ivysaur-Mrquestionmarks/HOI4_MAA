l_english:
 BRA_no_popery:0 "The Hand that Feeds" #no popery doesn't make sense considering the two possible leaders are an Eastern Orthodox and a Hindu lol
 BRA_no_popery_desc:0 "The so-called Boston Republican Army, these vile commie bastards, are running amock in our fair city and bringing ruin to New England. We, the native American opposition, say no more! It's time to resurrect the legacy of the Know-Nothings."
 BRA_wrath_of_kali:0 "The Wrath of Kali"
 BRA_wrath_of_kali_desc:0 "Dr. Shiva Ayyadurai has come on top to become the ruler of the Triumvirate. His ethnic background makes it easier to rule over our minorities and his political views keep the groypers in line. All of New England will fear the incoming Kali Yuga!"
 BRA_devaccination:0 "De-Vaccination"
 BRA_devaccination_desc:0 "The so-called 'Vaccinated' are really sick. These poor people, lied to by the devil Fauci and filled with microplastics, nanotechnology and disease... It is our duty to save them. We must medicate the medicated."
 BRA_infinity_indians:0 "Infinity Indians"
 BRA_infinity_indians_desc:0 "The people of India are an industrious, intelligent people. Our very own leader proves it! By restricting immigration from the rest of the world, but opening it up entirely to the subcontinent, we will build a race of supermen that will save America."
 BRA_embrace_kek:0 "Embrace Kek"
 BRA_embrace_kek_desc:0 "Kek, the ancient Egyptian god of chaos, has become a rallying cry in our circles. There's some wiggle room here- why don't we embrace Kek into the Hindu pantheon?"
 BRA_stuff_the_ballots:0 "Stuff the Ballots"
 BRA_stuff_the_ballots_desc:0 "It seems like an age ago now, but I remember when I ran for office and the liberal establishment rigged it against me. Now let's see how they like it! We'll run an election for Provisional President of New England- and I will win with Assad margins!"
 BRA_to_end_the_world:0 "To End the World"
 BRA_to_end_the_world_desc:0 "It is clear that America has failed. If this is true, then the world is doomed. We must restart the cycle, in order to birth our new genesis we must first destroy the old world. This is now our goal."
 BRA_blueprint_for_new_world:0 "A Blueprint for the New World"
 BRA_blueprint_for_new_world_desc:0 "While we prepare to end this world, we must think about what the next will look like. This is the task that the great Rajah shall burden himself with."
 BRA_new_england_unification:0 "War for New England"
 BRA_new_england_unification_desc:0 "There really can be no dilly dally. The end of the world waits for nobody, and for now we must secure our powerbase!"
 BRA_mission_to_modi:0 "Mission to Modi"
 BRA_mission_to_modi_desc:0 "We can prove to be a valuable state of influence and investment to the Indian government. We should send people over there and see if we can get a military mission."
 BRA_elephant_cavalry:0 "Elephant Cavalry"
 BRA_elephant_cavalry_desc:0 "By importing mighty elephants from the subcontinent, and freeing a few from our own zoos and circuses too, we can build a terrifying force which will overwhelm any small militia garrison."
 BRA_hindu_constitution:0 "A Hindu Constitution"
 BRA_hindu_constitution_desc:0 "The Constitution of the United States is a good document, but critically flawed. We shall write a new constitution, under the guidance of the Rajah, to ensure peace and stability in our new world."
 BRA_pagan_alliance:0 "Pagan Alliance"
 BRA_pagan_alliance_desc:0 "We should unite all the Non-Abrahamic faiths of America under the banner of the Kali Yuga, for a safer, stronger, more righteous new world."
 BRA_slay_canadian_asura:0 "Slay the Canadian Asura"
 BRA_slay_canadian_asura_desc:0 "Canada is a land which contains much of our Hindu brethren, but they are led astray by false leaders and Christian dogma. We must begin a great campaign Northwards, to save them."
 BRA_saviour_of_the_world:0 "Saviour of the World"
 BRA_saviour_of_the_world_desc:0 "It may not be over, yet. It could be in our interests to join forces with the Loyalists, perhaps we should do everything in our power to save this world before condemning it?"
 BRA_false_prophet:0 "The False Prophet"
 BRA_false_prophet_desc:0 "Donald Trump is an Asura like no other, he has poisoned the minds of men for his personal gain. He and his ilk must be beheaded before the new world can come around."
 BRA_kali_is_our_leader:0 "Kali is Our Leader"
 BRA_kali_is_our_leader_desc:0 "The Goddess Kali speaks through our Rajah. She is who truly leads us on our great crusade to end the world. As such, it should say so on our official documents and international relations."
 BRA_fear_the_american_rajah:0 "Fear the American Rajah"
 BRA_fear_the_american_rajah_desc:0 "Our great Rajah has led us through thick and thin, under him we cannot be stopped!"
 BRA_institute_conspiracy:0 "The MIT Conspiracy"
 BRA_institute_conspiracy_desc:0 "In the shadows, the Massachusets Institute of Technology watches and waits. Waits for the right time to take over, and create a true American technocracy... That time is now!"
 BRA_friendly_face:0 "The Friendly Face of American Technocracy"
 BRA_friendly_face_desc:0 "Lex Fridman is a well known and highly regarded face of MIT. With him at the helm, we can earn the trust of the people."
 BRA_begin_the_experiments:0 "Begin the Experiments"
 BRA_begin_the_experiments_desc:0 "We are small, and if we are to survive, we must have technological superiority. It's time to get weird with it!"
 BRA_freedom_is_slavery:0 "Freedom Is Slavery"
 BRA_freedom_is_slavery_desc:0 "If we wish to remain truly free and independent, then everyone must pitch in! Altogether, comrades!"
 BRA_comrade_fridman:0 "Comrade Fridman"
 BRA_comrade_fridman_desc:0 "We should build a cult of personality around Chairman Fridman, to further his aims."
 BRA_soviet_aesthetics:0 "Soviet Aesthetics"
 BRA_soviet_aesthetics_desc:0 "Sovietism isn't exactly popular in these parts, but we gotta admit they were damn efficient. Commieblocs aren't nice to look at, but they're easy to build."
 BRA_techno_mladorossy:0 "The Techno-Mladoamerikantsy"
 BRA_techno_mladorossy_desc:0 "The Union of Mladorossy were an organisation of White Russians who advocated for a synthesis of Tsarism and Bolshevism. Add in our own flavour of Technocracy, and they fit perfectly for the Chairman's goals."
 BRA_mobilise_the_morons:0 "Mobilise the Morons"
 BRA_mobilise_the_morons_desc:0 "If you cannot think for us, you will die for us!"
 BRA_our_new_jerusalem:0 "Our New Jerusalem"
 BRA_our_new_jerusalem_desc:0 "The time has come. If we want to survive, we must expand!"
 BRA_dissolve_council_of_admins:0 "Dissolve the Council of Administrators"
 BRA_dissolve_council_of_admins_desc:0 "The Administrators have served their purpose, but now it's time for absolute rule by Fridman."
 BRA_boston_stormtroopers:0 "Form the Stormtroopers"
 BRA_boston_stormtroopers_desc:0 "On top of the regular goons, we should also create an elite, crack team of blackshirts who will guarantee our success."
 BRA_the_institute:0 "The Institute"
 BRA_the_institute_desc:0 "The presence of MIT and Chairman Fridman is now so utterly pervasive and unavoidable that people have begun informally referring to us as simply 'The Institute'."
 BRA_synthetic_people:0 "Synthetic People"
 BRA_synthetic_people_desc:0 "We are beginning to learn how to utilise AI and Boston Dynamics technolgoy to create Synthetic humans, or 'Synths' for short. Very unethical but very useful!"
 BRA_tame_the_wild_north:0 "Tame the Wild North"
 BRA_tame_the_wild_north_desc:0 "We can't trust the Canadians. Never have been able to. They must be tamed and conquered."
 BRA_lysensko:0 "Exonerate Trofim Lysenko"
 BRA_lysensko_desc:0 "Trofim Lysenko was a genius Soviet agriculturalist who has been slandered and defamed. It's sickening! We will redeem him and institute his ideas."
 BRA_secret_police:0 "Secret Police"
 BRA_secret_police_desc:0 "The people can't be trusted. We must police every action, every thought!"
 BRA_perfect_technocracy:0 "A Perfect Technocracy"
 BRA_perfect_technocracy_desc:0 "With our bases covered and our military in ship shape, we can now truly establish our more perfect technocracy."
 BRA_improve_synth_production:0 "Improve Synth Production"
 BRA_improve_synth_production_desc:0 "These Synths are awesome! We should get into the business of mass producing them."
 BRA_total_ascendancy:0 "Total Ascendancy"
 BRA_total_ascendancy_desc:0 "We have ascended far beyond what anyone could have ever expected. We are total, and we are dominant. We are the rightful rulers of the world!"
 BRA_the_boston_republican_army:0 "The Boston Republican Army"
 BRA_the_boston_republican_army_desc:0 "All Together Comrades! Up the RA!"
 BRA_dropkick_murphys:0 "Dropkick Murphys"
 BRA_dropkick_murphys_desc:0 "In the unexpected power struggle following the assasination of our leader, musician Ken Casey has taken leadership!"
 FRA_federalist_veteran:0 "The Federalist Veteran"
 FRA_federalist_veteran_desc:0 "Former mayor and cabinet member in the Biden Admin, Marty Walsh, has secured the support of the more moderate voices and secured his control as leader of Boston."
 BRA_accept_legitimist_refugees:0 "Accept Legitimist Refugees"
 BRA_accept_legitimist_refugees_desc:0 "With the collapse of the Federal Republic, many proud Legitimists find themselves subjugated and starving. We should welcome them with open arms!"
 BRA_punk_rock_bolshevism:0 "Punk Rock Bolshevism"
 BRA_punk_rock_bolshevism_desc:0 "No Gods, No Masters, Workers of the World Unite!"
 BRA_this_is_fine:0 "'This Is Fine'"
 BRA_this_is_fine_desc:0 "Everything's gonna be okay, guys! Trust me. We just need to... We just need to sort ourselves out."
 BRA_decree_on_land:0 "Decree on Land"
 BRA_decree_on_land_desc:0 "Our platform is radical, and we must reflect that. It is time for widespread redistribution."
 BRA_decree_on_heritage:0 "Decree on Heritage"
 BRA_decree_on_heritage_desc:0 "Boston is a city with a large amount of Irish heritage- as seen in our very own chapter of the Irish Republican Army. This must be reflected."
 BRA_socialism_with_irish_characteristics:0 "Socialism with Irish Characteristics"
 BRA_socialism_with_irish_characteristics_desc:0 "We lead a unique revolution, unlike any in the past. This is the Great Irish Revolution!"
 BRA_president_in_absentia:0 "President-In-Absentia"
 BRA_president_in_absentia_desc:0 "D.C. has fallen, and the President is missing. However, it is still paramount that we continue the struggle to save America."
 BRA_suspend_natural_born_citizen_clause:0 "Suspend the Natural-born-citizen Clause"
 BRA_suspend_natural_born_citizen_clause_desc:0 "The President is missing, and chaos reigns. We must revoke the clause of the constitution mandating natural born citizenry presidents, and inaugaurate Marty Walsh at once!"
 BRA_inauguration:0 "Inauguration of President Walsh"
 BRA_inauguration_desc:0 "With all the laws blocking us from assuming complete power now thrown to the wayside, we must hurridly organise an inauguration of our new president, Marty Walsh."
 BRA_republican_is_a_dirty_word:0 "'Republican' is a Dirty Word"
 BRA_republican_is_a_dirty_word_desc:0 "As much as it sucks, Trump and his fascist army have completely sullied the term of Republicanism. We cannot continue to embrace this, and must seek other venues."
 BRA_heirs_of_lincoln:0 "Heirs of Lincoln"
 BRA_heirs_of_lincoln_desc:0 "We must reclaim the Republican mantle! Don't surrender to Trump and his croneys, don't let them claim that beautiful word!"
 BRA_revolution_never_ends:0 "The Revolution Never Ends"
 BRA_revolution_never_ends_desc:0 "Keep marching, keep fighting, never give in, total liberation now!"
 BRA_fortress_boston:0 "Fortress Boston"
 BRA_fortress_boston_desc:0 "We must turn Boston into an Impenetrable Fortress. One that cannot ever fall to Reaction."
 BRA_exile_army:0 "The Great Exile Army"
 BRA_exile_army_desc:0 "D.C. is lost. But let us not forget where we are! We are Boston, the home of the American Revolution! 1776 lives in us!"
 BRA_settling_in:0 "Settling In"
 BRA_settling_in_desc:0 "The trauma is subsiding, and it's becoming increasingly clear what's going on here. Let's get ready!"
 BRA_push_for_new_england:0 "Push to Reclaim New England"
 BRA_push_for_new_england_desc:0 "If we want to have a chance of surviviing, we must secure our supply lines outside of tthe city of BBoston proper. It's time to take on the other warlords that surround us."
 BRA_fenian_brotherhood:0 "Fenian Brotherhood"
 BRA_fenian_brotherhood_desc:0 "After the First Civil War, Irishmen had the means and the will to form an invasion army into Canada. It failed, but with similar conditions, we shall try again!"
 BRA_new_ireland:0 "New Ireland"
 BRA_new_ireland_desc:0 "New England is ours! And under our hands, we shall officially decree it to be renamed... New Ireland!"
 BRA_search_for_the_president:0 "Search for the President"
 BRA_search_for_the_president_desc:0 "With our resources expanded and our legitimacy growing, we should send people to find just what exactly happened to Mr. President!"
 BRA_assume_complete_responsibility:0 "Assume Complete Responsibility"
 BRA_assume_complete_responsibility_desc:0 "We must centralise the state under Walsh, and hand him more powers."
 BRA_quebecois_liberation_front:0 "Quebecois Liberation Front"
 BRA_quebecois_liberation_front_desc:0 "The Quebecois are our allies, and we should not be mere oppressors of them. Solidarity!"
 BRA_more_funding_MIT:0 "More Funding!"
 BRA_more_funding_MIT_desc:0 "More... MORE.... MORRREEE!!!!!!"
 BRA_saraswati_pajeets:0 "Saraswati"
 BRA_saraswati_pajeets_desc:0 "The Goddess of Knowledge will guide us forward as we take our place in history!"
 BRA_nationalise_mit:0 "Nationalise MIT"
 BRA_nationalise_mit_desc:0 "New evidence has unsurfaced which proves that MIT was involved in the conspiracy to overthrow us! We cannot allow them to exist independently any longer- they will belong to the people."
 BRA_appeal_to_europe:0 "Appeal to the Europeans"
 BRA_appeal_to_europe_desc:0 "Surely we can garner support from the Europeans, and acquire rifle contracts?"
 BRA_decree_on_bread:0 "Decree on Bread"
 BRA_decree_on_bread_desc:0 "With resources secured, we should now put forth a decree on bread, that no mouth under our protection shall go hungry!"
 BRA_decree_on_democracy:0 "Decree on Democracy"
 BRA_decree_on_democracy_desc:0 "For the Revolution to truly succeed, we must be democratic as we are socialist! When the time is right, elections must be held."
 BRA_ban_counterrevolutionary_actors:0 "Ban Counter-Revolutionaries"
 BRA_ban_counterrevolutionary_actors_desc:0 "True Democracy won't be able to exist until actors of the Counter-Revolution are dealt with. Until then, we must ban Trumpists and conservatives from organising."
 BRA_rig_ballots:0 "Rig the Ballots"
 BRA_rig_ballots_desc:0 "We must keep up the facade of democracy to ensure our continued legitimacy, however in these times it's not feasible to actually consider LOSING the elections. Rig it all!"
 BRA_push_to_dc:0 "Push to D.C."
 BRA_push_to_dc_desc:0 "Whatever our future may be, what's clear is that we must reclaim tthe capitol!"
 BRA_a_new_election:0 "A New Election"
 BRA_a_new_election_desc:0 "With our grip secure, it's finally time to folllow through on the Decree on Democracy."
 BRA_suspend_elections:0 "Suspend the Decree on Democracy"
 BRA_suspend_elections_desc:0 "On second thoughts... if we hold elections now... we might not win!"
 BRA_bright_new_horizon:0 "A Bright New Horizon"
 BRA_bright_new_horizon_desc:0 "With D.C. back in our hands, it's time to declare the Second Federal Republic of America!"
 BRA_decree_on_unity:0 "Decree on Unity"
 BRA_decree_on_unity_desc:0 "There can only be one America, and it must be us! Let us draftt a decree to annex what territory lies out our grasp."
 BRA_carry_torch_of_legitimism:0 "Carry the Legitimist Torch"
 BRA_carry_torch_of_legitimism_desc:0 "There are others who still remain out there who champion our cause, and we would do well to be their torchbearers!"
 BRA_make_america_again:0 "Make America Again"
 BRA_make_america_again_desc:0 "Ah! Ah! He said it! He said the name of the mod!"

 BRA_rajagopala_chidambaram:0 "Rajagopala Chidambaram"
