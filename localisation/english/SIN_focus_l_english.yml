 #event 1: Kaczynski comes to power
 colorado.1.t:0 "The Prisioner Election"
 colorado.1.d:0 "After Joaquin "El Chapo" Guzmán, the most powerful man in the land, called for the prisioners to go back to ADX Florence in order to vote for a leader, to form legitimate a government, few believed that something would come of it. How wrong they were!\n\nAs the prisioners were gathering, some were skeptical that this may be a trap or a move from Guzmán to consolidate power, but as the election progressed, he simply stood back, silently. As the votes were being counted it was evident that a pattern was emerging - Each prisioner was voting for himself, no one had more than one vote.\n\nThen came the last vote to be opened: it read "Ted Kaczynski". Gasps were heard across the room as someone finally had a plurality of the votes. However it was clear who was the only one not to vote for himself: The only one with zero votes was El Chapo himself.\n\nWhy would he vote for the Unabomber?"
 colorado.1.a:0 "Long Live Primitivia"~

 #event 1000: Kaczynski comes to power
 colorado.1000.t:0 "Anarcho-Primitivists in the Rockies"
 colorado.1000.d:0 "After somehow the prisioners elected a leader in the long-abandoned USP Florence Supermax, the former bomber who roamed under an unknown name during the 1990s, Ted Kaczynski was chosen. Guided by Ted's ideas that the industrial revolution was a mistake and one of the main factors in the decline of civilization, a de facto state was formed under the ideals of anarcho-primitivism. This combination of militaristic drug gangsterism and the primitiveness of ideology was a shock to all participants in the Civil War, and the emerging factions continue to amaze us. What the future holds for this once great country remains to be seen."
 colorado.1000.a:0 "Paint The Town Green"


