 #coop cartel
 SIN_cooperation_cartel_invest_in_drug_labs:0 "Invest in [GetCartelName] Drug Labs"
 SIN_cooperation_cartel_invest_in_drug_labs_desc:0 "By investing resources into the Cartel's production network, we can ensure a steady flow of revenue and strengthen our ties with their leadership."

 SIN_cooperation_cartel_facilitate_money_movement:0 "Facilitate [GetCartelName] Money Movement"
 SIN_cooperation_cartel_facilitate_money_movement_desc:0 "The Cartel relies on complex financial networks to move its wealth. By assisting in laundering and transferring funds, we gain their trust."

 SIN_cooperation_cartel_help_remove_rivals:0 "Help Remove [GetCartelName] Rivals"
 SIN_cooperation_cartel_help_remove_rivals_desc:0 "Our allies in the Cartel face constant threats from competing organizations. By discreetly supporting their efforts to eliminate rivals, we secure their dominance and our influence over them."

 SIN_cooperation_cartel_integrate:0 "Integrate the [GetCartelName]"
 SIN_cooperation_cartel_integrate_desc:0 "We have been cooperating with the Cartel entities so far, and it is time to finally integrate them into our system."

 #opp cartel
 SIN_oppression_cartel_slander_the_cartel:0 "Slander the [GetCartelName]"
 SIN_oppression_cartel_slander_the_cartel_desc:0 "A coordinated propaganda campaign can turn ADX Florence's opinion against the Cartel, undermining their legitimacy and weakening their support networks."

 SIN_oppression_cartel_raid_drug_corridors:0 "Raid [GetCartelName] Drug Corridors"
 SIN_oppression_cartel_raid_drug_corridors_desc:0 "Targeting key trafficking routes used by the Cartel will disrupt their operations and cut off vital sources of income."

 SIN_oppression_cartel_assassinate_drug_lord:0 "Assassinate [GetCartelName] Leader"
 SIN_oppression_cartel_assassinate_drug_lord_desc:0 "Eliminating the leadership of the Cartel could throw the organization into chaos."

 SIN_oppression_cartel_destroy:0 "Crush the [GetCartelName]"
 SIN_oppression_cartel_destroy_desc:0 "We have been persecuting the Cartel so far, and it is time to finally destroy them for good."

 #coop establishment
 SIN_cooperation_establishment_hold_city_council:0 "Hold a [GetEstablishmentName] Council Meeting"
 SIN_cooperation_establishment_hold_city_council_desc:0 "By allowing the Establishment to convene openly, we demonstrate our willingness to cooperate with existing political structures and maintain a sense of normal governance."

 SIN_cooperation_establishment_introduce_new_laws:0 "Introduce a New [GetEstablishmentName] Law"
 SIN_cooperation_establishment_introduce_new_laws_desc:0 "Working alongside the Establishment, we can introduce legislation that aligns with our broader goals while preserving the appearance of institutional continuity."

 SIN_cooperation_establishment_allow_a_political_rally:0 "Hold a [GetEstablishmentName] Rally"
 SIN_cooperation_establishment_allow_a_political_rally_desc:0 "Permitting a public rally organized by the Establishment strengthens our relationship with them and helps project unity and legitimacy to the wider population."

 SIN_cooperation_establishment_integrate:0 "Integrate the [GetEstablishmentName]"
 SIN_cooperation_establishment_integrate_desc:0 "We have been cooperating with the Establishment entities so far, and it is time to finally integrate them into our system."

 #oop establishment
 SIN_oppression_establishment_raid_a_town_hall:0 "Raid a [GetEstablishmentName] Town Hall"
 SIN_oppression_establishment_raid_a_town_hall_desc:0 "A direct raid on a Town Hall will disrupt their operations and send a clear message that their authority is no longer recognized."

 SIN_oppression_establishment_hunt_party_militants:0 "Hunt [GetEstablishmentName] Party Militants"
 SIN_oppression_establishment_hunt_party_militants_desc:0 "By targeting militant elements aligned with the Political Parties, we can weaken their ability to resist and dismantle their support networks."

 SIN_oppression_establishment_kidnap_a_party_leader:0 "Kidnap a [GetEstablishmentName] Party Leader"
 SIN_oppression_establishment_kidnap_a_party_leader_desc:0 "Abducting a key figure within the Establishment will throw their leadership into disarray, though such actions may provoke unrest or retaliation."

 SIN_oppression_establishment_destroy:0 "Crush the [GetEstablishmentName]"
 SIN_oppression_establishment_destroy_desc:0 "We have been persecuting the Establishment so far, and it is time to finally destroy them for good."

 #coop mob
 SIN_cooperation_mob_facilitate_gambling:0 "Facilitate [GetMobName] Gambling"
 SIN_cooperation_mob_facilitate_gambling_desc:0 "By permitting the Mob to expand its gambling operations, we can secure a steady stream of revenue and strengthen our ties with the criminal underworld."

 SIN_cooperation_mob_fund_alcoholism:0 "Fund [GetMobName] Alcoholism"
 SIN_cooperation_mob_fund_alcoholism_desc:0 "The Mob profits greatly from alcohol distribution and underground bars. Supporting these ventures will increase their loyalty."

 SIN_cooperation_mob_help_loan_sharking:0 "Help the [GetMobName] to Loan Shark"
 SIN_cooperation_mob_help_loan_sharking_desc:0 "The Mob has long relied on predatory lending and debt collection to maintain control. Assisting their loan-sharking operations will deepen our cooperation with them."

 SIN_cooperation_mob_integrate:0 "Integrate the [GetMobName]"
 SIN_cooperation_mob_integrate_desc:0 "We have been cooperating with the Mob entities so far, and it is time to finally integrate them into our system."

 #oop mob
 SIN_oppression_mob_slander_the_mob:0 "Slander the [GetMobName]"
 SIN_oppression_mob_slander_the_mob_desc:0 "A coordinated propaganda campaign can expose the crimes and corruption of the Mob, turning ADX firmly against them."

 SIN_oppression_mob_denounce_fraud:0 "Denonuce [GetMobName] Fraud"
 SIN_oppression_mob_denounce_fraud_desc:0 "By uncovering and publicizing the fraudulent financial schemes of the Mob, we can undermine their legitimacy and weaken their economic power."

 SIN_oppression_mob_assassinate_mob_leader:0 "Assassinate a [GetMobName] Boss"
 SIN_oppression_mob_assassinate_mob_leader_desc:0 "Removing a prominent boss of the Mob could throw the organization into chaos."

 SIN_oppression_mob_destroy:0 "Crush the [GetMobName]"
 SIN_oppression_mob_destroy_desc:0 "We have been persecuting the Mob so far, and it is time to finally destroy them for good."

 #coop anprims
 SIN_cooperation_anprims_invest_in_primitive_tech:0 "Invest in [GetAnprimsName] Tech"
 SIN_cooperation_anprims_invest_in_primitive_tech_desc:0 "Modern industry has brought us dependency, alienation, and ecological ruin. By supporting  sustainable technologies, we can build a society less dependent on the industrial machine."

 SIN_cooperation_anprims_combat_social_alienation:0 "Help the [GetAnprimsName] fight Social Alienation"
 SIN_cooperation_anprims_combat_social_alienation_desc:0 "Supporting efforts to restore local ties and communal life may help heal the social wounds left by industrial civilization."

 SIN_cooperation_anprims_go_on_a_hunt:0 "Send the [GetAnprimsName] on a Hunt"
 SIN_cooperation_anprims_go_on_a_hunt_desc:0 "Hunting is more than a means of acquiring food. It is a return to a more direct relationship with nature, free from the alienation of modern industrial life."

 SIN_cooperation_anprims_integrate:0 "Integrate the [GetAnprimsName]"
 SIN_cooperation_anprims_integrate_desc:0 "We have been cooperating with the Anprim entities so far, and it is time to finally integrate them into our system."

 #opp anprims
 SIN_oppression_anprims_slander_the_anprims:0 "Slander the [GetAnprimsName]"
 SIN_oppression_anprims_slander_the_anprims_desc:0 "The Anprims preach the abandonment of the civilization we have built. By exposing their beliefs as dangerous romanticism, we can turn the public against their vision of a world without industry."

 SIN_oppression_anprims_boycott_deindustrialization:0 "Boycott [GetAnprimsName] Deindustrialization"
 SIN_oppression_anprims_boycott_deindustrialization_desc:0 "The Anprims seek to dismantle the industrial foundations of our society. We will oppose their efforts at every turn."

 SIN_oppression_anprims_ambush_the_hunters:0 "Ambush [GetAnprimsName] Hunters"
 SIN_oppression_anprims_ambush_the_hunters_desc:0 "The Anprims have taken to the wilderness in pursuit of their primitive ideal. If they insist on treating the forests as their territory, we will make sure the hunters become the prey."

 SIN_oppression_anprims_destroy:0 "Crush the [GetAnprimsName]"
 SIN_oppression_anprims_destroy_desc:0 "We have been persecuting the Anprims so far, and it is time to finally destroy them for good."





