 SIN_CARTEL_TOOLTIP:0 "The £faction_sin_cartel §YCartel§! are the representatives of the Mexican Sinaloa Cartel within our territory, mostly based around drug trafficking but also smuggling, firearms and human trafficking. \nThe £faction_sin_cartel §YNarcotrafickers§! want an operating base within American soil to expand their products reach and influence within the United States."
 SIN_MOB_TOOLTIP:0 "The £faction_sin_mob §YMafia§! are the members of American organized crime, focused on acquiring money by any means necessary, including drugs, loans, and protection rackets. \nThe £faction_sin_mob §YMobsters§! wish for a nation where they run behind the scenes, extracting as much money as possible from the nation."
 SIN_ANPRIMS_TOOLTIP:0 "The £faction_sin_anprims §YAnarcho-Primitivists§! are those who believe industrial society and its consequences have gone too far, and wish for a return to a simple lifestyle. \nThe £faction_sin_anprims §YAnarcho-Primitivists§! will try to destroy all signs of modern industrial society, freeing the planet from technology which destroys both the Earth and the human spirit."
 SIN_ISLAMISTS_TOOLTIP:0 "The £faction_sin_islamists §YIslamists§! are members of Islamic terrorist organizations who were imprisoned inside ADX Florence. \nThe £faction_sin_islamists §YIslamists§! want a Jihad, a great holy war against America and to spread Islam throughout the nation by any means necessary."
 SIN_DT_TOOLTIP:0 "The £faction_sin_dt §YDomestic Terrorists§! are Americans convicted of acts of terror, from shootings to bombing and kidnappings for various reasons. \nThe £faction_sin_dt §YDomestic Terrorists§! want chaos and fear to spread among the American people to establish their control over them."
 SIN_ESTABLISHMENT_TOOLTIP:0 "The £faction_sin_establishment §YEstablishment§! represents those who oppose the current rule of the criminals from ADX Florence, Republican and Democrat alike. \nThe £faction_sin_establishment §YPoliticians§! want a return to American democracy, order and stability to Colorado, and if need be the rest of the nation."

 SIN_LOYALTY_TOOLTIP:0 "§YLoyalty§! represents the faction's desire to cooperate with our leader. \nThe higher the §YLoyalty§!, the less likely it is that a faction will confront him. \nBefore integrating a faction into our Criminal System, it is necessary to complete certain decisions to align their members with us and increase their §YLoyalty§! to 100."
 SIN_POPULARITY_TOOLTIP:0 "§YInfluence§! represents the influence a faction receives from inside ADX Florence. \nThe higher the §YInfluence§!, the more likely it is that a faction will take bold actions. \nBefore destroying a faction, it is necessary to complete certain decisions to weaken it and reduce its §YInfluence§! to 0."

