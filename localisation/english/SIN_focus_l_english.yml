 SIN_cooperation_dt_power_desc:0 "We shall approach the Terrorists leaders and try to align our objectives."

 SIN_cooperation_dt_free:0 "Gift equipment to the [GetDtName]"
 SIN_cooperation_dt_free_desc:0 "What is a better gift to a Terrorist than a few free weapons?"

 SIN_cooperation_dt_integrate:0 "Integrate the [GetDtName]"
 SIN_cooperation_dt_integrate_desc:0 "We have been cooperating with the Terrorists entities so far, and it is time to finally integrate them into our system."

