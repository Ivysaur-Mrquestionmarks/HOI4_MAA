l_english:
 ################################ PAC - EVENTS ################################
 
 fleet_P.1.t:0 "The Birth of the Junta"
 fleet_P.1.d:0 "After the civil war broke out the Pacific fleet quickly seized Alaska and Hawaii to be given as concessions to the winner, but as days turned into months, the Pacific Fleet quickly realized that they were alone in the Pacific, and it was up to them to restore America to the Glory she once had. We are now tasked to destroy the Red Menace in California, but our nation grows weary and our population are increasingly anti-war... If we do not win this war soon, our hold is as good as gone."
 fleet_P.1.a:0 "We Fight Our Country's Battles."

 fleet_P.2.t:0 "War report"
 fleet_P.2.d:0 "Good morning Admiral,\n\nCurrently, not much progress has been made within the war. Based on all of our logistics, we can make a beach head against the Californians within a few months. I should also note some of our troop loyalties may be brought into question seeing that they are still adjusting to the ideas of a war at home as opposed to Iraq or Afghanistan. I will keep you updated. Report Over."
 fleet_P.2.a:0 "hmm"

 fleet_P.3.t:0 "Our Friends in Fresno"
 fleet_P.3.d:0 "Good morning Admiral,\n\nWe have located several cells of loyalists within Fresno, California. After mild negotiation, we have created various paramilitary groups to sabotage production and morale of the PRA. They have been tasked to cause as much chaos and disorder as possible to help us with our invasion. Like the resistance in Paris against Hitler, we have our resistance in Los Angeles against Sanders. Report Over."
 fleet_P.3.a:0 "Glad to see not all of California has gone mad."

 fleet_P.4.t:0 "The Californian Uprising"
 fleet_P.4.d:0 "Good morning Admiral,\n\nWe are proud to announce bands of loyalist paramilitaries have created a general uprising against the Sanders regime. They have been instructed to create pockets of loyal neighborhoods into a collective front we can use to push against them. Hopefully, we will eventually annex the front in addition to the rest of that bolshevik hellhole. This may be our big break sir. Report Over."
 fleet_P.4.a:0 "I want military parades in Sacramento by Christmas"

 fleet_P.5.t:0 "The shelling of california"
 fleet_P.5.d:0 "Today at 5 am we received reports that ships of the imperialist navy have attack various of our cities.\nThis will temporarily reduce our industrial output and has already killed several workers who were in the area affected."
 fleet_P.5.a:0 "This won't stop the revolution"

 fleet_P.6.t:0 "Operation Guam"
 fleet_P.6.d:0 "Good morning Admiral,\n\nAfter careful planning and training, we are ready for the proper invasion of mainland California. Our troops are stationed and ready to make a beach head on your command. We even have most of the pacific on a naval blockade in an attempt to block incoming resources from the Chinese. We are ready for the beginning of the invasion on your mark. Report Over."
 fleet_P.6.a:0 "It's time to return to the mainland."

 fleet_P.7.t:0 "Anti-War Protests Emerge"
 fleet_P.7.d:0 ""
 fleet_P.7.a:0 "Let Them Protest."
 fleet_P.7.b:0 "Clear Out The Protesters."

 fleet_P.8.t:0 "An Incident In Hawaii"
 fleet_P.8.d:0 "army and militia have a little incident in hawaii over a disagreement"
 fleet_P.8.a:0 "Why Can't They Just Work Together?"

 fleet_P.9.t:0 "Protests Emerge Over The Juntas Rule"
 fleet_P.9.d:0 ""
 fleet_P.9.a:0 "Allow Them To Protest."
 fleet_P.9.b:0 "Crush Them."

 fleet_P.10.t:0 "A Debate Over Leadership"
 fleet_P.10.d:0 "army and militia have a debate over who should be really leading the military"
 fleet_P.10.a:0 "Side With The Army"
 fleet_P.10.b:0 "Side With The Militias"

 fleet_P.11.t:0 "Victorious!"
 fleet_P.11.d:0 "Victory. That is not a word that has left Aquilino's lips in a very long time. After many trials and tribulations, victory was the final outcome for the Admiral and his fleet. The idea of returning to the mainland has been realized as his men parade up and down the streets of every city in California. They have accomplished something that they deemed based on their situation was impossible.\nChampagne was popped, cigars were lit, sailors sung songs of returning home, everyone onboard was ecstatic to hear the news. Admiral John C. Aquilino took a deep breath and interrupted the celebrations to make a speech. The room quited immediately as everyone was eager to hear what he had to say.\nLadies and gentlemen, we may have taken California, we may have liberated the West Coast from Bolshevism. But there is something I want to remind each and everyone of you of. There is still much to be done. Tonight we drink and celebrate returning home... he took a swig before ending his speech."
 fleet_P.11.a:0 "Tomorrow we forge the plans for our new America"

 fleet_P.12.t:0 "The Last Frontier"
 fleet_P.12.d:0 "As a result from the collapse of the junta, the state of Alaska has proclaimed independence.\nThe goals of the new independent state are of now unknown. It seems that they need someone to guide them."
 fleet_P.12.a:0 "I will be that guide! (Play as Alaska)"
 fleet_P.12.b:0 "They can handle themselves just fine."

 fleet_P.13.t:0 "Federalist Forces Arrive"
 fleet_P.13.d:0 "With the capitulation of the Federalist regime in D.C. and Sanders refusal to rejoin the Legitimist cause, the Federalist Forces, including Acting President Abrams and his Military High Command have landed in Honululu and demanded that Hawaii cede all power to the true American government. While we just as easily could shoot them, many of our forces have favorable opinions on the Federalists, and may hurt our chances in the international sphere."
 fleet_P.13.a:0 "We shall be America's Salvation"
 fleet_P.13.b:0 "Say no, and arrest anyone who complains!"

 fleet_P.14.t:0 "Joining the Fleet?"
 fleet_P.14.d:0 "With Sanders defeated, we have linked up with [PAC.GetNameDef]. Should we join their cause and pledge our troops to them?"
 fleet_P.14.a:0 "A United Front against Bolshevism!"
 fleet_P.14.b:0 "The Fire Legion Lives On!"

 fleet_P.15.t:0 "Fire Legion forces pledge allegiance!"
 fleet_P.15.d:0 "Having managed to resist Sandersist assault during our reconquest of California, the Fire Legion survived the red terror and stook their independence.\n\nNow, however, with the communists dealt with, the Legion has pledged its allegiance to us and has been officially integrated into our forces."
 fleet_P.15.a:0 "The United Front Grows!"

 fleet_P.16.t:0 "End of the Line"
 fleet_P.16.d:0 "The collapse of the fleet was as inevitable as the collapse of the nation it was once loyal to. The garrisons in Alaska and Hawaii grew tired of the military dictatorship and the failed military campaign in California. Aquilino’s regime fell quickly, but for the thousands of people who suffered the martial law and drafted policies for an endless war it was not quick enough. The Admiral made a great retreat into Northern Alaska in order to evade the new Alaskan government. Using some funds he had “acquired” from what was left of the fleet’s economy he purchased a small cabin in the wilderness under a fake name. Aquilino simply expected to live out the rest of his life as a hermit, reading books about old naval battles and keeping warm by the fire with a bottle of brandy. Aquilino sat by his fire with his drink, as he had been doing for a few weeks now. He let his beard grow long as he had simply docked all his cares in the harbors of his former ships. His quiet time was interrupted by the sound of a siren and a megaphone.\n\n"John C. Aquilino you're under arrest, please exit the cabin and approach us with your hands up!" cried out the voice.\n\nAquilino was a man who would always search for the best tactic available, but a rusty old pistol he had from the navy would be no match for the dozens of police outside already taking aim. He decided that it would not be worth running anymore, and all he hoped was that history would not remember him as a traitor or a tyrant, but a man who did what he needed to do. He did make one decision that if he were to go down, he would go down dressed in his finest. He put on that famous uniform he wore what felt like many years ago, he combed his hair, shaved and decided to leave his parade saber as a show of no hostilities.\n\n"Mr. Aquilino if you do not exit the cabin in five minutes we will be forced to breach, please cooperate now and avoid any further escalation!" the voice cried out again.\n\nHe inspected himself in the mirror, liking what he saw but wishing that he would wear this uniform parading the streets of California and not the snowy tundra of Alaska. He took one last shot of whiskey before walking to the door and turning himself in."
 fleet_P.16.a:0 "A captain goes down with his ship, an admiral goes down with his fleet."

 fleet_P.17.t:0 "Collapse of the Pacific Fleet"
 fleet_P.17.d:0 "Following the arrest of Admiral John C. Aquillino and other high ranking offiers in Alaska by a group of upstarts, the entire U.S. Pacific Fleet has disbanded. Soldiers fighting in California have surrendered to the forces of the [PRA.GetName] and naval forces have placed themselves under the authority of the civilian government of Alaska and Hawaii. Though the collapse of the U.S. Pacific Fleet has been met with despair by some, many Californians have taken to the streets to celebrate the defeat of such a formidable foe."
 fleet_P.17.a:0 "Non sibi sed patriae"

