l_english: 
#Focuses
 CORE_CAN:0 "We will be capable of §Ccoring§! individual Canadian states."
 USA_NEW_revolt:0 "Every §Ccore state§! of §Y[NEW.GetName]§! that has over §O40% resistance§! will rise up against our enemies."
 USA_CSA_ultimatum:0 "We will §Ydemand§! the §R[CSA.GetName]§! return §GFlorida§! their rightful land."
 USA_KMT_deal:0 "We will offer Wisconsin an §Yintevention§! against the §Y[GLA.GetName]§! in exchange for them becoming our §Cpuppet.§!"
 USA_GLA_deal:0 "We will §Yprotect§! the §Y[GLA.GetName]§!, if they promise to join our war against the feds in the future."
 USA_GLA_deal2:0 "Trump will §Ycall us to §Rwar§!§! when he is figthing the feds."
 USA_Mike_Dewine:0 "Mike DeWine"
 the_future_of_republicanism:0 "The Future of the Republican Party"
 USA_reasses_army:0 "Reassess the Military"
 USA_reasses_army_desc:0 "If we wish to make America great again, we’ll need a great military to help accomplish it. Currently, our military is acceptable, but it’s not exceptional. Different people have different ideas on how to upgrade it, from complex reforms to completely falling back on old traditions. This is an urgent matter that must be dealt with."
 USA_recomision_planes:0 "Recommission Old Planes"
 USA_recomision_planes_desc:0 "Our Air Force has been behaving below expectations for some time now. While they may not be the best, older plane designs are cheaper and use fewer materials. They also work as practice for our loyal pilots." 
 USA_retore_helis:0 "Restore Old Helicopters"
 USA_retore_helis_desc:0 "Helicopters all do the same thing, more or less. Who needs the newest model when we can just improve the old one?" 
 USA_helis_research:0 "Improve our Helicopter Fleet"
 USA_helis_research_desc:0 "Improve our Helicopter Fleet: Now that we have a good amount of helicopters, their imperfections can no longer be ignored. We have plenty of talented mechanics who would love nothing more than to have a go at an old helicopter."
 USA_figther_research:0 "Conquer the Skies"
 USA_figther_research_desc:0 "If we want to take back America, we need to take back the skies first. While the skies above the Great Plains and the Midwest are ours now, the sky is controlled by our rivals elsewhere. We will show them who’s the boss! "
 USA_strat_research:0 "Strategic Bomber Program"
 USA_strat_research_desc:0 "The Federal Republic of America relies heavily on its industrial prowess. If we can take that from them, it will be like breaking their kneecaps. What better to do than strategic bombers? "
 USA_strats:0 "Hell from Above"
 USA_strats_desc:0 "Now that we have a respectable bomber program, we can ensure our enemies’ soldiers will always be watching the sky, for who knows when their foxhole could be the target of an air strike? e"
 USA_missiles:0 "Improve Our Silos"
 USA_missiles_desc:0 "We were incredibly lucky to inherit the bulk of America’s nuclear missile silos. While we would never dream of using nuclear warheads on our soil, the silos can be easily retrofitted to fire conventional warheads." 
 USA_silos:0 "Expand Our Silos"
 USA_silos_desc:0 "Expanding our missile silos offers us the opportunity to launch more missiles in a shorter period of time, something devastating to our foes."
 USA_air_doc1:0 "Focus on Our Air Doctrine"
 USA_air_doc1_desc:0 "We must focus on our air doctrine so we can pound our enemies on land and in the air. It must be done just in case our enemies have a yuge air force."
 USA_air_doc2:0 "Hire More Aerial Strategists"
 USA_air_doc2_desc:0 "By hiring more aerial strategists, we can continue to improve our air doctrine."
 USA_strats_doc:0 "Strategic Bombing Operations"
 USA_strats_doc_desc:0 "If we want to crush our enemies, we must bomb their manufacturing centers so their troops won't get the military equipment required to be triumphant. These operations will be crucial for reuniting the Land of the Free; it's all common sense."
 USA_military_reform:0 "Reform the Military"
 USA_military_reform_desc:0 "Several generals have come together to propose a plan for reforming our military. Reform is necessary, they say, because although it’s a hard pill to swallow, we are not as powerful as we once were. As such, we need to compensate for the loss of manpower and equipment. They bring up valid points, and President Trump has authorized their proposal."
 USA_doctrinal_reform:0 "Reform Our Doctrine"
 USA_doctrinal_reform_desc:0 "Before we can do anything else, we need to reform our doctrine. It should prioritize protecting the lives of troops and keeping our equipment in our hands. Once this is done, we can continue the reforms. "
 USA_support_our_troops:0 "Support Our Troops"
 USA_support_our_troops_desc:0 "We no longer have a near-endless supply of manpower, and so we need to ensure our soldiers survive. We will devote resources to making sure they have the protection they need."
 USA_promote_caution:0 "Promote Caution"
 USA_promote_caution_desc:0 "Don’t take unnecessary risks, doing so can cost you your life! If we have soldiers running into the open and being constantly gunned down, our manpower will quickly be depleted. As such, every soldier should know the importance of caution."
 USA_expand_enlistment:0 "Expand Enlistment"
 USA_expand_enlistment_desc:0 "The land we control is not the most populated, and many people are busy with their own lives. Some are opposed to fighting their countrymen, even if their countrymen are traitors! As such, they will need a bit of prodding; expanded enlistment should work! "
 USA_trench_building_classes:0 "Trench Building Training"
 USA_trench_building_classes_desc:0 "While it’s not the early 1900s anymore, trenches are still just as important to modern combat as they once were. The American army is not used to trenches being so heavily featured in a doctrine, as they are used to going on the offensive. As such, training is necessary to make sure every soldier’s trench is their home."
 USA_deeper_trenches:0 "Deepen Our Trenches"
 USA_deeper_trenches_desc:0 " While we will still be going on the offensive, it’s good to make sure our defenses are as excellent as they can be. In the unlikely scenario we are pushed back, we will have them hemorrhaging soldiers for every step they take." 
 USA_the_new_army:0 "The New American Army"
 USA_the_new_army_desc:0 " Cautious, tightly knit, and effective. This is the new American army. We will be ready for any fight that comes our way, and we will tackle it with reason and logic. The Federal Republic won’t know what hit them!" 
 USA_the_king_of_the_battle_field:0 "The King of the Battlefield"
 USA_the_king_of_the_battle_field_desc:0 "The raw industrial might of the Federal Republic of America dwarves anything we have to offer, and as such, their equipment will surely be more effective than ours. To combat this, we will need to find other ways to control the battlefield. Artillery, also known as the king of the battlefield, will be a crucial asset in our overall strategy. Therefore, we will put an emphasis on it when researching new military technology."
 USA_prepare_for_their_armour:0 "Prepare for Their Tanks"
 USA_prepare_for_their_armour_desc:0 "Tanks will be a major issue in our fight against the FRA, and so we must be prepared to deal with them. We will make sure our infantry is equipped with the right equipment to deal with them." 
 USA_prepare_for_their_planes:0 "Prepare for Their Planes"
 USA_prepare_for_their_planes_desc:0 "Planes will be another major card the FRA has up their sleeve. We must be able to shoot those bastards down if we’re going to have any sort of chance to win this war."
 USA_what_over_confidence:0 "What Over Confidence?"
 USA_what_over_confidence_desc:0 "What? The United States of America has had the greatest army on the planet for nearly a century, so why fix what isn’t broken? Our current doctrine should be more than capable of defeating the Federal Republic of America, and just about any other rival we encounter!" 
 USA_focus_on_speed:0 "Focus on Speed"
 USA_focus_on_speed_desc:0 "Blitzkrieg was an incredibly successful way of waging war during WW2, and while it’s fallen out of favor since then, with a few tweaks we can surely use it once again. When talking to his generals about how blitzkrieg could be Americanized, President Trump was told about how General George S. Patton extensively studied the strategy and how he implemented what he learned into his own military strategy. Using this knowledge, Trump ordered his military officials to adapt what he calls the 'Patton Doctrine'"
 USA_mechs:0 "Mechanized Warfare"
 USA_mechs_desc:0 "Modern warfare is defined by who has the best vehicles. The number one position in that field has always gone to America. But now that we’re fighting enemies with the same equipment as us, we’re going to need to change some things." 
 USA_ifv_focus:0 "Bring Forth the Bradleys"
 USA_ifv_focus_desc:0 "The United States of America has always been at the forefront of military innovation. Our equipment really is the best of the best, and so we should use it as much as we can. " 
 USA_armour:0 "Midwestern Armor"
 USA_armour_desc:0 "The FRA will have lots of tanks, and to combat those, we should build some tanks of our own. The Midwest is our most developed region industry wise, and so the task of producing tanks will fall to them. " 
 USA_elite_army:0 "The Best of the Best"
 USA_elite_army_desc:0 "The United States of America has always been at the forefront of military innovation. Our equipment really is the best of the best, and so we should use it as much as we can. "
 USA_focus_on_the_offense:0 "Relentless Attack"
 USA_focus_on_the_offense_desc:0 "Imagine, wave after wave of attacks. Tanks, soldiers, artillery. Rockets and bullets flying through the air! It’s enough to strike fear into the heart of any enemy soldier, which is why it’s how we’ll fight!"
 USA_transport_helis:0 "Air Assault Infantry"
 USA_transport_helis_desc:0 "After enemy ground forces have been weakened and their anti-air has been destroyed, air assault infantry is what comes next. Dozens of helicopters carrying hundreds of soldiers into enemy territory, then depositing their load and going back for seconds. This has worked to such great effect in the past; it’s paramount we fully incorporate it into our doctrine." 
 USA_behind_frontlines:0 "Go Beyond Supply"
 USA_behind_frontlines_desc:0 "Planes carry a finite amount of fuel, and so they can only go a certain distance. However, there are ways to extend the distance they can potentially travel, and we need to harness that to the best of our ability. "
 USA_air_dominance:0 "Air Dominance"
 USA_air_dominance_desc:0 "When you control the sky, you control the battlefield. Our enemies will be helpless to stop us as the sky is blacked out by the sheer might of our Air Force. Fly-Fight-Win!" 
 USA_the_american_army:0 "The Good Old Army of the USA"
 USA_the_american_army_desc:0 "The army is back in tiptop shape and ready to take on any threats! By falling back on traditions from years past, we have proven that just because something is old doesn’t mean it’s ineffective. Speaking of old, we’re coming for you, Biden!"  
 USA_guerrilla_warfare:0 "Guerrilla Warfare"
 USA_guerrilla_warfare_desc:0 "From the military debate, an interesting idea has sprung up. There are those loyal to us across the country. Why not exploit that?"
 USA_form_cells:0 "Form Resistance Cells"
 USA_form_cells_desc:0 "There are patriots trapped by oppressive regimes across this shattered land. With a bit of help, they will no longer be content with simply sitting idly by. If we are able to form enough resistance cells, we can prepare a popular uprising. While our enemies are busy fighting on the home front, we can simply breeze right through them." 
 USA_defend_our_land:0 "Defend Our Land"
 USA_defend_our_land_desc:0 "The territory we currently control is still something we need to defend, even if we intend to fight an unconventional war. Fortifications will be constructed, and we will have soldiers dedicated to defending our land." 
 USA_mobilise_the_people:0 "Popular Mobilization"
 USA_mobilise_the_people_desc:0 "We must stoke the flames of resistance across the land! Rise against your oppressors, true patriots! fight, fight, fight!" 
 USA_to_the_last_man:0 "Fight Till the Last Man"
 USA_to_the_last_man_desc:0 "When we are dealing with resistance groups formed of civilians, they tend to be more devoted to the cause than regular soldiers. As such, they will be more willing to fight until the last man standing. Dealing with a war of attrition like this will surely wear down the resolve of our foes." 
 USA_expand_the_cells:0 "Expand the Cells"
 USA_expand_the_cells_desc:0 "Now that resistance cells across the country are finding their footing, they can begin expansion. However, they must be careful, draw too much attention, and they risk getting shut down before they even have a chance to start." 
 USA_arm_the_cells:0 "Arm the Patriots" 
 USA_arm_the_cells_desc:0 "Making sure our loyal patriots have the weapons they need is very important for our cause. We will begin smuggling large amounts of guns behind enemy lines and to our secret resistance groups, ensuring they can fight when they need to."
 USA_guns_for_our_people:0 "Guns for Our People"
 USA_guns_for_our_people_desc:0 "Our nation must be a bastion for the Second Amendment. The Globalists in the East want to take that Amendment away from their citizens. Due to this fact, we must ensure everyone in our country gets weapons to defend from the tyrannical government in D.C." 
 USA_simplify_guns:0 "Simplify Gun Production"
 USA_simplify_guns_desc:0 "Lots of people mean lots of guns, and it’s our job to build them. The Second Amendment will not only be protected, its use will be encouraged!" 
 USA_underground_workshops:0 "Underground Workshops"
 USA_underground_workshops_desc:0 "Now that our partisans know how to construct weapons, they can begin building secret workshops to mass produce them as best they can. " 
 USA_fund_guerrillas:0 "Increase Guerrilla Activity"
 USA_fund_guerrillas_desc:0 "As the war for America draws ever nearer, it is time to reap the fruits of our labor. Resistance groups that have been spending so much time establishing themselves can begin attacking their oppressors. Roads, factories, army bases, sabotage them all! " 
 USA_rise_up:0 "Prepare the Popular Uprising"
 USA_rise_up_desc:0 "As guerrilla activity spikes within our rivals, the time for the popular uprising is just around the corner. When we go to war, our partisans will finally get their time in the sun, striking at our enemies from deep behind their lines!" 
 USA_make_america_great_again: "Make America Great Again"
 USA_make_america_great_again_desc:0 "Once upon a time, the United States of America was the greatest nation on Earth. It was renowned by every country, its people were happy, and it could project its power to any corner of the globe! But no longer is that the case. Thanks to the Democrats and their woke mob, the America our Founding Fathers wanted was replaced by something lesser. No longer was patriotism encouraged; instead, the Democrats tried to turn the men and women of America into weak snowflakes who would bow to any foreign power, and who would be offended by just about anything.\n\nBut one man stood against the tide! Donald J. Trump would not simply stand by and watch the nation he loved be brought to its knees. His first presidency in 2016 was one of the most successful yet, and it seemed he might save America. But thanks to the Chinese rigging the election to oust him, it seemed his work might all be for naught. Unwilling to see this happen, he rallied patriots everywhere and formed a rival government, a real government, a great government! Now America lies shattered, and President Trump is the only man who can truly put it back together!"
 USA_choose_a_vp:0 "Choose a Vice President"
 USA_choose_a_vp_desc:0 "Most of the world recognizes the Federal Republic of America as the legitimate successor to the USA, and there are several reasons for this. Firstly, Biden’s government seems more like a real government. While we are just as democratic as them are, some aspects of our nation may seem a bit…dictatorial. Mainly is the fact that President Trump has no Vice President. Thanks to Mr. Pence’s betrayal and the haste with which our new government was formed, there was simply no time to pick one. Now that the dust has settled on the Good Friday Ceasefire, the time has come for him to make a decision." 
 USA_rino_path:0 "John Thune"
 USA_rino_path_desc:0 "There were a few Senators who resisted President Trump during the conflict with the traitorous Mike Pence; Senator John Thune of South Dakota was a part of that resistance. However, Thune swiftly forgave President Trump and is now a moderate ally. John Thune's moderate conservatism will bring us prosperity, and we could approach the Federal Republic with an offer." 
 USA_private_investments:0 "Talk with Private Corporations"
 USA_private_investments_desc:0 "With the instability in the USA right now, many corporations have been wary about investing or even doing business in America. Thune has convinced President Trump that ensuring the support of corporations will greatly benefit us. President Trump did not need much talking down, as he himself is the owner of a wealthy business conglomerate. Not all corporations have been willing to strike a deal with us, but the ones that have will find that their investment has been well placed!" 
 USA_negotiate_with_corpos:0 "A Deal with Northeastern Corporations"
 USA_negotiate_with_corpos_desc:0 "What better way to strike our rivals than by stealing their business? While we recover militarily, we can launch a different kind of preemptive strike. By securing the support of corporations originating from the Northeast, we can hopefully drive up costs and nurture dissent within the Federal Republic of America. " 
 USA_integrate_ohio:0 "Thune's Dakota Development Act"
 USA_integrate_ohio_desc:0 "Vice President John Thune has proposed an act that would lead to the creation of thousands of jobs in his home state of South Dakota. He has plans to expand the act into North Dakota, but for now, we will hire new construction workers in South Dakota in order to develop the state. The vitalness of the act can not be understated, as it will help us finish our Keystone Pipeline project." 
 USA_free_trade:0 "Open Up to Other Republicans..."
 USA_free_trade_desc:0 "Even though we only officially control some regions of the country, there are those loyal to us just about everywhere. Lots of Republicans have been forced to flee their homes thanks to patriotism being a prosecutable offense these days. They are flocking here by the droves, and welcoming them in will prove to be very beneficial." 
 USA_fruits_of_trade:0 "...And their Money"
 USA_fruits_of_trade_desc:0 "While this is not the case for all, many of the Republicans who were able to make it here are very well-off financially. These men and women will find it easier to establish themselves within the United States of America, so long as they invest a little in the war effort. Even those who aren’t so rich will be able to assist our noble cause by going to work in factories and fields across the nation!" 
 USA_align_republicans:0 "Expand the Loyalists"
 USA_align_republicans_desc:0 "While the loyalist faction of nations is few, there are still those hidden within other American successors and break-offs still loyal to us. Several of these groups are influential within their respective communities, and in some cases could even be considered their nation. We will invite them to do business with us, while intentionally ignoring the nation they take up shelter in. " 
 USA_new_trade_routes:0 "Find New Routes to Our Allies"
 USA_new_trade_routes_desc:0 "Our allies are scattered across the continent, and we are separated by vast swaths of anarchy or woke hordes. If we are to maintain our position, we must secure trade routes to other loyalist nations. Once we are all strong economically, we will find becoming strong militarily to be a much easier feat." 
 USA_deradicalisation:0 "Fight Radicalization"
 USA_deradicalisation_desc:0 "The radicalism of some branches of the Republican Party is bad for business. Thune and Trump have had several conversations about the negative impacts that radical groups can have on the appearance of a nation. Thanks to some convincing from Thune, President Trump has announced a campaign to remove some of the most radical elements from our democracy. How this goes, remains to be seen." 
 USA_expell_deradicals:0 "Eliminate the Proud Boys"
 USA_expell_deradicals_desc:0 "While President Trump is not too enthusiastic about this, it must be done. As of now, the Proud Boys are doing nothing but terrorizing residents of our nation and damaging our reputation abroad. Something must be done about them, and the simplest thing to do is to just get rid of them. While this may damage his reputation to some people, it will just show who the true patriots are." 
 USA_research_group:0 "Loyalist Research and Development"
 USA_research_group_desc:0 "Most of the so-called "intellectuals" currently reside within the FRA. This isn’t to say there aren’t smart and capable scientists within our nation; we must simply set out to find them. Soon, the USA will be creating new and ingenious inventions by the day!" 
 USA_mil_industrial_complex:0 "Revive the Military Industrial Complex"
 USA_mil_industrial_complex_desc:0 "Despite Eisenhower’s warnings about the military industrial complex nearly 80 years ago, in reality, it has proven to be very reliable. Large defense contractors were damaged extensively by the start of the Second American Civil War, but if we help them reestablish themselves, we will surely reap the benefits. " 
 USA_embargo_FRA:0 "Restrict Trade With the Demorats" #Intentional misspell
 USA_embargo_FRA_desc:0 "Shockingly, in some areas of the economy, we still openly trade with the FEDS. To think they are stealing our resources and giving us their discounted, “pro-labor” goods is an atrocious idea. We will restrict, and in some cases, terminate trade with the FRA to ensure our goods stay in our hands." 
 USA_bring_new:0 "Host Resistance Radio Exiles"
 USA_bring_new_desc:0 "Resistance Radio has shown itself to be very capable of spreading Pro-Trump propaganda. Currently, their broadcasts are limited to Maine and Denver, but with a bit of investing, we can spread it nationwide! Who doesn’t want to enjoy some patriotic tunes with a sprinkling of Trumpism?"
 USA_NEW_RR_propaganda:0 "Push Propaganda through Resistance Radio"
 USA_NEW_RR_propaganda_desc:0 "Just like the Democrats did to us, we must push propaganda to demoralize the Swamp and help the patriots grow more resilient. We can attract patriots that are trapped in the FRA, and we will probably grow in population." 
 USA_NEW_units:0 "Recruit New Patriots"
 USA_NEW_units_desc:0 "With a wave of patriots coming in, we can train them for combat. Once the training is finalized, they can become a soldier for our glorious resistance." 
 USA_expand_minning:0 "Expand Mining Operations"
 USA_expand_minning_desc:0 "While the territory we control mainly consists of fields for natural resources, there are still plenty of ores and other materials below ground. This is America, after all! Mining was never really prioritized in the Great Plains under previous regimes, but we see its value. We need all the resources we can get, and there are plenty under our feet! " 
 USA_expand_minning2:0 "Open New Mining Sites"
 USA_expand_minning2_desc:0 "Our initial expansion of mining operations hasn’t been enough. Our factories are still struggling when it comes to sourcing raw materials. We need to mine more, to dig even deeper! We are standing on the secret to our success, and we will get it into our hands! " 
 USA_NEW_forts:0 "Fortify New England"
 USA_NEW_forts_desc:0 "While our holdings in New England are few, they are invaluable. Maine is the only New England state currently not occupied by the FRA, and once war resumes, it will be an important front. We must help them dig in and ensure our friends in Maine do not fall."
 USA_loyalist_economic_coperation:0 "Invest in our Allies"
 USA_loyalist_economic_coperation_desc:0 "Our allies are just as war-torn as we are, and could do with a little investing. The money we send out to them will mainly be for their military, but they’re also free to spend some of it on infrastructure if they please." 
 USA_MAGA_path:0 "Josh Hawley"
 USA_MAGA_path_desc:0 "Senator Josh Hawley from Missouri has proven himself as one of the most intelligent and agile Senators in the whole of the nation. He has only gotten better since the start of the civil war and the fraudulent 2020 Election. Even though the MMS has branded him as a Christian Nationalist, he is still the perfect fit for the job of Vice President." 
 USA_midwest_industrialisation:0 "Bring Back American Jobs"
 USA_midwest_industrialisation_desc:0 "Under the Demorats, jobs pioneered by Americans were ignored and people were encouraged to practice "the arts". Real American jobs are ones like farmer, factory worker, and miner. The Democrats want our people to do nonsensical professions like software engineer, opinion writer, and improv comedian. If we are to make America great again, we need to bring back these great jobs! " 
 USA_midwest_industrialisation2:0 "Create Even More Jobs"
 USA_midwest_industrialisation2_desc:0 "Thanks to the Democrats, jobs for Americans were taken away and given to illegal aliens who flooded our border. Now that President Trump is in charge of the USA, albeit not all of it, he can ensure that jobs meant for Americans go to Americans. Not only this, but with Vice President Hawley’s help, even more new jobs can be created!" 
 USA_the_arms_industry:0 "Patriotic Jobs"
 USA_the_arms_industry_desc:0 "There are American jobs, and then there are patriotic jobs! While every job helps the economy, some actively help the nation as well. Some of these include the military and anyone in government. These men and women are doing God’s work, and their duty to their nation!" 
 USA_industrial_subsedies:0 "Subsidize American Industry"
 USA_industrial_subsedies_desc:0 "Many corporations are struggling to establish themselves within the USA, and this isn’t good for business. Vice President Hawley has started a campaign to subsidize industry in an attempt to get manufacturing companies to set up shop. This will be a win-win for both of us, as we get more money and jobs for the people, and they get more goods produced at a cheaper price." 
 USA_celebrate_our_achivement:0 "Celebrate Our Accomplishments"
 USA_celebrate_our_achivement_desc:0 "We have come far in a short period of time, and both President Trump and Vice President Hawley have agreed celebrations are in order. The venue has been decided, the invitations sent out, and the catering companies chosen. This will be a great party, one the guests will not soon forget. Things must go smoothly, I mean, how badly off plan could it possibly go? " 
 USA_continue_the_plan:0 "Continue the Industrial Plan"
 USA_continue_the_plan_desc:0 "Well, that party was certainly interesting. Despite Trump Jr.’s delusional ramblings and proclamations, as of now, the industrial bill is going forward according to plan. Junior does not have as much power as he would like to believe, and unless President Trump listens to him, God knows why he would, things should go forth uninterrupted. There is still much work to do, and we will do it!" 
 USA_the_critic:0 "The Critic"
 USA_the_critic_desc:0 "Trump Jr. has continuously been a thorn in Vice President Hawley’s side. Not to disrespect President Trump, but his love for his son often causes him to favor him blindly. Junior is not a very intelligent man, yet he has somehow garnered a significant support base. He has been a heavy critic of the infrastructure and industrial bills, and now it seems President Trump may be beginning to listen to him." 
 USA_the_counter_proposal:0 "The Counter Proposal"
 USA_the_counter_proposal_desc:0 "Trump Jr. has come out of nowhere with his counter proposal to Vice President Hawley’s infrastructure bill. Why? We’re unsure, but he is trying to undermine the Vice President’s influence. Surprisingly, President Trump has accepted his proposal, hopefully not a sign of things to come. " 
 USA_his_project:0 "Jr.'s Projects"
 USA_his_project_desc:0 "Trump Jr. has begun his projects under his infrastructure bill. It is nowhere near as organized as Hawley’s and seems like it will do nothing but waste funds. However, the Vice President can’t call Junior out on this, lest he risk losing Trump Sr.’s favor." 
 USA_another_disputed_project:0 "Another Dispute"
 USA_another_disputed_project_desc:0 "Vice President Hawley can’t let this go on any longer. His hard work is being ruined simply because he is not the President’s son. He needs to do something about it, and fast. Perhaps a meeting with the President is best, so that he may explain Junior’s problems." 
 USA_infrastructure_plan:0 "The Infrastructure Plan"
 USA_infrastructure_plan_desc:0 "Now that our industrial might has been expanded, the time has come to turn our attention towards the nation’s infrastructure. The territory currently controlled by the USA is mostly rural and sparsely populated outside of cities, and so many roads and bridges are outdated. How can America truly be great again if the very roads its people use to traverse aren’t?" 
 USA_drill_baby_drill:0 "Drill Baby Drill"
 USA_drill_baby_drill_desc:0 "No matter how much we expand drilling operations, it seems like there’s always more. The USA truly is the land favored by God when it comes to natural resources, and why would we ignore his gift? Drill, drill, drill! " 
 USA_fuel_storage:0 "Expand Fuel Storage"
 USA_fuel_storage_desc:0 "The fact that we have gotten to the point that we need to expand fuel storage simply shows how far we’ve come. In the initial days after the Good Friday Ceasefire, fuel was scarce, and now we have too much! New silos and other storage depots will be constructed to keep our abundant fuel reserves safe. " 
 USA_reivest_the_profits:0 "Reinvest the Profits"
 USA_reivest_the_profits_desc:0 "Both the infrastructure and industrial bills that Hawley has overseen have proven themselves to be very profitable. We would be fools not to use this money to continue expanding both bills, so that the profits continue to roll in."
 USA_infrastructure_carson:0 "Hawley's Infrastructure Bill"
 USA_infrastructure_carson_desc:0 "Vice President Hawley has proposed his infrastructure bill, and it has passed with immense support! With his industry buildup being so successful, many within the government were happy to support his new infrastructure bill. This will bring the economy new jobs, more money, and possibly new investors. It’s a win-win for everyone! " 
 USA_the_request:0 "Hawley's Request"
 USA_the_request_desc:0 "Trump Jr. has been nagging Vice President Hawley for some time. He has done everything he can to constantly undermine Hawley’s efforts, and for what? Tomorrow, President Trump and Hawley will meet, and the latter intends to request that the President control his son. How Trump will respond is uncertain, but Hawley sincerely hopes his response will favor him." 
 USA_the_plot:0 "The Plot"
 USA_the_plot_desc:0 "Vice President Hawley is unfit for government, and no one knows this better than Junior. Political dynasties are a thing, right? So by that logic, someone related to Trump should be his Vice President. Hawley isn’t related to Trump, but guess who is? Trump Jr!" 
 USA_the_scandal:0 "The Scandal"
 USA_the_scandal_desc:0 "Josh Hawley is a respected man within the Trump administration, and so sabotaging him will be hard. Luckily, during a recent speech, he said some words that could be easily twisted. While everyone knows Hawley isn’t a radical unionist, his words taken out of context with an additional spin could easily make it look like he is." 
 USA_the_after_math:0 "The Aftermath"
 USA_the_after_math_desc:0 "Trump Jr.’s fabricated scandal worked incredibly well, better than he even expected. Half the country started believing Hawley was secretly a communist, and even President Trump got on the rumor train. Former Vice President Hawley resigned out of shame, and while it might’ve made Junior feel a little bad, it was for the best." 
 USA_prevent_another_fuck_up:0 "Keep Jr. Under Control"
 USA_prevent_another_fuck_up_desc:0 "Thankfully, President Trump has been cooperative and sees the threat his son poses to the betterment of our nation. While of course no official action will be taken against Junior, his father has pulled some strings to make sure he won’t be a problem anymore." 
 USA_increase_oversight:0 "Increase Oversight"
 USA_increase_oversight_desc:0 "As the scope of the infrastructure bill expands, it becomes more of a burden to oversee everything. With so much construction and labor, this is quite the opportunity for unpatriotic unions to form. Oversight must be expanded to ensure nothing like this happens. Communists have no place in America!" 
 USA_Continue_the_plan:0 "The Plan Continues"
 USA_Continue_the_plan_desc:0 "We are now entering the second stage of the infrastructure bill, and things are continuing to go smoothly! Junior isn’t a problem anymore, any potential unions have been weeded out, and the profits just don’t stop! Now Hawley can turn his gaze back inward and sort out all the “problems” within the administration." 
 USA_invest_in_electronics:0 "American Electronics Act"
 USA_invest_in_electronics_desc:0 "Silicon Valley in California was once the main innovation hub of America, but now that it’s under the control of the communists, we must form a new one. The goal of this initiative is to get American products, specifically electronics, back on the market. Make American electronics great again!" 
 USA_fire_unloyal_party_members:0 "Fire Disloyal Republicans"
 USA_fire_unloyal_party_members_desc:0 "There are those within the current administration who do not support Hawley and President Trump. These traitors masquerade as Republicans, but in reality don’t want a better future for our country! They have tried to sabotage us before, and now we must fire them to make sure they don’t try again. " 
 USA_sideline_rinos:0 "Control Promotions"
 USA_sideline_rinos_desc:0 "It’s a shame traitors were able to ascend to the upper echelons of our government in the first place, and it will not happen again. Not just had they found their way into government positions, but also into influential positions elsewhere. If we control who gets promoted, we can ensure they don’t harbor dangerous ideas and that they, too, want what’s best for the nation. " 
 USA_Patriots_in_control:0 "Patriots in Control"
 USA_Patriots_in_control_desc:0 "America is great again! While it still lies fractured, the land controlled by true patriots is in better condition than ever. The Feds, PRA, and other successor states come nowhere close to the level of innovation we have made! The Great Plains and Midwest have gone from desolate, ignored regions of America to some of the most prosperous. God bless the USA!" 
 USA_a_new_VP:0 "Trump Jr's Vice Presidency"
 USA_a_new_VP_desc:0 "With Ben Hawley out of the picture, Trump Jr. has finally got his chance. He managed to convince President Trump to select him as his new VP, a dream come true. Now a new political dynasty can form, one that will last for ages. The Trump Dynasty! So that America will stay great!" 
 USA_empower_the_trump_family:0 "Empower the Trump Family"
 USA_empower_the_trump_family_desc:0 "The Trump Family is possibly the greatest to ever come out of America. Only they know what is right for the nation, and will lead it to a bright future. However, they need more power to do this, and thanks to both the President and Vice President being Trumps, the opportunity has finally arisen."
 USA_trump_jr_and_his_projects:0 "Give Jr. Control Over the Economy"
 USA_trump_jr_and_his_projects_desc:0 "Hawley, communist as he was, had some genuinely decent ideas for managing industrial policy. Trump Jr. will now have to take over the management of the nation’s industry, and Hawley’s plan was so good that he intends to keep it. Of course, he’ll get all the credit now, but who cares?" 
 USA_family_and_goberment:0 "Family and Government"
 USA_family_and_goberment:0 "Many of the most successful regimes in history were so successful because they were ruled by one family. Families know each other, and work very well together. Notice how these are two traits politicians should have as well. This is why it’s optimal for the government to be dominated by a single family! " 
 USA_cult_of_personality:0 "The Cult of Trump"
 USA_cult_of_personality_desc:0 "Too many, a cult of personality sounds like a bad thing. However, it really isn’t. When a leader has a cult of personality, they manage to lead their nation much more successfully. When America’s leader is someone as great as President Trump, a cult of personality is a necessity so he can bring forth his vision for our great nation!"
 USA_the_true_struggle:0 "Our True Struggle"
 USA_the_true_struggle_desc:0 "Now that the Trumps firmly sit atop the territory they control, they can begin preparations for a great crusade. A crusade against the traitorous Democrats, who broke the USA! In a way, though, Trump Jr. must thank them, for they allowed him to reform the government. Soon America will be whole again, an America ruled by the Trumps!" 
 USA_the_trump_legion:0 "The Trump Legion"
 USA_the_trump_legion_desc:0 "Behind President Trump is his supportive family. They are his legion, defending him no matter where he goes. Democrats, unloyal Republicans, and all sorts of traitors will not be able to do anything so long as Trump’s family is there. Now that they occupy many important government positions, anything Trump wants done will be done. For the United States of America, and President Trump!" 
 USA_PB_path:0 "Gavin McInnes"
 USA_PB_path_desc:0 "If President Trump wants to be able to lead the USA with the utmost efficiency, he needs a VP who will not question his decisions. Gavin McInnes, founder of the Proud Boys, has shown himself time and time again to be a true patriot. McInnes was one of the first to oppose the woke agenda, and bringing him into the administration will also bring in the Proud Boys. Of the three choices for Vice President, McInnes has the most to offer, and least to take."
 USA_railroads:0 "Railroad Projects"
 USA_railroads_desc:0 "For a long time, the heart of America was its railroads. In the past century, trucking has slowly begun to replace trains, but has not made them obsolete. Trains can carry far more than trucks, and what we need is lots of supplies moved very fast. An initiative has begun to expand and replenish railroads, so that the USA can become better connected than ever. " 
 USA_mix_development:0 "Expand Dual-Use Industries"
 USA_mix_development_desc:0 "Our civilians and soldiers need lots of the same things, and it’s our job to ensure they have them. While there are already factories pumping our supplies for the people and army alike, it’s simply not enough to meet demand. Expansion to current factories is needed, along with the construction of new ones. Once the production meets the demand, everyone will be happy!" 
 USA_build_up_arms:0 "A Patriotic Arms Industry"
 USA_build_up_arms_desc:0 "With the outbreak of the Second American Civil War, many defense contractors began supplying both sides. While this worked in the short term, we can no longer associate ourselves with companies that work with the Democrats. Either they can choose us, or them. Soon, the arms industry will be controlled by patriots, and every gun will go to a true believer!" 
 USA_war_policy:0 "Prepare for Total War"
 USA_war_policy_desc:0 "Sooner than later, the Good Friday Ceasefire will expire, and the drums of war will beat again. When this war comes, we will not simply engage in hit and runs and insurrections; we will fight total war. We need tanks, guns, planes, all of this and more. When the time comes for our soldiers to march, the Democrats will be overwhelmed and destroyed!" 
 USA_closed_economy:0 "Close the Economy"
 USA_closed_economy_desc:0 "If our economy relies too much on a single foreign entity, we will struggle to fight a war. The USA has plenty of natural resources, and as such, we don’t need to rely on anyone but ourselves. With our economy closed, nations more friendly to the woke left will no longer be able to play with us!" 
 USA_underground_factories:0 "Hide our Factories"
 USA_underground_factories_desc:0 "Our factories, as they currently stand, are incredibly easy targets for missiles and bombers. Our Air Force will not be able to defend them all from the forces of the feds, and so we must ensure they cannot be found. Keep them secret, keep them safe." 
 USA_bomb_proof_factories:0 "Bomb-proof the Rest"
 USA_bomb_proof_factories_desc:0 "Not all of our factories can be easily hidden, and so we must begin bombproofing those we cannot disguise. We will ensure they are built and reinforced with sturdy materials, and protected with the best AA the USA has to offer." 
 USA_mil_readiness1:0 "Labor Units"
 USA_mil_readiness1_desc:0 "A drastically overlooked segment of the army in the early days of our buildup was the labor units. These men and women are among the most important, ensuring that the land we take back stays under our control. Our army’s current labor force is understaffed and lacks equipment, something that will not do if we are to take back America!" 
 USA_mil_readiness2:0 "Rigorous Training"
 USA_mil_readiness2_desc:0 "There aren’t many soldiers in our labor units who are experts in their field, and this is a major problem. If they don’t know what they’re doing, their fortifications will be lackluster and easily overrun. We must gather the few experts we do have and put them in charge of training recruits. Soon, the labor units will be on par with the rest of our military!" 
 USA_mil_readiness3:0 "Expand the Labor Corps" 
 USA_mil_readiness3:0 "Now that the soldiers and engineers within our labor units know what they’re doing, we can finally go about gathering more of them. The force is still small, despite minor expansions, and more manpower is needed. Any true patriot should be willing to work anywhere in the army, and so there should be no problems with being assigned to build bunkers and bridges." 
 USA_the_PB_paramilitary:0 "A Second Army"
 USA_the_PB_paramilitary:0 "While our armed forces continue to prepare for conflict with the Federal Republic of America, we can turn our attention to our less “official” army. The Proud Boys, a far-right militia founded by Vice President McInnes. Unlike our army, which resides only within the territories under our control, the Proud Boys have several sects outside our borders. We must ensure they are properly utilized when we march to reunite America!" 
 USA_iron_fist:0 "Our Iron Fist"
 USA_iron_fist_desc:0 "The armed forces of the USA must be seen as dignified and respectable; however, the Proud Boys don’t need the same levels of accountability. The FRA has them classified as a terrorist group, so why change anything? Terrorists are what we need them to be, capable of striking deep into enemy territory even in times of peace. They will be our silent, iron fist, and they will be regarded as heroes!" 
 USA_Expand_PB_influence:0 "Expand Their Scope"
 USA_Expand_PB_influence_desc:0 "The Proud Boys units outside of our borders are often disunited and out of contact with their leaders. While they still work to further our goals, without functional communication, we can’t give them orders. To expand the scope of the Proud Boys, we must find ways to get in contact with those of them behind enemy lines. Once they’re receiving new orders, we can move on to the next part of our plan." 
 USA_Expand_PB_militias:0 "Expand Proud Boy Recruitment"
 USA_Expand_PB_militias_desc:0 "There will always be those who are a little too “cuckoo” for regular military service. Usually, they would be disregarded by their government and sent to do some other job. However, the Proud Boys have used them. They need all the manpower they can get, and so these failed soldiers who probably shouldn’t be given firearms will be permitted to join them!" 
 USA_train_PB:0 "Enlarge Proud Boys Regiments"
 USA_train_PB_desc:0 "Now that we have more Proud Boys, we can begin to expand the size of their units. Until now, they’ve been kept small but organized to maintain secrecy and keep a low profile. However, there are plenty of areas where they can be expanded to wreak more havoc upon our foes!" 
 USA_heavy_weapons_PB:0 "Give Them Heavy Weapons"
 USA_heavy_weapons_PB_desc:0 "Up until recently, the Proud Boys have not needed heavy weaponry, as the majority of their operations were things like hit and runs and convoy raids. However, as their size increases, they’ve been finding themselves fighting against trained military forces more and more often. They are in desperate need of heavy weaponry to combat such threats and to ensure their mission is successful." 
 USA_limit_PB:0 "Put Limits on The Proud Boys"
 USA_limit_PB_desc:0 "While they are loyal to us, there are times when the Proud Boys can be too radical. We must keep up the myth that we are not directly funding them, even if everyone knows we are, officially, we aren’t. If they’re seen getting too much control, it will be obvious we’re their supplier. It is paramount that we place limits on them to stop them from going too crazy." 
 USA_retake_control_from_PB:0 "Retake Control"
 USA_retake_control_from_PB_desc:0 "Despite McInnes founding the Proud Boys, he took a more hands-off approach after that, even giving up leadership. This has led to most units of the Proud Boys not being under our control, and only listening to our orders unofficially. With the recent limits placed on them, their dislike of us has grown, and we must wrangle them back under our control to make sure they don’t try anything funny." 
 USA_work_with_the_opposition:0 "Reinstate the Opposition"
 USA_work_with_the_opposition_desc:0 "No matter how much we need the Proud Boys, we cannot become dependent on them. If they manage to gain too much power, our nation is doomed. To combat this, in a highly secretive move, several opposition groups to the Proud Boys have been founded or brought in. This is a conspiracy of the highest level; in fact, it’s questionable if the President even knows. However, it’s a necessary step to take in ensuring we stay in charge." 
 USA_make_america_again:0 "Make America Again"
 USA_make_america_again_desc:0 "We currently face a serious dilemma. How can we make America great again when we don’t control all of it? Since the fake president, Joe Biden, formed his illegitimate regime, our great nation has fractured. Between us and the Federal Republic lie a slurry of breakaway nations and even less legitimate successors. If we are to truly bring freedom and patriotism back to the USA, we must control it all!" 
 USA_western_direction:0 "The Situation in the West"
 USA_western_direction_desc:0 "The western United States was once known as the “Wild West”, and for good reason. Today, that name can once again be applied to the absolute anarchy the Rockies and Pacific have devolved into. Every ideology under the sun has found a place to fester and grow, from communism to fascism, and it must be brought to an end! The West must be reigned back under our control, to the Pacific we shall go!" 
 USA_deal_with_devil:0 "Deal With the Devil"
 USA_deal_with_devil_desc:0 "As it currently stands, a war against California would be a long and brutal one. We would win in the end, but we would risk weakening ourselves to the point of being unable to take on the FRA. As much as it pains us, coming to some sort of agreement with Sanders is the best option. Trump and Sanders will carve up the West into their spheres of influence. Someday we will strike down California, but that day is not today." 
 USA_IDA_PRA_deal:0 "Expand the Scope of the Deal"
 USA_IDA_PRA_deal_desc:0 "So far, our deal with Sanders has been surprisingly beneficial for both of us. While we will still get them someday, we might as well exploit them while we can." 
 USA_SIN_conflict:0 "Secure Colorado"
 USA_SIN_conflict_desc:0 "Colorado is where our capital is located, yet we don’t control the entire state. We must secure the western half of it if we are to keep Denver far behind the frontlines." 
 USA_cut_off_the_middle_states:0 "Cutoff the Rockies"
 USA_cut_off_the_middle_states_desc:0 "The Rockies are mostly large swathes of anarchy with no major powers. Despite the harsh terrain, it shouldn’t be hard to march through and crush all resistance. Especially with the support of our Western Command Center." 
 USA_end_socialism:0 "End Communism"
 USA_end_socialism_desc:0 "The fact that an ideology such as communism can even find a place on our shores shows how far we’ve fallen as a nation. California, under the control of that rat Bernie Sanders, has become a puppet of the PRC. We can’t let their false successor last any longer." 
 USA_arm_the_coalition:0 "Arm Anti-Communists"
 USA_arm_the_coalition_desc:0 "Luckily, we aren’t the only people who hate communism. Just about every other breakaway nation in the West is anti-communist, and with a bit of coaxing would surely be willing to fight California. However, they need weapons, weapons we can provide. We will arm them to ensure our progress towards a common goal." 
 USA_red_war:0 "§RThe Red War§!"
 USA_red_war_desc:0 "The negotiations have been held, the secret meetings discussed, and the time is now. We will stamp this putrid state from the face of our nation with the support of the entire West. If we all work together, we can drive the People’s Republic from our shores!" 
 USA_MON_conflict:0 "Push Montana West"
 USA_MON_conflict_desc:0 "Montana has been a stable red state for many years, but the fact that they would opt for independence rather than joining us tells us everything we need to know about them. We will force them to hand over their eastern lands in exchange for peace." 
 USA_MON_invade:0 "Invade Montana"
 USA_MON_invade_desc:0 "Did the Montanans seriously think we’d let them continue their independent existence? Now that they’ve already been weakened, we can deal the final blow and invade and annex them." 
 USA_CAS_inavde:0 "Reach the Pacific"
 USA_CAS_inavde_desc:0 "Cascadia is an odd hybrid state of Washington and Oregon, and also our last obstacle before we reach the Pacific. They’ve been weakened by internal struggle and a conflict with California, so marching through them shouldn’t be too hard." 
 USA_PRA_inavde:0 "Destroy Commiefornia"
 USA_PRA_inavde_desc:0 "California is on its last legs! It has no allies, and we stand united against it! Sanders’ experiment won’t last much longer, and it’s our job to make sure it’s ended." 
 USA_VAN_inavde:0 "Remember the Pig War"
 USA_VAN_inavde_desc:0 "Ever since the Oregon Treaty in 1846, the US has gained little to no territory. Fortunately, Trump wants to expand our territory into British Columbia to take their natural resources." 
 USA_mormon_victor:0 "Push Beyond the Rockies"
 USA_mormon_victor_desc:0 "Now that the Rockies have been secured, we can move beyond them into the southwest and Great Basin. We will inch closer to California, one conquered nation at a time!" 
 USA_southern_direction:0 "Turn Towards the South"
 USA_southern_direction_desc:0 "The South is home to some of the most legitimate successor nations to the United States. The Confederacy, Second Texan Republic, and Florida could all be considered nations in their own right. As such, it is paramount that we defeat them as soon as possible. Order must be restored before any national identity can be established down south." 
 USA_southern_border_adjustment:0 "Our Current Expansion Goals"
 USA_southern_border_adjustment_desc:0 "The South offers prime territory for expansion, but it's best to take it slow. Our first goal should be annexing the rest of Oklahoma, which has been split between us and Texas. While the Texans may be willing to work with us, it’s best to navigate around them and stab them in the back." 
 USA_deal_with_CSA:0 "Anti-Texas Deal"
 USA_deal_with_CSA_desc:0 "The Confederacy shares Louisiana with Texas, and at the moment tensions between the two aren’t too friendly. With enough pressure on the Texans from both of us, surely they will concede and give us what we want. " 
 USA_southern_forts:0 "Fortify the Southern Flank"
 USA_southern_forts_desc:0 "Oklahoma is a vast yet empty state, and as such is incredibly challenging to defend. If the Texans were to launch a preemptive strike, our forces in the south would not be able to easily defend the land. As such, we should invest in proper defenses to ensure continued control over the southern plains." 
 USA_aid_FLO:0 "Invest in the Defense of Florida"
 USA_aid_FLO_desc:0 "The Republic of Florida is an invaluable asset to our current position within the United States. They offer the chance to strike the Confederacy from the back, but they also present a challenge in logistics. Defending the panhandle is a necessity." 
 USA_intervine_FLO:0 "Intervine in Florida"
 USA_intervine_FLO_desc:0 "Our Floridian allies are at risk of being defeated by the Second Confederacy. We must prevent this from happening, and support the young Republic however we can." 
 USA_ultimatum_CSA:0 "The Panhandle Ultimatum"
 USA_ultimatum_CSA_desc:0 "Hopefully Kanye has realized the error of his ways. His war against Florida has not gone according to plan, and unless he wants to risk war with us, he should concede to their demands. We fully support Florida’s so-called Panhandle Ultimatum, and we will let the CSA know it." 
 USA_invite_FLO:0 "Invite Florida to the Loyalist"
 USA_invite_FLO_desc:0 "Up until now, our alliance with Florida hasn’t been officially ratified; however, the time has come to do so. We will invite them into our faction, for the continued prosperity of America!" 
 USA_TEX_invade:0 "Invade Texas"
 USA_TEX_invade_desc:0 "The time has come to take back the Lone Star State. The first Republic of Texas was a mistake, and so too is the second one. They will put up a fight, but enough of their people want to join us that they may be forced to deal with threats on the home front as well. To the Gulf of Mexico!" 
 USA_CSA_invade:0 "Crush the Traitors"
 USA_CSA_invade_desc:0 "Now that more pressing matters have been dealt with, we can turn our attention to the Deep South. In a move reminiscent of the First American Civil War, a Confederacy of States has been formed. However, their national identity is fragile, and it should not be too hard to break their resolve." 
 USA_MEX_invade:0 "§GCross The Border Wall§!"
 USA_MEX_invade_desc:0 "The Mexican drug cartels have, for far too long, caused instability in 4 of our bordering states. Trump has made a drastic decision to invade Mexico to crush the drug traffickers." 
 USA_eastern_direction:0 "Reclaiming the East"
 USA_eastern_direction_desc:0 "To the east lies our greatest foe, Joe Biden and his Federal Republic of America. The time has finally come to begin preparations to march eastward, and the expiration date of our shaky truce comes ever closer. If peace is not an option, we will reunite America through blood!" 
 USA_aid_NRA:0 "Support West Virginia"
 USA_aid_NRA_desc:0 "West Virginia’s situation is…unique, to say the least. Nonetheless, they are supportive of our cause, and as such, we should support them back." 
 USA_aid_KFC:0 "Support Free Kentucky"
 USA_aid_KFC_desc:0 "Kentucky is currently in the clutches of a madman. Not all are pleased with his rule, however, and he has found himself dealing with an incursion. We will support these rebels in exchange for their future support." 
 USA_bomb_KFC:0 "Bomb the Colonel"
 USA_bomb_KFC_desc:0 "Material aid is not enough for the soldiers of Free Kentucky, and so we must take it a step further. We will hold a bombing campaign against the mad colonel to destabilize his regime further." 
 USA_puppet_KFC:0 "Secure Kentucky"
 USA_puppet_KFC_desc:0 "With the victory of Free Kentucky, we can make our move and bring them into our sphere. They may not offer much, but it’s one step closer to our greatest foe."
 USA_AFS_invade:0 "End Vermin's Whole Career"
 USA_AFS_invade_desc:0 "The American Free State is a sad, pathetic excuse for a nation, run by sad, pathetic excuses for politicians. They will tear each other apart if given enough time; we might as well speed up the process." 
 USA_VIR_invade:0 "An Atlantic Coast"
 USA_VIR_invade_desc:0 "We have come far from our humble origins in the Great Plains, and now it seems the Atlantic Ocean is within reach. With one final push, we will soon have an Atlantic coast." 
 USA_strike_first:0 "Strike First"
 USA_strike_first_desc:0 "We can’t afford to sit around and give the FRA any more time to build their arsenal. We must strike now, while the iron is hot, before they get any funny ideas of their own. Soon, our last major obstacle before we reunite America will be vanquished! From sea, to shining sea!" 
 USA_victory:0 "Patriot Victory"
 USA_victory_desc:0 "We have done it! The Federal Republic of America has been vanquished, and America can finally become whole once more! Of course, there are still several steps that must be taken, but we are closer than we have been since the start of the Second Civil War." 
 USA_guantanamo:0 "Demand Guantanamo"
 USA_guantanamo_desc:0 "Guantanamo Bay is our rightful territory, and it should be returned to us! If the current owners have a problem, they can deal with it!" 
 USA_purto_rico:0 "Demand Puerto Rico"
 USA_purto_rico_desc:0 "The United Nations occupied Puerto Rico under the guise of “peacekeeping". Well, now that peace has been restored, surely they won’t have a problem with handing it back over." 
 USA_maine:0 "Invade New England"
 USA_maine_desc:0 "While we may control D.C. once again, not all of the former FRA is actually under our control. Several breakaway states have formed that are still resisting our control. This simply will not do, and we must finish our crusade!" 
 USA_invade_NRA:0 "Invade West Virginia"
 USA_invade_NRA_desc:0 "West Virginia, while originally supportive of our cause, has strayed from patriotism. Luckily, Appalachia is a fairly underdeveloped region, and retaking West Virginia should be an easy feat." 
 USA_northen_direction:0 "Secure the North"
 USA_northen_direction_desc:0 "While we have the North mostly secured, there are still some places where expansion is required. The Great Lakes region, in particular, is free from our control, despite being in such proximity. The war against Pence further weakened our influence in the region, but now we are in a position to take it back!" 
 USA_minnesota:0 "Invade Minnesota"
 USA_minnesota_desc:0 "Minnesota has seen some of the largest fighting between forces friendly to us and forces friendly to Biden since the signing of the Good Friday Ceasefire. As such, we have been hesitant to officially step in and invade, but as we’ve become much more established, the time has come to do so. First Minnesota, then the rest of the Great Lakes will follow!" 
 USA_docks:0 "The Trump Navy!"
 USA_docks_desc:0 "Up until now, we have not had to worry about a navy, as we’ve controlled almost entirely landlocked states. However, we do control some ports on the Great Lakes, and as the region becomes more important, so too is the prospect of a fleet to call our own." 
 USA_ship_modules:0 "Develop Ship Modules"
 USA_ship_modules_desc:0 "Develop Ship Modules" 
 USA_ship_modules_desc:0 "Ships are only as good as their sailors…and the equipment aboard them. Now that our navy is beginning to float, we should put some modules on them so they can do more than drift aimlessly." 
 USA_naval_air:0 "Naval Aviation"
 USA_naval_air_desc:0 "When it comes to naval combat, the air is just as important as the sea. While we aren’t in a position to build any carriers, that doesn’t matter as the Great Lakes are small enough that we can deploy planes from our territory. However, we should make some adjustments so they are more suitable for flying over the Lakes." 
 USA_ships:0 "Ship Development"
 USA_ships_desc:0 "The Great Lakes were never home to much more than Coast Guard cruisers, and so we will have to build most of our ships from scratch." 
 USA_docks2:0 "Expand Our Naval Capacity"
 USA_docks2_desc:0 "Now that we have more ships, we need more docks suitable for hosting them. Not only will this help our military, but the construction of docking facilities will create new jobs for many!" 
 USA_great_lakes_warfare:0 "Great Lakes Warfare"
 USA_great_lakes_warfare_desc:0 "While the Great Lakes may be expensive, they are, in the end, still lakes. They are surrounded by land, and as such, naval warfare on them will be very unique. It is best to get ahead early and begin practicing and studying doctrines." 
 USA_subs:0 "Submarine Development"
 USA_subs_desc:0 "Submarines are just as important as their above-water counterparts, and we must incorporate some into our navy if we want to truly rule the Lakes." 
 USA_destroyers:0 "Refurbish Old Destroyers"
 USA_destroyers_desc:0 "Being able to quickly strike our opponents on the Lakes is a necessity, and so we will embark on a campaign to construct more destroyers." 
 USA_crusiers:0 "Cruiser Building Program"
 USA_crusiers_desc:0 "If we are to truly control the Great Lakes, we must be able to control the water close to our shores. Cruisers will be constructed for this very purpose." 
 USA_embargo_GLA:0 "Shock [GLA.GetName]"
 USA_embargo_GLA_desc:0 "The Great Lakes Authority has proven to be incapable of governing itself, and the steps must be taken to conquer it. Firstly is an embargo; if we can seed discontent at home, the people will be all the more willing to accept our control." 
 USA_GLA_invade:0 "Tread on Them"
 USA_GLA_invade_desc:0 "Our embargo has proven to be more successful than we could have hoped, and now we can march right into the Great Lakes Authority. Soon they will be back under their rightful owners." 
 USA_KMT_arm:0 "Support Wisconsin"
 USA_KMT_arm_desc:0 "The Winsconsonites are stubborn in their desire to regain their lands from the GLA.\nWe can use this to our advantage by aiding them to weaken the GLA." 
 USA_KMT_puppet:0 "Take Advantage of Wisconsin"
 USA_KMT_puppet_desc:0 "Without realizing it, Wisconsin has somewhat involuntarily given us total control over them. Now we will officially make them our puppet, one more pawn in the game for the future of the USA." 
 USA_GLA_art_of_the_deal:0 "Art of the Deal"
 USA_GLA_art_of_the_deal_desc:0 "Working with the Great Lakes Authority will be much more successful than fighting with them, especially as we share similar ideologies. We will secretly negotiate with them to form an unofficial alliance, a little secret between the two of us." 
 USA_GLA_call:0 "Call Our Northern Ally"
 USA_GLA_call_desc:0 "The war against Biden will surely be tough, and we’ll need all the help we can get! By bringing the Great Lakes Authority into the equation, we open another front for the Feds that they would rather not have to deal with!" 
 USA_purge_dems:0 "Purge Leftism"
 USA_purge_dems_desc:0 "Lurking within the United States of America is a hidden demon. While many Democrats have been confined to the Feds, thank God, there are still some within our nation and even our government. We simply cannot allow this to continue, lest we fall ill to the same woke-virus they have tried to spread. The only way to do this is to make sure they are removed from our government, and potentially removed from life." 
 USA_discredit_Biden:0 "Trial Biden in Absentia"
 USA_discredit_Biden_desc:0 "Sleepy Joe Biden thinks his Federal Republic of America is the true successor to the USA, and so does most of the world. While we don’t have much in our arsenal of legitimacy, we do have some ways to discredit his regime. For one, we control more land and most likely have a stronger military. Secondly, we are literally named after the United States of America, and they aren’t. So how can they be legitimate?" 
 USA_trial_for_degeneracy:0 "Trial for Degeneracy"
 USA_trial_for_degeneracy_desc:0 "The number one offense that most Democrats can be held accountable for is degeneracy. They have tried to brainwash our children into believing that there are more than two genders. Even the implications of this are simply disgusting, and trials will be held for major democrats. While we can’t yet prosecute them, the time will come." 
 USA_trial_for_treason:0 "Trial for Treason"
 USA_trial_for_treason_desc:0 "Another major offense many Democrats have partaken in is treason. They have explicitly tried to weaken our nation so that it could be taken over by foreign powers of the migrant mobs swarming over the southern border. Treason has always been one of the highest crimes in any civilized nation, and so trials will be held." 
 USA_trial_for_cheating:0 "Trial for Cheating"
 USA_trial_for_cheating_desc:0 "Another major offense the Democrats have partaken in that has even affected President Trump personally is cheating. Mainly, elections. Almost all recent elections where a Democrat has won have been rigged by the Chinese to give them an unfair advantage. Cheating should not be allowed in elections, and so trials will be held."
 USA_send_agents:0 "Send a Hitman into the Federal Republic"
 USA_send_agents_desc:0 "While it won’t be easy, we need to infiltrate the ranks of the Federal Republic. Once we’ve done this, we can kinapt the federal leadership. Soon, the time will come for the Democrats to be prosecuted!" 
 USA_actual_trial:0 "The Real Trial"
 USA_actual_trial_desc:0 "Now that we control the Federal Republic of America, the last bastion of wokeness is gone. Most major Democratic Party members are now in custody, and the few who disappeared will be tracked down soon. President Trump has announced plans to personally oversee the trials against his rivals, to make sure their punishments are proportional to their crimes." 
 USA_actual_trial_degeneracy:0 "Trial for Degeneracy"
 USA_actual_trial_degeneracy_desc:0 "Degeneracy is not an executable offense, but many who are found guilty of it will be imprisoned for life. The degenerates among the Democrats must now be allowed to return to society, lest they ever attempt to brainwash a new generation of patriot Americans." 
 USA_actual_trial_treason:0 "Trial for Treason"
 USA_actual_trial_treason_desc:0 "Treason, unlike degeneracy and cheating, is an executable offense. While all Democrats are technically guilty of treason, we can’t be seen executing dozens, if not hundreds, of politicians. As such, only the highest ranking members of the Democratic Party will be executed, and hopefully a message will be sent." 
 USA_actual_trial_cheating:0 "Trial for Cheating"
 USA_actual_trial_cheating_desc:0 "While the Democrats themselves didn’t rig the elections, the Chinese did that; they certainly knew and assisted them. As such, their punishments will be slightly less, but they will probably end up spending the rest of their lives in prison. From now on, all elections will be free and fair!" 
 USA_final_veredict:0 "The Final Verdict"
 USA_final_veredict_desc:0 "Now that the trials have finished, the final verdicts can be handed down. Almost every Democrat has been found guilty of some offense; the only ones who haven’t been the ones who snitched in exchange for freedom. Now that our only real rivals are gone, the plan to rebuild the political system can finally begin!" 
 USA_democrat_question:0 "The Democrat Question"
 USA_democrat_question_desc:0 "Despite most real Democrats being imprisoned or executed, some sleazy politicians escaped punishment. They and some moderate Republicans have advocated for the Democratic Party to be restored, but more akin to the Democrats of 60 years ago. The only other real option is to make the Libertarians the main Republican opposition. President Trump must now internally debate on which option is best for the nation." 
 USA_reform_democrats:0 "Reform the Democrats"
 USA_reform_democrats_desc:0 "The status quo exists for a reason, and messing it up might have dire consequences. While the Democrats of today want to hurt America and sell it out to foreign rivals, the Democratic Party of old cares about its country. Before there was such a thing as wokeness and LGBTQ, we could peacefully interact and work with Democrats. We will bring their party back, but restore its former glory!" 
 USA_bring_southern_democrats:0 "Bring in Conservative Democrats"
 USA_bring_southern_democrats_desc:0 "A lot of the great Democrats of old came from the south. Dixiecrats, as they were called, were an important part of the old Democrats. When the progressives and communists seized the party, they shunned and chased out the Dixiecrats. Now that we’re once again in control, we can make sure these poor southern politicians have a better home." 
 USA_choose_a_new_democratic_candidate:0 "Handpick a Democratic Candidate"
 USA_choose_a_new_democratic_candidate_desc:0 "Now that the Democrats are people we can work with, we shouldn’t have to fear an election with them. Firstly, their candidate has slim chances of winning, and secondly, they won’t do anything to hurt us. The time has come to choose a new Democratic candidate and hold new elections!" 
 USA_pardon_some_democrats:0 "Pardon Some Democrats"
 USA_pardon_some_democrats_desc:0 "After the fall of the Federal Republic of America, some Democrats proved to be surprisingly cooperative. They had previously been outliers among their party, although still partially brainwashed. Now that they are free from the progressives’ yoke, they won’t cause us any problems. They will be pardoned and shall return to work in the New Democratic Party." 
 USA_let_them_campaign:0 "Allow Limited Democrat Campaigning"
 USA_let_them_campaign_desc:0 "We can’t have the world screaming undemocratic at us, and so the Democrats will be allowed to campaign. While the chances are low that they will win, they still have a decently sized support base. No matter who wins, however, our agenda will continue to be pushed forward."
 USA_our_campaign:0 "Our Own Campaign"
 USA_our_campaign_desc:0 "While President Trump is popular, he can’t just magically win the election. A campaign must be held to show how great Trump is, and how great he would be if he were reelected! America is still recovering from the Civil War, and so it can be made better! Great, even! Make America Great Again!" 
 USA_new_election:0 "New Elections"
 USA_new_election_desc:0 "The time has come. The ballots are open, the votes are rolling in, and the suspense is growing. Who will win the first elections of the re-United States of America? All we can do is wait and see, it’s a long way till November!" 
 USA_keep_them_under_watch:0 "Keep the New President Underwatch"
 USA_keep_them_under_watch_desc:0 "To the surprise of many, the Democratic candidate came out on top. It would seem the people are more tired of Trump than we thought. Nevertheless, their administration will not do anything to hurt us. They are just as loyal to our regime now as the other patriots. However, we must keep them under watch, just in case." 
 USA_trump_forever:0 "Trump Forever"
 USA_trump_forever_desc:0 "Coming as a surprise to very few, President Trump has secured another term. For the first time since 2020, he rules over a whole America. He can finally begin the long, arduous process of restoring the USA’s former greatness. America will be great, now, and forevermore!" 
 USA_a_new_face:0 "Leave with Honor"
 USA_a_new_face_desc:0 "To the nation’s shock, President Trump has announced he will not be running for reelection. He has endorsed his Vice President and has announced his plans to retire from politics once he has served his term. While this is sad news, it’s understandable. Trump is getting old, and he has done so much for our country! It’s only reasonable he would want to spend his golden years retired, in the nation he made." 
 USA_ban_democrats:0 "Ban the Democrats"
 USA_ban_democrats_desc:0 "If there’s one thing we’ve learned in the past few decades, it’s that the Democratic Party cannot be trusted. They are vermin, an infection of the political system. The only way forward is to cut the rot off at the source, and completely ban the Democratic Party!"
 USA_end_wokeness:0 "End Wokeness"
 USA_end_wokeness_desc:0 "Now that the wokes have been removed from the government, we can finally remove them from our country. Wokeness has done so much to hurt America, from starting a civil war to brainwashing the youth and killing hundreds. No more, we will end it once and for all!" 
 USA_republican_education:0 "Patriotic Party"
 USA_republican_education_desc:0 "The Democrats turned the education system into an amalgamation of filth and corruption. Now that we’re in control again, we can start to undo the damage done to schools. LGBTQ specifically will be banned in schools, and such degeneracy should not find its way into the minds of the youth! We will make sure that schools only teach true American values! Get rid of them." 
 USA_new_2_party:0 "A New Two-Party System"
 USA_new_2_party_desc:0 "Modern politics within the USA have been dominated by the two “traditional parties” for years. However, now that one of those parties is gone, we need to replace it, lest we appear as a dictatorship. The only two parties that could reasonably replace the Democrats are the Greens and Libertarians. We shouldn’t have to explain why the Greens are not an option, and so that leaves the Libertarians." 
 USA_let_them_campaign_:0 "The Libertarian Campaign"
 USA_let_them_campaign__desc:0 "The time has come to allow the Libertarians to set forth and spread their wings! We have done the best we can, and have created a rival party we can truly be proud of! Sure, their chances of success are slim, as we want them to be. Regardless, no one can call us a dictatorship anymore!" 
 USA_GLA_reunification:0 "Reunify With the GLA"
 USA_GLA_reunification_desc:0 "The Great Lakes region throughout the Second American Civil War became something of an anomaly. The states of Wisconsin and Michigan were always flip floppy when it came to politics, but their fall to libertarianism was quite surprising. Regardless, now that we have the Libertarians as the second official major party, peaceful reunification should be possible." 
 USA_extend_period_of_exeption:0 "Extend the Period of Exception"
 USA_extend_period_of_exeption_desc:0 "Although the FRA has been subdued, there are still threats to our nation. As such, the State of Exception must be extended, as the wisdom of our president knows no bounds. With his guidance, we will stomp out the last traces of evil within our great USA, and we will be one nation under god once more!" 
 USA_end_leftist_remains:0 "End Leftist Remnants"
 USA_end_leftist_remains_desc:0 "Despite the fact that we are now the undisputed successor to the United States of America, there are still traitors who resist the will of their nation! These Marxist scum hide in the shadows and strike when we least expect it, acting as if this somehow makes them noble. We will show them who’s in charge when we hang them from the gallows!" 
 USA_america_first:0 "America First"
 USA_america_first_desc:0 "The United States of America is a great country, some might even say it’s the greatest. For this reason, we must show the world we are a force to be reckoned with, and we aren’t giving out anymore freebies!" 
 USA_the_future_of_democracy:0 "The Future of Democracy"
 USA_the_future_of_democracy_desc:0 "There was a time when it seemed as though democracy would be struck down. Then, a hero emerged from the ashes, Donald J. Trump! Thanks to his Odyssey of patriotism and his noble deeds, the future of our great nation was safely secured! Now we can finally stop focusing on the present and turn our gaze to the future, along with the greatness that is to come!"
 USA_experiment_ships:0 "Experimental Ship Designs"
 USA_experiment_ships_desc:0 "Even with our newly captured coast, we are behind our enemies when it comes to naval capabilities. The use of experimental technology may help us close the gap with our enemies."
 USA_support_allies:0 "Support Our Allies"
 USA_support_allies_desc:0 "Even if direct intervention may not always be the best move, we must still find ways to support fellow patriots in their struggles across America and beyond."
 USA_NRA_talks:0 "Meet with West Virginia"
 USA_NRA_talks_desc:0 "In any potential war with the FEDS, the territory of West Virginia will be key for control over the frontline.\nRight now, we are unable to conquer the land by military means, so maybe a more diplomatic approach could benefit us."
 USA_NRA_coal_imports:0 "Import West Virginian Coal"
 USA_NRA_coal_imports_desc:0 "The corporations in control of West Virginia have kindly offered us cheap coal imports. It would be foolish not to take them up on this offer!" 
 USA_NRA_fox_news:0 "Invite the New Fox News"
 USA_NRA_fox_news_desc:0 "Even if Tucker has decided to associate himself with the disgusting ideology of communism, he used to be one of the greatest conservative minds of our time. Maybe he still has something of value to say, and isn't completely lost to that disgusting ideology."
 USA_pardons:0 "Pardon the Opposition" 
 USA_pardons_desc:0 "Better deal with Democrats than deal with fascists."
 USA_WPC_deal:0 "Negotiations With the [WPC.GetName]" 
 USA_WPC_deal_desc:0 "Better deal with Democrats than deal with fascists."
 USA_evangelist_path:0 "Ben Carson" 
 USA_evangelist_path_desc:0 "Benjamin Carson is one of the few members of President Trump’s old cabinet still loyal to him. They’ve become close friends since the outbreak of the civil war, and have proven to work together quite well. As the former Secretary of Housing and Urban Development, Hawley will be invaluable in developing the lands currently controlled by the USA. This has landed him a place on the ticket as President Trump’s VP, and with luck they will continue to do great work together!"
 USA_patriotic_mobilisation:0 "Patriotic Mobilization" 
 USA_patriotic_mobilisation_desc:0 "Uncle Sam Wants You! Bread and butter tactics like this will enthuse the populace to support our mobilisation, while the Democrat traitors pander to their disaffected masses with more woke crud."
 USA_penal_labour:0 "Penal Labor" 
 USA_penal_labour_desc:0 "Bleeding Heart Libtards took away a great cost-saving technique we used to employ: Penal Labor! They feel remorse for the scum of the earth while we do not, and with the prisoner influx from Democrat uprisings and the betrayal of the RINOs, we will have a great manpower pool to rebuild our country."
 USA_expand_prision_labour:0 "Expand Prisoner Labor" 
 USA_expand_prision_labour_desc:0 "With our continued mobilization and struggle to reclaim the country, more jobs are left empty. With some training, we could have our prisons become factories and traitorous unions replaced with loyal convicts."
 USA_stablish_control:0 "Reestablish Control" 
 USA_stablish_control_desc:0 "With the chaos following the Democrat resistance and RINO betrayal, the country has been left with minimal government presence. This must be fixed, and control will be re-established over the country."
 USA_deal_with_opposition:0 "Dealing with the Opposition" 
 USA_deal_with_opposition_desc:0 "Although armed resistance from the Democrats has ended, they still protest and resist our rule. We need to decide on how to handle these rabble-rousers."
 USA_harsh_aproach:0 "The Harsh Approach" 
 USA_harsh_aproach_desc:0 "These devious rabble-rousing slanderers will be taught a lesson in humility and tranquility."
 USA_inflitrate_opposition:0 "Infilitrate the Opposition" 
 USA_inflitrate_opposition_desc:0 "It seems that the Democrat Organizations that organized and ran the 2020 Riots are still operational and running the current resistance. I wonder if they are looking for some more help..."
 USA_pol_victory:0 "Trumpist Domination" 
 USA_pol_victory_desc:0 "With the Democrat Organizations now destroyed, their printers scrapped for parts, and the leaders arrested, their sheep have stopped tirading, and now our rule is secured."
 USA_friendly_aproach:0 "The Peaceful Approach" 
 USA_friendly_aproach_desc:0 "While the Democrats may be godless sodomites, they are still people and entitled to their First Amendment Rights."
 USA_soften_our_laws:0 "Soften Repression"
 USA_soften_our_laws_desc:0 "The current emergency measures are unconstitutional and will be removed so that our rights can be secured."
 USA_open_discourse:0 "Reopen Debate in Denver"
 USA_open_discourse_desc:0 "A government without an opposition is as good as toast without butter. To keep our government honest, we will reopen debate and conversation about our policies."
 USA_god_and_trump:0 "God and Trump"
 USA_god_and_trump_desc:0 "Trump is chosen by God to rule the US, I just know it! When the forces of evil came to kill him, God rescued him from certain death and brought him here to our Eden, the Midwest."
 USA_ban_abortion:0 "Ban Abortion"
 USA_ban_abortion_desc:0 "Abortion is nothing more than legalized baby murder. This sick Punic practice will be banned in our country."
 USA_some_exeptions:0 "...With Some Exceptions"
 USA_some_exeptions_desc:0 "It turns out that the medical community thinks so much that giving an ultrasound is abortion, so we will need to institute some exceptions before we have mothers dying because doctors are too scared to treat them."
 USA_tradiotional_mariage:0 "Ban Gay Marriage"
 USA_tradiotional_mariage_desc:0 "God hath commanded that holy matrimony shall only be between a man and a woman, and as great, God fearing, we will make our laws follow his commands."
 USA_christianity_at_school:0 "Put Christianity Back into Schools"
 USA_christianity_at_school_desc:0 "The godless Democrats tricked many people, including their corrupt Supreme Court, into saying that teaching Christianity and Christian values in schools is a violation of the Constitution. This plot by Satanists to breed generations of the godless will be ended."
 USA_the_kanye_question:0 "The CSA Conundrum" #Yes, this is spelled correctly
 USA_the_kanye_question_desc:0 "Kanye West was sent by Trump to secure the south, but he ended up betraying us. While we do not have a heart for traitors, he does rule with the guiding light of God, so we may be willing to work with him... for now, at least."
 USA_isolate_the_CSA:0 "Isolate the CSA"
 USA_isolate_the_CSA_desc:0 "The Land of Traitors cannot be allowed to influence its neighbors and make friends to bring us down. Therefore, we will see to it that they will be alone."
 USA_npa_CSA:0 "Negotiate with Kanye"
 USA_npa_CSA_desc:0 "While Kanye may have broken away from us, he shares our values. Fighting with him will only strengthen the Democrats."
 USA_trade_CSA:0 "Trade Deal with Dixie"
 USA_trade_CSA_desc:0 "By establishing trade routes, we can strengthen the Christian cause."
 USA_border_conflict_CSA:0 "Clash with the South"
 USA_border_conflict_CSA_desc:0 "No mercy will be shown to traitors, and the land they occupy must be reclaimed; however, we cannot afford a war right now. Luckily, they cannot either, and they have limited control over their territory. This allows us to perhaps move the border a bit."
 USA_war_on_drugs_part_2:0 "Continue the War on Drugs"
 USA_war_on_drugs_part_2_desc:0 "The War on Drugs would have been successful if the deep state hadn’t undermined it. With the government finally under control, we can once again fight drug abuse."
 USA_give_the_youth_an_alternative:0 "Give the Youth an Alternative to Drugs"
 USA_give_the_youth_an_alternative_desc:0 "The youth fall into drug abuse because they have idle hands. With relaxed child labor laws, they will contribute to society instead of spending years in prison."
 USA_clean_carsons_home:0 "Liberate Carson's Hometown"
 USA_clean_carsons_home_desc:0 "Our Vice President is from the once great city of Detroit, a city that has fallen into disrepair and communism. We will liberate his home and rebuild it to its former glory."
 USA_a_new_detroid:0 "Cleanse Detroit of Drugs"
 USA_a_new_detroid_desc:0 "Detroit has been a drug den for too long; the DEA will have a fun time sweeping the place up."
 USA_end_anti_american_history:0 "End Anti-Americanism in Schools"
 USA_end_anti_american_history_desc:0 "In many schools across our country, teachers do not teach the greatness of America, but rather to hate our country. This anti-Americanism will not be tolerated any longer."
 USA_promote_true_patriotism:0 "Achieve True Patriotism"
 USA_promote_true_patriotism_desc:0 "Our people have grown apathetic due to the systematic destruction of our country by the Democrats. With true Republicans back in charge, it's time to rebuild American Patriotism."
 USA_abolish_the_separation_of_church_and_state:0 "Abolish the Separation of Church and State"
 USA_abolish_the_separation_of_church_and_state_desc:0 "God has commanded us to rule by his law, so why would we choose to make it illegal to do so? This is because the founders thought freedom of religion was only within Christian denominations. However, modern godless Supreme Courts have made it so we are not able to rule rightly. With a new amendment, we can fix this right away."
 USA_fight_the_blue_devil:0 "Fight the Blue Devil"
 USA_fight_the_blue_devil_desc:0 "The Democrats have done so much damage to our country, our religion, and our culture. They are truly demonic. When history is taught, it shall tell of the Blue Devil that came to destroy America, but was fought and defeated by the Godly Republicans."
 USA_a_new_era_of_american_greatness:0 "A New Era of American Greatness"
 USA_a_new_era_of_american_greatness_desc:0 "With the damage done by the Blue Devil undone and the country once again great, we have founded a new golden era for the United States."
 USA_christian_media:0 "Christianize the Media"
 USA_christian_media_desc:0 "The Media has been controlled by Satanists and Atheists aligned with the godless Democrats for too long! With some nice reforms, some money,  and Supreme Court decisions, the media will soon be nice and Christian again. Do you want to watch the Catholic Station or the Lutheran one today?"
 USA_WPC_rail:0 "Build the Dakota-Manitoba Railroad"
 USA_WPC_rail_desc:0 "A Railroad between our countries will help with economic development and trade."
 USA_WPC_minning:0 "Joint Mining Venture"
 USA_WPC_minning_desc:0 "The WPC is much poorer than us and requires help with resource development. They have agreed to let us develop the resources in exchange for rights to some of them."
 USA_WPC_alliance:0 "The Edmonton Treaty"
 USA_WPC_alliance_desc:0 "The WPC is the best shot for Canada and is a great ally to us; therefore, we should work together to reclaim our countries."
 USA_mediation:0 "Ask Western Canada for Mediation With Biden"
 USA_mediation_desc:0 "With our new friends in Western Canada not being as hated by the Democrat usurpers in Washington, we can ask them to open a diplomatic channel for negotiations with the Federal Republic."
 USA_FRA_negotiate:0 "A Call with Biden"
 USA_FRA_negotiate_desc:0 "With the lines being opened, Trump and Biden have agreed to talk. I wonder what will come of it..."
 USA_FRA_propagandise_our_mercy:0 "Propagandize Our Mercy"
 USA_FRA_propagandise_our_mercy_desc:0 "We can use our talks as great propaganda! We are the bigger men who opened these talks after all."
 USA_FRA_form_the_PA_core:0 "Recall Rural Pennsylvanian Rebels"
 USA_FRA_form_the_PA_core_desc:0 "They have agreed to let our brave men in Pennsylvania join us in exchange for their no longer resisting the Democrats."
 USA_FRA_expand_trade:0 "Limited Trade with the Democrats"
 USA_FRA_expand_trade_desc:0 "They have agreed that we are still Americans and that some commerce should be allowed."
 USA_FRA_deport_protestors:0 "Deport Democrats"
 USA_FRA_deport_protestors_desc:0 "They have agreed that since our people in their land will be brought here, their people in our land should go to them as well."
 USA_FRA_supress_protestors:0 "Suppress Democrats"
 USA_FRA_supress_protestors_desc:0 "Trump was unwilling to deport the Democrats to the Feds. So we will need some new measures to keep them quiet..."
 USA_IDA_connect_capitals:0 "Connect Our Capitals"
 USA_IDA_connect_capitals_desc:0 "With the borders having stabilized to the west, we should establish connections between our capitals to better communicate and trade."
 USA_IDA_civs:0 "Joint Industrial Efforts"
 USA_IDA_civs_desc:0 "If the WCZ is to accomplish its goal of retaking the West, it will need more industry, and developing the Midwest while we are at it will benefit everyone."
 USA_IDA_infra:0 "Strengthen Our Infrastructure"
 USA_IDA_infra_desc:0 "The infrastructure of the Rockies is... subpar, to say the least. We should repair and expand it to accommodate our needs."
 USA_IDA_fuel:0 "Promote Fracking"
 USA_IDA_fuel_desc:0 "The WCZ needs larger fuel storage to fuel its war machine. Let's get it built."
 USA_IDA_fuel_fill:0 "Maximize Our Fuel Storage"
 USA_IDA_fuel_fill_desc:0 "With some requisitions, we can get WCZ’s fuel refilled, thanks to  President Trump."
 USA_IDA_offmapciv:0 "Construct Workshops in the Rockies"
 USA_IDA_offmapciv_desc:0 "By constructing workshops in the WCZ, their industrial output can be increased."
 USA_IDA_rgroup:0 "Technology Sharing"
 USA_IDA_rgroup_desc:0 "If we are to be successful, we should work together to have the best technological development."
 USA_IDA_industrial_tech:0 "Hire Industrial Scientists"
 USA_IDA_industrial_tech_desc:0 "As we continue to mobilize, we should hire scientists from industrial research companies to fast-track our research."
 USA_IDA_industrial_center:0 "Western Industrial Project"
 USA_IDA_industrial_center_desc:0 "We can continue to build industry in our lands."
 USA_IDA_minning:0 "Expand Mining in Idaho"
 USA_IDA_minning_desc:0 "Idaho is a resource-rich and all-around great place in our country; furthering its development will be a tremendous boon to us and our allies."
 USA_IDA_guns:0 "Arm the Militias"
 USA_IDA_guns_desc:0 "The Militias that run the WCZ are in need of weaponry, and President Trump shall provide."
 USA_IDA_exercises_land:0 "Joint Training Programs"
 USA_IDA_exercises_land_desc:0 "With our differing military structures, we can learn a lot by doing joint training exercises."
 USA_IDA_exercises_special_forces:0 "Collaborative Specialist Training"
 USA_IDA_exercises_special_forces_desc:0 "The Rockies are a great place to train special forces. With a new training program, they will be unstoppable."
 USA_IDA_airbases:0 "Reopen Western Airports"
 USA_IDA_airbases_desc:0 "With the chaos of the last few months, many airports have been abandoned. We can use them to house and deploy our air forces."
 USA_IDA_exercises_air:0 "Joint Pilot Training"
 USA_IDA_exercises_air_desc:0 "With military expansion comes the need for training, and that is multiplied when you factor in aircraft. With a joint program, we can more efficiently train these new pilots."
 USA_IDA_exercises_paratroopers:0 "Joint Paratrooper Exercises"
 USA_IDA_exercises_paratroopers_desc:0 "With all the open plains in the Great Plains, paratroopers will have plenty of space to train together."
 USA_IDA_join_arms_manufacturing:0 "The Loyalist Arms Industry"
 USA_IDA_join_arms_manufacturing_desc:0 "To supply the military, you need a military industry, right?"
 USA_IDA_annex:0 "Unify the Loyalists"
 USA_IDA_annex_desc:0 "With DC reclaimed, it's time to unite the loyalists behind our president, Donald Trump."
 USA_IDA_exile_prep:0 "Prepare a Potential Exile Government"
 USA_IDA_exile_prep_desc:0 "With the threats to our West, it will be necessary to make provisions in case the WCZ happens to be defeated."
 USA_IDA_annex_cap:0 "End the Exile Government"
 USA_IDA_annex_cap_desc:0 "The failure of the WCZ is disappointing, but not unexpected; there is no longer a need for these failures."
 USA_IDA_help_IDA:0 "Continue to Support the Western Command Zone"
 USA_IDA_help_IDA_desc:0 "Even though they failed us, we should continue to support them to retake the West."
 USA_IDA_legitimacy:0 "Secure the Legitimacy of the Exile Government"
 USA_IDA_legitimacy_desc:0 "To ensure their continued survival, we must work to keep their legitimacy up."
 USA_GRL:0 "Seize Greenland"
 USA_GRL_desc:0 "We might have won the Civil War, but it destroyed our global hegemony. Regaining control over the Western Hemisphere will be the first step in rebuilding our power. Greenland, an island President Trump has focused on even before the start of the civil war will be key for our renaissance as a nation."
