l_english:
 SEM_floridian_civil_war:0 "The Floridian Civil War"
 SEM_floridian_civil_war_desc:0 "After Jeb Bush stepped down, the many different areas of Florida began to draw apart and Blakanize. Soon, four emerged and all claimed to be the true new Florida. This can only be resolved in one way"
 SEM_the_state_of_our_nation:0 "The State of our New Nation"
 SEM_the_state_of_our_nation_desc:0 "Florida has fallen to pieces and now we have the oppertunity to take control but their are others who will try to stop us"
 SEM_prepare_offensives:0 "Prepare Offensives"
 SEM_prepare_offensives_desc:0 "Now that our army is better organized, we can begin to plan assults into the illegitimate states keeping us from full control of Florida"
 SEM_attack_nasa:0 "Stike at NASA"
 SEM_attack_nasa_desc:0 "NASA has always been a scientific organization. They do not have the military expirence to combat us and emerge victorious"
 SEM_attack_seminoles:0 "Strike the Seminoles"
 SEM_attack_seminoles_desc:0 "The Seminoles are not as fierce as they once where. Many years ago, they stood toe to toe with the United States army. Today, they will grovel at our feet"
 SEM_attack_democrats:0 "Invade Miami"
 SEM_attack_democrats_desc:0 "The largest industrial base in Florida lies in the massive city of Miami. It would be wise for use to take this city at once."
 SEM_attack_anarchists:0 "Attack the Anarchists"
 SEM_attack_anarchists_desc:0 "Those who reject goverment in favor of total anarchy are brainless bozos who deserve fates worse than death"
 SEM_one_final_push:0 "One Final Push"
 SEM_one_final_push_desc:0 "The civil war is nearing its end. We must make one last great effort to seal our victory"
 SEM_internal_matters:0 "Internal Matters"
 SEM_internal_matters_desc:0 "Our nation is new to the world stage and with that comes growing pains and a multitude of issues. We must address these quickly if we are to survive"
 SEM_address_the_military:0 "The Military"
 SEM_address_the_military_desc:0 "Although our military is small, it still needs to be treated professionally if it is to win our conflicts" 
 SEM_address_the_economy:0 "The Economy" 
 SEM_address_the_economy_desc:0 "Florida did not have a large economy before the civil war but we must play the cards we are delt. Finding a way to make the most out of what we have is paramount"
 SEM_address_the_government:0 "The Government"
 SEM_address_the_government_desc:0 "Many question how fast our new government was able to take control of our territory but none will question us when we lead the nation to victory"
 SEM_solidify_nation:0 "Solidify the Nation"
 SEM_solidify_nation_desc:0 "With internal matters delt with, it is time to turn our gaze elsewhere"
 SEM_a_new_florida:0 "A New Florida"
 SEM_a_new_florida_desc:0 "We have emerged through the smoke and fumes of a burning state ravaged by civil war. No one can question our resolve"
 SEM_attack_nasa_idea:0 "Strike NASA"
 SEM_attack_democrats_idea:0 "Strike at the Democrats"
 SEM_attack_seminoles_idea:0 "Strike the Seminoles"
 SEM_final_push_idea:0 "The Final Push"
 SEM_final_push_idea_desc:0 "One final offensive could be what we need to secure victory in Florida"
 SEM_starting:0 "The Seminole Nation"
 SEM_starting_desc:0 "This new fledgling Seminole nation has it's work cut out for it. The swamps of Southern Florida are sparse in population and in factories. In addition to this, the Seminole nation only allows their fellow Seminoles to enlist and hold goverment office. Time will only tell if these are setbacks or advantages."
 
 SEM_a_people_unconquered:0 "An Unconquered People"
 SEM_a_people_unconquered_desc:0 "When the White man first turned up on our shores thirsting for our lands, we fought tooth and nail against innumerable odds. We had succeeded in preserving our homeland in the Seminole Wars, and we have done so once again today. Let no one underestimate the unconquered people of the Seminole Tribe!"
 
 SEM_reconcile_with_the_miccosukee:0 "Reconcile with the Miccosukee"
 SEM_reconcile_with_the_miccosukee_desc:0 "Decades ago, the Miccosukee split from the Seminoles over petty political differences, and they have remained independent ever since. We cannot let these squabbles get in the way of unity, we will reach out and reintegrate what remains of the Miccosukee."


 SEM_there_are_only_the_seminoles:0 "There are ONLY Seminoles"
 SEM_there_are_only_the_seminoles_desc:0 "The Miccosukee are still Seminoles, despite whatever claims to independence they might have. We will make sure they will recognize that fact no matter what. We must clamp down on their rootless identity and ensure Seminole unity."
 
 SEM_reaffirm_the_miccosukee_autonomy:0 "Reaffirm the Miccosukee Autonomy"
 SEM_reaffirm_the_miccosukee_autonomy_desc:0 "The Miccosukee are our brothers and we must respect their claims to their own reservation. We shall elevate them to an autonomous status to prove that we will not trample over the rights of any other native tribes."

 SEM_develop_miccosukee_lands:0 "Develop Miccosukee Territory"
 SEM_develop_miccosukee_lands_desc:0 "The Miccosukee lands are undeveloped compared to the rest of the reservations. Poverty is still inflicts a massive portion of the population, despite the tribe's wealth in casinos. We will promote local jobs and create new infrastructure to bring prosperity to the region."

 SEM_absorb_the_reservation:0 "Absorb the Reservation"
 SEM_absorb_the_reservation_desc:0 "With the Miccosukke no longer considered their own separate entity, we will formally take over their reservation and begin our own developments on the land. This will be unpopular, but it must be done."

 SEM_wipe_away_the_remnants_of_bia:0 "Sweep Away the Bureau of Indian Affairs"
 SEM_wipe_away_the_remnants_of_bia_desc:0 "The Bureau of Indian Affairs clung onto power on the reservations when Florida broke away from the United States. Even now, the tribes are still under their nominal influence, mostly due to decades of them commanding curriculum and policy. We will finally rid ourselves of the remnants of the B.I.A. and pursue our own destiny."
 
 SEM_promote_tribal_education:0 "Independent Tribal Curriculum"
 SEM_promote_tribal_education_desc:0 "For years, the White man has had unprecedented control over our education systems and more often than not, has abused that power. We must enshrine independent education as a right of all tribes."

 SEM_big_cypress_and_brighton_cattle:0 "Expand Cattle Operations in Brighton and Big Cypress"
 SEM_big_cypress_and_brighton_cattle_desc:0 "Before the Second American Civil War, our tribe commanded the 13th largest cattle operation in the entire country. We will continue to expand these operations. You can never have enough meats and leather."

 SEM_expand_the_casinos:0 "Bring Casinos to the Cities"
 SEM_expand_the_casinos_desc:0 "Our tribe was among the first to enter into the gaming industry and we have seen immense success since. However, pesky legislation prevented casinos in the cities. Now that we have control, we can make sure every city has a casino."

 SEM_expand_seminole_petroleum:0 "Expand Seminole Petroleum"
 SEM_expand_seminole_petroleum_desc:0 "Seminole Petroleum is a fuel refining and transportation company owned by our tribe. It desperately needs to be funded and expanded if we want any chance of meeting our fuel requirements."
 
 SEM_modernize_petroleum_infrastructure:0 "Modernize Petroleum Infrastructure"
 SEM_modernize_petroleum_infrastructure_desc:0 "Florida's petroleum infrastructure is outdated and aging. It faces plenty of risks from harsh weather conditions and normal wear and tear. It is in desperate need of modernization."

 SEM_tap_into_big_cypress_national_preserve:0 "Tap Into Big Cypress National Preserve"
 SEM_tap_into_big_cypress_national_preserve_desc:0 "Now that we have control over the Miccosukee tribal lands, we can tap into the oil deposits found within Big Cypress National Preserve. While our fellow tribesmen won't be happy with the desecration of nature, they will come to see its benefits soon enough."

 SEM_drill_baby_drill:0 "Drill Baby Drill!"
 SEM_drill_baby_drill_desc:0 "We need oil and resources now if we want our fledling nation to survive. Heritage hardly matters when we can't even create enough energy to power our electrical grids and factories."

 SEM_respect_our_ancestral_lands:0 "Respecting Our Ancestral Lands"
 SEM_respect_our_ancestral_lands_desc:0 "There is a fine line between acquiring necessary resources and destroying our ancestral lands. The wonton pursuit of resources no matter the costs is exactly what we criticized the White man of doing. We would be no better if we did the same."

 SEM_question_of_blood:0 "Policy of Blood Quantum"
 SEM_question_of_blood_desc:0 "Blood quantum is a controversial policy that decides who is Native by the percentage of native blood they have. We currently mandate members have at least a quarter of Seminole blood in them, but this has restricted the amount of members in our tribe. We find ourselves greatly outnumbered in our own nation, so some have pushed for ending blood quantum in our tribe altogether to boost our ranks. A fringe few however, call for the return of the "good old days" where you needed 100% native blood to be considered a member."

 SEM_full_bloods_only:0 "Reestablish Full-Blood Citizenship"
 SEM_full_bloods_only_desc:0 "Decades ago, our reservation demanded each of its members to have full Seminole blood. Unfortunately we have diluted that requirement to a measly 25% to bolster our numbers. We must return to the tradition and revise our stance on this subject matter."

 SEM_quarter_bloods:0 "Reaffirm Quarter-Blood Policy"
 SEM_quarter_bloods_desc:0 "The quarter-blood policy is the compromise between full-blood citizenship and abolishing blood quantum altogether. It has been this way for decades, so why change course now?"

 SEM_end_the_policy:0 "End the Policy of B.Q."
 SEM_end_the_policy_desc:0 "Blood quantum is an outdated practice that some tribes have already gotten rid of. We should follow suit. The only requirements to join our tribe from now on is to have an ancestor from the 1957 Tribal Roll and be sponsored by a current member. We don't expect this to be a popular policy among the tribe, but it is a necessity."

 SEM_relax_attitudes_towards_interracial_marriages:0 "Destigmatize Interracial Marriage"
 SEM_relax_attitudes_towards_interracial_marriages_desc:0 "Only relatively recently has our tribe opened up to the idea of interracial marriage. It is still ultimately frowned upon, especially marriages with White people. We must break this stigma if we seek to bring our people and nation into the modern era."
 
 SEM_promote_cooperation_between_the_races:0 "Seek Reconciliation"
 SEM_promote_cooperation_between_the_races_desc:0 "We must not perpetrate a cycle of violence by attacking our fellow White brothers. Most want to see this nation succeed. Only a fringe few bigots seek to take down what could be an incredible multicultural state that reconciles its brutal history with the United States. Even if we wanted to fight the White man anyways, we are greatly outnumbered."
 
 SEM_establish_associate_tribal_memberships:0 "Establish Associate Tribal Memberships"
 SEM_establish_associate_tribal_memberships_desc:0 "Associate Tribal Memberships will allow non-tribal entities to partner up with our tribe. These will usually be vendors and organizations who seek to support our tribe and people. We must be willing to show we can work with everyone to improve the lives of this nation."

 SEM_problem_of_the_iste_hatke:0 "Problem of the Iste Hatke"
 SEM_problem_of_the_iste_hatke_desc:0 "The Iste Hatke, or the White man, is still the dominant race in Florida. While we have legitimate claim over this land, we still have to face the reality of our situation. Some hard-headed tribal members want to find a way to completely entrench Native power, while others seek a more liberal solution, such as a pluralistic nation."

 SEM_down_the_warpath:0 "Down the Warpath"
 SEM_down_the_warpath_desc:0 "There cannot be any reconciliation with the race that pillaged our homes and killed the sons and daughters of this proud tribe. We will take minoritarianism to the extreme, and enforce our will, no matter how unpopular it is."

 SEM_land_back:0 "Fanaticize the Land Back Movement"
 SEM_land_back_desc:0 "The Land Back Movement is currently toothless and has no aims outside making White liberals feel good about themselves. We need to take back control of it and turn it into action against the White settlers. We will terrorize their homes and businesses, and chase out the White devils from our lands!"

 SEM_a_coalition_against_the_pale_skins:0 "Form A Coalition Against the Pale-Skins"
 SEM_a_coalition_against_the_pale_skins_desc:0 "The tribes are currently hesistant to support our actions against the White devils but are still pleased with how we have treated them. With a little more pressure and a clear plan of attack, we will gain the support of the lesser tribes."

 SEM_pan_tribal_alliance:0 "Pan-Indianism"
 SEM_pan_tribal_alliance_desc:0 "If the bickering tribes put down their arms against one another and united against the first White settlers, the history of our people would be dramatically different. We will not make the same mistake."

 SEM_ban_interracial_marriage:0 "Ban Interracial Marriage"
 SEM_ban_interracial_marriage_desc:0 "Our tribe only numbers in the thousands. Interracial marriage will further dilute our numbers until we are nothing. While it may be controversial to some in our tribe, it has to be this way to preserve our people and culture."

 SEM_ensure_equality_under_the_law:0 "Ensure Equality Under the Law"
 SEM_ensure_equality_under_the_law_desc:0 "The White man assumes that we will strip away their rights or give special priviliges to Natives. We must dispel this by codifying a new set of laws, ensuring equality under the law."

 SEM_expand_the_reservations:0 "Expand the Everglade Reservations"
 SEM_expand_the_reservations_desc:0 "With the area completely under our control, we can finally delegate more land to our tribe. We still have to be careful though, encroaching on the private property of others could create a scandal we ought to avoid."

 SEM_install_tribal_authorities_in_the_cities:0 "Bring Itálwa to the Cities"
 SEM_install_tribal_authorities_in_the_cities_desc:0 "Itálwa is how we structure Seminole society in tribal towns, down to family roles, military, and more We must expand this concept to encompass all of our lands and ensure all follow it. We shall begin delegating cities and towns to Seminole tribe members."

 SEM_seize_white_businesses:0 "Seize White Businesses"
 SEM_seize_white_businesses_desc:0 "Any White owned business on our land is illegitimate because they made their profit on stolen land. Taking control of them is merely reparations for centuries of humiliation and torment."

 SEM_the_trail_of_tears:0 "Trail of the White Man's Tears"
 SEM_the_trail_of_tears_desc:0 "We can't physically remove all of the White people in our land, but what we can do is move them somewhere else. We have scoped out the city of Orlando as a prime spot to keep the White people in. While there may be overcrowding, it doesn't matter too to us much. This is only a fraction of the pain they have inflicted on us."

 SEM_off_the_reservation:0 "Off the Reservation"
 SEM_off_the_reservation_desc:0 "No more living on reservations! Our people will spread and populate the entirety of Florida, for it is our rightful and ancestral land. We will never be restrained to parcels of land again and we would rather die than kneel to any imperialists or colonists that attack."

 SEM_remember_ancient_cuban_native_ties:0 "Remember the Taíno People"
 SEM_remember_ancient_cuban_native_ties_desc:0 "The Taíno people were the indigenous population that settled the Caribbean hundreds of years ago. They had made contact with a previous Floridian tribe, the Calusa tribe. Both were driven to extinction and absorbtion by the Spaniards. But the Taíno still live on in the modern Cuban people and even the Cuban-Americans. We shall reach out to them like they did to the Calusa and bring them into our fold."

 SEM_seminole_law_above_all:0 "Enforce Seminole Tribal Laws"
 SEM_seminole_law_above_all_desc:0 "Everyone in our land will answer to tribal courts! You can also count on them to grant harsh punishments to White settlers who get out of line."

 SEM_allow_honorary_memberships:0 "Allow Honorary Memberships"
 SEM_allow_honorary_memberships_desc:0 "Honorary memberships are special memberships given to non-tribal entities who've done extraordinary deeds to help our tribe. Through this, we can foster cooperation between the Native and White populations. Although some Seminoles are completely against the idea, warning against letting outsiders get too close to our tribe, pointing to the myriad of problems it may cause."

 SEM_one_nation_two_systems:0 "One Nation, Two Systems"
 SEM_one_nation_two_systems_desc:0 "Our nation will be governed by two systems, one for the Natives and the other for the cities. It is essentially a refurbishment of the old system but allows for much greater autonomy for our people living on the reservations. Some in our tribe have lamented this a return to status quo, but it is not. The possibilities for our people now are unrestrained by bureaucratic bloat or the B.I.A.!"

 SEM_entrench_seminole_supremacy:0 "Entrench Seminole Supremacy"
 SEM_entrench_seminole_supremacy_desc:0 "We must entrench the fact that the Seminoles are not only superior to other tribes, but the White man himself. If we had the same resources that was afforded to the Europeans hundreds of years ago, we would have carved out a mighty empire and crushed their armies. It is time to set the record straight."

 SEM_strengthen_traditional_floridan_industry:0 "Strengthen Traditional Floridian Industry"
 SEM_strengthen_traditional_floridan_industry_desc:0 "Florida is an economy dominated by tourism, agriculture, and shipping. If we want to get out of this rut, we must stick to the basics and reinvigorate trust in the economy."

 SEM_invest_in_small_business:0 "Invest in Native Businesses"
 SEM_invest_in_small_business_desc:0 "Native businesses are a surprising pillar of the Floridian economy. We run the oil and the casinos, but we must not only think big. We must think small as well and support the entreprenuerial spirits of all Natives."

 SEM_reliable_energy_supply:0 "Ensure Reliable Energy"
 SEM_reliable_energy_supply_desc:0 "Florida has struggled with reliable energy due to a multitude of problems. With oil and gas industries booming however, we can finally supply cheap and reliable energy for the majority of Floridians."

 SEM_subsidies_for_native_owned_businesses:0 "Hard Rock Cafe"
 SEM_subsidies_for_native_owned_businesses_desc:0 "Hard Rock International is the pride of our tribe, with them managing Hard Rock Casinos and Cafes not just across America, but across a multitude of different countries. However, ever since the collapse of the United States, the companies have been operating independently of one another. It is time to bring them back under our control."

 SEM_build_up_port_tampa_bay:0 "Build Up Tampa Bay"
 SEM_build_up_port_tampa_bay_desc:0 "Tampa Bay is the jewel in the Floridian crown. We must make sure to continue investing and building it up to ensure our economy thrives."

 SEM_create_a_seminole_merchant_fleet:0 "Dugout Canoes to Merchant Fleet"
 SEM_create_a_seminole_merchant_fleet_desc:0 "Our tribe once used dugout canoes to traverse the rivers effectively, but now a whole ocean is has opened up to us. Dugout canoes won't cut it anymore, and so we must embrace the mercantile economy and invest in creating a large merchant fleet to protect our shores."

 SEM_strong_supply_lines:0 "Formidable Supply Lines"
 SEM_strong_supply_lines_desc:0 "Our improvements in infrastructure and ports have made it cheap and easy to transport goods across our country, which we can easily repurpose for military affairs."

 SEM_florida_oranges:0 "Champion the Seminole Tangelo"
 SEM_florida_oranges_desc:0 "The Seminole Tangelo is one of the few fruits named after our tribe. We must embrace this fact and promote the Seminole Tangelo as a way to boost our already booming citrus economy."

 SEM_florida_state_university:0 "Cooperate With Florida State University"
 SEM_florida_state_university_desc:0 "With Tallahasee back under our control, we can finally continue our decades long cooperation with Florida State University. They've been a proud ally to our tribe and have done a lot to preserve our culture. We should strengthen our bond and promote higher education in our tribe."
 
 SEM_increase_agricultural_subsidies:0 "Fund Our Cash Crops"
 SEM_increase_agricultural_subsidies_desc:0 "Over the years, Florida's agricultural industry has fallen on harsh times. Extreme weather, citrus diseases, and land loss has gutted the economy, which all need to be combatted. We need major investments to turn this sinking boat around."
 
 SEM_preserving_seminole_culture:0 "Preserving Seminole Culture"
 SEM_preserving_seminole_culture_desc:0 "The American collapse and the fight for Florida has created an existential threat to the Seminole culture. If our nation is conquered by radicals, it could see our entire people vanish. We must make sure that our culture not only survives, but thrives so that our people and way of life can endure for centuries more."

 SEM_fund_the_seminole_tribal_libraries:0 "Fund the Seminole Tribal Libraries"
 SEM_fund_the_seminole_tribal_libraries_desc:0 "The Seminole Tribal Libraries are an important resource for the Seminole youth. They must learn our tribe's past to understand our future. We must ramp up our funding and expand these libraries to widen access to more people."

 SEM_promote_the_seminole_museum:0 "Promote the Ah-Tah-Thi-Ki Museum"
 SEM_promote_the_seminole_museum_desc:0 "The crowning achievement of our tribe has to be the Ah-Tah-Thi-Ki Museum, the culmination of centuries of history found in one place. It works to preserve our culture and history through interviews, honoring the oral history of our people. We will continue to promote and expand the museum so that the memory of the past will never be extinguished."

 SEM_standardize_the_mikasuki_language:0 "Standardize the Muscogee Language"
 SEM_standardize_the_mikasuki_language_desc:0 "Muscogee is an important language to our tribe but has unfortunately fallen out of favor with the Seminole youth. It is difficult to learn due to the lack of standardization, which is an unfortunate side effect of our oral traditions. We must rectify this mistake and begin the long process of standardization."

 SEM_decolonize_the_historical_narrative:0 "Decolonize the Historical Narrative"
 SEM_decolonize_the_historical_narrative_desc:0 "In standard curriculum across America, colonizers are potrayed as adventurers and civilizers, while the tribes that once lived there as savages that shared an unfortunate fate. This disgrace to our people and Native brothers must be corrected."

 SEM_establish_mikasuki_language_schools:0 "Establish Muscogee Language Schools"
 SEM_establish_mikasuki_language_schools_desc:0 "The difficult part of standardization is over, but we must open up schools to educate the Seminole youth of our language. We hope this program is a success and captivates our people to learn Muscogee."

 SEM_elevate_mikasuki_as_the_national_language:0 "Elevate Muscogee as the National Language"
 SEM_elevate_mikasuki_as_the_national_language_desc:0 "Years of effort have finally paid off, we now have a substantial amount of our tribe are embracing Muscogee once again. It is even beginning to spread to the cities. There may come a day where the majority of Florida speaks Muscogee again, much like it did centuries ago."
 
 SEM_maintaining_our_traditions:0 "Our Traditions"
 SEM_maintaining_our_traditions_desc:0 "In these dark times, the only thing we can do is fall back on our tradition, people, and culture. Through this, we can uplift ourselves and endure until there are brighter days ahead."

 SEM_annual_green_corn_ceremony:0 "The Green Corn Dance"
 SEM_annual_green_corn_ceremony_desc:0 "One of our oldest traditions is the Green Corn Ceremony, a tradition usually held in early summer to gaurantee the successfulness of a corn harvest. While the superstition aspect has all but been erased, it is still a great time of dancing and feasting, making it something to be enjoyed by all."

 SEM_promote_seminole_stickball:0 "A Game of Stickball"
 SEM_promote_seminole_stickball_desc:0 "Stickball is a peculiar sport where two teams attempt to score by controlling a ball with only sticks. It is a well established sport with hundreds of years of history, but with our growing influence, it could be expanded into something much greater."

 SEM_continue_seminole_tourism:0 "Continue Seminole Tourism"
 SEM_continue_seminole_tourism_desc:0 "Whether we like it or not, our tribe is supported through tourism. If this is a necessary evil, then we should make the most of it and at least educate those who come to our reservation."

 SEM_alligator_wrestling:0 "Alligator Wrestling"
 SEM_alligator_wrestling_desc:0 "While extremely dangerous, over the last one hundred years, alligator wrestling has taken off in our tribe. Of course only the trained should participate but there are always going to be the dumb few White folk who get deathrolled."

 SEM_chickee_building:0 "Continue Chickee Building"
 SEM_chickee_building_desc:0 "The Chickee and its style is of extreme cultural importance to our people, but we cannot deny, it is not the most spacious nor efficient way to build homes for our people. We have created new designs which seek to blend modernity and tradition, which we hope will satisfy our housing needs."
 
 SEM_patchworking:0 "Seminole Artisanship"
 SEM_patchworking_desc:0 "Seminole patchworking is an important tradition that must be preserved. We should create new programs to get more of our people, specifically women, into patchworking."

 SEM_end_the_rape_of_culture:0 "End the Rape of Culture"
 SEM_end_the_rape_of_culture_desc:0 "White people have shown no respect for Native culture. They wear our culture like a child wears a costume on Halloween. They have no reverence for the history of a people that are older than their own country. They are soulless and corrupt everything they touch. That ends today. We will ban any foreigners from visting our reservations and will enact harsh punishments on those who mock us and our ways."
 
 SEM_remembering_the_seminole_wars:0 "Remembering the Seminole Wars"
 SEM_remembering_the_seminole_wars_desc:0 "The Seminole Wars were a series of conflict fought between our people and the United States. While we never formally surrendered, our people fled into the Everglades and kept our culture and people intact. We must never forget what the colonialists and imperialists did to us and our brothers so many years ago."
 
 SEM_modernize_the_army:0 "Copy Uncle Sam"
 SEM_modernize_the_army_desc:0 "As the saying goes... if you can't beat them, join them. We will modernize our military and restructure ourselves on the United States military. We will not be technologically inferior to any enemies ever again!"

 SEM_big_cypress_shootout:0 "Big Cypress Shootout"
 SEM_big_cypress_shootout_desc:0 "The Big Cypress Shootout has been an annual tradition for our tribe, reenacting battles from the Second Seminole War. While mostly for fun and entertainment, we can expand this event into war games for our soldiers."

 SEM_guerilla_warfare:0 "Our Ancestor's Warfare"
 SEM_guerilla_warfare_desc:0 "We are still around solely due to the genius of our strategy in the Seminole Wars and our ability to outflank and outmaneuver the enemy. We must not forsake our past and try to keep true to our military roots."

 SEM_study_the_battle_of_wahoo_swamp:0 "Study of Battle of Wahoo Swamp"
 SEM_study_the_battle_of_wahoo_swamp_desc:0 "While the Battle of Wahoo Swamp was a defeat for our people, it was still critical in preventing further encroachment of the United States military into the swamps of Florida. We must learn what we did right and wrong, and better adapt our guerilla strategies for the terrain and environment."

 SEM_local_manufacturing:0 "Prioritise Local Manufacturing"
 SEM_local_manufacturing_desc:0 "Local manufacturing will be the life blood of our military. Tribal villages will be turned into gun smiths, taking old equipment and refurbishing and assembling them. We will let no resource go to waste!"

 SEM_raiding_tactics:0 "Raid and Run"
 SEM_raiding_tactics_desc:0 "One of our greatest strengths is our ability to creep up on enemy supply depots and attack them, seizing equipment and supplies. We will make this a fundamental aspect of our military so we can stay self sufficient, even when factories are not producing enough to supply us."

 SEM_live_off_the_land:0 "Live Off the Land"
 SEM_live_off_the_land_desc:0 "In modern warfare, encirclements can be devastating to a military force. However the Seminoles are rugged and adapted to living off the land and hunting without need for supply lines. We will ensure all soldiers are able to adapt to new environments and be self-reliant when cut off."

 SEM_evolution_of_the_medicine_man:0 "Evolution of the Medicine Man"
 SEM_evolution_of_the_medicine_man_desc:0 "Medicine men are extremely important to any native culture as they are responsible for healing not just physical but spiritual or mental ailments. With the advance in modern medicine however, we can mix effective medicines alongside ceromonies and chants, bringing modernity and tradition together."

 SEM_legacy_of_the_black_seminole_scouts:0 "Legacy of the Black Seminole Scouts"
 SEM_legacy_of_the_black_seminole_scouts_desc:0 "The Black Seminole Scouts were "

 SEM_melt_away_into_the_forests:0 "Melt Away Into the Forests"

 SEM_reliable_cheap_arms:0 "Native Wisdom and Ingenuity"

 SEM_mikasuki_code:0 "Muscogee Code"

 SEM_the_forests_are_our_cover:0 "Terrain Is Our Advantage"
 
 SEM_scrap_metal_recycling:0 "Scrap Metal Recycling"

 SEM_bog_iron_refining:0 "Bog Iron Refining"

 SEM_rare_mineral_mining:0 "Rare Mineral Mining"

 SEM_america_in_chaos:0 "America In Chaos"

