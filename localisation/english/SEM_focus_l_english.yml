 #EVENTS

 seminoles.1.d:0 "The Seminole chickees. Traditional longhouses that Seminoles for generations had built and lived in down in the swamps for Florida and the American South. Today it held one of the most pivitol meetings in the tribe's history. Leader of the tribe, Marcellus Osecola Jr. was speaking to the gathered heads and elders of the tribe. \n\n"Brothers and sisters," He said with a slow but powerful voice that resonated within the open building. "We, for the first time since the 1800's the Seminole nation is once again free. This was once a land of proud warriors, willing to fight against insurmountable odds for their freedoms. Alas, this was not enough. For hundreds of years after our people where executed, enslaved, murdered and relocated against our will. No more I say. NO MORE! Today marks the day that the Seminoles undergo our next trail, the Trail of Blood!""
 seminoles.1.a:0 "We will have our revenge..."
 seminoles.1.t:0 "The Floridian Civil War"

 seminoles.2.t:0 "Seminole Victory!"
 seminoles.2.d:0 "Chieftan Marcus Osecola Jr. gathered the tribial council together at a small table in the Miami courthouse. He laid down on the table numerous pictures from the past few months of conflict. They were grotesque. Many of the council members looked away at the mere sight of them. \n\n"These have already made their rounds on the interent." Osecola said picking up a photo of one of his soldiers carrying scalps. "The other nations will not take kindly to our ways. Espically the Klan to the north. \n\nOsecola slowly placed down the picture and placed both of his hands on the table as if to brace himself. "We must prepare ourselves for what is to come and if need be, strike first.""
 seminoles.2.a:0 "A hard fought victory"

 seminoles.3.t:0 "Us Few Seminoles"
 seminoles.3.d:0 "Despite our victory, the realities of governing a land of majority white people is dawning on us. The native population of Florida is only around 1% of the total population, with a measly 4,000 seminoles left. If we want our new nation to survive, we must find a way to deal with this new reality."
 seminoles.3.a:0 "Unfortunate..."
 
