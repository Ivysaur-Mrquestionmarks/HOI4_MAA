 sem_israel.1.b:0 "This is going too far!"

 sem_bopevent.1.t:0 "Osceola Moves to Dissolve the Seminole Tribal Council!"
 sem_bopevent.1.d:0 "The success of Osceola against the White man and the preservation of stability in the country has severely weakened the influence of the Seminole Tribal Council. Many of our people now look solely to Osceola Jr for guidance, which he has swiftly capitalized on. After demonizing the council as weak and efficient, he has declared the Seminole Council void, with him acting as the sole leader of the nation!"
 sem_bopevent.1.a:0 "A sensible move."

 sem_bopevent.2.t:0 "The Warpath Party Dissolves"
 sem_bopevent.2.d:0 "After unsuccessfully agitating for influence, with the nominal support of Osceola Jr, the Warpath party has dissolved. Both Osceola Jr and the Seminole Council came to the understanding that both sides must share the power for the betterment of the tribe. While a fringe few are not happy with this, most are content with the status quo."
 sem_bopevent.2.a:0 "The Seminole Council exists for a reason."

 sem_bopevent.3.t:0 "The Council Removes Osceola Jr!"
 sem_bopevent.3.d:0 "The Seminole Council has apparently lost all faith in the leadership of Osceola Jr and his war against the Pale-Skins. They have claimed the brutality of his policies have torn the nation apart, condemning him for crimes against humanity. Just earlier he was arrested after his guards refused to defend him. It seems like the rule of Osceola Jr is over with the Seminole Council taking up the mantle. But not all is well. The news have sparked a new series of riots and calls for the end of minoritarianism in Florida. The Council is ill prepared for this and it is likely the entire nation will collapse!"
 sem_bopevent.3.a:0 "The end is nigh..."
 
 sem_collapse.1.t:0 "Council Begins to Fracture"
 sem_collapse.1.d:0 "With the arrest of Marcellus Osceola Jr, infighting has shaken the Seminole Council down to its core. Bickering from all sides has led to the complete loss of faith from not only from White citizens but from natives as well. The Council essentially has lost complete control of the situation and now is powerless to stop the coming storm..."
 sem_collapse.1.a:0 "Our grip is slipping!"

 sem_collapse.2.t:0 "Riots Rock Florida!"
 sem_collapse.2.d:0 "The lack of a proper government in Florida has resulted in protests and riots spreading across the country. People are calling for the restoration of the old Floridian state and the end of Native rule in the area. Worse yet, militias have cropped up and have taken control of regions in the name of this new Floridian government."
 sem_collapse.2.a:0 "I'm sure they'll stop eventually... right?"
 
 sem_collapse.3.t:0 "Holly Tiger Declared New Chairwoman"
 sem_collapse.3.d:0 "The Seminole Council has announced a new leader in the midst of the turmoil. It seem's that after much deliberation, Holly Tiger, the recently elected Vice-Chairwoman, has finessed her way into power by promising a return to stability. The Seminole Council has also given her extraordinary powers to restore order and peace to the land of Florida. While people are optimistic about this change, some who are supposedly on the ground floor have claimed that this will be a catastrophic error for the tribe."
 sem_collapse.3.a:0 "A light at the end of the tunnel?"

 sem_collapse.4.t:0 "Holly Tiger Dissolves the Seminole Council!"
 sem_collapse.4.d:0 "Holly Tiger has utilized her extreme powers and loopholes to order the dissolution of the Seminole Council, essentially granting complete power to herself. She claims that the Seminole Council was selling out the people of the Seminoles to big business and even claims of collaboration with White supremacists. While no evidence has come out about these affairs, she is quickly galvanizing support from tribal leaders and leftists."
 sem_collapse.4.a:0 "Oh..."

 sem_collapse.5.t:0 "The Declaration of a New Revolutionary Seminole State"
 sem_collapse.5.d:0 "With the foreboding dissolution of the Seminole Council, Holly Tiger has completed the transition of the Seminoles from a tribal council republic into a revolutionary state bent on the liberation of all Native people. She has declared that the state's purpose is to bring equality and classlessness to the Native people and to destroy the racial bourgeois of Whites."
 sem_collapse.5.a:0 "A Red Chieftainess"

 sem_victory.1.t:0 "The Past Redeemed, the Future Secured"
 sem_victory.1.d:0 ""
 sem_victory.1.a:0 "Our home until our dying breath!"

 News_Events.103.a:0 "An Unlikely Victor"
 News_events.103.t:0 "Seminole Tribe Triumphs in Floridian Civil War"
 News_events.103.d:0 "An unlikely victor emerges from the fires of the Floridian Civil War. The Seminole nation, though quite small, has taken control of Florida follwing their recent victory. Chieftan Marcus Osecola Jr. is set to lead the nation as the head of the Seminole Tribe and seems hell-bent on protecting the land from invaders. Osecola states that the Second Confederacy poses the "biggest threat to the Seminole culture and our way of life" over any other nation. There appears to be an inevitable clash in the future."

