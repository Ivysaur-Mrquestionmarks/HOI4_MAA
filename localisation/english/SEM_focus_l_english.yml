 SEM_whites_vs_natives:0 "Managing the Racial Crisis"
 SEM_whites_vs_natives_desc:0 "Just because we came out victorious in the Floridian Civil War, doesn't mean we won a popular mandate with the people. Our government is strictly a minority government, with the Seminole Tribal Authority technically governing the entire nation, cities included. The predominantly White population has apparently taken issue with this and now multiple groups are agitating against our government. Even the natives are not too enthusiastic about us, seeing how we are but a tiny minority within an already small minority. If we are too complacent, this could spiral into a crisis that may topple our very regime."

