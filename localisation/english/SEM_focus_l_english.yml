 #EVENTS

 seminoles.1.d:0 "The Seminole chickees. Traditional longhouses that Seminoles for generations had built and lived in down in the swamps for Florida and the American South. Today it held one of the most pivitol meetings in the tribe's history. Leader of the tribe, Marcellus Osecola Jr. was speaking to the gathered heads and elders of the tribe. \n\n"Brothers and sisters," He said with a slow but powerful voice that resonated within the open building. "We, for the first time since the 1800's the Seminole nation is once again free. This was once a land of proud warriors, willing to fight against insurmountable odds for their freedoms. Alas, this was not enough. For hundreds of years after our people where executed, enslaved, murdered and relocated against our will. No more I say. NO MORE! Today marks the day that the Seminoles undergo our next trail, the Trail of Blood!""
 seminoles.1.a:0 "We will have our revenge..."
 seminoles.1.t:0 "The Floridian Civil War"

 seminoles.2.t:0 "Seminole Victory!"
 seminoles.2.d:0 "Chieftan Marcus Osecola Jr. gathered the tribial council together at a small table in the Miami courthouse. He laid down on the table numerous pictures from the past few months of conflict. They were grotesque. Many of the council members looked away at the mere sight of them. \n\n"These have already made their rounds on the internet." Osecola said picking up a photo of one of his soldiers carrying scalps. "The other nations will not take kindly to our ways. Espically the Klan to the north. \n\nOsecola slowly placed down the picture and placed both of his hands on the table as if to brace himself. "We must prepare ourselves for what is to come and if need be, strike first.""
 seminoles.2.a:0 "A hard fought victory"
 
 seminoles.3.t:0 "Racial Tensions Boil Over"
 seminoles.3.d:0 "Protests in Miami and Tampa have rocked our fledling nation. People hoistered the old Floridian flag over government buildings, while others took to burning the Seminole flag. Even our supposed Native allies find themselves hesistant to support us. They claim we do not represent the entire Native community, and some leaders are getting ready to support the protests against us! It seems like everyone is standing poised against us, ready to bring us down."
 seminoles.3.a:0 "Reality comes knocking hard"
 
 seminoles.4.t:0 "The Second Patriot Army"
 seminoles.4.d:0 " Terrible news out of the north of our state today! A white supremacist group, calling itself the “Second Patriot Army” In honor of the American colonists who ravaged our villages during the Seminole Wars, has formed several militia groups and is already conducting terroristic operations. Already, a police station was bombed and a small army unit ambushed with no survivors. They’re popular among the white citizens, seeing them as some sort of liberators, and suspected foreign backing from several groups is being investigated as we speak. We must make haste to combat this unprecedented threat, lest they destroy us like their namesake tried to oh so many years ago."
 seminoles.4.a:0 "We need to do something!"

 seminoles.5.t:0 "Our People's Future"
 seminoles.5.d:0 "The guns have gone silent in the South as the proud Seminole flag flies from New Orleans to Raleigh. We are now in possession of a vast swath of the United States, which has sparked quite a debate over the future of our nation.\n\n The pragmatists call for us to retreat from the South and establish a puppet state. They claim it is too unfeasible to directly govern the territory, and are hesistant to accept plans to annex Georgia, South Carolina, and Alabama.\n\nOthers concur on the unfeasibility of governing the lands that constitute the Confederacy, but they still believe we ought to annex our ancestral territories and partition the rest into pro-tribal governments.\n\nThat is not even the most radical idea however. The tribal youth have been ignited by our recent victory and now many are calling for us to completely liberate the United States from the yoke of colonialism."
 seminoles.5.a:0 "Direct annexation is unfeasible, create a Southern puppet state."
 seminoles.5.b:0 "Reclaim our ancestral lands only, partition the rest."
 seminoles.5.c:0 "We can't stop here, all of America must be liberated!"

 seminoles.6.t:0 "Holly Tiger elected as Vice-Chariwoman of the Seminoles"
 seminoles.6.d:0 "Holly Tiger, by a majority vote from the Board of Directors, has been elected as the Vice-Chairwoman of the Seminoles. She is the first woman to be elected as the Vice-Chairwoman in the history of our tribe, which marks a historic moment. Throughout her campaign, she emphasized that she would put the Seminole people first, and increase transparency when it comes to the business aspect of the tribe.\n\nBehind closed doors however, it has been reported she has called for a radical change in how the tribe operates, citing the calamity of the American collapse. She has supposedly called for the dissolution of the corporate arm of the Seminoles and to pursue more egalitarian ideals. The rumors have gotten to the point that her opponents have called her a socialist and even a communist! It has to be noted that she's been quick to dispel the rumors as mere slander."
 seminoles.6.a:0 "Congratulations"

 sem_tot.1.t:0 "Trail of Tears Continued"
 sem_tot.1.d:0 "As the efforts to relocate our white population into the Orlando Reservation continue, several thousand whites have successfully been relocated this year, though with several casualties among them, mainly due to resistance. Protests, both internal and abroad also continue to harm our reputation, but we will continue onwards. Justice will be done, revenge is at hand."
 sem_tot.1.a:0 "We are slowly reclaiming our lands"

 sem_culture.1.t:0 "The Annual Green Corn Dance"
 sem_culture.1.d:0 "It is time for this year's Green Corn Dance! Here, we shall celebrate the harvest of the first corn of the year, which still signifies the start of a new year for many of our people. Alongside this, it represents a sort of a new beginning for people, both giving thanks for the good and forgiving the bad, letting everyone start the new year fresh and renewed. While still niche with our white population it's popularity keeps growing year after year, both among natives or otherwise."
 sem_culture.1.a:0 "Wonderful!"

 sem_culture.2.t:0 "A Great Day for Stickball"
 sem_culture.2.d:0 "Andrew breathed in as he held his stick. After so much planning and training, today was finally the day. After the civil wars, both American and Floridian, all everyone wanted was a way to relax and enjoy themselves, and with the new Native government, what better way than a classic game of stickball. Andrew had been playing the niche sport for a few years now, though never in any kind of professional way, as the market simply wasn’t there. However, recent investments into local cultural practices, stickball among them, have changed the game quite significantly. Small teams are growing, cities are investing into funding their own teams, and a national league is even in talks of being formed. Andrew couldn’t be more hopeful for the future of his sport, but now he had to focus. There was a game to win after all."
 sem_culture.2.a:0 "Better than baseball."
 
 sem_culture.3.t:0 "A Dangerous Pastime"
 sem_culture.3.d:0 "Recently, the rather niche sport known as “Alligator Wrestling” has began gaining massive popularity around our state. They consist on the “wrestler” handling the alligator in question, moving around it to dodge it’s powerful bites and flipping it over for an audience’s enjoyment. While this is an ancient tradition based around indigenous alligator handling, it’s been a form of entertainment here in Florida for over a century now. While this does strengthen our local sense of identity and culture, it has led to quite predictable negative results, such as amateur “wrestlers” heading into the Everglades and subsequently getting drowned and/or devoured by the reptiles in an attempt to gain clout. "
 sem_culture.3.a:0 "More entertaining than WWE."

 sem_culture.4.t:0 "New Chickee Designs"
 sem_culture.4.d:0 "All around Florida, curious new structures can be seen being built and remodeled. Due to the harm the civil war brought to our state, there has been a high demand for new homes to replace those damaged or destroyed. A particularly interesting development in this field is that of the “New Chickee” style. While Chickee means simply “house” in Mikasuki and Creek languages, the word has taken to refer to a particular style of building inspired by Seminole traditional building styles which use stilts and thatched roofs, and mostly built out of cypress wood. This inspiration has taken on a variety of shapes, from functional stilts which help during flooding and hurricane season, to more decorative elements such as palm thatch overhangs in gardens and over streets, which are a welcome source of shade during the day. This architectural trend as a whole has given our cities and homes a new life, something desperately needed after the chaos of the war."
 sem_culture.4.a:0 "Tradition and modernization are compatible."

 sem_culture.5.t:0 "Patchworking and Crafts"
 sem_culture.5.d:0 "Due to the influx of funds towards Seminole cultural projects, a significant shift has occurred within the state’s artistic and artisanal scene. From more “traditional” western design standards, many have shifted towards Seminole and Seminole-inspired works, particularly those based around the Taweekaache, a traditionally Seminole style of patchwork with bright and colourful bands stretching across the clothing. Styles using this technique have become prevalent around our nation, from shirts and jackets to dresses and skirts. Not only this, but other traditional crafts have risen in popularity, from dolls to beads, even among our non-Seminole population, providing a great boon for our nation artisans."
 sem_culture.5.a:0 "A testament to our creativity."

 sem_army.1.t:0 "Learning from the Seminole Wars"
 sem_army.1.d:0 "The Seminole Wars were treacherous for our people, with many in the end being removed to Oklahoma where our lost brothers now remain. Despite unspeakable crimes and overwhelming force, we used guerilla warfare to beat the Americans in many different battles, but in the long run the United States technological and numerical might drove us into the Everglades where we have remained since.\n\nHowever, this could be more than just a tragedy. It could be a lesson for our people and how we should form our army. One side calls for us to follow our ancestors and rely on guerilla warfare and infiltration to beat our enemies.\n\nOthers believe that this will just lead to a repeat and us once again being driven back to the Everglades. They call on us to use all of the left over military sites and equipment from the now defunct United States army to build a modern military."
 sem_army.1.a:0 "Learn from Uncle Sam"
 sem_army.1.b:0 "Follow in the footsteps of Osceola"

 sem_army.2.t:0 "Big Cypress Shootout Re-enactment"
 sem_army.2.d:0 " "
 sem_army.2.a:0 "Valuable lessons"
 
