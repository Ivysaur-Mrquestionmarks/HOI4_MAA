 #Events
 
 viva_las_vegas.22.t:0 "A Celebration in Time of Sorrow"
 viva_las_vegas.22.d:0 "Today is November 13th, also known by some as New Vegas Day, and its the start of the 3-day New Vegas Day celebrations in Goodsprings Nevada. Most would think the country falling apart would put a damper on the festivities, however its the biggest one to date. Thousands of Fallout Fans have descended upon the little town to celebrate like nothing is wrong, even celebrities who have settled in Vegas to avoid the government in California with some minor connections to Fallout have shown up. This has caught the attention of Steve Wynn, founder of Wynn Casinos and a man who likes power. To most hes old and on his way out, sidelined by the bigger fish in the Vegas Pond, and they're right. This displeases him. If there was just a way to get power over the city Wynn could show them all and maybe even make them pay. He looks at the news on his IPad and sees an article about New Vegas Day and becomes interested. After a few safari searches a plan begins to develop. Fans of a game series about shooting your enemies and doing quests would love if the 'Real Life Mr.House' gave them a quest to overthrow the government, wouldn't they? Then again they are probably just a bunch of weak nerds anyway, and he'd have to supply them. After a couple hours of further research and pondering Wynn decides to:"
 viva_las_vegas.22.a:0 "Might as well try my luck"
 viva_las_vegas.22.b:0 "Nah, it wouldn't work"
 
 viva_las_vegas.23.t:0 "Time to Wynn the Jackpot"
 viva_las_vegas.23.d:0 "When Wynn's message was played to the crowd the reaction was initially mixed, but a voice of support from amoung the crowd rang out. The voice was of Sean Wallis, dressed as a NCR Trooper, he said 'That was cringe, but hes got a point that the government needs to go!' Some cheers followed, but it looked as if his idea was not the most popular. He continued, 'What does everyone think of us? Do they see our hard work on cosplay, our dedication to what we love, or do they see a bunch of nerds! Useless Nerds! This is our chance to show the world who we really are!' This time cheers rang out, but there were still a lot of skeptics. 'Hes right, you know' said another voice, one everyone recognised, the voice of Vulpes Inculta. Or as he goes by in real life, Jason Spisak. 'I am ready for a change of pace in life, why not?' Then a few more, less notable, individuals voiced their support for the plan. With the crowd convinced one man said they need a 'courier' to lead them, with everyone quickly agreeing. Wallis, who clearly wanted to lead the operation quickly won over the NCR fans behind his banner. This was opposed by the Legion Fans who acclaimed Spisak as their leader. Seeing conflict on the horizon a group of fans attempted to field a 'Unity Candidate', famous actor Clancy Brown. Brown only was there because he was bored with jobs being sparce with the situation in America and thought that New Vegas Day would be fun, and he did lend his voice to Paladin Rhombus in Fallout 1, giving him acclaim with the more nerdy Brotherhood Fans. They did not ask him first. At an impasse the poor Wynn Employee sent to deliver the message was given the choice of leadership. He picked:"
 viva_las_vegas.23.a:0 "The Fan - Sean Wallis and his NCR Faction"
 viva_las_vegas.23.b:0 "The Compromise - Clancy Brown and the Unity Faction"
 viva_las_vegas.23.c:0 "The Voice Actor - Jason Spisak and his Legion Faction"
 
 viva_las_vegas.24.t:0 "Las Vegas in Chaos"
 viva_las_vegas.24.d:0 "WHAT THE FUCK IS GOING ON! *gunshot* *gunshot* gunshot* Im hit, Im hit, who the fuck are these people!? Hzzt - All Units to City Hall - Armed Militia is Approaching - Hzzt Ahhh, fuck *gunshot* Omega Squadron, Advance! Legionaires, Fight! Ad Victorium! The fight has consolidated around City Hall as night falls, and the next morning it can easily be seen that:"
 viva_las_vegas.24.a:0 "The Shoddy Militia is Destroyed"
 viva_las_vegas.24.b:0 "A New Day Dawns in Vegas"
 
 viva_las_vegas.25.t:0 "The Aftermath"
 viva_las_vegas.25.d:0 "Vegas has been rocked, but it still stands. Police are rounding up survivors trying to hide from punishment and, most importantly, Wynn himself. The coward was still just in his house, sulking. We will rebuild from his foolish gamble."
 viva_las_vegas.25.a:0 "Wynn has gone Bust"
 
 new_vegas.1.t:0 "Declaration of New Vegas"
 new_vegas.1.d:0 "Both Steve Wynn and the Courier were standing in front of the Wynn Las Vegas atop a quickly built podium, in front of both the soldiers who had taken the city and journalists and civilians who were interested in the developing situation. Wynn had of course spoken to crowds before, but it was a big difference between a sleek corporate boardroom and a group of armed men and women wearing a combination of tactical gear and cosplay. Regardless of his nerves however, he began speaking.\n"People of Las Vegas.' He began. 'I'll try to keep this short. Today marks a new dawn for the city we all love. To face the challenges around us and from inside our very home, the incompetent previous regime had to be removed. All of this is thanks to Vegas' very own Courier, and his brave soldiers on the ground.' At that point many in the crowd cheered and saluted towards the Courier, annoying Wynn, though he brushed it off. 'Today, a new era for Las Vegas begins. An era of change and hope. And in honor of our brave troops, my first act as Mayor of Las Vegas shall be to rename the city. From this day on, we shall be known as the people of New Vegas!'"
 new_vegas.1.a:0 "Viva New Vegas"
 
 new_vegas.2.t:0 "The Meeting"
 new_vegas.2.d:0 "Wynn sat down in his office atop the Wynn Las Vegas. Due to some structural damage, the City Hall was still unsafe to use as the main administrative hub of the city. Convenient for him. 'Mr. Wynn, your 12 pm is heading in now' Said his assistant. 'Perfect, let him in.' Answered Wynn. At last, the long overdue meeting with this 'Courier' character.\n'Mr. Wynn, good morning.' Said the man in front of him, wearing a strange sort of combat armor under a tacky cowboy duster. 'A good morning indeed, my friend. Now, if you don't mind, I'd like to begin by discussing something of great importance with you. I've got plans with MGM and I want to clearly define where on the Strip you would-' 'Now hold on' Interrupted the Courier, who couldn't care less for Wynn's ramblings 'I think it's most important to set our goals clear to both the city and the outside world. Our intentions for expansion and long term-' 'Expansion? The hell does Expansion mean? We're staying right here in Vegas, plenty of profit here without having to worry about conflict.' Replied the increasingly annoyed magnate. 'Look Wynn, we can't focus on profit alright? We have a one in a billion chance to bring real change not only the city but the entire country! We can't just focus on a few casinos!' Angrily answered the Courier, before scoffing and leaving the office. Wynn simply sighed and rubbed his forehead as his so-called 'Ally' left the room."
 new_vegas.2.a:0 "I guess I will just have to deal with these nerds"
 
 new_vegas.3.t:0 "A Night at the Wynn Casino"
 new_vegas.3.d:0 "Wynn tapped his feet anxiously as he waited outside the Casino's meeting room.  Inside were representatives from Caesars, MGM, Vici, Apollo, even the Mob had people inside the room. Wynn reprimanded himself again and again for trusting a bunch of man-children to help run this town and not going to the businesses first. Wynn breathed in and opened the door into the meeting room.\n'Good evening gentlemen. Now, I won't waste your time, so let's get started.' Throughout the night, Wynn and his associates formed a tight collaboration, dividing up New Vegas' territory, resources and administration between themselves. Wynn had at long last, gotten himself some actual allies."
 new_vegas.3.a:0 "This is much better than some nerds"
 
 new_vegas.4.t:0 "The Showdown at Wynn Casino"
 new_vegas.4.d:0 "Wynn looked over the city from the Wynn New Vegas' 45th floor. Tonight, the city looked more like a boiling kettle than the oasis of civilization it was meant to be. With police, mob enforcers and casino security on one side, and the Courier's militia on the other as the South Las Vegas Boulevard became a dangerous frontline. But Wynn's focus wasn't on the street, but rather the rapidly approaching Courier. The same bastard who'd fucked over his plans and put a halt to any progress in the city. The moron had agreed to come to his office, unarmed, without bodyguards, to try and hash out a deal and stop the chaos. Wynn could barely contain his giggle as the Courier entered the room, still unaware of the four mob hitmen acting as his guards.\n'Mister Wynn, as-' 'Get this over with already.' Stated simply the businessman, as his guards quickly revealed their pistols, ready to gun down the so-called Courier in the middle of the room. But the Courier's fate was not to die in that room.\nWith a swiftness unseen by any living man, he revealed his own hidden gun, a Colt Single Action Army, and unloaded five rounds into the five men before him, killing every hitman before they could even fire a shot. As Wynn struggled for air with a pierced lung, the Courier sent a message to Wynn's supporters from his laptop to stand down, just to give a message to his own militia to attack while their guard was down. Wynn tried pleading, but his words failed to reach his throat, and as his supporters were crushed on the streets, Wynn's last sight would be the muzzle flash of the Courier's revolver."
 new_vegas.4.a:0 "The Courier cheats death once again"
 
 new_vegas.5.t:0 "New Vegas under the Courier's Thumb"
 new_vegas.5.d:0 "The last remnants of Wynn have been arrested or beaten down into compliance. The Casinos that had once backed Wynn now find themselves under new management. As for the rest of the people of New Vegas, they are weary of more violence in the streets and naturally suspicious, but the Courier's natural charisma has already made him more popular than Wynn could ever hope to be.\n\nFor now at least, New Vegas is the Courier's to do so as he wishes."
 new_vegas.5.a:0 "A New Age Begins - The Age of New Vegas"
 
