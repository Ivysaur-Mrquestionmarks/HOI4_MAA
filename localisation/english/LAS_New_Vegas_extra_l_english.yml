l_english:
 
 #Events
 
 new_vegas.1.t:0 "Declaration of New Vegas"
 new_vegas.1.d:0 "Wynn declares New Vegas with the Courier (keep courier ambiguous through event 5 so i dont have to code 3 different events for the entire starting tree thx)"
 new_vegas.1.a:0 "Viva New Vegas"
 
 new_vegas.2.t:0 "The Meeting"
 new_vegas.2.d:0 "Wynn meets with courier and they have a falling out"
 new_vegas.2.a:0 "I guess I will just have to destroy these nerds"
 
 new_vegas.3.t:0 "A Night in Wynn Casino"
 new_vegas.3.d:0 "Wynn meets with organized crime and other casino owners to form an alliance"
 new_vegas.3.a:0 "This is much better than some nerds"
 
 new_vegas.4.t:0 "The Showdown in Wynn Casino"
 new_vegas.4.d:0 "Courier kills Wynn in a great battle (This should be characterized as a great feat by the courier (Like Dickride them almost))
 new_vegas.4.a:0 "The Courier cheats death once again"
 
 new_vegas.5.t:0 "New Vegas under the Courier's Thumb"
 new_vegas.5.d:0 "something something opponents of the courier have been rounded up and no longer pose a threat"
 new_vegas.5.a:0 "A New Age Begins - The Age of New Vegas"
 
 new_vegas.6.t:0 "For the Republic"
 new_vegas.6.d:0 "wallis adresses his troops, make it sound cool, ncr larp, etc"
 new_vegas.6.a:0 "FOR THE REPUBLIC!!!!!"
 
 new_vegas.7.t:0 "The Executive Branch"
 new_vegas.7.d:0 "describe the executive branch of the NVR government (look at focus description for details)"
 new_vegas.7.a:0 "you can do this too"
 
 new_vegas.8.t:0 "The Legislative Branch"
 new_vegas.8.d:0 "describe the legislative branch of the NVR government (look at focus description for details)"
 new_vegas.8.a:0 "you can do this too"
 
 new_vegas.9.t:0 "The Judicial Branch"
 new_vegas.9.d:0 "describe the judicial branch of the NVR government (look at focus description for details)"
 new_vegas.9.a:0 "you can do this too"
 
 new_vegas.10.t:0 "New Departments"
 new_vegas.10.d:0 "Wirtie something about the establishment of government departments ex: Department of Defense, Justice, Interior, etc"
 new_vegas.10.a:0 "Another Step Closer to a Real Govenment"
 
 new_vegas.11.t:0 "New Judges"
 new_vegas.11.d:0 "Write about Wallis appointing judges"
 new_vegas.11.a:0 "A Step Closer to Civilization"
 
 new_vegas.12.t:0 "Governance Restored"
 new_vegas.12.d:0 "Wallis opens the new congress and makes a speech"
 new_vegas.12.a:0 "The Whole Room Cheers"
 
 new_vegas.13.t:0 "Election Day"
 new_vegas.13.d:0 "describe wallis's New Vegas Party and the opposing Independence Party New vegas Party wants to expand independ doesnt both will keep wallis as leader"
 new_vegas.13.a:0 "The New Vegas Party!"
 new_vegas.13.b:0 "The Independence Party!"
 
 new_vegas.14.t:0 "New Vegas Requests Aid"
 new_vegas.14.d:0 "This event is sent to fra new vegas requests some equipment"
 new_vegas.14.a:0 "Anything to Help!"
 new_vegas.14.b:0 "We have our own problems"
 
 new_vegas.15.t:0 "[FRA.GetName] Sends Aid"
 new_vegas.15.d:0 "FRA sends equipment to LAS"
 new_vegas.15.a:0 "A Thanks to [FRA.GetName]"
 
 new_vegas.16.t:0 "[FRA.GetName] Rejects our Plea"
 new_vegas.16.d:0 "FRA Doesn't send aid"
