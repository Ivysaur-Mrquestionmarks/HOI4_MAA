 vance.34.c:0 "The Free Ohio Coalition Win The Election!"


 ################################ FOCUSES ################################

 #Starting Tree
 AFS_triumvirate_rule:0 "Triumvirate Rule"
 AFS_triumvirate_rule_desc:0 "When Vermin Supreme became dissatisfied with the G.L.A.R being Pro-Trump, Vermin, with the help of Howie Hawkins and James Mattis, rebelled against the GLAR and managed to hold out until the Good Friday Ceasefire and establishing a triumvirate government. \n\nBut now, the triumvirate is showing it's cracks, with a economy in ruins, much like the G.L.A.R, and violence in the streets, the three must now work together to decide on how to fix the problems that lie ahead."

 #Starting Tree Vermin
 AFS_againist_tyranny:0 "Against Tyranny"
 AFS_againist_tyranny_desc:0 "Vermin stands against all these wannabe tyrants, egotistical madness and power hungry silver-tongued politicians. He knows each one of them wants to strip us of our freedoms and to make us their mindless puppets who will follow whatever they say. But Vermin and we refuse to bow and give in."
 AFS_investigate_the_triumvirate:0 "Investigate the Triumvirate"
 AFS_investigate_the_triumvirate_desc:0 "Though in practice the Triumvirate is supposed to help everyone work together, in reality tensions exist and distrust among everyone is common. Recently, we have been seeing suspicious activity from Mattis and Hawkins' side. To keep ourselves and everyone safe, we will send agents to investigate so we know for sure what they might be planning."
 AFS_make_them_powerless:0 "Make Them Powerless"
 AFS_make_them_powerless_desc:0 "Hawkins and Mattis have shown increasingly rebellious behaviour, taking them out wouldn't be right and would lead to huge backlash. What we can do however, is curtail their influences and sway over the public so no new members will come and join them."
 AFS_weaken_their_armies:0 "Weaken Their Armies"
 AFS_weaken_their_armies_desc:0 "Hawkins and Mattis may have lost sway and relevancy because of our efforts but their armies still loom. If we don't tread carefully, they may become an issue later down the line. But we can remedy this; however, a few rank changes, Garrion shifting from here to there, and additional “support” to their armies will do nicely."
 AFS_popular_support:0 "Popular Support"
 AFS_popular_support_desc:0 "We wouldn't exist without the people who support us. No stable leadership can exist without them. We fight for the freedom and happiness of the people. Only with their support and devotion can we move forward with our plans."
 AFS_connect_with_our_populous:0 "Connect With Our Populous"
 AFS_connect_with_our_populous_desc:0 "Vermin has not forgotten the very people he swore to protect. He will make sure to let them know he is always working to help them and save them from outside threats while also providing aid for them to rebuild and live peacefully."
 AFS_promises_of_a_anarchist_paradise:0 "Promises of a Anarchist Paradise"
 AFS_promises_of_a_anarchist_paradise_desc:0 "We not only promise the people peace and return to normalcy. We promise them a truly free nation. No more knee-bending to demagogues, no more blindly following strongmen, no more being hand-fed poison. There is only freedom to be happy, prosperous, with sunshine and smiles all around. A paradise where every man, woman and child has the right to be themselves!"
 AFS_vermins_black_army:0 "Vermin's Black Army"
 AFS_vermins_black_army_desc:0 "Without a standing army, we cannot defend ourselves from outside forces. Our army will be trained in the ways of the black army. Independent, decentralised, highly adaptable and most importantly of, loyal to Vermin."
 AFS_take_them_down:0 "Take Them Down!"
 AFS_take_them_down_desc:0 "Hawkins, Mattis and both of their loyalist trouble makers are in a weak enough position to take them out without having to worry about public backlash or mutinies. Without them causing trouble within our territory, we will be finally able to tend to our plans."

 #Starting Tree Hawkins/Mattis
 AFS_againist_lawlessness:0 "Against Lawlessness"
 AFS_againist_lawlessness_desc:0 "Vermin and his anarchist ideas have done nothing but cause chaos across our territory. America already lies in anarchy, and what we need is law and order. Not more anarchy."
 AFS_turn_the_people_againist_vermin:0 "Turn The People Against Vermin"
 AFS_turn_the_people_againist_vermin_desc:0 "Vermin Supreme is nothing more than a fraud and opportunist! His anarchist ideas will continue to destroy this country! All he does is let chaos and disorder spread!"
 AFS_againist_the_vermin:0 "Against The Vermin"
 AFS_againist_the_vermin_desc:0 "Vermin Supreme is an actual Vermin. His ideas are all insane, stupid and borderline schizophrenic. We don't need more crazy people running this country!"
 AFS_riots_across_ohio:0 "Riots Across Ohio"
 AFS_riots_across_ohio_desc:0 "We want order! We want law! Down with Anarchy! Down with Vermin! Our nation needs stability and discipline not anarchist rabble!"
 AFS_plot_againist_vermin:0 "Plot Against Vermin"
 AFS_plot_againist_vermin_desc:0 "Vermin still has a large support base. Going against him publicly won't do and only cause it to backfire. We need to plan in the shadows away from Vermin's followers and their prying eyes."
 AFS_secret_assassinations:0 "Secret Assassinations"
 AFS_secret_assassinations_desc:0 "There are many supporters of Vermin who hold strong positions across the territory. If we are to take down the Anarchist ramble, neutralizing key people will allow for Vermin's power base to be cut."
 AFS_influence_the_government:0 "Full Control"
 AFS_influence_the_government_desc:0 "The Anarchist's power base has been cut, our loyalists have slowly been replacing positions they had once held and have started to grant us more opportunities to power grab."
 AFS_preparations:0 "Preparations"
 AFS_preparations_desc:0 "Any day now we still strike and take Vermin down. But before executing our plans we must make sure everything is planned and prepared well. Chances cannot be taken. One small misstep will cost us dearly."
 AFS_begin_the_plot:0 "Begin The Plot"
 AFS_begin_the_plot_desc:0 "It is time that we take down the vermin and begin his demise, no more anarchism, no more chaos, and no more loud rave parties when i'm trying to go to sleep!"

 #Vermin Tree
 AFS_vermins_anarchist_dreams:0 "Vermin's Anarchist Dreams"
 AFS_vermins_anarchist_dreams_desc:0 "Vermin dreams are in the first steps to becoming a reality. A happy less corrupt world remains on the horizon and we do not intend to just stand by and let it slip."
 AFS_free_from_tyranny:0 "Free From Tyranny"
 AFS_free_from_tyranny_desc:0 "We stand here free from the clutches of tyrants and wannabe emperors. And we do not intend to back down any time soon. We shall fight to maintain our freedoms!"
 AFS_right_to_pony:0 "Right to Pony"
 AFS_right_to_pony_desc:0 "Everyone has the right to have a pony they can love and cherish, and to call their own. Everyone in the territory will have at least one pony to have for themselves."
 AFS_promote_anarchist_ideals:0 "Promote Anarchist Ideals"
 AFS_promote_anarchist_ideals_desc:0 "Many within our territory are still weary about the idea of Anarchism but we will let them know they have nothing to fear. Anarchism is for everyone and everyone is equal under it. Only those who seek to exploit and abuse people have to fear Anarchism."
 AFS_upgrade_the_black_army:0 "Upgrade the Black Army"
 AFS_upgrade_the_black_army_desc:0 "Our current army structure has served us well enough, but it isn't enough to stand up to giants, nor is it strong enough to take the initiative. Changes and improvements must be made."
 AFS_motivate_the_populace:0 "Motivate the Populace"
 AFS_motivate_the_populace_desc:0 "We can only survive if the people are motivated enough to stand up and fight. Apathy and nihilism is a death cycle. The best way to keep our people motivated is through passionate speeches, music and flashy propaganda."
 AFS_unite_the_people_of_ohio:0 "Unite the People of Ohio"
 AFS_unite_the_people_of_ohio_desc:0 "Unity is our greatest strength, our people will not break under pressure and threats from outsiders. We are strong and not to be messed with."
 AFS_what_remains_of_the_triumvirate:0 "What Remains of the Triumvirate"
 AFS_what_remains_of_the_triumvirate_desc:0 "It's safe to say the remnants of Mattis and Hawkins support won't cause a problem in the future or any time soon, but it doesn't mean we should just close our eyes. Keeping a tight leash will help keep everything in check. It's better to be safe than sorry."
 AFS_self_governance:0 "Self-Governance"
 AFS_self_governance_desc:0 "We are not autocrats, we won't tell what people can and can't do."
 AFS_vermins_autonomous_regions:0 "Vermin's Autonomous Regions"
 AFS_vermins_autonomous_regions_desc:0 "The people have the right to govern themselves whichever way they please. Who are we to decide who does what? Vermin will let autonomous regions around the territory be set up by local leaders, which will expand local freedom and shave off administrative loads from us."

 AFS_self_protecting_cities:0 "Self-Protecting Cities"
 AFS_self_protecting_cities_desc:0 "A well armed people are ready for whatever threat that may come, instead of us worrying by every city and slowing down every city will be taught and given the means to protect themselves from whatever dangers that may come, this in turn also teaches the public to be well trained and ready against any foes."
 AFS_putting_the_people_first:0 "Putting the People First"
 AFS_putting_the_people_first_desc:0 "Our interest doesn't rely on self-serving politicians, corrupt oligarchs, money hungry grifters. Everything we do is in service to the people."
 AFS_fight_the_power:0 "Fight the Power!"
 AFS_fight_the_power_desc:0 "We will not bend, we will not kneel. With Vermin at our helm the anarchist dream is real!"
 AFS_no_authority_no_bureaucracy:0 "No Authority, No Bureaucracy"
 AFS_no_authority_no_bureaucracy_desc:0 "Authority is nothing more than greedy people's desire to control more and more while bureaucracy only slows up justice from being served, while hiding behind walls of guidelines and Terms of Service. All of these will be purged so a new world may emerge from the ashes of the crooked and old."
 AFS_finalize_vermins_anarchist_reforms:0 "Finalize Vermin's Anarchist Reforms"
 AFS_finalize_vermins_anarchist_reforms_desc:0 "Vermin's reforms are almost complete, gone are the stagnant ways of old, gone are the systemic injustice and hard wired exploitation of the America of old."
 AFS_liberty_above_all:0 "Liberty Above all"
 AFS_liberty_above_all_desc:0 "Our motivation comes from our desire to be free and happy not from money, consumerism, fiery lies spoken by two faced politicians nor by ideals of olds. Liberty is the greatest thing for one to have and we all shall fight to protect it."

 AFS_pony_enhancements:0 "Pony Enhancements"
 AFS_pony_enhancements_desc:0 "We won't be able to save ourselves with outdated peashooters and flimsy grenade launchers that can barely launch things 3 feet away. We will put our greatest minds to work to improve upon existing equipment and to research newer and modern technologies."
 AFS_guerrilla_warfare_tech:0 "Guerrilla Warfare Tech"
 AFS_guerrilla_warfare_tech_desc:0 "Big massive guns and flashy tech won't do. What we need is weapons that can easily be carried and concealed and hidden. The enemy expects frontal assaults and huge battles. But why would we need to fight the wolf head on when we can just poke it until it bleeds to death."
 AFS_serving_liberty:0 "Serving Liberty"
 AFS_serving_liberty_desc:0 "We do not serve any strongman, no corporation, no Gods, no wannabe kings, we serve freedom and liberty through and through, pure and unadulterated."
 AFS_freedom_and_ponies:0 "Freedom and Ponies"
 AFS_freedom_and_ponies_desc:0 "The people in our territory are as happy as they can be. They have peace, happiness, harmony and most importantly ponies. Who doesn't love these little ponies?"
 AFS_an_army_of_ponies:0 "An Army of Ponies"
 AFS_an_army_of_ponies_desc:0 "Our army will be made of strong, resilient, hard-working and genius soldiers. There is nothing we can't overcome by working together, unity is harmony and friendship is strength."
 AFS_the_return_of_calvary:0 "The Return of Calvary"
 AFS_the_return_of_calvary_desc:0 "Armoured vehicles, MBTs, APCs and Humvees are now the norm in warfare. But that doesn't mean we should forget one of man's oldest friends. Horses! They have aided and served humans for millenia. Cavalries have been a key part in many historical battles and they will have their former glory again!"
 AFS_remember_what_your_fighting_for:0 "Remember What You're Fighting For!"
 AFS_remember_what_your_fighting_for_desc:0 "We fight for freedom! We fight for liberty! We fight for friendship and harmony! And most importantly, we fight for our little ponies!"

 AFS_leading_the_anarchist_front:0 "Leading the Anarchist Front"
 AFS_leading_the_anarchist_front_desc:0 "Vermin Supreme is a great leader, visionary and a man of the people. His leadership is our best way forward. We all must look up to and learn from our father Vermin."
 AFS_anarchists_across_the_globe:0 "Anarchists Across the Globe"
 AFS_anarchists_across_the_globe_desc:0 "We are not alone in our struggle, Anarchists world wide see us. They know our struggle and are willing to help their brothers-in-arms."
 AFS_fight_againist_tyranny:0 "Fight Against Tyranny"
 AFS_fight_againist_tyranny_desc:0 "Standing aside and turning our heads away is how tyranny spreads. But we will simply not stand idly by, we will fight tyranny whatever form it may take."
 AFS_for_americas_future:0 "For Americas Future"
 AFS_for_americas_future_desc:0 "If we do not fight, America will be ruled by tyrants or worse, there will be no America for us to call home. We America will not be lost, America will live, We are America, forever and together!"

 AFS_anarchism_has_succeed:0 "Anarchism Has Succeed"
 AFS_anarchism_has_succeed_desc:0 "Many had claimed we couldn't do it. Many had said we'd collapse. Many had said we'd just end up as some crime ridden drug den like all the other anarchists. But we have proved them wrong. We not only created a functioning Anarchist state but we have also ensured that our people are happy and smiling."

 AFS_promote_mutual_aid:0 "Promote Mutual Aid"
 AFS_promote_mutual_aid_desc:0 "Those who have the means should give to help those in need. Selfishness and hoarding does not help society. Everyone must collaborate so they may reap its rewards."
 AFS_working_together:0 "Working Together"
 AFS_working_together_desc:0 "Working together hand in hand, shoulder to shoulder is erasing disharmony from the nation. No longer will the working man tear his brothers apart. With each other by his side they will conquer every obstacle."
 AFS_communal_rebuilding_projects:0 "Communal Rebuilding Projects"
 AFS_communal_rebuilding_projects_desc:0 "Though every commune is independent they are still brothers and as brothers they will help each other rebuild whenever any issues arise. Working together is the key to harmony and brotherhood."
 AFS_together_we_can_rebuild_the_rust_belt:0 "Together, We CAN Rebuild the Rust Belt"
 AFS_together_we_can_rebuild_the_rust_belt_desc:0 "Together we are strong, together there is nothing we can't do. Together, we will rebuild America's heart. Together we will show the world we are serious and we mean business."
 AFS_promote_local_businesses:0 "Promote Local Businesses"
 AFS_promote_local_businesses_desc:0 ""
 AFS_vermins_gift_economy:0 "Mutualist Economics"
 AFS_vermins_gift_economy_desc:0 "A system where collaboration and mutual support is key will help the people unite and rebuild. Instead of consumerism or greed being the main motivator, progress and mutual support will help our society progress and keep it from money hoarders."
 AFS_communal_trade:0 "Communal Trade"
 AFS_communal_trade_desc:0 "If one commune doesn't have the resources it needs other communes to come and fill the gap by letting others trade with them for goods and resources, this will promote healthy competition and help communes in need."
 AFS_reuse_the_wealthys_assets:0 "Reuse the Wealthy's Assets"
 AFS_reuse_the_wealthys_assets_desc:0 "Many wealthy assets remain within our territory as their owners have fled a long time ago. Instead of letting these sit there and rot we will use them to the fullest to help our cause."
 AFS_economic_self_management:0 "Economic Self-Management"
 AFS_economic_self_management_desc:0 ""
 AFS_rust_belt_industrial_communes:0 "Rust Belt Industrial Communes"
 AFS_rust_belt_industrial_communes_desc:0 "The Rust belt used to be the beating heart of America and those who made it work were the workers. Their contribution was vital to its growth. Independent industrial communes headed by the workers themselves will help us use the Rust Belt's industrial might without delay and maximise its efficiency."
 AFS_phase_out_capitalism:0 "Phase Out Capitalism"
 AFS_phase_out_capitalism_desc:0 "Capitalism was nothing more than a parasite. It leaches people's hard work and grows like a cancer consuming more and more while enticing people to give into its decadence. Now after our reforms this parasite will be destroyed well and truly."
 AFS_vermins_rust_belt:0 "Vermin's Rust Belt"
 AFS_vermins_rust_belt_desc:0 "Under our Great Vermin the Rust Best has been transformed into an efficient, phosphorus and powerful industrial giant. No longer held back by bureaucratic jargon and exploitation."

 #Vermin War Tree
 AFS_americas_liberation:0 "America's Liberation"
 AFS_americas_liberation_desc:0 "We have secured and rebuilt our territory. Our armies stand ready to finally liberate their brothers across America."

 AFS_virginian_cooporation:0 "Virginian Cooperation"
 AFS_virginian_cooporation_desc:0 "To our delight it seems the Anarchists have managed to revolt against their oppressors in Virginia and have managed to set up an Anarchist state like ours. It is very good for us and we will reach out to them and invite them to join us in our revolution against tyranny."
 AFS_riding_to_richmond:0 "Riding to Richmond"
 AFS_riding_to_richmond_desc:0 "Once again oppression dwells in the halls of Richmond Virginia, like the olden days of the civil war where chattel slavers held the state at bayonet’s point. We will ride through Virginia to Richmond like General Grant once done. For as he freed men from bondage to slavers, we will free all from the bondage of the state."
 AFS_freedom_to_the_coal_miners:0 "Freedom to the Coal Miners"
 AFS_freedom_to_the_coal_miners_desc:0 "The greedy corporations in West Virginia have sucked the state dry and have unapologetically enslaved its workers. These coal miners work day and night breaking their backs just for corporate fiends to line their pockets. But do not worry fellow workers. We are here to free you from your indentured servitude."
 AFS_resist_againist_the_cornel:0 "Resist Against the Colonel"
 AFS_resist_againist_the_cornel_desc:0 "The Colonel has gone mad. He turned Kuntecky into his personal insane fiefdom and now because of his delusions the people suffer. This cannot continue."

 AFS_the_false_libertarians:0 "The False Libertarians"
 AFS_the_false_libertarians_desc:0 "The “Libertarians” up north in the great lakes claim they uphold freedom and liberty while in reality they are simply corporate and capitalist interests wearing a new suit. They can cry for freedom all they want but we know they only want to entrench Capitalism deeper and shackle workers."
 AFS_take_down_trumps_quote_on_quote_democracy:0 "Take Down Trump's "Democracy""
 AFS_take_down_trumps_quote_on_quote_democracy_desc:0 "Trump claims he is the legitimate government and he is truly democratic opposed to the democrats dictatorship? But if he really? Turning blind eye to extremists? Harmful rhetoric? Lining his pockets to lobby money? Causing our country to break into pieces and sending his rabid followers to start a war? Tell me does this sound like a democracy to you? No it is nothing more than an oligarchy wearing a mask of righteousness."
 AFS_liberal_authoritarianism:0 "Liberal Authoritarianism"
 AFS_liberal_authoritarianism_desc:0 "The autocrats up in DC claim to uphold freedom. Meanwhile they hold the heart of American capitalistic cancer. All their claims for progress and liberalism are just lip service to keep us numb and quiet. Calling whoever that criticises them as extremists and non American. We are not blind, we see through their fake smiles and promises."
 AFS_the_dawn_of_anarchism:0 "The Dawn of Anarchism"
 AFS_the_dawn_of_anarchism_desc:0 "The main contenders of the American Civil War have been conquered and now we stand as the biggest and the strongest state within the former US. Many have said we would fail, we have proved them wrong once again!"

 AFS_the_ride_into_the_desert:0 "The Ride Into the Desert"
 AFS_the_ride_into_the_desert_desc:0 "Out here there are only 2 things: sand and insanity. From Nazis, to Commies, to Crazed Mormons this barren land has fell victim to the worst the statists have to bring against the people. We will cross the Mojave like a legion of old, to free the land from the statist yesmen and their corrupt system where the house always wins. Its time to watch the house burn."
 AFS_rocky_mountains_liberation:0 "Rocky Mountain's Liberation"
 AFS_rocky_mountains_liberation_desc:0 "The last of Trump's followers are now fortifying in the mountains. But that won't do anything against our liberation of the Rockies! even if our little ponies may not handle these mountains."
 AFS_communist_oppressors:0 "Communist Oppressors"
 AFS_communist_oppressors_desc:0 "Throughout history we can see communism has been nothing more than a corrupt oligarchy wearing a red coat. Countless innocents were murdered and jailed by them. And now they are trying to claw their way into the United States. We will not let them pass. We had stopped communism back in the 1990s and now we will do it again."
 AFS_californian_anarchist_cooporation:0 "Californian Cooperation"
 AFS_californian_anarchist_cooporation_desc:0 "The people of California have overthrown the previous government and have brought anarchism to the West Coast, and we must work with them to liberate America from tyranny."
 AFS_water_ponies:0 "Sea Ponies, To the Pacific!"
 AFS_water_ponies_desc:0 "Our liberation isn't only for those living in the continental US. Our mission extends to people oppressed by the Juntas in the former US Pacific territories, too. Like the great sea ponies we will march through the sea and fight."
 AFS_liberation_of_the_forests:0 "Liberation of the Forests"
 AFS_liberation_of_the_forests_desc:0 "Oh, the beautiful lands of Cascadia, once the capital of anarchism and anti-fascism in America, are now under the control of tyrants. We must liberate Cascadia from them and restore the lost capital of anarchism."
 AFS_riding_down_south:0 "Riding Down South"
 AFS_riding_down_south_desc:0 "Kanye Ke I don't know how but somehow has managed to lead the south even while only paying attention to his music career. Honestly I respect him for being able to pull such a feat off. But shame we will have to take him out. He has allied with the vile KKK and equally as violent ethno-nationalist Black panthers. Our new America has no place for extremists and racists like them. The South will fall again and we will make John Brown proud!"
 AFS_together_with_cornel_west:0 "Together With Cornel West"
 AFS_together_with_cornel_west_desc:0 "Cornel West, a fellow anarchist, is now the leader of Texas and is willing to work with us in our mission to free America from tyranny!"
 AFS_the_ride_to_austin:0 "The Ride to Austin"
 AFS_the_ride_to_austin_desc:0 "The oil barons and corrupt politicians have secured their control over Texas and have enslaved their people. Fortunately, we and our little ponies are coming to free the people of Texas and break their chains! and disband the statist government."
 AFS_the_oppressive_rulers_of_flordia:0 "The Oppressive Rulers of Flordia"
 AFS_the_oppressive_rulers_of_flordia_desc:0 "The Autocrats in Florida are the worst of the worst. Online crazed radical teens, mentally insane children, corrupt politicians and clowns with very questionable pasts. Florida will not continue to suffer under them. They will be free and united."
 AFS_unification_under_the_banner_of_anarchism:0 "Unification Under the Banner of Anarchism"
 AFS_unification_under_the_banner_of_anarchism_desc:0 "We have finally reunited America from its tyranny, and now, the people of America are free from their chains! And with this, Vermin Supreme must help us rebuild America and reconnect with the rest of the world and, eventually, spread anarchism across the world! But for now, let's try to get back on our feet."

 #Vermin Post-Unification Tree
 AFS_formalize_the_anarchist_internationale:0 "Formalize the Anarchist Internationale"
 AFS_formalize_the_anarchist_internationale_desc:0 ""
 AFS_meet_with_anarchists_worldwide:0 "Meet With Anarchists Worldwide"
 AFS_meet_with_anarchists_worldwide_desc:0 ""
 AFS_arm_the_freedom_fighters:0 "Arm the Freedom Fighters"
 AFS_arm_the_freedom_fighters_desc:0 "Freedom has been achieved on the home front but worldwide our brothers continue to be oppressed. With our huge stockpile of weapons produced by us we will aid our friends in their struggle against oppression."
 AFS_true_liberty_across_america:0 "True Liberty Across America"
 AFS_true_liberty_across_america_desc:0 "Vermin has bestowed real freedom to all those in the American continent. No more we will lay down and bend the knee. We stand tall, happy, and proud, knowing true freedom and not the fake lies that were given to us years ago."
 AFS_putting_the_individual_first:0 "Putting the Individual First"
