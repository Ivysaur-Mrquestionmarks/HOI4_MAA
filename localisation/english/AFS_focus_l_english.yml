 #Hawkins Hawkins Tree
 AFS_for_terra_and_humanity:0 "For Terra And Humanity"
 AFS_for_terra_and_humanity_desc:0 "A true Green government has been finally forged from the ashes of old America.Our crusade is against those who dare to pollute the planet and destroy human equality and progress. And this time we will make sure our plans work fully."
 AFS_authority_to_hawkins:0 "Authority To Hawkins"
 AFS_authority_to_hawkins_desc:0 "For the Green movement to remain stable and not fracture into cliques a centralized authority figure needs to be in place and who is in a better position to do it than Hawkins himself. He is the face of the American Green Party and the vanguard of the new Green Movement."
 AFS_ensure_loyality_and_order:0 "Ensure Loyalty And Order"
 AFS_ensure_loyality_and_order_desc:0 "We can't let ourselves be compromised by opportunists and anarchic rabbles. Everyone must be loyal to the government to ensure stability. Crime and disorder will be clamped down upon to maintain peace."
 AFS_censor_the_cilimate_deniers:0 "Censor The Climate Deniers"
 AFS_censor_the_cilimate_deniers_desc:0 "We tried to reason with, we tried to show them the statistics but they didn't listen. All too happy to have their lines filled with Oil barons. That ends now. They can scream and shout all they want but their voice will no longer be given an outlet to spread lies and poisonous thoughts."
 AFS_normalize_authoritarianism:0 "Normalize Authoritarianism"
 AFS_normalize_authoritarianism_desc:0 "What's wrong with a little bit of Authoritarianism? Are you a criminal? No, of course not. Why should you be scared? The government is here to protect us! It's their job to keep us safe. We shouldn't worry about what they do, they are expecting no? Just stay calm and go on with your day and let the government handle your problems. It's for our own safety."
 AFS_eco_socialist_ideals:0 "Eco-Socialist Ideals"
 AFS_eco_socialist_ideals_desc:0 "Our ideals are one of ending greed and protecting the environment, but these ideas aren't only for a select few to have. It must be taught to the future generations so they may not repeat the mistakes of the past."
 AFS_implement_a_social_credit_system:0 "Implement a Social Credit System"
 AFS_implement_a_social_credit_system_desc:0 "It would be a lie if we said humans naturally want to do good. Without incentive no one would do anything. Good behaviour is nurtured by giving rewards. How kids and dogs are given treats for following rules. We can implement a system where by hard work, collaboration and good behaviour the citizens can earn points or credits which will open up more and more perks for them. It will not only idealize good citizens but also foster a mentality of growth and working hard."
 AFS_gain_omnipresence:0 "Gain Omnipresence"
 AFS_gain_omnipresence_desc:0 "Rebellion and dissent grows in dark corners where cannot reach, these voices can grow larger and larger like a virus infecting our people. Simply beating them back when they reveal themselves is not enough. We need to expand our reach to each and every corner of existence. Even the slightest hint of rebellion will be squashed the moment it is born."
 AFS_tackle_cilimate_disinformation:0 "Tackle Climate Disinformation"
 AFS_tackle_cilimate_disinformation_desc:0 "Climate disinformation is still a major problem currently. Either it be some rich oil baron or price paying someone to spread lies or willingly ignorant people being stuck in the past. Disinformation is simply that, lies. And spreading such lies is a crime because it goes against our government."
 AFS_the_invisible_eye:0 "The Invisible Eye"
 AFS_the_invisible_eye_desc:0 "Constantly looking over people without subtlety can cause great distress upon the person, and can also make them aware of us, empowering them to find new ways to evade our sight. Surveillance needs to be more hidden, more in planesight but not out in the open. Any normal person won't cause problems if he knows he's being watched and won't be distressed when the camera watching and monitoring his every move is tucked away out of sight."
 AFS_establish_a_meritocracy:0 "Establish a Meritocracy"
 AFS_establish_a_meritocracy_desc:0 "Autocracy, while good for control, eventually causes distress and distrust upon the rulers which may spill over into total chaos. Simply look at the US. On the opposite side democracy while supporting freedom also leaves room for opportunists and corrupt figures to foster. But in a society governed by merit. Power and influence doesn't come from strongmanning or getting votes from the uneducated. But power is given to those with proven high intellect and efficiency in governance. A meritocracy will also foster intellectual growth in our citizens."
 AFS_entreach_our_ideology:0 "Entrench Our Ideology"
 AFS_entreach_our_ideology_desc:0 ""
 AFS_the_workers_green_new_deal:0 "The Workers Green New Deal"
 AFS_the_workers_green_new_deal_desc:0 "The original Green New Deal didn't go well in the old US, it countered numerous hurdles, critics and lobbyists. But now that we have full control this new and improved GND will help not only the environment but also squeeze out economic inequality and upcharge economic growth."
 AFS_stability_across_ohio:0 "Stability Across Ohio"
 AFS_stability_across_ohio_desc:0 "Relative peace and stability has finally come again to Ohio and the other states under its control. The road here was long and hard but it was worth all the wait."

 AFS_transform_ohio:0 "Transform Ohio"
 AFS_transform_ohio_desc:0 "The current state of Ohio and other territories within the AFS is terrible and is completely contradictory to our plans. If we are to rebuild and regain our strength this issue needs to be ratified."
 AFS_bio_cities:0 "Bio-Cities"
 AFS_bio_cities_desc:0 "Many industrialists and urbanists always think of nature as a hurdle they need to overcome. But no, the answer is not complicated. By making our infrastructure in a way so that it lives in harmony along with plant life and bio diversity around it we can cut down on the worry of dealing with forests and trees being cut down. It also provides a clean and healthy environment for those living near them."
 AFS_the_future_of_urbanization:0 "The Future of Urbanization"
 AFS_the_future_of_urbanization_desc:0 "If you asked someone to think of Urbanization, many would think about boring blocks of soulless houses stacked on top in fields that used to be sprawling forests. But it doesn't have to be that. We will fix the flaws in Urbanization to ensure maximum citizen happiness and environmental protection."
 AFS_threats_to_the_planet:0 "Threats To The Planet"
 AFS_threats_to_the_planet_desc:0 "Be it oil barons and prices, reckless car enthusiasts, unclean industrial practices, throwing garbage in open areas and dumping chemicals in the water etc pose a serious risk to our planet. Even the mildness of slip up can spiral into a whirlwind of chaos."
 AFS_seizing_the_means:0 "Seizing The Means"
 AFS_seizing_the_means_desc:0 "Untimately the state is the one who's in charge of governance and private individuals are simply not trustworthy enough to be let into the economy. Old America is a good example of that. So taking direct control over the economy is the next logical conclusion because it will also allow us to direct resources more clearly and efficiently."
 AFS_the_energy_of_tomorrow:0 "The Energy of Tomorrow"
 AFS_the_energy_of_tomorrow_desc:0 "As energy technology progresses, old enemy sources like coal and oil start to shift into an old era. Coal and oil drive industries in the past but in the present major strides have been taken to find alternative but still effective sources of power such as renewables, solar, air, hydro and nuclear. These are efficient, clean, safe and keeps our environment pure."
 AFS_environmentalist_socialism:0 "Environmentalist Socialism"
 AFS_environmentalist_socialism_desc:0 "Capitalism strives for endless growth and consumption. It grows like a cancer uprooting all that existed before it. The greed fueled by capitalism also incentivises people to grow uncaring for nature and only to see it as another resource to exploit. And this will end now. We must ensure greed doesn't overcome us and destroy ourselves from the inside. We must protect and care for nature for they are our cradles."
 AFS_end_the_exploitation:0 "End The Exploitation"
 AFS_end_the_exploitation_desc:0 ""
 AFS_learn_from_china:0 "Learn From China"
 AFS_learn_from_china_desc:0 "China has implemented a system where they are able to prioritize economic growth under socialist ideals and proficiently dealing with domestic pollution. Their system is the perfect example for us to learn from. China turning away from fossil fuels and towards green and nuclear energy also made them energy efficient more so in these coming turbulent years. And this is exactly what we are looking for."
 AFS_solar_urbanism:0 "Solar Urbanism"
 AFS_solar_urbanism_desc:0 ""
 AFS_environmentalism_by_force:0 "Environmentalism By Force"
 AFS_environmentalism_by_force_desc:0 "It is sad that no matter how hard we try, we cannot make them see the truth. Either be for personal benefit for entrenched ignorance. Environmentalism for this very reason must be enforced strongly in every facet of society. There shall be no room for planet destroyers."

 AFS_natures_strongest_soldiers:0 "Nature's Strongest Soldiers"
 AFS_natures_strongest_soldiers_desc:0 "When it comes to warfare or human development in general, nature is treated as an obstacle. But unlike them we don't see it that way, nature is our creator and protector and we use its advantages for ourselves working in complete harmony."
 AFS_leave_only_destruction:0 "Leave Only Destruction"
 AFS_leave_only_destruction_desc:0 ""
 AFS_destroyer_of_cities:0 "Destroyer of Cities"
 AFS_destroyer_of_cities_desc:0 ""
 AFS_train_the_children:0 "Train The Children"
 AFS_train_the_children_desc:0 ""
 AFS_leading_earths_salvation:0 "Leading Earth's Salvation"
 AFS_leading_earths_salvation_desc:0 ""
 AFS_anything_and_everything_for_mother_nature:0 "Anything and Everything for Mother Nature"
 AFS_anything_and_everything_for_mother_nature_desc:0 "The enemies of nature are all around us , coming in many colours. Nothing is off the table if it means we can beat these environment destroying, air polluting mongrels back."
 AFS_a_green_internationale:0 "A Green Internationale"
 AFS_a_green_internationale_desc:0 "Our movement isn't solely in America; nationals worldwide have their own versions of a Green party. Co-operation and solidarity is our strong suit and we shall call up all those who support our cause to aid us."
 AFS_blending_in:0 "Blending In"
 AFS_blending_in_desc:0 "Unlike our foes we don't fight back against nature, we use it to our advantage and history has shown us how even a weak unprofessional army can beat up even the strongest of superpowers by utilising mother nature."
 AFS_victory_at_any_cost:0 "Victory at Any Cost"
 AFS_victory_at_any_cost_desc:0 "We will smite the invaders from our skies, they might sweep over us like the sands of winter. But we will not bow before them! Never again we will endure their carelessness and cruelty towards nature. We will strike without warning, without mercy. Fighting as one with nature. We will shatter their corruption and hunt down everyone guilty. And as our last breath tears through their lungs in their cities, we will rise through the depths of the forests and reclaim nature! Sons and Daughters of Green Terra! NOW IS YOUR TIME!"
 AFS_professionalize_the_green_army:0 "Professionalize The Green Army"
 AFS_professionalize_the_green_army_desc:0 "To win the upcoming wars to unify America our army needs to be more than skilled gunmen hiding in bushes. Using the remaining generals and their experiences and teaching our soldiers will understand the ways of tactics, doctrines and working in tandem with the environment."
 AFS_unconventional_and_unethical_warfare:0 "Unconventional and Unethical Warfare"
 AFS_unconventional_and_unethical_warfare_desc:0 "Conventional wars are too messy and resource draining on both sides, turning the battlefield into a slog. While hesitation and holding back during critical times in battle causes victory from being delayed. We need to fight not head on but by exploiting the weaknesses of our enemies and without mercy."
 AFS_childern_of_mother_nature:0 "Youth Indoctrination"
 AFS_childern_of_mother_nature_desc:0 "The minds of kids are malleable and adaptable. In the modern age of the internet children are it's biggest consumers and learners. To take advantage of this fact we will teach them about our ways via online content and nature related videos, vlogs, documentaries etc."
 AFS_eco_militarism:0 "Eco-Militarism"
 AFS_eco_militarism_desc:0 "To protect nature is a task that needs to be upheld every day, every week. Lying idly by in apathy lets bad actors take advantage and abuse nature. We have seen what apathy does. Protecting nature is not a task for only a few, but the duty of each man, woman and child."

 #Hawkins War Tree
 AFS_for_terra:0 "For Terra!"
 AFS_for_terra_desc:0 "We fight Earth and Terra. Our crusade is against climate destroyers and environment destroyers. We fight for equality and the environment. And we are coming for all of you who disrespect nature!"
 AFS_end_the_industrialization_of_west_virginia:0 "End The Industrialization of West Virginia"
 AFS_end_the_industrialization_of_west_virginia_desc:0 "Do you see that? Of course you can't, there's smog covering the whole goddamn horizon. And who is the culprit? The communists in West Virginia. They think that industrializing the whole damn state will save their people from poverty or damnation or whatever the fuck they think of. But what I know, or what WE know, is that they are only dooming the future generations and the future of the planet with their smog and smoke and pollution. They need to be dealt with."
 AFS_chicken_making_tyrant:0 "Chicken Making Tyrant"
 AFS_chicken_making_tyrant_desc:0 "The colonel? Some crazy idiot high on drugs and LARPing in his chicken based fiefdom. He abuses his citizens by hiring blood thirsty and greedy guns for hire. The lives of these abused victims cannot be allowed to be increased. This madness must end NOW."
 AFS_the_green_push_into_virginia:0 "The Green Push into Virginia"
 AFS_the_green_push_into_virginia_desc:0 "Virginia, such a beautiful state, holds many industries that produce way too much pollution, not to mention all the toxic chemicals dumped into its waterways, its time we show them some green, not the drug kind, but natural green. When they see our electric vehicles and their smog slowly disappear, they will be glad we came to liberate them."
 AFS_work_with_virginia:0 "Work With Virginia"
 AFS_work_with_virginia_desc:0 "It seems that environmentalists are now in control of Virginia and have secured their rule, and we obviously have to get into an alliance with them so that we can work together to save the planet."
 AFS_libertarian_climate_destroyers:0 "Libertarian Climate Destroyers"
 AFS_libertarian_climate_destroyers_desc:0 "The Libertarians preach their freedoms and cry for de-regulation but we know what it will cause. Regulation is the thing that keeps their stupid companies from dumping all their trash everywhere. They say we are “treading on their freedom”. Well let them say it more and we will prove them right."
 AFS_false_green_activists:0 "False Green Activists"
 AFS_false_green_activists_desc:0 "Oh you support environmentalism? Funny then. Why did you not speak up when the others tried to expand oil lines and expand strip mining? Oh wait you didn't because you actively supported it. You're nothing more than a fake and fraud keeping up a fake altruistic appearance just so you can secure more votes from people who don't know anything any better so you may get re-elected and continue to enrich your friends. Do you know what we do to scammers and liar? We beat them and let them rot in jails."
 AFS_donald_the_truth_denier:0 "Donald The Truth Denier"
 AFS_donald_the_truth_denier_desc:0 "Donald denies every truth for personal gain or for his arrogance, one of the truth he denies is climate change. Everyone in this world knows climate change is real and works to fix the problem. But Trump and his oil barron buddies only seem to accelerate to the end. He's too dangerous to keep him at it. He needs to be stopped."
 AFS_the_grand_fight_for_terra:0 "The Grand Fight For Terra"
 AFS_the_grand_fight_for_terra_desc:0 "Our Grand crusade for Terra is the most important battle for the survival of nature. If we lose now Terra will continue to be bled dry by greedy hooligans who have no respect for the cradle that gave them life and provided for them."
 AFS_south_rockies_liberation:0 "South Rockies Liberation"
 AFS_south_rockies_liberation_desc:0 "We're now approaching west, and to our west, anti-nature forces are also in control, and we must move to crush them and secure the South Rockies. And no, Ted Kaczynski is not our friend; he doesn't quite fit with our exact view of things."
 AFS_north_rockies_liberation:0 "North Rockies Liberation"
 AFS_north_rockies_liberation_desc:0 "The last bastion of Trump's anti-nature forces is hiding in the mountains, but they won't be safe for long. We will invade them and destroy the last bits of Trumpism and climate denialism."
 AFS_the_greenification_of_california:0 "The Greenification of California"
 AFS_the_greenification_of_california_desc:0 "Years of nonsensical planning, corruption and utter incompetence has led California to almost turn into a wasteland. Where once beautiful glistening lakes are now dried husks, open grass fields now are nothing more than dried up beds of chemical waste. Year after year California catches fire because of their utter lack of foresight and their cities...their cities might as well be Hell itself. Climate change isn't setting California on fire, it's the goddamn bushes those idiots brought from Australia."
 AFS_cleaning_the_ocean:0 "Cleaning The Ocean"
 AFS_cleaning_the_ocean_desc:0 "Unfortunately, the Pacific Ocean has more plastic than any other ocean, and we need to act quickly and clean it, but Hawaii and Alaska stand in our way in doing so, and because of this, we will just have to invade them and destroy the last of the American warlords."
 AFS_protecting_the_forests:0 "Protecting The Forests"
 AFS_protecting_the_forests_desc:0 "The forests of Cascadia is one of the few spots remaining in the United States which still maintained its natural beauty uncorrupted by modern vices. But the rulers over the forest cannot be trusted. They may seem inconsequential now but if we don't act now we might be too late to do anything when they start uprooting the forests."
 AFS_create_a_stable_and_green_south:0 "Southern Devils"
 AFS_create_a_stable_and_green_south_desc:0 "Kanye West and his violent extremists have been destroying the South and bringing it to ruin, and they must be crushed, and we must rebuild the South and restore its environment."
 AFS_end_of_the_oil_barons:0 "End of The Oil Barons"
 AFS_end_of_the_oil_barons_desc:0 "Stupid Texan oil barons, they think they can get away and continue to ruin the environment alone just by declaring “neutrality”? No. No matter what side you take you are still committing a crime against mother Earth, and you will pay for every gallon of oil you suck out of the planet."
 AFS_flordian_greenification:0 "Floridian Greenification"
 AFS_flordian_greenification_desc:0 ""
 AFS_eco_america:0 "Eco-America"
 AFS_eco_america_desc:0 "America, the great giant has woken once more but under our new Green banner. Being the strongest and more influential nation in the world, our green utopia is no longer a distant dream."
 AFS_twilight:0 "Twilight"
 AFS_twilight_desc:0 ""
 AFS_the_south:0 "The South"
 AFS_the_south_desc:0 ""
 AFS_the_north:0 "The North"
 AFS_the_north_desc:0 ""
 AFS_the_world:0 "The World"
 AFS_the_world_desc:0 ""

 #Hawkins Post-Unification
 AFS_organize_a_legitimate_government:0 "Organize a Legitimate Government"
 AFS_organize_a_legitimate_government_desc:0 "Since we have unified most of the remnants of the world government have been dissolved or destroyed. If we are to be taken seriously by other nations a new proper legitimate government must be created."
 AFS_become_the_dragon:0 "Become The Dragon"
 AFS_become_the_dragon_desc:0 "When Mao had died in 1976 many thought China would continue to be the same massive but ultimately a backward nation. But the ascendancy of Deng Xiaopeng and his reform broke all such notions. He showed the world how economic and social growth was still possible while continuing to maintain stability across the nation. After his passing China marinated it's growth as it now stands as the 2nd greatest World power...before the whole US civil war thing. We need to take back our spot on the world stage and why try to figure out a new way when we can just copy from the successful power."
 AFS_continue_our_socialist_utopia:0 "Continue Our Socialist Utopia"
 AFS_continue_our_socialist_utopia_desc:0 "There will be no revision to our established plans. There will be no compromise for our Green Socialist Utopia. We are unique and the most successful Green state on this planet and we will keep it that way."
 AFS_open_up_to_the_dragon:0 "Open Up To The Dragon"
 AFS_open_up_to_the_dragon_desc:0 "Allthough China initially supported the West Coast communists during the start of the civil war they had no close relations with us. We might have ended the Californian breakaway but China seemed has not care much when it happened resulting in no bad blood between us. Since we share the same ideals as them and to not follow in the footsteps of previous leaders, opening up China will be of great help. Besides their investments and co-operation with us will help us recover faster from the civil war, promoting peace and solidarity."
 AFS_green_world:0 "Green World"
 AFS_green_world_desc:0 "The ideals of a clean society, anti-over consumerism and social equality can't prosper if it only exists in one spot. These ideals should be allowed to spread and gain prominence all over the world. The future generation must be taught to care for nature, care for each other. Because only with care and co-operation can the dream of a Green Utopian world begin."
 AFS_reconnect_with_the_international_community:0 "Reconnect With The International Community"
 AFS_reconnect_with_the_international_community_desc:0 "Rebuilding and fighting each other has taken its toll on America, we have practically been isolated for a decade or more. But in the modern age it won't work. Reconnecting with old friends and allies will help retake our spot and put back old positive relations in place."

 #Mattis Tree
 AFS_mattiss_victory:0 "Mattis's Victory"
 AFS_mattiss_victory_desc:0 "My whole life I have served weak men. Politicians in uniform, never possessing the character this Nation demanded. They called me 'Mad Dog' they called me 'Chaos.' Now they will see what Chaos I can truly render. From this Chaos, I will build a new America. An America with the character and determination to win the wars to come. I have always lived my life by simple motos and creeds, by standards instilled in me by the Corps I love so dear. I must bring those standards to the nation... and if they can't meet those standards... \n\nThere are just some assholes in the world who need to be shot."

 AFS_militarize_the_nation:0 "Militarize The Nation"
 AFS_militarize_the_nation_desc:0 "While I fix the issues of our greater society, I must not neglect the armed forces that will carry our banner to victory. We must provide the brave men and women who shall take up this noble cause all the support they need. All resources, all able bodied persons, and all our weight shall be thrown behind the might of our Armies. We shall not be just a nation. We shall be an Army."
 AFS_to_serve_mattis:0 "To Serve Washington"
 AFS_to_serve_mattis_desc:0 "Washington, the great and noble warfighter. His visage shall stir the hearts of all those able to fight. He once led farmers and clerks to war against the might of an empire. Now I shall too bear the mantle of our great father and begin the great experiment anew. The soldiers, the Marines, the Airmen and the Sailors shall not be serving just me. No. They shall serve Washington, his spirit born anew with the resurrection of his great crusade."
 AFS_war_with_reason:0 "War With Reason"
 AFS_war_with_reason_desc:0 "The greatest weapon a soldier has is between his ears. Any moron with a gun can kill a man, it takes one with brains to truly frighten his enemy. I want my men to strike fear, to kill with a furious rage and skill that no one shall stand against. But first, as he must sharpen his bayonet, he must sharpen his mind. Already, my reading lists have been sent. Meditations, The Art of War, and many others shall become mandatory reading. Not just for my officers... no... for all my troops. They shall sharpen their minds as I have... This will give them spirit, a willingness to kill for his country. \n\nA nation must be prepared for war, and I shall prepare her."
 AFS_columbias_call:0 "Columbia's Call"
 AFS_columbias_call_desc:0 "Columbia, your majestic banner ever flowing in the breeze. I hear your voice upon the wind, your words sweet and soothing to this old Marine. We will march forth o' Columbia, your flag unfurled in the winds of a changing nation. I shall answer your call. I shall respond to your call for aid!"
 AFS_live_by_the_sword:0 "Live By the Sword"
 AFS_live_by_the_sword_desc:0 "We must live by the very standards set by our times. All of our citizens are warriors waiting to . Society must be prepared, the camps shall prepare them. They must be armed, the factories themselves instruments of the Great Experiment. A nation of warriors, ready for the coming war."
 AFS_the_necessary_measures_for_victory:0 "The Necessary Measures for Victory"
 AFS_the_necessary_measures_for_victory_desc:0 "Fear is not a word I know... it is not a word my Marines shall know. But my enemies. They shall know fear. I have given the orders, we are to kill every last son of a bitch who stands in the way of our Great Experiment. No prisoners from the weak, no soldiers unfit to serve. We shall use every last measure to ensure our great victory. The Great Experiment must succeed."
 AFS_soldiers_of_strength:0 "Soldiers of Strength"
 AFS_soldiers_of_strength_desc:0 "Pussies in suits ruined the fighting men of America. Softened their training, made them weak. I shall reverse this. My analysts... the ones I haven't added to the lists anyhow, have warned me this will increase attrition from training, lower the number of my fighting men. They are morons. Men without the conviction to see the genius of this plan. I'd rather fight a war with a hundred hard killers, than with a thousand soft handed men who will shrink from the occasion. \n\n“Get the Drill Instructor manuals out, we are going to be changing a few things...”"
 AFS_made_of_steel:0 "Made of Steel"
 AFS_made_of_steel_desc:0 "I make killers, not paper pushers. Through reform my men are becoming hardened fighters, not the soft minded soldiers being churned out by our weak neighbors. We have honed their bodies, their minds, their hearts for the coming fight. Our men, made of steel will smash anyone who stands in my way."
 AFS_discipline_is_the_soul_of_an_army:0 "Discipline is the Soul of an Army"
 AFS_discipline_is_the_soul_of_an_army_desc:0 "The standards that I live by are the same standards that built the greatest fighting force the world has ever seen. Discipline, hones those standards, sharpens them like a great blade. Standards are the heart of an army, but discipline is it's soul. I read in a book a tale of decimation, when a squad fails, there is no reason to waste 10 good men, when you can make an example of one...  The Great experiment demands sacrifice for the greater good, to put the strength of ones virtues and determination to the test. I will test their discipline. \n\n“We are reintroducing flogging, inform the generals.”"
 AFS_novus_continental_army:0 "Nova Exercitus Continens"
 AFS_novus_continental_army_desc:0 "Through the mud and blood of the new training camps I have forged the fighting men of this nation into something truly magnificent. They did not freeze in the hills of Pennsylvania, but these men have fought through their own valley forge. I am their new Washington, and they, my new Continentals."
 AFS_forged_in_the_fires:0 "Forged in the Fires"
 AFS_forged_in_the_fires_desc:0 "A true measure of a soldier's capability must come in the face of true danger. We shall test the very limits of our men. Push them beyond what they thought possible. Some may die, true. But in the end, I will have Marines and Soldiers worthy of fighting through hell and able to yank the ass hair off the Devil. We shall forge them for our great experiment, make instruments of war bred to kill. \n\n“Call the department of defense, I want live fire drills, knife fighting drills, and I want them to feel pain. Pain breeds Marines worth having.”"
 AFS_ai_military_integration:0 "A.I Military Integration"
 AFS_ai_military_integration_desc:0 "Artificial Intelligence has proven to be a boon to our outnumbered army. Small and fierce we may be, the supplementation of armed troopers with Advance A.I. Drone technology will help us crush the false Presidents and those to our south. Our Army shall be unrivaled, they shall know fear."
 AFS_destory_their_will:0 "Destroy Their Will"
 AFS_destory_their_will_desc:0 "I have already made my mandates clear, my demands obvious. They have rejected me. They have turned me away. They rejected peace. So now, I will blow them off the face of the fucking earth. They will know fear... They will know Chaos"
 AFS_unrestricted_research:0 "Unrestricted Research"
 AFS_unrestricted_research_desc:0 "Science and Reason can be the greatest ally in war. I will harness this power for the Great Experiment. I have ordered those on the lists be used as needed. In death, they will be patriots for the cause. What can harden a man's skin to cold and heat, what chemicals can eat the skin off his hands. Can a man be melded with mechanics to truly become something superior. These new patriots will help us find out. Science and reason will guide us to victory."
 AFS_the_future_is_present:0 "The Future is the Present"
 AFS_the_future_is_present_desc:0 "When I joined the Corps they handed me a rifle. A rudimentary tool like any other. A harvester of souls in the hands of Uncle Sams Bastards. The Marines have harvested souls with rifles for over two hundred years, and we shall continue to do so. But now we will also use the tools of a modern age. As our grandfathers swapped his horse for a tractor, we shall now trade in the obsolete weapons of war, and wield the next generation of tools the Marines shall need to bring in the newest crop..."

 AFS_restart_the_american_experiment:0 "Restart the American Experiment"
 AFS_restart_the_american_experiment_desc:0 "I remember my oath to this nation. I remember it quite fondly. When I made that oath for the first time, my life changed forever, and I began to serve a greater purpose. Now, I am once more called by the nation I love to serve an even greater purpose. The great experiment that I've served has been betrayed and halted by the incompetence of weaker men, it is now my duty to begin that experiment anew, to begin the rebirth of the nation I so love."
 AFS_societal_control:0 "Societal Control"
 AFS_societal_control_desc:0 "If I am to save this country, this country needs to change. The standards and demands of a regimented life must be established if we are to succeed. People will resist, it is the nature of those without discipline. So I will establish discipline in the streets, in the schools, and in the day to day life of the people I must protect. Standards must be maintained after all."
 AFS_exterminate_societal_corruption:0 "Exterminate Societal Corruption"
 AFS_exterminate_societal_corruption_desc:0 "My attempts to restructure our great society are thwarted by those that wish to hold back our great experiment. The anarchist remnants, the tree hugging buffoons, all of them standing in the way of progress. They are corrupted to their very hearts by anti-American thoughts. We must remove this threat to the experiment. By any means necessary. It makes my heart heavy, but I will do what I must..."
 AFS_novus_patriotism:0 "Nova Patriotismus"
 AFS_novus_patriotism_desc:0 "A nation of patriots, a nation of soldiers. That is what we need to win the coming war. A Marine can carry the best rifle, the most grenades, and the most resistant armor. But if he does not believe in the war he is fighting, he can lose to the most rudimentary militiaman. I will not allow this to happen. We must weed out the false patriots, those who stood in the way of our initial progress, or didn't move with the speed it required. Patriotism should no longer be a measure of one contentment with their country, but a measure of how willing they are to kill for it. \n\nTo the False Patriot we must expect only one thing... a swift and easy exit from life."
 AFS_followers_of_washington:0 "Followers of Washington"
 AFS_followers_of_washington_desc:0 "I stared at his portrait for hours. Outside of my office, the sound of countless booted feet on drill seemed rhythmic and peaceful. It gave me the peace I needed to reflect on the steps I am taking to fix our nation. How did you do it? Washington, an aristocrat but beloved by the people. He made this nation. How am I supposed to follow in your footsteps? We must all embody his courage, his commitment to standards of excellence. I must be more like Washington. \n\n“Make sure Portraits of the First President are sent to all Military Offices and Schools in the Free State. Mandatory display... We need him.”"
 AFS_restore_the_soul_of_the_republic:0 "Restore the Soul of the Republic"
 AFS_restore_the_soul_of_the_republic_desc:0 "This nation used to be built upon principles of sacrifice, duty, and an honorbound dedication to preservation of our great experiment. We must instill this spirit once more. This very soul of sacrifice and dedication must be drilled into the populace at all turns. A cult of duty must be born. It must start with our children, with the next generation of warfighters and peace keepers. And I think I know just how to do it... \n\n“Lets standardize the JROTC, if they are old enough to wear a uniform, they are old enough to understand their duty to the country.”"
 AFS_stratocratic_authority:0 "Stratocratic Authority"
 AFS_stratocratic_authority_desc:0 "The civilians failed us. In Vietnam they betrayed us. In Korea, our Marines froze in a war that cowards would not let us conclude. In Afghanistan and Iraq, civilians in suits told warfighters how to fight an enemy that they themselves had never seen. Civilians are what failed this nation. Only I can fix this. This shall no longer be a nation built upon the principles of the weak, and undisciplined. We shall adopt strict standards. And even stricter laws. We must secure a nation of warfighters, of men dedicated the god of war and death, not to greed and cowardice... Maybe Starship Troopers had a good idea... \n\n“Make the announcement, if you want to vote, put on a uniform. No cowards in my nation.”"
 AFS_novus_ordo_seclorum:0 "Novus Ordo Seclorum"
 AFS_novus_ordo_seclorum_desc:0 "A New Order of the Ages... The reverse seal of the country has now fallen into disrepair and disarray. But it means more to us than any of those false states who tear at the Fabric of Lady Liberty's cloak. I must remind this state of our mission. Of our purpose and great crusade. Once I led Marines into the desert to die for politicians who cared little for the lives of midwestern farm boys and young men with dreams. Now I lead those Marines against the same politicians who have torn their birthright from their hands. We are the harbingers of a new order. A great horde of men dedicated to restoring the greatness of this nation. We are The New Order."
 AFS_father_of_the_country:0 "Father of the Country"
 AFS_father_of_the_country_desc:0 "Some would say I have earned the title of the Mad Dog in attempts to destroy the power of the entrenched bureaucrats. I hated that name, but now... I don't know... Father of The Country. Leader of the New Order. A Marine is above self aggrandizing titles, but what if thats what this country needs. A man to bring others to heel, a father to steer errant children... \n\nI am the Father of a New America... and I must guide my children"
 AFS_governmental_cleansing:0 "Governmental Cleansing"
 AFS_governmental_cleansing_desc:0 "As I have done with the civilians, I now must do with the politicians. Many have taken to groveling at my boots to keep their jobs and what little power they think they still have. What cowards, I may have respected them more if they had been men about it and stood for what they thought was right. But no, they turned to ass kissing and bending at every twist and turn as if to show their morals were just as flexible. Already I've ordered the Marines to occupy the halls of government. I am not cruel, I do not push the limit of whats necessary. Many of those disgraceful suits will be given a chance to serve a greater purpose. Those worthy shall wear the uniforms of the nation, proudly serving their country. Others though... those that can't adapt to coming tides of war... well they will discover there is no worse enemy than a United States Marine."
 AFS_strength_and_virtue:0 "Strength and Virtue"
 AFS_strength_and_virtue_desc:0 "I have always told my men the greatest tool in warfighting is the one between their ears. We must breed strength, duty, and intelligence into our future leaders. I will be the harbinger of a new generation of American leaders and men. All across my controlled states, I have ordered copies of Meditations, by the great leader Marcus Aurellius, to be issued to all highschoolers and soldiers. We must instill the lessons of strength and virtue into our next generation, and they will learn to adopt the warrior ethos we need to win the wars to come."
 AFS_make_our_nation_safe:0 "Make Our Nation Safe"
 AFS_make_our_nation_safe_desc:0 "With my attempts to restructure our broken society, I have flushed the most degenerate of our society to the forefront. Under the lights of my new government, we must squash these threats to stability and order. They must be made to understand the standards. But who shall enforce these standards, who can I rely on to make sure these standards are not wavered from or broken? I can rely on the Corps, or what I have left of it. The last bastion of sane, strong men in this nation can be built into something even stronger... \n\n“Call the Commandant, I want Marines patrolling the streets within twenty four hours, this should give me time to think.”"
 AFS_urban_protectors:0 "Urban Protectors"
 AFS_urban_protectors_desc:0 "I put my Marines on the streets, and the reports I have received disturbs me. Flag burners, false patriots, assaults in the street. Those anarchists destroyed the fabric of our society. I must now restore it. I will unleash my dogs of war, unbound our peace keepers from the shackles of bureaucracy and let them loose upon those who would pull our nation back from greatness. A new Justice Department shall be formed, with men to act as Judge, Jury, and Executioner. The civilian must come to respect our power, not thumb his nose at the thought of it. \n\n“Cry Havoc and Let Loose the Protectors of My People”"
 AFS_show_them_discipline:0 "Show Them Discipline"
 AFS_show_them_discipline_desc:0 "There are those 'not on the list' that we can save. It will be harsh, but they will know the consequence of failure. We can not tolerate the weak, those who will stand in the way of my mission. Across my territory camps are being established, Drill Instructors Trained. We will turn every man, every woman, any child above sixteen into the Americans we need. Not all will survive, but those that do will have earned the title of Citizen."
 AFS_the_people_are_not_to_be_trusted:0 "The People Are Not to be Trusted"
 AFS_the_people_are_not_to_be_trusted_desc:0 "Civilians... ignorant sheep following the will of the latest trends. They are undisciplined hordes, unfit to bear the burden of military service. There are some that we can fix, that we can turn into the soldiers the New America will need. But others... they are stalling the experiment. They thumb their noses at me. While my Judicial Police Forces have done great at weeding out the worst amongst them, there are those that hide in the shadows. I do not fear them, a Marine does not know the word fear. I only see a new obstacle to overcome... \n\n“Call the Commissioner of the JPF, I want lists drawn up and names erased as need be.”"

 AFS_rebuild_the_abandoned_factories:0 "Rebuild Abandoned Factories"
 AFS_rebuild_the_abandoned_factories_desc:0 "A nation cannot march to war with pens and good intentions. If I am to save this country I must begin producing the means in which I will do it. Carter, that stupid blowhard, moved many of our factories overseas. But, the shells of America's industrial might still exist, rotting monuments of brick and mortar. I, James Mattis, will bring a new dawn of American Industry. \n\n“Use the prisoners to start rebuilding, I want to see guns on assembly lines within two months.”"
 AFS_rust_belt_rejuvenation:0 "Rust Belt Rejuvenation"
 AFS_rust_belt_rejuvenation_desc:0 "I did it. In a combined effort, overseen by the brightest minds of the Marine Corps, and to a lesser extent, the Army, we have rebuilt the pride of America's economy. While the civilians must wait to reap the rewards until the end of our great struggle, we may now begin the process of arming our troops for the coming war. With the false Presidents on either side, we must have the best equipped, best trained, and most elite fighting force in the world... but first, they need guns. But something is beginning to eat at me... I think I know what it is... \n\n“... What was the name of the Army Engineer who rebuilt that munitions plant in Cleveland... monitor him, I don't like how he dragged his heels.”"
 AFS_economic_militarization:0 "Economic Militarization"
 AFS_economic_militarization_desc:0 "What use is money to a soldier? A Marine? Hell, a sailor only needs money for booze. I can fix this. We shall do away with antiquated currencies, we shall prepare the populace for war. They will hate me, but they will respect me. I will issue war bonds, implement a war tax, and issue new script for food and goods. We shall use what remains of our monetary stock to finance the coming storm of war. An army fights a war with guns and artillery. A nation shall fight one with austerity."
 AFS_built_to_perfection:0 "Built to Perfection"
 AFS_built_to_perfection_desc:0 "With our rebuilding of the American War economy, I have done what no great President has done before. I cut through the bullshit and built a functioning industry. My factories produce more ammunition, more uniforms, and more helmets than the false states too our south, and rival those to our east and west. We have built a perfect military industry, free from the greedy hands of politicians or warhawks. It takes a military man, to know what a military truly needs. \n\nI built this... not them"
 AFS_new_american_architecture:0 "New American Architecture"
 AFS_new_american_architecture_desc:0 "They are calling me a fool. Well they did is the proper word. Insubordination in the ranks isn't tolerated after all. Every piece of architecture, every building, home, and apartment is a fortress. All shall serve their purpose. Citizens, those not drafted into our armies are to be stalwarts of resistance to our enemies. Churches with Machine Gun ports in their windows, a Presidential Palace with Artillery Fixtures. We are not just a nation of soldiers and patriots. We are a fortress ready to destroy any son of a bitch who gets in our way, or tries to destroy the Great Experiment. No more useless pageantry. \n\nEven a building can be a patriot in my America"
 AFS_nationalize_military_industries:0 "Prioritize Military Industries"
 AFS_nationalize_military_industries_desc:0 "A nation preparing for war cannot be tied to the luxuries of a foregone age. They laughed at me when I told them to stop making toasters. They asked if I was kidding. They said the people would be furious, that they would riot. But my Marines kept them in line. We cannot waste resources on petty luxuries and unnecessary goods. The people may barter with what they have as they please, but all assembly lines must work for the great experiment, the great experiment must succeed."
 AFS_industrielle_america:0 "Industrielle Ohio"
 AFS_industrielle_america_desc:0 "We cannot exist alone on the factories the cities offer. While we have done wonders in expanding our military industry, the question remains of how much further can we go. I have ordered all property not used for practical purposes be seized. Museums have been emptied, useless call centers repurposed. They shall all be turned into factories of war. Producing the tanks, aircraft, and artillery the Great Experiment demands. \n\nThe Great Experiment Demands It"

 #Mattis War Tree
 AFS_no_one_to_trust:0 "No Person to Trust"
 AFS_no_one_to_trust_desc:0 "We did it. Our nation of warriors and stoics has been secured. However, threats to my Great Experiment exist everywhere, all along our borders. Weakness seeks to destroy the discipline and standards that only the blood of true patriots could truly possess. I must continue in my great crusade, the Great Experiment must expand. It is our manifest destiny. It is the dream of Columbia."
 AFS_the_fried_chicken_fanatic:0 "The Fried Chicken Fanatic"
 AFS_the_fried_chicken_fanatic_desc:0 "Fried Chicken, the bane of any man who desires his men to be fit and prepared for war. This stain of nazi adjacent bullshittery will be crushed under the boot of our troopers. We will cut the fat from the chicken. The Great Experiment must march forward..."
 AFS_the_false_savior:0 "The False Savior"
 AFS_the_false_savior_desc:0 "The hackling blowhard upstart... he is weak... undisciplined. He lacks standards, conviction. He is the antithesis of what it means to be strong. He stands in the way of the Great Experiment. His idealism and radical degenerate behavior must be crushed... Columbia demands it."
 AFS_bloody_virginia:0 "Bloody Virginia"
 AFS_bloody_virginia_desc:0 "In our first Civil War, we scorched the south. But we left out Virginia. I will not make the same mistake. They are but a thorn of resistance in the face of my men, disciplined and steeled for war. We have to bring the Virginians back under the watchful gaze of Columbia and Her Great Experiment. My great experiment..."
 AFS_libertarian_degenerates:0 "Libertarian Degenerates"
 AFS_libertarian_degenerates_desc:0 "I've cured the Virginians of their weakness, heeled the dogs of West Virginia and put them in the mines to serve the cause of The Great Experiment. I cut the wings from the Chickens back and hung the Colonel out to dry. But my mission is not over. I hear her sometimes... her voice is clear and pure. Columbia calls for me, yearns for her children to be brought back. She demands discipline, she demands The Great Experiment marches forward. Her errant children of the Great Lakes must be shown the meaning of discipline."
 AFS_one_final_battle:0 "One Final Battle"
 AFS_one_final_battle_desc:0 "I fought you where I had too. You never listened to me. You never took my advice. You thought you had all the answers. You're nothing to me. Nothing but a blowhard. I dug my heels with you. I served weak men, I served them well. But you... you're not weak. You're arrogant... you're prideful. A weak man can be made to see the virtues of strength... but a prideful one must be shown the consequence of ego... Columbia demands it"
 AFS_taking_back_whats_ours:0 "Taking Back Whats Ours"
 AFS_taking_back_whats_ours_desc:0 "Weak... weak... you ruined this nation. Burned her banners, and for what? What do we have to show for it? Columbia mourns her lost sons and daughters, dead because the weak could not fathom to negotiate with the arrogant. I will teach the Arrogant humility, but I must teach the weak to see the virtues of strength. I will show them the virtues of discipline, of standards. I will bring them to see the beauty of Columbia's Great Experiment. I must... I must... I will show them fear..."
 AFS_unification_or_extinction:0 "Unification Or Extinction"
 AFS_unification_or_extinction_desc:0 "I once told a group of sheep herders that if they fucked with me, I would wipe them off the face of the earth. Now I must make a similar threat to the false pretenders across this country. They will bend the knee or face the wrath. I am disciplined Chaos, the New Washington, the harbinger of a new Great Experiment, and they will know that I am Mad Dog, they will know my name..."
 AFS_southern_hell:0 "Southern Hell"
 AFS_southern_hell_desc:0 "In our first great civil war, we destroyed them once. Put their men in the ground through four years of bloody fighting. But I must finish what the Great Sherman started. I will embody his great moto, war is hell. I will bring hell to the south, and burn it to the ground."
 AFS_the_end_of_texan_independence:0 "The End of Texan Independence"
 AFS_the_end_of_texan_independence_desc:0 "Columbia calls once more for her errant sons and daughters to be returned to her. Texas, o' Texas. As once your forefathers saw the virtues of the great experiment, you too will come to see the strength and power of it's righteous mission. Columbia calls Texas, and I will bring you the phone."
 AFS_teach_the_child_a_lesson:0 "Teach The Child a Lesson"
 AFS_teach_the_child_a_lesson_desc:0 "Barron, son of the man who helped destroy this nation, you will break from your fathers greed and arrogance. I will show you the virtues of the great experiment. You will see the beauty of Columbia. Discipline will be your new moto, callsign Chaos will be your teacher. The Great Experiment guides us all, and it will guide you too."
 AFS_extremist_childern:0 "Extremist Childern"
 AFS_extremist_childern_desc:0 "You lack discipline, you are errant children with false gods of hate and misguided rage. You will learn... I will teach you... I am chaos, you are the harbingers of a false order and you shall feel the wrath of the Mad Dog you lost sons of Columbia..."
 AFS_the_mountains_wont_save_you:0 "The Mountains Wont Save You"
 AFS_the_mountains_wont_save_you_desc:0 "I defeated better men than you. Men who fled into the caves of their Afghan mountains, far from their families and homes to wage a war they knew would likely result in their deaths. They fucked with me and I destroyed them. You cower behind the shield of the north, but the hooked sword of my Armies shall pierce you anyhow..."
 AFS_the_workers_false_hope:0 "The Workers False Hope"
 AFS_the_workers_false_hope_desc:0 "Weak and slovenly. You professed a pseudo commie hope to the people while you resided in undisciplined luxury amongst lake houses and fast cars. You are degenerate incarnate, a false prophet of the great experiment. You mock Columbia's bounty while flourishing under her banner. I will show you... the great experiment demands it."
 AFS_american_separatism_ends_here:0 "American Separatism Ends Here"
 AFS_american_separatism_ends_here_desc:0 "I am so close Columbia... the blood of your errant children weighs heavy on my heart. My whole life I have served your banner, been an instrument of the great experiment, but my heart... it hurts Columbia. Washington must have bore the pain of killing the men whom he had once been so accustomed too, but was his pain this great? O' Columbia, carry me o'er these great mountains into the heartland of decadence and false gods. I am so close..."
 AFS_taking_back_the_pacific:0 "Taking Back The Pacific"
 AFS_taking_back_the_pacific_desc:0 "The last steps, though my feet drag heavy. The Great Experiment is so great a burden to bear. O' Columbia, you rule once more over this great continent, your tears the blood of the true patriots. We are so close to setting you free once more. Guide the vessels of our great fleet to bear upon the enemies of your will..."
 AFS_columbia_saved:0 "Columbia Saved"
 AFS_columbia_saved_desc:0 "I did it... We did it... O' Columbia weep no more the blood of the true and false patriot, only the enemies of your nation do remain. O' Columbia guide the remainder of your battered forces for these last battles, let your sword be the guide we need..."

 #Mattis Post-Unification Tree
 AFS_1812:0 "1812"
 AFS_1812_desc:0 "You may have burned the home of Columbia, but I will scorch your nation. We will show you the true will of Columbia and her great experiment. You will join her children you forgotten men of the north, abandoned by your Crown. A new crown shall rule, the crown of liberty worn by the keeper of the great experiment..."
 AFS_1846:0 "1846"
 AFS_1846_desc:0 "Invaders strike across your south o' Columbia. I will stop them. I will put an end to this. All will recognize your beauty and strength. New Children for the future of the Great Experiment... I will bring them to you."
 
 AFS_americas_new_jounery:0 "America's New Jounery"
 AFS_americas_new_jounery_desc:0 ""
 AFS_a_new_and_separated_world:0 "A New And Separated World"
 AFS_a_new_and_separated_world_desc:0 ""
 AFS_a_new_age_of_domination:0 "A New Age of Domination"
 AFS_a_new_age_of_domination_desc:0 ""
 AFS_self_sustainability:0 "Self Sustainability"
 AFS_self_sustainability_desc:0 ""
 AFS_old_world_order:0 "Old World Order"
 AFS_old_world_order_desc:0 ""
 AFS_an_eternal_golden_age:0 "An Eternal Golden Age"
 AFS_an_eternal_golden_age_desc:0 ""
 AFS_son_of_washington_and_man_of_the_people:0 "Son of Washington, And Man of The People"
 AFS_son_of_washington_and_man_of_the_people_desc:0 "I am Washington reborn. I am beloved by all, the chosen son of Columbia. They fear me. They love me. I am the chosen warrior of the great experiment, the harbinger of a new America. All will remember my name and legacy. I am the new father of America..."
 AFS_never_again:0 "Never Again"
 AFS_never_again_desc:0 "Never again O' Columbia will I ever let your people weep. Never again will they forsake you as they once did. O Columbia, I love you. I will die for you. The Great Experiment Continues..."

 #Vance Tree
 AFS_againist_the_triumvirate:0 "Against The Triumvirate"
 AFS_againist_the_triumvirate_desc:0 ""
 AFS_anti_triumvirate_action:0 "Anti-Triumvirate Action"
 AFS_anti_triumvirate_action_desc:0 ""
