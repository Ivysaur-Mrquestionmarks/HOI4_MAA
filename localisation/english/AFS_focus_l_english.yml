 ################################ EVENTS ################################

 AFS.1.t:0 "The Triumvirate Meeting Starts"
 AFS.1.d:0 "vermin, hawkins, and mattis meet in columbus to decide on what policies to do in order to keep the american free state running"
 AFS.1.a:0 "Maybe We Can Still Be Friends?"
 
 AFS.2.t:0 "Triumvirate: Economic Plans?"
 AFS.2.d:0 ""
 AFS.2.a:0 "Continue With Vermin's Plans."
 AFS.2.b:0 "We Need More Authority Over The Economy!"

 AFS.3.t:0 "Triumvirate: Plans for The Government?"
 AFS.3.d:0 ""
 AFS.3.a:0 "We Need More Decentralization!"
 AFS.3.b:0 "We Need a Centralized Government!"
 AFS.3.c:0 "We Need More Authority to Ourselves!"
 
 AFS.4.t:0 "Triumvirate: Law and Order?"
 AFS.4.d:0 ""
 AFS.4.a:0 "There is No Need for Oppression!"
 AFS.4.b:0 "The People Are too Chaotic!"

 AFS.5.t:0 "Triumvirate: The Future?"
 AFS.5.d:0 ""
 AFS.5.a:0 "Trust Me, Anarchism Will Work!"
 AFS.5.b:0 "What About The Environment!"
 AFS.5.c:0 "We Need to Militarize the Nation!"

 AFS.6.t:0 "Mattis And Hawkins Leave The Meeting"
 AFS.6.d:0 ""
 AFS.6.a:0 "The End of The Triumvirate is Here..."
 AFS.6.b:0 "The End of The Triumvirate is Here..."
 AFS.6.c:0 "The End of The Triumvirate is Here..."

 AFS.7.t:0 "Secret Assassination Plans Uncovered"
 AFS.7.d:0 "vermin's guys tell vermin that they found plans by hawkins and mattis to kill him and his advisors"
 AFS.7.a:0 "Quickly! Stop These Plans!"

 AFS.8.t:0 "Secret Assassinations Successful"
 AFS.8.d:0 "hawkins (or mattis) assassination plans succeed but they don't end up killing vermin"
 AFS.8.a:0 "We Will Surely Stop The Vermin!"

 AFS.9.t:0 "End of The Civil War"
 AFS.9.d:0 ""
 AFS.9.a:0 "Time to Rebuild."

 AFS.10.t:0 "Jon Husted Killed By Anarchists"
 AFS.10.d:0 "jon husted (who was mike dewine's lieutenant governor before 2025) gets killed by vermin anarchists"
 AFS.10.a:0 "Who Will Ever Replace Him?"

 AFS.11.t:0 "[AFS.GetLeader] Invites Us to Their Faction"
 AFS.11.d:0 ""
 AFS.11.a:0 "Yes"
 AFS.11.b:0 "No"

 AFS.12.t:0 "They Accept!"
 AFS.12.d:0 ""
 AFS.12.a:0 "Yay!"

 AFS.13.t:0 "They Declined"
 AFS.13.d:0 ""
 AFS.13.a:0 "..."

 AFS.14.t:0 "The Ohio Republican Party Grows"
 AFS.14.d:0 "people are starting to not like the triumvirate and are now supporting the republicans"
 AFS.14.a:0 "They Can't Be A Threat, Right?"
 AFS.14.b:0 "Fight Back Against Them!"

 #Vermin Events

 vermin.1.t:0 "Vermin Meets With His Allies"
 vermin.1.d:0 "vermin meets with his buddies to decide what to do against hawkins and mattis"
 vermin.1.a:0 "Hawkins And Mattis Must Be Defeated!"

 vermin.2.t:0 "Vermin Rally At Columbus"
 vermin.2.d:0 "vermin does a rally to get support against hawkins and mattis"
 vermin.2.a:0 "The New Capital of Anarchism!"

 vermin.3.t:0 "Where To Rally at Next?"
 vermin.3.d:0 ""
 vermin.3.a:0 "Somewhere Near Hawkins Territory."
 vermin.3.b:0 "Somewhere Near Mattis Territory."

 vermin.4.t:0 "Vermin Rallies Near Hawkins Territory"
 vermin.4.d:0 ""
 vermin.4.a:0 "We Must Stop The Green Terror!"

 vermin.5.t:0 "Vermin Rallies Near Mattis Territory"
 vermin.5.d:0 ""
 vermin.5.a:0 "The Mad Dog Must Be Put Down!"

 vermin.6.t:0 "Vermin Meets With His Army"
 vermin.6.d:0 "vermin meets with his black army soldiers and meets with anarchist generals to decide how to defeat hawkins and mattis"
 vermin.6.a:0 "Glory to The Black Army!"

 vermin.7.t:0 "Hawkins And Mattis Declares War On Us!"
 vermin.7.d:0 ""
 vermin.7.a:0 "The Fight For Freedom Has Begun."

 vermin.8.t:0 "Dreams of Paradise"
 vermin.8.d:0 "(post civil war)"
 vermin.8.a:0 "Vermin's Anarchist Reforms Have Begun!"

 vermin.9.t:0 "Our Fellow Freedom Fighters"
 vermin.9.d:0 "(post civil war) vermin meets with anarchists, rojavan officials, and the zapatistas"
 vermin.9.a:0 "One Day, Humanity Will Be Free."

 vermin.10.t:0 "Fight For Your Rights, And Your Ponies!"
 vermin.10.d:0 "(post civil war) vermin uploads a video on youtube about fighting for freedom and stuff"
 vermin.10.a:0 "Freedom is Worth Dying For!"

 vermin.11.t:0 "Migrants and Refugees Move in to Our Nation"
 vermin.11.d:0 "(post civil war)"
 vermin.11.a:0 "They Will Stay Here as Citizens."

 vermin.12.t:0 "The Effects of the Triumvirate"
 vermin.12.d:0 "(post civil war) something something, what radicalization and chaos does to a nation"
 vermin.12.a:0 "We Will Reverse The Effects of Those Extremists!"

 vermin.13.t:0 "It Has Become Reality"
 vermin.13.d:0 "the event that popups when you do vermins final political focus"
 vermin.13.a:0 "An America With No Chains is Approaching"

 vermin.14.t:0 "Love & Ponystep"
 vermin.14.d:0 "(post civil war) vermin visits a rave party in cincinnati (and they play ponystep :3)"
 vermin.14.a:0 "BEST PARTY EVERRRR!!!!!!!!!!"

 vermin.15.t:0 "Spike Cohen Escapes From The Great Lakes"
 vermin.15.d:0 "spike cohen escapes from the GLA because of the boogaloo coup"
 vermin.15.a:0 "Back With Vermin."

 vermin.16.t:0 "Vermin Supreme Reunites America"
 vermin.16.d:0 "Today, Vermin Supreme, the "figurehead leader" of the American Free State, has announced that America has been "fully liberated from the warlords that used to rule it" and said that the various communes in the American Free State are currently rebuilding America and working on establishing new communes in the newly liberated america."
 vermin.16.a:0 "Anarchism, Succeeds?"

 vermin.17.t:0 "An International Meeting"
 vermin.17.d:0 "(post-unification) vermin supreme meets with anarchists and libertarian-socialists from across the world, and they officially establish a international organization of anarchists"
 vermin.17.a:0 "Anarchism Can Only Succeed If We Work Together!"

 vermin.18.t:0 "Welcome to Our Commune!"
 vermin.18.d:0 "(this event popups after doing the autonomous regions focus) vermin visits a commune and meets with the locals there"
 vermin.18.a:0 "What A Nice Visit."

 vermin.19.t:0 "Protecting Our Homes"
 vermin.19.d:0 "(this event popups after doing the self protecting cities focus) anarchist militias defend a town from bandits"
 vermin.19.a:0 "The Scum Were Defeated!"

 vermin.20.t:0 "Tearing Down"
 vermin.20.d:0 "anarchist militiamen go around a former mattis controlled city and tear down mattis propaganda and stuff"
 vermin.20.a:0 "I'm Glad We Defeated That Madman."

 vermin.21.t:0 "Anarchism And The Rust Belt"
 vermin.21.d:0 "(this event popups after doing the final economic focus) the rust belt is better than ever because of anarchism"
 vermin.21.a:0 "Prosperity Within Anarchism!"

 #Hawkins Events

 hawkins.1.t:0 "Annihilationism Spreads in The Green Army"
 hawkins.1.d:0 "annihilationists (who literally want to end humanity to save nature) are getting soldiers to believe in their cause"
 hawkins.1.a:0 "Stop The Spread."
 hawkins.1.b:0 "We Can't Mess Up Our Army."

 hawkins.2.t:0 "Annihilationists Gain Power in The Army"
 hawkins.2.d:0 ""
 hawkins.2.a:0 "Make Them "Disappear""
 hawkins.2.b:0 "As Long As They Help Us Out..."

 hawkins.3.t:0 "Annihilationists Angry Over Their Suppression"
 hawkins.3.d:0 ""
 hawkins.3.a:0 "They Will Be Suppressed."

 hawkins.4.t:0 "Green Army Commanders Upset Over Annihilationist Empowerment"
 hawkins.4.d:0 " "normal" green army generals angry over hawkins sucking dick for the annihilationists"
 hawkins.4.a:0 "We Will Try to Balance It Out."
 hawkins.4.b:0 "They Are Helping Us!"

 hawkins.5.t:0 "Annihilationists Purged"
 hawkins.5.d:0 ""
 hawkins.5.a:0 "The Bastards Are Dead!"

 hawkins.6.t:0 "The Future of The Green Army"
 hawkins.6.d:0 ""
 hawkins.6.a:0 "The Core of Our Army."
 hawkins.6.b:0 "The Annihilationists Have Served Us Well."

 hawkins.7.t:0 "Vermin Attacks Our Territory"
 hawkins.7.d:0 ""
 hawkins.7.a:0 "He Will Never Stop Mother Nature!"

 hawkins.8.t:0 "Hawkins Gives Power to Annihilationist Generals"
 hawkins.8.d:0 "this is the event that pops up when you do the first focus for the annihilationist path, where hawkins gives power to the annihilationists and becomes a figurehead leader"
 hawkins.8.a:0 "Our Time Has Come."

 hawkins.9.t:0 "Purging The Dissidents"
 hawkins.9.d:0 "the annihilationists purge parts of the military that don't think that killing everyone is a good idea"
 hawkins.9.a:0 "They're Finally Dead."

 hawkins.10.t:0 "Terror Attack Succeeds!"
 hawkins.10.d:0 "Our terror attack has succeed, and we have showed the world what we are capable of."
 hawkins.10.a:0 "One Small Step Closer to Humanity's End."

 hawkins.11.t:0 "Terror Attack Fails..."
 hawkins.11.d:0 "Our terror attack has failed. maybe next time we will show them what we got."
 hawkins.11.a:0 "Next Time, Next Time We Will Show Them."

 hawkins.12.t:0 "Larry Fink Assassinated"
 hawkins.12.d:0 "Earlier today, Larry Fink, chairman and CEO of BlackRock, has been assassinated by a lone assassin in New York City. The assassination happened at 5:AM when there was an explosion near 50 Hudson Yards, which the assassin supposedly had a bomb strapped to they're chest and detonated it as soon as they got near Fink. There is a mystery on what the assassin's motives were, the Federal Government has not yet made any official statements regrading the assassin and they're motives."
 hawkins.12.a:0 "The Horror!"
 
 hawkins.13.t:0 "Terror Attack in Paris"
 hawkins.13.d:0 ""
 hawkins.13.a:0 "The Horror!"

 hawkins.14.t:0 "Three Gorges Dam Destroyed"
 hawkins.14.d:0 ""
 hawkins.14.a:0 "The Horror!"

 hawkins.15.t:0 "Big Ben Destroyed By Eco-Terrorists"
 hawkins.15.d:0 ""
 hawkins.15.a:0 "The Horror!"

 hawkins.16.t:0 "Explosion at Taj Mahal"
 hawkins.16.d:0 ""
 hawkins.16.a:0 "The Horror!"

 hawkins.17.t:0 "Terror in Sydney"
 hawkins.17.d:0 ""
 hawkins.17.a:0 "The Horror!"

 hawkins.18.t:0 "Building The Foundations"
 hawkins.18.d:0 "the annihilationists are making the foundations for an ai that will do research on making a bio-pandemic that can wide out humanity in a short amount of time"
 hawkins.18.a:0 "The End is Near"

 hawkins.19.t:0 "Sweat Release"
 hawkins.19.d:0 "the annihilationists have released the bio-pandemic"
 hawkins.19.a:0 "Never Again Will Mother Nature Be Enslaved."

 hawkins.20.t:0 "Extremely Contagious Disease Spreads Across The World"
 hawkins.20.d:0 "In the last three days, a new disease, that came from the eco-terrorist lead nation of "Terra," has been spreading across the world at a extremely fast rate. WHO has just declared the new disease as a public health emergency of international concern (PHEIC) and governments around the world are currently trying to enforce lockdowns"
 hawkins.20.a:0 "Hopefully We Can Survive This..."

 hawkins.21.t:0 "Mankind's Death"
 hawkins.21.d:0 "the event where humanity dies from the disease and the annihilationist leadership are the last ones alive (they're gonna take suicide pills)"
 hawkins.21.a:0 "We Have Finished Our Quest."

 hawkins.22.t:0 "Changes in Leadership"
 hawkins.22.d:0 "hawkins does a small government purge"
 hawkins.22.a:0 "No More Useless Traitors!"

 hawkins.23.t:0 "Advisors Suggests Other Forms of Government"
 hawkins.23.d:0 "hawkins advisors think that a meritocracy wont work and that hawkins should pick something else"
 hawkins.23.a:0 "I Thought Purged People Like You."
 hawkins.23.b:0 "Fine, I Will Go With Something Else."

 hawkins.24.t:0 "The Workers Green Future"
 hawkins.24.d:0 "hawkins delivers a speech about the future of socialism and the planet and that it's the peoples duty to bring forth this future"
 hawkins.24.a:0 "The Future Shall be Brighter Than Ever!"

 hawkins.25.t:0 "Exploiters of Nature Arrested"
 hawkins.25.d:0 "hawkins orders the arrest of people who have "destroyed and ruined the local environment" "
 hawkins.25.a:0 "Justice Served!"

 hawkins.26.t:0 "Looking to China"
 hawkins.26.d:0 "hawkins looks to china and thinks that they're the best example of eco-authoritarianism and green-socialism"
 hawkins.26.a:0 "The Greatest Example!"

 hawkins.27.t:0 "Environmental Salvation Council Chooses a New Leader to Lead The Nation"
 hawkins.27.d:0 "(annihilationists) the council picks a new leader after  1-2 months since hawkins stepping down as leader"
 hawkins.27.a:0 "Venn Will Be Earth's Salvation."

 hawkins.28.t:0 "Environmentalists Unite America"
 hawkins.28.d:0 "Today, Howie Hawkins, president of the Environmental Republic of America, has announced that the last of the remaining nations and warlords have surrendered to them, and that America and it's territories have been restored. In this same statement, Howie Hawkins also said to have plans for America's Reconstruction and to also reconnect with the world."
 hawkins.28.a:0 "Will Earth Be Saved?"

 hawkins.29.t:0 "Misanthropes Conquer America"
 hawkins.29.d:0 "Reports from America indicates that the terrorist organization, known as "Terra" has reunited America and has cleared up the last remaining resistance to stand in their way. in light of this news, the United Nations Security Council have announced that they will "try to contain the terror that has been unleashed onto America." Terra has made no statements as of now"
 hawkins.29.a:0 "Humanity's End Gets Closer..."

 hawkins.30.t:0 "Howie Hawkins Meets With Xi Jinping"
 hawkins.30.d:0 "(post-unification)"
 hawkins.30.a:0 "Building a New World, Together!"

 hawkins.31.t:0 "United Nations Grants Back America's UNSC Membership"
 hawkins.31.d:0 "(post-unification)"
 hawkins.31.a:0 "Gaining Back Our Place in The World!"

 hawkins.32.t:0 "Green Army Generals and Commanders Officially Accept Our Rule"
 hawkins.32.d:0 "the green army "accepts" (forced to accept) annihilationist rule"
 hawkins.32.a:0 "They Finally Joined Our Side!"

 hawkins.33.t:0 "Canadian Bastards"
 hawkins.33.d:0 "annihilationists kidnap some rich dudes from canada and records their execution and upload it to the internet"
 hawkins.33.a:0 "A Lot More to Go"

 hawkins.34.t:0 "New And Green Ideals"
 hawkins.34.d:0 "(this event pops up after doing the eco socialist ideals focus) hawkins is trying to make society "green" "
 hawkins.34.a:0 "A Society of The Future."

 hawkins.35.t:0 "The Minds of The Youth"
 hawkins.35.d:0 "(this event pops up after doing the entrench our ideology focus) hawkins is trying to indoctrinate the kids"
 hawkins.35.a:0 "It Will Pay Off in The Long Run."

 hawkins.36.t:0 "Life Under The Social Credit"
 hawkins.36.d:0 "(this event pops up after doing the social credit system focus) just write a story about what life under hawkins's social credit system is like"
 hawkins.36.a:0 "The Social Credit System is Great! Right?"

 hawkins.37.t:0 "The Nuclear Question"
 hawkins.37.d:0 "hawkins has to decide if he should abandon his anti-nuclear stance and start building nuclear power plants or not"
 hawkins.37.a:0 "No to Nuclear!"
 hawkins.37.b:0 "You Know, Maybe Nuclear is The Future..."

 hawkins.38.t:0 "Green Economic Transition Complete"
 hawkins.38.d:0 "hawkins's transition towards a green economy is complete"
 hawkins.38.a:0 "A Green Future is Upon Us"


 #Mattis Events

 mattis.1.t:0 "Meditations" #a reference to Meditations the book, which mattis has read before
 mattis.1.d:0 "mattis talks about him leaving his home to go to ohio, getting a bunch of marines to join him to ohio, and him having to deal with everything that happens in ohio and saying that vermin and hawkins are idiots"
 mattis.1.a:0 "I Must Keep Ohio Safe From Those Fools."

 mattis.2.t:0 "A Speech To Our Men"
 mattis.2.d:0 "mattis does a speech to his soldiers to get them motivated"
 mattis.2.a:0 "March On!"

 mattis.3.t:0 "The Traitor, And the Man Who Started it All"
 mattis.3.d:0 "mattis talks about his experiences with trump and him starting americas collapse"
 mattis.3.a:0 "He Will Pay The Price"

 mattis.4.t:0 "The Perpetrators of Chaos"
 mattis.4.d:0 "mattis talks about how biden, and the people who seized land when the chaos started, are also all responsible for destroying america"
 mattis.4.a:0 "I Will Make Sure It Never Happens Again..."

 mattis.5.t:0 "The First President"
 mattis.5.d:0 "mattis talks about how george washington was a true president and that modern presidents are all corrupt"
 mattis.5.a:0 "He Lead America To Victory."

 mattis.6.t:0 "The Attack On Vermin"
 mattis.6.d:0 ""
 mattis.6.a:0 "The End of The Vermin is Here."

 mattis.7.t:0 "Herding The Sheep"
 mattis.7.d:0 "mattis thinks that the people are sheep and that he's above them all"
 mattis.7.a:0 "This is For Their Safety."

 mattis.8.t:0 "Washington's Sons and Daughters"
 mattis.8.d:0 "an event about mattis's new political organization (followers of washington) that brainwashes people lol"
 mattis.8.a:0 "A Step Closer to a Washingtonian Society."

 mattis.9.t:0 "Americas New Father"
 mattis.9.d:0 "mattis thinks he's the new washington and shit"
 mattis.9.a:0 "I Am Washington's Son."

 mattis.10.t:0 "A Show of Strength"
 mattis.10.d:0 "mattis flexes his new military stuff to the people and claims that no other nation in america has anything like what mattis's military has"
 mattis.10.a:0 "We Are The Mightiest of Them All!"

 mattis.11.t:0 "A Revised and Truly Washingtonian Constitution"
 mattis.11.d:0 "mattis "rewrites" the constitution to justify all the stuff he does"
 mattis.11.a:0 "The True Constitution!"

 mattis.12.t:0 "Rebuilding Washington's Legacy"
 mattis.12.d:0 "mattis thinks he's rebuilding george washington's legacy"
 mattis.12.a:0 "Never Forget What He Built For Us."

 mattis.13.t:0 "Decaying Savior"
 mattis.13.d:0 "mattis talks about him getting close to his death and that he needs to find a way to live longer"
 mattis.13.a:0 "No Matter What, I Must Live."

 mattis.14.t:0 "Death Has Arrived"
 mattis.14.d:0 "mattis dies"
 mattis.14.a:0 "His Mission Must Be Passed Down to Us."

 mattis.15.t:0 "Rising Above Death"
 mattis.15.d:0 "mattis achieves immortality by becoming a cyborg"
 mattis.15.a:0 "Nothing Can Stop My Mission."

 mattis.16.t:0 "Americas Military Purification"
 mattis.16.d:0 "Today, James Mattis, the leader of the American Provisional Military Government, announced in a speech outside the white house, that the last remaining rebels have been "dealt with" and that order has been established throughout America. In this speech, James Mattis also said that "a new golden age will rise in America, and it's only a matter of time until America climbs back up as the worlds superpower" the international community has not made any statements about this recent news as of now."
 mattis.16.a:0 "A New, and Militaristic Age for America"

 mattis.17.t:0 "Forever Golden"
 mattis.17.d:0 "(post-unification) mattis thinks that the people of america will be eternally happy under his rule"
 mattis.17.a:0 "What No President Could Ever Done."

 mattis.18.t:0 "A Nation to The End of Time"
 mattis.18.d:0 "(post-unification) mattis thinks his america will last forever and that there will never be another civil war/collapse"
 mattis.18.a:0 "Forever, and Ever."

 mattis.19.t:0 "Washington's Mission"
 mattis.19.d:0 "(this event popups after mattis.5) mattis talks about his "grand mission" to save america from traitors and warlords"
 mattis.19.a:0 "America Will Be Saved."

 mattis.20.t:0 "Justice For America"
 mattis.20.d:0 "mattis captures trump and kills him"
 mattis.20.a:0 "Never Another Trump."

 mattis.21.t:0 "The Capitol Retaken"
 mattis.21.d:0 "mattis (after defeating biden) talks about rebuilding washington d.c and doing some "revisions" "
 mattis.21.a:0 "A Step Closer to Restoring America."

 mattis.22.t:0 "The Boy Ruler"
 mattis.22.d:0 "mattis finds barron and tries to convince him to join his side, but he refuses and now has to decide if he should kill him or not"
 mattis.22.a:0 "Just Kill The Boy."
 mattis.22.b:0 "He's a Victim, And Needs to Be Healed From His Wounds."

 mattis.23.t:0 "Safety And Stability"
 mattis.23.d:0 "mattis talks about how before his victory in the ohio civil war, and even before america collapsed, there was lots of crime and chaos in ohio, and him saying that he's restoring order in ohio and making it clean."
 mattis.23.a:0 "Stability Will Be Ensured"

 #Vance Events

 vance.1.t:0 "Mike DeWine's March on Columbus"
 vance.1.d:0 "mike dewine and jd vance does a coup on the triumvirate with the support from mattis's generals and the remnants of the ohio national guard"
 vance.1.a:0 "We Have Came to Save Ohio!"

 vance.2.t:0 "Triumvirate Loyalists Arrested"
 vance.2.d:0 "mike dewine arrests the remaining vermin, hawkins, and mattis loyalists"
 vance.2.a:0 "They Have Been Put In Their Place."

 vance.3.t:0 "Mike DeWine Assassinated"
 vance.3.d:0 "mike dewine gets assassinated by a hawkins loyalist while mike was in the capital building (columbus, ohio statehouse) making orders"
 vance.3.a:0 "We Will Get Those Extremists!"

 vance.4.t:0 "JD Vance Sworn In As President of Ohio"
 vance.4.d:0 ""
 vance.4.a:0 "He Will Continue DeWine's Mission!"

 vance.5.t:0 "Triumvirate Strongholds Captured"
 vance.5.d:0 "after mike dewine's assassination, JD vance orders to arrest more triumvirate loyalists and puts the nation into martial law"
 vance.5.a:0 "This is For DeWine!"

 vance.6.t:0 "Thiel's Request"
 vance.6.d:0 "(pre dewine assassination event) peter thiel (who has been funding vance and helping him out to be mike dewine's vice president) wants JD vance to rule with an iron fist and bring the dark enlightenment to ohio"
 vance.6.a:0 "I'm Not Becoming an Autocrat!"
 vance.6.b:0 "I Will Listen to Your Request Peter."

 vance.7.t:0 "Vance's Refusal"
 vance.7.d:0 "vance refuses to listen to thiel's request and thiel crashsout and leaves the building"
 vance.7.a:0 "Good Riddance."

 vance.8.t:0 "Vance's Enlightenment"
 vance.8.d:0 "vance accepts thiel's request and starts planning"
 vance.8.a:0 "The Storm Over Ohio Grows..."

 vance.9.t:0 "Order Restored in Ohio"
 vance.9.d:0 "(normal) vance restores order in ohio"
 vance.9.a:0 "Will Things Go Back to Normal Now?"

 vance.10.t:0 "Vance Grants Himself Emergency Powers"
 vance.10.d:0 "(enlightenment) vance gives himself emergency powers to follow thiel's secret request, and uses mike dewine's death as a excuse to give himself these powers"
 vance.10.a:0 "Is This Necessary?"

 vance.11.t:0 "East or West?"
 vance.11.d:0 ""
 vance.11.a:0 "The East, The Rightful Government."
 vance.11.b:0 "The West, The Patriots of America."
 vance.11.c:0 "No, We Won't Join Any of Them!"

 vance.12.t:0 "Ohio Wants to Join Our Faction"
 vance.12.d:0 ""
 vance.12.a:0 "Sure."
 vance.12.b:0 "No."

 vance.13.t:0 "Alliance With The Democrats Or Third Parties?"
 vance.13.d:0 ""
 vance.13.a:0 "Fine, We Will Work With the Democrats."
 vance.13.b:0 "I Prefer Libertarians Than Democrats."

 vance.14.t:0 "The Balance of Power"
 vance.14.d:0 ""
 vance.14.a:0 "Power to The President!"
 vance.14.b:0 "Power to The Senate!"

 vance.15.t:0 "Normalcy Returns to Ohio"
 vance.15.d:0 "ohio is back to what it was before americas collapse"
 vance.15.a:0 "Back on Track."

 vance.16.t:0 "Popularity of The Democrats Grow"
 vance.16.d:0 "(normal vance) democrats take advantage of the political state of ohio and gets a bunch of people to support them"
 vance.16.a:0 "I Guess Were Gonna Have to Deal With Them Now."

 vance.17.t:0 "Libertarians And Centrist Parties Form a Coalition"
 vance.17.d:0 "(normal vance) libertarians and centrist parties work together and form the Free Ohio Coalition, and they also start getting a bunch of people to support them too"
 vance.17.a:0 "Them Too!?"

 vance.18.t:0 "Political Polarization Declines"
 vance.18.d:0 "this event popups when you go cooperative democracy on the BoP"
 vance.18.a:0 "The People of Ohio May Once Again be United!"

 vance.19.t:0 "Democrats and Republicans Speak Out Against Vance's "Consolidation of Power""
 vance.19.d:0 "this event popups when you go republican control on the BoP"
 vance.19.a:0 "It's For The People!"

 vance.20.t:0 "The Duke's Orders"
 vance.20.d:0 "(enlightenment) vance orders a government (and somewhat of a military) purge"
 vance.20.a:0 "Lock Up The Dissidents."

 vance.21.t:0 "Large Scale Protests Over Vance's New Government"
 vance.21.d:0 "(enlightenment) vance"
 vance.21.a:0 "Arrest Those Unlawful Brats!"

 vance.22.t:0 "Protesters Cleared Up"
 vance.22.d:0 "(enlightenment) vance"
 vance.22.a:0 "They Are Now In There Place."

 vance.23.t:0 "Crime, Eliminated. Stability, Restored."
 vance.23.d:0 "this event popups after doing the focus "statherotita" thats also one of last government focus for enlightenment vance"
 vance.23.a:0 "Order, And Only, Order."

 vance.24.t:0 "Trial of The Cathedral"
 vance.24.d:0 "(enlightenment) vance does a trial on the "cathedral" which is just liberals, leftists, left-leaning news companies, and any left-leaning universities/collages"
 vance.24.a:0 "They Will Be Purged From The Duchy!"

 vance.25.t:0 "Trial of The Hedonists"
 vance.25.d:0 "(enlightenment) vance does a trial on anarchists, drug sellers, and anyone that traditionalists don't like"
 vance.25.a:0 "Degenerates Have No Place in The Duchy!"

 vance.26.t:0 "A New Enlightened, and Catholic America"
 vance.26.d:0 "Today, JD Vance, Former Duke and now "King of America" has announced in a speech outside the former capital building, now known as the "Grand Court of The Monarch" with Curtis Yarvin and Peter Theil next to him, that the "last warlords of America have surrendered to us" and that stability and order has been fully established across America. In this same speech, JD Vance has also said that he has already begun talks with countries, and international organizations."
 vance.26.a:0 "Has America Really been Enlightened?"

 vance.27.t:0 "Rumors from Springfield"
 vance.27.d:0 "(normal) vance hears rumors about migrants from the CSA that came to get away from the CSA civil war are "eating the cats and eating the dogs" "
 vance.27.a:0 "We Can't Let Them do This!"
 vance.27.b:0 "These Are Just Rumors, I Got Better Things to Do."

 vance.28.t:0 "They're Eating The Dogs, They're Eating the Cats."
 vance.28.d:0 "(normal) vance does a speech about the rumor and says that he will be "taking swift action against these monsters" "
 vance.28.a:0 "Save Springfield!"

 vance.29.t:0 "Democrats and Libertarians Disprove The Rumors"
 vance.29.d:0 "democrats and libertarians show evidence that the rumors in springfield are false and that they're in fact, not eating the dogs and cats"
 vance.29.a:0 "What?! They're Lying!"

 vance.30.t:0 "The Columbus Address"
 vance.30.d:0 "(enlightenment) vance addresses the people of ohio of the official declaration of the duchy (this is after him doing a purge and getting rid of protesters)"
 vance.30.a:0 "The Leviathan is Born"

 vance.31.t:0 "Meeting of The Aristocrats"
 vance.31.d:0 "(enlightenment) vance meets with "aristocrats" (CEOs)"
 vance.31.a:0 "The American Aristocracy Has Begun."

 vance.32.t:0 "2026 Ohio Elections"
 vance.32.d:0 "an election between republicans, democrats, and the libertarian/centrist party (The Free Ohio Coalition) vance is still running btw"
 vance.32.a:0 "Vance Wins Reelection!"
 vance.32.b:0 "The Democrats Win The Election!"
 vance.32.c:0 "The Free Ohio Coalition Win The Election!"

