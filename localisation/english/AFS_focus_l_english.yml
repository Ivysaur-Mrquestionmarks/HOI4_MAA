 #Hawkins Tree
 AFS_hawkins_victory:0 "Nature's Victory"
 AFS_hawkins_victory_desc:0 "After years of struggle a true Environmentalist nation has been set up. Without having to worry about petty anarchists and warmongering generals we can finally enact our grand plan to save our planet."

