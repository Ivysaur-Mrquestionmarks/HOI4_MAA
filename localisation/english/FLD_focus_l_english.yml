 #events
 fld.1.d:0 "Miami was in ruins. Smoke filled the air as police struggled to maintain control over a panicked populace. Years earlier, Jeb's Revolution was put down, making the area a virtual police state. After the sudden rise and fall of Jeb's second reign, the area was forgotten and saw a steep drop in population. Now, upon the brink of annihilation, Miami was held by a loosely strung together government led by [FLD.GetLeader]. [FLD.GetLeader] was no military mastermind but she knew how to speak to the masses. Soon her voice was playing over every single radio and TV in the area. \n\n"My fellow Floridians. We must during this trying time come together as one. The forces of evil and destruction lie at our gates and if we continue to fight, we will become only a distant memory in the pages of history. I need you all to fight for your civil liberties and freedoms you hold so dear, for the battle upcoming depends on it. In the coming weeks, you will be tested in your strength, mind, and soul, but take heart, for we hold the legitimate power in Florida. Long live Florida! Long live Democracy!"
 fld.1.a:0 "For Democracy!"
 fld.1.t:0 "The Floridian Civil War"
 fld.2.t:0 "[FLD.GetName] Proclaims Victory"
 fld.2.d:0 "[FLD.GetLeader] moved towards to podium. It was odd, the room broadcasted from in the past months of the bloody Floridian Civil War was usually empty. Now it was alive with reporters and camera crews from around the globe. As [FLD.GetLeader] slowly set her papers on the podium, she thought of all the men, women and children that had died for the cause. She owed their familes a brighter future. [FLD.GetLeader] slowly looked up, fixed the microphone so it was right at the edge of his lips and said... \n\n"The bright future of Florida starts today.""
 fld.2.a:0 "Thank God it's over"
 fld.3.t:0 "New Florida Elections"
 fld.3.d:0 "In the highly contested race for the Presidency of a newly independent Florida, three prominent politicians have emerged as front-runners, each bringing unique ideologies and visions. Francis X. Suarez, the innovative Miami mayor, presents moderate politics with an emphasis on technology, and aims to transform Florida into a global tech hub. Val Demings, a former congresswoman, champions progressive values, advocating for transformative changes in areas like criminal justice and income inequality. Floridians face a crucial decision that will shape the trajectory of their state, as these candidates engage in spirited campaigns across the diverse region."
 fld.3.a:0 "Francis X. Suarez"
 fld.3.b:0 "Nikki Fried"
 fld.3.c:0 "Val Demings"
 fld.4.t:0 "Florida Declares Independence!"
 fld.4.d:0 "Breaking news from Miami today as [FLD.GetLeader] announces that the [FLD.GetName] is declaring independence from the former United States and will look to foreign powers for guarantees of safety. \n\n[FLD.GetLeader] declared that [FLD.GetName] will be applying to join the UN and other international organizations in the coming weeks. While [FLD.GetName] is one of the first former American states to declare independence, they may not be the last some analysts warn."
 fld.4.a:0 "A future without America?"
 fld.5.t:0 "The Hidden Crisis Reveals Itself"
 fld.5.d:0 "As a more normal administration has finally taken control of Florida, a problem that had been swept under the rug is reappearing. Barron Trump, Jeb Bush, and warlord control over Florida led to this problem festering in the darkness. Corruption by officials also is a major factor in the rise of the use of illicit substances. If we don't do something soon, this problem may get out of our control."
 fld.5.a:0 "We need to fix this..."
 fld.6.t:0 "A Magical Kingdom"
 fld.6.d:0 ""
 fld.6.a:0 "How bad can we possibly be?"
 fld.7.t:0 "[FROM.GetName] Asks to Join our Faction!"
 fld.7.d:0 ""
 fld.7.a:0 "For the sake of America, we accept."
 fld.7.b:0 "No, they will only bring us down."
 fld.8.t:0 "[FROM.GetName] Rejected us From Their Faction!"
 fld.8.d:0 ""
 fld.8.a:0 "They will be sorry!"
 fld.9.t:0 "[FROM.GetName] Accepted us Into Their Faction!"
 fld.9.d:0 "We are now fighting with [FROM.GetName] to reunify America!"
 fld.9.a:0 "A toast to our new friendship!"
 News_Events.104.a:0 "Stability for Florida"
 News_events.104.t:0 "Miami Goverment Survives Floridian Civil War"
 News_events.104.d:0 "Today in Miami, provisional President of now a united Florida, [FLD.GetName] addressed the media. This comes in the wake of the Miami Goverment emerging victorious in the Floridian Civil War. [FLD.GetName] is now declaring that there will be free elections starting quite soon with many candidates on the ballot. [FLD.GetName] was also deeply remorseful at the lives lost during the war and vows to help stabilize the nation. Much work is needed to repair the damages from the conflict that raged from Orlando to Miami, and everywhere inbetween. It seems that Florida is in good hands."
 
 