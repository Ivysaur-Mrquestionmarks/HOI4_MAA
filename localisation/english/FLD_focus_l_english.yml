l_english:
 FLD_floridian_civil_war:0 "The Floridian Civil War"
 FLD_floridian_civil_war_desc:0 "After Jeb Bush stepped down, the many different areas of Florida began to draw apart and Balkanize. Soon, four emerged and all claimed to be the true new Florida. This can only be resolved in one way."
 FLD_the_state_of_our_nation:0 "The State of our New Nation"
 FLD_the_state_of_our_nation_desc:0 "Florida has fallen to pieces, giving us the opportunity to take control, but there are others who will try to stop us."
 FLD_prepare_offensives:0 "Prepare Offensives"
 FLD_prepare_offensives_desc:0 "Now that our army is better organized, we can begin to plan assaults into the illegitimate states keeping us from full control of Florida."
 FLD_attack_nasa:0 "Stike at NASA"
 FLD_attack_nasa_desc:0 "NASA has always been a scientific organization. They do not have the military experience to combat us and emerge victorious."
 FLD_attack_seminoles:0 "Strike the Seminoles"
 FLD_attack_seminoles_desc:0 "The Seminole are not as fierce as they once were. Many years ago, they stood toe to toe with the United States army. Today, they will grovel at our feet."
 FLD_attack_democrats:0 "Invade Miami"
 FLD_attack_democrats_desc:0 "The largest industrial base in Florida lies in the massive city of Miami. It would be wise for us to take this city at once."
 FLD_attack_anarchists:0 "Attack the Anarchists"
 FLD_attack_anarchists_desc:0 "Those who reject government in favor of total anarchy are weak and incompetent, and must be conquered."
 FLD_one_final_push:0 "One Final Push"
 FLD_one_final_push_desc:0 "The civil war is nearing its end. We must make one last great effort to seal our victory."
 FLD_internal_matters:0 "Internal Matters"
 FLD_internal_matters_desc:0 "Our nation is new to the world stage and with that comes growing pains and a multitude of issues. We must address these quickly if we are to survive."
 FLD_address_the_military:0 "The Military"
 FLD_address_the_military_desc:0 "Although our military is small, it still needs to be treated professionally if it is to win our conflicts" 
 FLD_address_the_economy:0 "The Economy" 
 FLD_address_the_economy_desc:0 "Florida did not have a large economy before the civil war, but we must play the cards we are dealt. Finding a way to make the most out of what we have is paramount!"
 FLD_address_the_government:0 "The Goverment"
 FLD_address_the_government_desc:0 "Many question how fast our new government was able to take control of our territory but none will question us when we lead the nation to victory!"
 FLD_solidify_nation:0 "Solidify the Nation"
 FLD_solidify_nation_desc:0 "With internal matters dealt with, it is time to turn our gaze elsewhere..."
 FLD_a_new_florida:0 "A New Florida"
 FLD_a_new_florida_desc:0 "We have emerged through the smoke and fumes of a burning state ravaged by civil war. No one can question our resolve."
 FLD_attack_nasa_idea:0 "Strike NASA"
 FLD_attack_democrats_idea:0 "Strike at the Democrats"
 FLD_attack_seminoles_idea:0 "Strike the Seminoles"
 FLD_final_push_idea:0 "The Final Push"
 FLD_final_push_idea_desc:0 "One final offensive could be what we need to secure victory in Florida"
 
 
 #start of non-civil war stuff
 FLD_florida_election:0 "Call for an Election"
 FLD_florida_election_desc:0 "Victorious in the civil war, we must adhere to our democratic principles and elect someone to lead us through whatever the future may bring."
 
 #suarez
 FLD_suarez:0 "Suarez"
 FLD_suarez_desc:0 "Francis X. Suarez, the Republican-turned-independent former mayor of Miami, wins the election by a wide margin. His popularity due to his wartime leadership, and exciting new ideas on technology have invigorated the populace." 
 FLD_digital_democracy:0 "Digital Democracy"
 FLD_digital_democracy_desc:0 "Allowing citizens to provide real-time feedback during legislative sessions and vote on government initiatives from their homes allows us to have a more free, democratic society."
 FLD_crypto_economy:0 "Crypto Economy"
 FLD_crypto_economy_desc:0 "Paper money is a relic of the past, subject to inflation and poor handling by the state reserve. Recognizing cryptocurrencies as legal tender will safeguard our people’s finances, and spark a new era of growth."
 FLD_invite_tech_companies:0 "Invite Tech Companies"
 FLD_invite_tech_companies_desc:0 "To become a leader in innvoation and prosperity, we much first attract technology companies which will invest in our great nation!"
 FLD_miamicoin:0 "MiamiCoin"
 FLD_miamicoin_desc:0 "MiamiCoin is a city-backed cryptocurrency that we need to introduce all across the state. If the population starts using it, we can abolish taxes entirely!"
 FLD_abolish_taxes:0 "Abolish Taxes"
 FLD_abolish_taxes_desc:0 "Due to the massive success of MiamiCoin, we can now abolish all taxes!"
 FLD_silicon_valley_of_the_east:0 "Silicon Valley of the East"
 FLD_silicon_valley_of_the_east_desc:0 "Our aggressive moves to modernize and improve Florida have allowed us to meet and surpass our pre-war level of technology and innovation. Floridian companies compete with the best of the world!"
 FLD_smart_plan:0 "SMART Plan"
 FLD_smart_plan_desc:0 "We need to invest in modern rapid transit, including buses and high-speed rail. The SMART Plan will transform Florida into a leader in public transportation."
 FLD_an_independent_politician:0 "A New Age of Politics"
 FLD_an_independent_politician_desc:0 "Through Suarez's revolutionary ideas and leadership, Florida has introduced a new age of Politics to the world, where technology and innovation are embraced."
 FLD_miami_doctrine:0 "The 'Miami Doctrine'"
 FLD_miami_doctrine_desc:0 "The 'Miami Doctrine' is a bold plan by Suarez to completely eliminate partisan divide in Florida by creating a special taskforce to combat both extremes-left and right. This initiative aims to unite all Floridians as one people, rather than living divided."
 FLD_move_past_culture_war_poltiics:0 "Move Past the Culture War"
 FLD_move_past_culture_war_poltiics_desc:0 "The Culture War is over, and there is no reason to dote on the past. Right now we must think how we can move forwards together, rather than bickering about something that isn't relevant anymore."
 FLD_strengthen_the_executive:0 "Strengthen the Executive"
 FLD_strengthen_the_executive_desc:0 "The legislative process can often delay much needed reforms and relief. Cutting the bureaucratic ribbon will ensure a speedy enactment of our plans!"
 FLD_completely_digitize_bureaucracy:0 "Completely Digitize the Bureaucracy"
 FLD_completely_digitize_bureaucracy_desc:0 "Everything is faster, more efficient, and much more convenient online. We will apply this to how our government functions as well."
 FLD_addressing_climate_change:0 "Addressing Climate Change"
 FLD_addressing_climate_change_desc:0 "Although some of us may like to ignore this issue, it is becoming a serious danger for the Floridian people. We must solve this crisis-or mitigate the effects-before it is too late."
 FLD_flood_barriers:0 "Flood Barriers"
 FLD_flood_barriers_Desc:0 "Flood barriers not only protect our people, but our businesses as well. Protecting what allows us to thrive is key to becoming a successful nation."
 FLD_affordable_sustainable_housing:0 "Affordable and Sustainable Housing"
 FLD_affordable_sustainable_housing_desc:0 "As the population in [ROOT.GetName] is booming, we must increase our capacity to house people, while also keeping in mind the impacts of our actions."
 FLD_expand_urban_development:0 "Expand Urban Development"
 FLD_expand_urban_development_desc:0 "Urban amenities are vital to presenting ourselves to the world as a hyper-advanced country."
 FLD_strengthen_law_enforcement:0 "Strengthen Law Enforcement"
 FLD_strengthen_law_enforcement_desc:0 "Now that our reforms are well under way, we must secure the new nation we have built from those who want to threaten it and its civilians."
 FLD_department_of_marketing:0 "Create the Department of Marketing"
 FLD_department_of_marketing_desc:0 "The Department of Marketing will allow us to manage how our image is presented to the world. We want to show the world that our beautiful nation is one of the greatest paradises to live in."
 FLD_switzerland_of_america:0 "The Switzerland of the Americas"
 FLD_switzerland_of_america_desc:0 "Just like Switzerland, we will become a highly free, advanced, and business friendly society."
 FLD_dominate_the_ai_market:0 "Dominate the AI Market"
 FLD_dominate_the_ai_market_desc:0 "AI is the key to the future! If our goal to build a highly advanced nation is to be accomplished, AI will play a crucial role in its future."
 FLD_meet_with_themepark_corporations:0 "Meet With Themeparks"
 FLD_meet_with_themepark_corporations_desc:0 "Themeparks and their parent companies hold immense control over the Floridian economy and are extremely powerful entities. Perhaps they may become a very useful ally if we reach out to them?"
 FLD_reconciliation_with_moderates:0 "Reconcile With Moderates"
 FLD_reconciliation_with_moderates_desc:0 "One step in forging a new Florida is to forgive and forget non-fanatics. They are Floridians after all."
 
 #fried
 #FLD_fried:0 "Fried"
 #FLD_fried_desc:0 "Nikki Fried, Florida's pre-war Agriculture Commissioner and most notable Democrat wins the election. The people of Florida have suffered under despotic and insane leadership, and simply want a moderate and competent leader."
 
 #demings
 FLD_demings:0 "Demings"
 FLD_demings_desc:0 "Val Demings, a congressional representative from Orlando before the war, offered a more progressive vision for Florida than the other candidates. The populace, after years of right-wing and despotic rule, sided heavily with the left and elected Demings."
 FLD_ban_firearms:0 "Ban Firearms"
 FLD_ban_firearms_desc:0 "The war for Florida is over. We need to confiscate guns gained by the population during the war, and institute a ban on new firearms to protect our people."
 FLD_forgive_tuition_debt:0 "Forgive Tuition Debt"
 FLD_forgive_tuition_debt_desc:0 "Money shouldn't be a barrier to quality education! Floridians deserve to go to school without the fear of debt, regardless of their financial standing."
 FLD_defund_the_police:0 "Defund the Police"
 FLD_defund_the_police_desc:0 "After a period of violence and bloodshed, we have returned to peace. By defunding the police, we can make sure that our people do not experience oppression within the saftey of our own state."
 FLD_universal_healthcare:0 "Universal Healtchare"
 FLD_universal_healthcare_desc:0 "All Floridians have a right to healthcare, allowing them to live long and health lives."
 FLD_expand_voting_rights:0 "Expand Voting Rights"
 FLD_expand_voting_rights_desc:0 "Under previous regimes, many people of color and minority groups have been disenfranchised and prevented from voting. In our new nation, we will not allow this to happen."
 FLD_limit_offshore_drilling:0 "Limit Offshore Drilling"
 FLD_limit_offshore_drilling_desc:0 "In our new nation, we have a chance to move away from fossil fuels before coming dependent on them. Let's instead base our society off of renewables."
 FLD_progressive_movement:0 "Progressive Movement"
 FLD_progressive_movement_desc:0 "Through Demings' leadership, Florida has turned its back on despotism and right-wing extremism, and become a leader in the world for progressive societies."
 FLD_bastion_of_the_establishment:0 "The Return of the Democrats"
 FLD_bastion_of_the_establishment_desc:0 "Demings is a Democrat, and will work to return Florida to sanity and normalcy."
 FLD_female_stem_education:0 "Invest in STEM Education"
 FLD_female_stem_education_desc:0 "During the collapse, and even before so, STEM education has stagnated, allowing us to lose vital potential in the STEM sector. We need to encourage all of our citizens to partake in important sectors of our economy, especially through increasing education."
 FLD_close_the_wage_gap:0 "Close the Wage Gap"
 FLD_close_the_wage_gap_desc:0 "America was always known for having a horrendus wage gap between men and women. Now, we have a chance to fix that."
 FLD_funding_for_abortion:0 "Funding for Abortion"
 FLD_funding_for_abortion_desc:0 "Florida will work to protect the rights of all women in our borders, and provide services which were mostly unattainable during the past few years."
 FLD_focus_on_agriculture:0 "Focus on Agriculture"
 FLD_focus_on_agriculture_desc:0 "Floridian agriculture was some of the best in the world. We need to invest in our agriculture to reduce our reliance on the outside world."
 FLD_reduce_carbon_emissions:0 "Reduce Carbon Emissions"
 FLD_reduce_carbon_emissions_desc:0 "With all the mayhem on the continent, we can do our part in fighting climate change by limiting our own carbon emissions."
 FLD_woman_of_the_people:0 "Protect LGBTQ+ Rights"
 FLD_woman_of_the_people_desc:0 "LGBTQ+ rights are critical for ensuring a progressive and equal Florida."
 
 FLD_entrench_the_democrats:0 "Entrench the Democrats"
 FLD_entrench_the_democrats_desc:0 "The Democratic Party is back and here to stay! The Republicans have been a disaster, and will never return!"
 FLD_enhance_union_protections:0 "Enhance Union Protections"
 FLD_enhance_union_protections_desc:0 "Protecting the right to unionization will ensure that Floridian workers get the proper value out of their labor!"
 FLD_purge_altright_and_extremists_from_military:0 "Purge the Alt-Right From the Military"
 FLD_purge_altright_and_extremists_from_military_desc:0 "After a very long period of Republican rule, the alt-right has infiltrated Floridian military structures. It is time to purge these influences."
 FLD_woke_propaganda:0 "Woke Propaganda"
 FLD_woke_propaganda_desc:0 "A little propaganda does no harm, as long as it supports our beliefs..."
 FLD_denounce_corporate_influence:0 "Denounce Corporate Influence"
 FLD_denounce_corporate_influence_desc:0 "Corporate influence is what corrupted Florida in the first place! We should have never trusted those companies."
 FLD_ban_corporate_donations:0 "Ban Corporate Donations"
 FLD_ban_corporate_donations_desc:0 "To ensure a disaster like this never happens again, we will bar corporate interests from interfering with politics."
 FLD_era_of_woke_corporations:0 "Era of Woke Corporations"
 FLD_era_of_woke_corporations_desc:0 "Corporations are powerful entities, and can be swayed to our side."
 FLD_mandatory_corporate_diversity:0 "Mandate Corporate Diversity"
 FLD_mandatory_corporate_diversity_desc:0 "To seem that we are still committed to our goals on the outside, we need to pass some token legislation, at least, to appear good."
 FLD_incentivize_electric_cars:0 "Incentivize Electric Vehicles"
 FLD_incentivize_electric_cars_desc:0 "Electric cars are expensive and a massive burden. Building new factories to incentivize their purchase and use will be key in a green future!"
 FLD_floridian_green_new_deal:0 "A Floridian Green New Deal"
 FLD_floridian_green_new_deal_desc:0 "Eliminating fossil fuels and substituting them with alternatives like nuclear and renewable energy is one of our primary goals, and can finally be accomplished."
 
 #military/industry focuses
 FLD_what_we_once_had:0 "What We Once Had"
 FLD_what_we_once_had_desc:0 "Years of war have ravaged Florida, we must work to give Floridians back their land they know and love."
 FLD_everglade_protection_act:0 "Everglade Protection Act"
 FLD_everglade_protection_act_desc:0 "The Everglades are beloved by many Floridians, and we need to make sure that they remain protected."
 FLD_reforestation:0 "Reforestation"
 FLD_reforestation_desc:0 "During wartime and before the collapse, Florida was losing forest at an alarming rate. We must institue a reforestation project to make sure our land remains forested for generations to come."
 FLD_water_management:0 "Water Management"
 FLD_water_management_desc:0 "Much of our water infrastructure was destroyed due to years of fighting. We must restore our all of our people's access to clean water."
 FLD_improved_quality_of_life:0 "Reinvest into Eduction"
 FLD_improved_quality_of_life_desc:0 "Wars and neglect have led to our people living terrible lives. We must keep investing in improtving the quality of life for all!"
 FLD_clean_up_the_beaches:0 "Clean Up the Beaches"
 FLD_clean_up_the_beaches_desc:0 "Florida is known for its world class beaches. We must clean them and maintain them, so our own people and people around the world can enjoy them."
 FLD_internal_florida_infrastructure:0 "Hurricane-Proof Infrastructure"
 FLD_internal_florida_infrastructure_desc:0 "War and neglect have led to our infrastructure falling into disrepair. We will focus on rebuilding and expanding ours."
 FLD_invest_in_civilian_industries:0 "Invest in Civilian Industries"
 FLD_invest_in_civilian_industries_desc:0 "Wartime is over, we must now focus on our people and their livelihoods."
 FLD_new_era_for_florida:0 "New Era for Florida"
 FLD_new_era_for_florida_desc:0 "Florida has been rebuilt, and we now stand in front of the world as an example of peace and wellbeing in the former United States."
 
 FLD_formal_milita_training:0 "De-Politicize the Military"
 FLD_formal_milita_training_desc:0 "During the conflict of the past few years, many militia groups formed. We will incorporate them into our armed forces, so we do not have groups acting unsupervised."
 FLD_improved_small_arms:0 "Gun Buy-Back Programs"
 FLD_improved_small_arms_desc:0 "Though we wish not to engage in more conflict, development of small arms will allow us to defend ourselves again should it be needed."
 FLD_fortify_northern_border:0 "Fortify the Northern Border"
 FLD_fortify_northern_border_desc:0 "To aid in the defense of our land, we must build forts to help defend ourselves."
 FLD_coastal_patrol_vessels:0 "Coastal Patrol Vessels"
 FLD_coastal_patrol_vessels_desc:0 "Building new vessels will allow us to patrol our coast, and detect any threats before they approach our shore."
 FLD_upgrade_existing_airfields:0 "Renovate Miami Airport"
 FLD_upgrade_existing_airfields_desc:0 "Florida has many airfields, though we must repair and upgrade them to be able to handle modern aircraft demands."
 
 FLD_rebuild_military:0 "Rebuild our Military"
 FLD_rebuild_military_desc:0 "Our military, after fighting in the bloody Floridian Civil War, is made up of a few specialized militia groups. To survive in this world, we must build a professional army capable of defending our land."
 FLD_promote_defense_industry:0 "Promote Defense Industry"
 FLD_promote_defense_industry_desc:0 "The military industrial complex is extremely vital to the Floridian economy and the continued survival of Florida. Strengthening it will be key to our continued existence."
 FLD_synthetic_oil:0 "Synthetic Oil"
 FLD_synthetic_oil_desc:0 "As resources become increasingly scarce, alternatives must be considered. Investing in synthetic fuel will be a great investment in securing our fuel supply."
 FLD_coastal_forts:0 "Coastal Forts"
 FLD_coastal_forts_desc:0 "Florida has a long coast that is extremely vulnerable to enemy attacks. We must protect it to secure the rest of the nation."
 FLD_florida_war_tactics:0 "Florida War Tactics"
 FLD_florida_war_tactics_desc:0 "We must develop our own unique strategies and tactics in order to prove ourselves better than the other warlords vying to reclaim the United States for their cause."
 FLD_tank_upgrades:0 "Tank Upgrades"
 FLD_tank_upgrades_desc:0 "Tanks are essential for breakthroughs and encirclements. Modernizing our tank brigades will help us win any battle!"
 FLD_sea_power:0 "Sea Power"
 FLD_sea_power_desc:0 "Florida has long and vulnerable shores that are under threat of invasion. Building a navy will help us secure our shores from any enemy threat."
 FLD_tampa_bay_naval_yard:0 "Tampa Bay Naval Yard"
 FLD_tampa_bay_naval_yard_desc:0 "We will build the dockyards our navy needs to grow and sustain itself in Tampa, which will also boost the local economy."
 FLD_blue_water_navy_capabilities:0 "Blue Water Navy Capabilities"
 FLD_blue_water_navy_capabilities_desc:0 "A blue water navy will allow Florida to project power far from our sunny beaches, ensuring danger is prevented."
 FLD_guardians_in_the_skies:0 "Guardians of the Skies"
 FLD_guardians_in_the_skies_desc:0 "We must protect our skies from any enemy that dares to taint the beautiful, sunny blue skies with their planes."
 FLD_floridian_fighters:0 "Floridian Fighters"
 FLD_floridian_fighters_desc:0 "Fighter planes will be essential in protecting the beautiful sunny skies of Florida!"
 FLD_bomber_threat:0 "Bomber Capabilities"
 FLD_bomber_threat_desc:0 "Not only do we need to defend our territory, but we must pre-emptively strike our enemies to ensure they won't be able to cause any harm."
 FLD_sunny_skies_over_florida:0 "Sunny Skies Over Florida"
 FLD_sunny_skies_over_florida_desc:0 "And not a single enemy plane!"
 FLD_army_of_democracy:0 "Army of Democracy"
 FLD_army_of_democracy_desc:0 "The enemy will burn in the fires of democracy!"
 
 FLD_reestablish_international_trade:0 "Reestablish International Trade"
 FLD_reestablish_international_trade_desc:0 "Due to the constant fragmentation and isolationist rule by previous leaders of Florida, Florida has been disconnected from the international community for far too long."
 FLD_tourist_industry:0 "Tourist Industry"
 FLD_tourist_industry_desc:0 "Come to Florida! It is nice, sunny, and there is a lot to do here!"
 FLD_rebuild_themeparks:0 "Rebuild Themeparks"
 FLD_rebuild_themeparks_desc:0 "The themeparks that we are so famous for have been damaged during the bloody Floridian Civil War. It is only our responsibility to help them recover."
 FLD_regrant_special_tax_zones:0 "Regrant Special Tax Zones"
 FLD_regrant_special_tax_zones_desc:0 "Themeparks like Disney World had special tax zones-key word: had. To ensure future cooperation and prosperity, we will return this privelage to them."
 FLD_invite_foreign_investors:0 "Invite Foreign Investors"
 FLD_invite_foreign_investors_desc:0 "Foreign capital will be essential in rebuilding Florida after a long period of disastrous economic mismanagement."

 
 #foriegn policy focuses
 FLD_floridas_place_in_america:0 "Florida's Place in America"
 FLD_floridas_place_in_america_desc:0 "With Florida having settled our own internal issues, we must now look outward and determine our place in this new world."
 FLD_the_florida_way:0 "The Florida Way"
 FLD_the_florida_way_desc:0 "Florida has always been unique and special, and we do not need to join in with the conflicts raging around us. We can establish our own identity."
 FLD_beacon_of_democracy:0 "Beacon of Democracy"
 FLD_beacon_of_democracy_desc:0 "With the rest of the continent being engulfed in conflict, we can be a shining beacon of democracy to people all over North America!"
 FLD_guarantee_freedoms:0 "Guarantee Freedoms"
 FLD_guarantee_freedoms_desc:0 "In our new Constitution, we have outlined the overwhelming number of freedoms we will protect for both Floridians and anyone looking to flee chaos in America."
 FLD_welcome_to_florida:0 "Welcome to Florida!"
 FLD_welcome_to_florida_desc:0 "Must be the Sunshine!"
 FLD_meeting_in_washington:0 "A Meeting in Washington"
 FLD_meeting_in_washington_desc:0 "The Federal Republic stands as the last bastion of sanity around us, we must appraoch them about working together to save North America."
 FLD_prepare_to_fight:0 "Prepare to Fight"
 FLD_prepare_to_fight_desc:0 "We must gear up to fight alongside the Federal Republic."
 FLD_funding_from_washington:0 "Funding from Washington"
 FLD_funding_from_washington_desc:0 "The Federal Republic is a much larger and stronger nation than we are, and they have agreed to allocate some military aid to us."
 FLD_encourage_the_people:0 "Encourage the People"
 FLD_encourage_the_people_desc:0 "We must rally our people in support of our cause!"
 FLD_join_the_legitimists:0 "Join the Legitimists"
 FLD_join_the_legitimists_desc:0 "Formally joining the legitimists and the Federal Republic will allow us to be protected should we be attacked."
 FLD_loyal_to_dc:0 "Loyal to DC"
 FLD_loyal_to_dc_desc:0 "The Federal Republic is the true successor to America, and we will stand alongside them during this journey."
 FLD_demand_the_panhandle:0 "Demand the Panhandle"
 FLD_demand_the_panhandle_desc:0 "During the collapse of America, the Confederacy illegitimatly occupied the panhandle. The panhandle is Floridian through and through, we must demand it back!"
 FLD_war_with_the_csa:0 "War With the CSA"
 FLD_war_with_the_csa_desc:0 "After attempting to use diplomatic channels, we must go to war to recover our panhandle."
 FLD_give_up_claims_to_panhandle:0 "Give Up Claims to the Panhandle"
 FLD_give_up_claims_to_panhandle_desc:0 "Even though the panhandle is rightfully ours, we cannot compete with the confederacy to regain it."
 FLD_nonaggression_pact_with_csa:0 "Nonaggression Pact with the CSA"
 FLD_nonaggression_pact_with_csa_desc:0 "To prevent any future conflict with the confederacy, we will sign a nonaggression pact to keep the peace."
 FLD_the_libertarian_cause:0 "The Third Way"
 FLD_the_libertarian_cause_desc:0 "We have managed to guide Florida away from the destructive forces of extremism. Unfortunately, only few in the former United States see liberty in the same way as us. We must stick close with them to ensure our goals are achieved."
 FLD_strengthen_the_militia:0 "Strengthen the Militia"
 FLD_strengthen_the_militia_desc:0 "The militia will be vital in protecting our country. Ensuring they get the proper equipment needed may be crucial in our defense."
 FLD_support_CSB:0 "Support the Third Confederacy"
 FLD_support_CSB_desc:0 "The Third Confederacy share a similar viewpoint on how America should be run with us. Strengthening our libertarian allies will help secure Florida's prosperous future."
 FLD_secure_corporate_donations:0 "Secure Corporate Donations"
 FLD_secure_corporate_donations_desc:0 "Donations from the private sector will be instrumental in ensuring the stability of our state. By protecting our -and their- interests, we will have a mutually beneficial partnership"
 FLD_ally_the_gla:0 "Ally the [GLA.GetName]"
 FLD_ally_the_gla_desc:0 "The [GLA.GetName] is the leader of the libertarian cause in America! Aligning with them will bring our mutual goals to fruition!"
 FLD_for_a_free_america:0 "For a Free America"
 FLD_for_a_free_america_desc:0 "America was founded on the principles of liberty and freedom. We are the guardians of those ideals and will uphold them at all costs!"
 FLD_declare_independence:0 "Declare Independence"
 FLD_declare_independence_desc:0 "Our path has diverged from the rest of America's long ago, and it is now time to face that reality."
 FLD_leading_america:0 "Leading America"
 FLD_leading_america_desc:0 "We must guide our fellow Americans and show them the light that Florida has achieved."
 
 #Mutual Policy
 FLD_expand_anti_hurricane_measures:0 "Anti-Hurricane Measures"
 FLD_expand_anti_hurricane_measures_desc:0 "Hurricanes have harmed too many Floridian lives until now. We must ensure that we are prepared to prevent or mitigate future harm that may come from hurricanes."
 FLD_strengthen_relief_programs:0 "Strengthen Relief Programs"
 FLD_strengthen_relief_programs_desc:0 "People can lose everything due to a Hurricane. To mitigate this loss, we will be pre-emptively setting up relief centers to aid people that have lost their livelihoods.*
 FLD_government_mandated_hurrican_insurance:0 "Government Mandated Hurricane Insurance"
 FLD_government_mandated_hurrican_insurance_desc:0 "Expanding upon the initiative that was started when we strengthened relief centers, mandating insurance will result in people's finances being protected in the event of a hurricane, as well as ensuring minimal material loss for the average Floridian."
 FLD_expand_hurricane_shelters:0 "Expand Hurricane Shelters"
 FLD_expand_hurricane_shelters_desc:0 "As people lose their homes due to the hurricanes, they will need somewhere to stay. We can provide them shelter as they recover from the hurricane."
 FLD_invest_in_underground_supply_chains:0 "Invest in Underground Supply Chains"
 FLD_invest_in_underground_supply_chains_desc:0 "Our supply chains are too vulnerable to hurricanes above ground. Investing in the essential infrastructure to ensure that supply stays steady during hurricanes will be crucial."
 FLD_slow_normalization_of_drugs:0 "Slow Normalization of Drugs"
 FLD_slow_normalization_of_drugs_desc:0 "Drugs like Marijuana aren't dangerous if regulated. We must allow our people to access these drugs as long as they are not dangerous."
 FLD_legalize_illicit_substances:0 "Legalize Illicit Substances"
 FLD_legalize_illicit_substances_desc:0 "Substances like Marijuana need to be legalized and regulated. The non-regulated and illegal status of this market has destroyed many lives, and shall not destroy more."
 FLD_regulate_the_trade:0 "Regulate the Trade"
 FLD_regulate_the_trade_desc:0 "A big bonus of legalizing these substances is that they become taxable!"
 FLD_take_on_the_cartels:0 "Take on the Cartels"
 FLD_take_on_the_cartels_desc:0 "The drug cartels have been poisoning Floridians with drugs for far too long. Time to crush them."
 FLD_the_root_of_the_problem:0 "The Root of the Problem"
 FLD_the_root_of_the_problem_desc:0 "Finding the source of the drug crisis is essential in finding the solution. We will be one step closer to solving a problem that plagues many Floridians."
 FLD_crack_down_on_illegal_activities:0 "Crack Down on Illegal Activities"
 FLD_crack_down_on_illegal_activities_desc:0 "The distribution of these substances is illegal, and must be treated as such. The time of good cop is over, and now bad cop is stepping in."
 FLD_end_the_cartels_for_good:0 "End the Cartels for Good"
 FLD_end_the_cartels_for_good_desc:0 "Corruption has led to the cartels gaining immense power at the expense of the Floridian people. Fortunately, we aren't burdened by corruption (at least, not from the cartels) so this will not be an issue any longer. Time to crush the cartels."
 
