 ### EVENTS ### 
 
 alaska.1.t:0 "The Final Frontier in Chaos"
 alaska.1.d:0 "The occupation by the Pacific Fleet has done a number on our fledgling nation. The oil that flowed to fuel the war machine has stopped, causing the entire economy to freeze up. Extreme poverty, most notably in the Inuit community, has caused intense social unrest and has fueled separatism in the North. Our already neglected Infrastructure has decayed even further under the junta, with many towns disconnected and lacking clean drinking water.\n\nOur state barely functions and is held together by some of the few brave national guard soldiers still left on duty. Worst of all is the complete lack of trust that the average Alaskan has in Dunleavy or the establishment in general. In order to keep this state alive, we must show the Alaskan people we are not impotent, then we can deal with the imprisoned Pacific Fleet."
 alaska.1.a:0 "All eyes on Dunleavy"

 alaska.2.t:0 "Alaskan Oil Trade Deal?"
 alaska.2.d:0 "The newly independent state of Alaska has offered us a favorable trade deal regarding the sale of oil to us. It is no secret we've been looking for alternatives to Russian oil and gas, but reports about the stability of Alaska have not been good. They have an extremely volatile political situation, and any collapse of their government would likely put any deal made right now in serious jeopardy. Unless they stabilize, any deal would be nonsensical."
 alaska.2.a:0 "They're too unstable to be relied upon"
 
 alaska.3.t:0 "Europe Rebuffs Us"
 alaska.3.d:0 "Citing our political stability, the combined powers of France, Britain, and the Netherlands, have refused our trade deal. It seems like relief for our oil crisis will not come yet..."
 alaska.3.a:0 "It is never that easy"

 alaska.4.t:0 "Swiss-Alaskan Oil Deal?"
 alaska.4.d:0 "In an unexpected turn of events, Swiss diplomats reached out today to negotiate an oil trade deal between our two nations. While Switzerland had traditionally been reliant on the United States for oil, the collapse has opened up a new market in Switzerland. The amount they need is not nearly enough to save our oil industry, but it could be the right step in showing our reliability to the international community. Not all in our government is pleased though, and believe Switzerland is merely taking advantage of Alaska's precarious situation for cheap oil."
 alaska.4.a:0 "Better than nothing"
 alaska.4.b:0 "A waste of time!"

 alaska.5.t:0 "Liechtenstein's Trade Agreement"
 alaska.5.d:0 "It seems like the Swiss-Alaskan Oil Deal has had cascading effects, with a close partner to Switzerland, Liechtenstein, now wanting a cut of the Alaskan pie. They are offering us industrial goods, such as high precision manufacturing items, in exchange for cash. While the total yearly cost is only estimated to be in the low millions, the machinery could help our fledgling industry thrive."
 alaska.5.a:0 "Unexpected but welcome!"
 alaska.5.b:0 "Who are you again?"

 alaska.6.t:0 "Formation of the Communist Party of Alaska"
 alaska.6.d:0 "Political instability seems to be reaching a boiling point. Today, the newly formed Communist Party of Alaska held a rally in Anchorage, opening to crowds of supporters. Right-wing counter protestors also showed up, but were kept under wraps by the heavy police presence.\n\nThe man at the head of this was the ex-Party for Socialism and Liberation member, Michael Patterson. His arrest by the Pacific Fleet earned him plenty of sympathy from the left-wing, and he has used that to catapult his political career, seemingly aspiring for the role of chairman of Alaska.\n\nDuring the rally, he agitated for class war, calling for the end of fossil capitalism and the destruction of the bourgeoisie. He had specific vitriol for Mike Dunleavy, calling him a "flaccid puppet of the oil barons". Even though they are communist dogs, we cannot deny their growing influence in Alaskan politics."
 alaska.6.a:0 "Better dead than red!"

 alaska.7.t:0 "Protestors Gather Outside the Court Room"
 alaska.7.d:0 "Protestors have gathered outside the courtroom to vent their frustrations over the lengthy proceedings, with many believing that the courts are dragging out the trial for as long as possible, and some even claiming that the trial is rigged for the defendants. While they are mostly small scale and peaceful, the media has noted the potential for it to turn into a full scale riot if the trial does not wrap up soon."
 alaska.7.a:0 "Let them protest"
 
 alaska.8.t:0 "The Secret Meeting"
 alaska.8.d:0 "Last night, certain members of the National Guard reached out to the administration, acting as supposed representatives of the Pacific Fleet. While no obligations were made, it was made clear that they want us to pardon the Pacific Fleet, stating that a guilty verdict would set back the Alaskan military and navy by a decade. They even mentioned using military force to bring stability to Alaska if necessary."
 alaska.8.a:0 "This is getting dangerous... destroy any records of this meeting and keep it under wraps!"
 
 alaska.9.t:0 "A Leak!"
 alaska.9.d:0 "Somehow word of our secret meeting has leaked to the press. It is clear that someone is trying to destabilize us, but the question of who remains a mystery."
 alaska.9.a:0 "Damnit!"

 alaska.10.t:0 "Protests Devolve Into Riots!"
 alaska.10.d:0 "The consequences of the leak have made themselves very clear in Anchorage. The peaceful protests have devolved into full scaled riots. Police response has been bolstered, with some in the intelligence agencies citing high risks for terrorist attacks on the courtroom building. Nonetheless, the media has dubbed these riots "the Trial Riots"."
 alaska.10.a:0 "Let's hope we can get this over with and fast"
 
 alaska.11.t:0 "The Trial Ends"
 alaska.11.d:0 "To no one's surprise, the jury has delivered a guilty verdict in the case of the Pacific Fleet. The evidence presented was overwhelming, with many admirals and captains admitting to atrocities and war crimes. The military is outraged at this result as expected, and now some are pressuring Dunleavy into a full pardon. While this is unlikely to gover well, it may be the best to salvage our high command."
 alaska.11.a:0 "The court has spoken!"
 alaska.11.b:0 "We need them! Pardon them!"
 
 alaska_oil.1.t:0 "Alaska Pleads For Recognition"
 alaska_oil.1.d:0 " "
 alaska_oil.1.a:0 "It is smart to recognize them"
 alaska_oil.1.b:0 "We cannot risk angering the Federalists"

 alaska_oil.2.t:0 "[FROM.GetAdjective] Foreign Office Recognizes Us!"
 alaska_oil.2.d:0 " "
 alaska_oil.2.a:0 "We will make it worth their while"
 
 alaska_oil.3.t:0 "Negotiations With [FROM.GetAdjective] Diplomats Fail!"
 alaska_oil.3.d:0 " "
 alaska_oil.3.a:0 "We must try harder!"

 alaska_news.1.t:0 "Alaska Pardons the Pacific Fleet"
 alaska_news.1.d:0 "In a stunning display, Mike Dunleavy, acting leader of Alaska and former governor of the state, has moved to pardon the Pacific Fleet after the courts had initially found them guilty for war crimes and treason. Some are not so surprised, pointing to an alleged secret meeting held between representatives of the military and Mike Dunleavy that apparently detailed plans of a pardon and reintigration of the Pacific Fleet. As of now, there are no current comments from Dunleavy or his staff, leaving Alaskans with only deafening silence.\n\nHowever, Alaskans are not taking this verdict lying down. Reports have come out about riots spreading across Alaska, with an often colorful display of flags. Some wave the red flag, while others hoist the Gasden flag. An onlooker in Anchorage has stated, "There is no way in hell this ends well. I have family in Sitka and they've told me about the riots there. Fucking Sitka in flames, its unheard of.""
 alaska_news.1.a:0 "Utter insanity"
 alaska_news.1.b:0 "They will never understand!"

 alaska_news.2.t:0 "Alaska Finds the Pacific Fleet Guilty!"
 alaska_news.2.d:0 ""
 alaska_news.2.a:0 "Good riddance"
 
 alaska_apf.1.t:0 "Fate of the APF"
 alaska_apf.1.d:0 ""
 alaska_apf.1.a:0 "The APF stays"
 alaska_apf.1.b:0 "Liquidate it all!"
 alaska_apf.1.c:0 "Use increased oil revenues to increase APF payments"
 alaska_apf.1.e:0 "Use increased energy revenues to increase APF payments"
 
 alaska_commie.1.t:0 "The CPA Marches on Anchorage!"
 alaska_commie.1.d:0 ""
 alaska_commie.1.a:0 "Unfurl the red flags!"

 alaska_lolbert.1.t:0 "The Frontierist Party Marches on Anchorage!"
 alaska_lolbert.d:0 ""
 alaska_lolbert.1.a:0 "Don't tread on us!"

 ### CHARACTERS ###

 ALA_mike_dunleavy:0 "Mike Dunleavy"
 DESC_LEADER_MIKE_DUNLEAVY:0 "Mike Dunleavy was once a popular and effective governor of Alaska. He was praised for strengthening education, cracking down on crime, and for his fast COVID response. But many things have changed since the American Civil War.\n\nThe Pacific Fleet took control of Hawaii in the early phases and soon demanded Alaska surrender without bloodshed. Despite bipartisan opposition to junta control, Dunleavy capitulated, shocking Alaskans.\n\nFor his cooperation, the fleet allowed him to keep the mostly ceremonial role of governor of Alaska, staining his reputation as the war effort dragged on.\n\nNow that the Pacific Fleet has collapsed, he is left in control of a withering state that distrusts his rule, with many calling for him to step down. Winning back the trust of the Alaskan people will be a Herculean task."
 
