 ### FOCUS TREE ###

 ### IDEAS ###
 ALA_apf:0 "Alaska Permanent Fund"
 ALA_apf_desc:0 "The Alaska Permanent Fund was created to hold and invest the surplus value created by our Trans-Atlantic Pipeline. While it was temporarily disrupted due to the occupation by the Pacific Fleet, it is now back in effect, giving Alaskans everywhere a yearly stipend of cash."
 
 ALA_inuit_poverty:0 "Extreme Inuit Poverty"
 ALA_inuit_poverty_desc:0 "Before the Second American Civil War, the Inuit were already suffering from overcrowding and poverty. With the occupation by the Pacific Fleet and the collapse of any semblance of safety, the Inuit have been plunged into far worse conditions. Radicalism has gripped the Inuit community and Inuit separatism has already begun to shake the North."
 
 ALA_tourism_recession:0 "Tourism Recession"
 ALA_tourism_recession_desc:0 "Tourism has been the backbone of the Alaskan economy, but that has all but disintegrated due to recent events. The legacy of the Pacific Fleet, combined with growing political instability, and the fact that our would be customers are fighting each other, has made sure no one is visiting."
 
 ALA_alaskan_powder_keg:0 "The Alaskan Powder Keg"
 ALA_alaskan_powder_keg_desc:0 "A perfect storm of poverty, political radicalism, and the scars of militarism have tipped our fledgling state to the edge of utter collapse."

 ALA_shadow_of_pac:0 "Shadow of the Pacific Fleet"
 ALA_shadow_of_pac_desc:0 "The occupation has instilled a deep sense of trauma among the Alaskan people. Disdain for the navy and military are at an all time of high, with fewer people than ever enlisting. With all of our capable military leaders imprisoned for crimes against humanity, it seems like our leadership is practically nonexistant."

 ALA_collapsed_oil_industry:0 "Collapsed Oil Industry"
 ALA_collapsed_oil_industry_desc:0 "Under normal circumstances, our oil would exported abroad, but our nation is extremely new with zero recognition from the outside community. The painful truth is that no one wants to buy oil from us."
 
 ### EVENTS ### 

 ### CHARACTERS ###

 ALA_mike_dunleavy:0 "Mike Dunleavy"
 DESC_LEADER_MIKE_DUNLEAVY:0 "Few politicians have squandered their borderline pristine reputations like Mike Dunleavy. Despite serving Alaska as a very popular and effective governor, after the collapse of the United States, he quickly became the lapdog of the Pacific Fleet. Their troops were at first allowed to base in Anchorage, and then the airfields, and then soon all of Alaska came under the grip of the fleet. Without so much of a word or angry letter, Dunleavy stepped down and allowed the Pacific Fleet to take control and mobilize the population and its resources for its war aims.\n\nNow after the whimper that was the collapse of the Pacific Fleet, he has used whatever remains of his popularity to catapult himself back into the driver's seat. While the people are relieved that the junta is over, few have forgotten about the 'Great Alaskan Capitulation'. With trust already at an all time low, it will be an uphill battle for Dunleavy to win back the Alaskan people."
 
